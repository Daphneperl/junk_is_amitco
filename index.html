<!DOCTYPE html>
<html>
  <head>
    <title>Rhizome w UI</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&callback=initGoogleMaps&loading=async"
      async
      defer
    ></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Dock hover zone indicator (for debugging - can be removed) */
      .dock-hover-zone {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: rgba(255, 0, 0, 0.1);
        pointer-events: none;
        z-index: 1;
        display: none; /* Hidden by default, can be enabled for debugging */
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: 2vw;
        bottom: 2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: unset;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 2vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }
      #upload-hand-btn-text {
        position: absolute;
        left: 30%;
        top: 55%;
        transform: translate(-50%, -50%);
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
      }
      #upload-hand-btn-img {
        width: 270px;
        height: 270px;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Map Popup Styles */
      .map-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 4000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .map-popup-content {
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        padding: 20px;
        max-width: 800px;
        width: 90vw;
        max-height: 80vh;
        font-family: "VT323", monospace;
        color: #fff;
        display: flex;
        flex-direction: column;
      }

      .map-popup-header {
        font-size: 24px;
        margin-bottom: 15px;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .map-popup-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      .map-container {
        flex: 1;
        min-height: 400px;
        border: 1px solid #fff;
        border-radius: 4px;
        margin-bottom: 15px;
        position: relative;
        background: #1a1a1a;
        overflow: visible;
        display: flex;
        flex-direction: column;
      }

      #map {
        width: 100%;
        height: 100%;
        min-height: 400px;
        flex: 1;
        position: relative;
        background: #1a1a1a;
      }

      .map-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        padding: 10px;
        border-radius: 4px;
        z-index: 1000;
      }

      .map-instructions {
        color: #fff;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
      }

      .map-pin-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #ff4444;
        border: 2px solid #fff;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
        z-index: 1001;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .map-pin-button:hover {
        background: #ff6666;
      }

      .map-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .map-input {
        flex: 1;
        min-width: 200px;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 8px 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .map-input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .map-popup-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .map-popup-btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .map-popup-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .coordinates-display {
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="black-overlay"></div>
    <div id="loading-container">
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING... 0%
      </div>
    </div>
    <div id="visualization"></div>

    <!-- Floating Eye -->
    <div id="floating-eye">
      <img
        src="assets/GlitchyEyeGif.gif"
        alt="Glitchy Eye"
        style="width: 100%; height: 100%; object-fit: contain"
      />
    </div>

    <!-- Tooltip -->
    <div id="eye-tooltip">
      Here is the Rhizome View. Navigate through the interconnected network of
      images and discover hidden connections between different pieces of junk.
    </div>

    <!-- Pixel Arrow Indicator -->
    <div id="pixel-arrow-indicator">
      <img src="assets/pixel_arrow.png" alt="Arrow pointing up" />
    </div>

    <div id="rings-container">
      <div id="hover-title"></div>
    </div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see..." />
    <!-- Upload Hand Button (fixed, with image and overlaid text) -->
    <button id="upload-hand-btn">
      <img
        id="upload-hand-btn-img"
        src="UploadButton/BiggerHand.png"
        alt="Upload hand"
      />
      <div id="upload-hand-btn-text">Upload<br />junk</div>
    </button>
    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;
      let imageSprites = [];
      let connectionLines = [];
      let artisticData = [];
      let imageDataMap = new Map();
      let totalImages = 0;
      let loadedImages = 0;
      let entranceAnimationStart = 0;
      let entranceAnimationDuration = 4000; // 4 seconds for faster rotation

      // Separate variables for rings
      let ringsScene, ringsCamera, ringsRenderer;
      let rings;
      let ringsRotation = {

      // Calculate similarity between two images based on keywords
      function calculateSimilarity(image1, image2) {
        if (!image1 || !image2 || !image1.keywords || !image2.keywords) {
          return 0;
        }

        const keywords1 = new Set(
          image1.keywords.map((k) => k.keyword.toLowerCase())
        );
        const keywords2 = new Set(
          image2.keywords.map((k) => k.keyword.toLowerCase())
        );

        // Find intersection of keywords
        const intersection = new Set(
          [...keywords1].filter((x) => keywords2.has(x))
        );

        if (intersection.size === 0) return 0;

        // Calculate weighted similarity based on confidence scores
        let totalWeight = 0;
        let intersectionWeight = 0;

        // Calculate weights for intersection keywords
        intersection.forEach((keyword) => {
          const conf1 =
            image1.keywords.find((k) => k.keyword.toLowerCase() === keyword)
              ?.confidence || 0;
          const conf2 =
            image2.keywords.find((k) => k.keyword.toLowerCase() === keyword)
              ?.confidence || 0;
          intersectionWeight += (conf1 + conf2) / 2;
        });

        // Calculate total weights for all keywords
        image1.keywords.forEach((k) => (totalWeight += k.confidence));
        image2.keywords.forEach((k) => (totalWeight += k.confidence));

        // Return weighted similarity score
        return intersectionWeight / (totalWeight / 2);
      }

        // Helper function to get semantic category for an image
        function getImageCategory(imageData) {
          const keywordTexts = imageData.keywords.map((k) =>
            k.keyword.toLowerCase()
          );
          const categoryScores = {};

          for (const [category, keywords] of Object.entries(
            semanticCategories
          )) {
            let score = 0;
            for (const keyword of keywords) {
              if (keywordTexts.includes(keyword)) {
                score += 1;
              }
            }
            categoryScores[category] = score;
          }

          // Return the category with highest score, or 'other' if no clear match
          const maxScore = Math.max(...Object.values(categoryScores));
          if (maxScore === 0) return "other";

          for (const [category, score] of Object.entries(categoryScores)) {
            if (score === maxScore) return category;
          }
          return "other";
        }

        // Group images by semantic category
        const categoryGroups = {};
        artisticData.forEach((imageData, index) => {
          const category = getImageCategory(imageData);
          if (!categoryGroups[category]) {
            categoryGroups[category] = [];
          }
          categoryGroups[category].push({ ...imageData, originalIndex: index });
        });

        // Create strict spatial clusters with large separation
        const clusters = [];
        const clusterPositions = {

          people_faces: { x: 400, y: 0, z: 0 },

          food_dining: { x: 400, y: -400, z: 0 },
          other: { x: 0, y: 0, z: 0 },
        };

        Object.entries(categoryGroups).forEach(([category, images]) => {
          if (images.length === 0) return;

          clusters.push({
            category: category,
            images: images,
            position: clusterPositions[category] || { x: 0, y: 0, z: 0 },
          });
        });

        console.log(
          "Created strict spatial clusters:",
          clusters.map(
            (c) =>
              `${c.category}: ${c.images.length} images at (${c.position.x}, ${c.position.y}, ${c.position.z})`
          )

        return clusters;

      // Position images strictly within their cluster regions
      function positionImagesInStrictClusters(clusters) {
        const imagePositions = new Map();

        clusters.forEach((cluster) => {
          const baseX = cluster.position.x;
          const baseY = cluster.position.y;
          const baseZ = cluster.position.z;
          const clusterRadius = 60; // Smaller radius for tighter clusters

          // Position images within this cluster in a more organized way
          cluster.images.forEach((imageData, imageIndex) => {
            // Create a spiral pattern within the cluster
            const angle = (imageIndex / cluster.images.length) * Math.PI * 4; // 2 full rotations
            const radius =
              (imageIndex / cluster.images.length) * clusterRadius * 0.8;
            const height = Math.sin(angle * 2) * clusterRadius * 0.3;

            const x = baseX + radius * Math.cos(angle);
            const y = baseY + radius * Math.sin(angle);
            const z = baseZ + height;

            imagePositions.set(imageData.originalIndex, {
              x,
              y,
              z,
              category: cluster.category,
              clusterCenter: { x: baseX, y: baseY, z: baseZ },
            });
          });
        });

        return imagePositions;
      }

      // Find connections only within the same cluster
      function findIntraClusterConnections(clusters) {
        const connections = [];

        // Initialize empty connections array
        for (let i = 0; i < artisticData.length; i++) {
          connections.push([]);
        }

        // Only create connections within the same cluster
        clusters.forEach((cluster) => {
          const clusterImages = cluster.images;
          const similarityThreshold = 0.05; // Lower threshold to see more variation

          for (let i = 0; i < clusterImages.length; i++) {
            const image1 = clusterImages[i];
            const connectionsForImage = [];

            for (let j = i + 1; j < clusterImages.length; j++) {
              const image2 = clusterImages[j];
              const similarity = calculateSimilarity(image1, image2);

              if (similarity > similarityThreshold) {
                connectionsForImage.push({
                  targetIndex: image2.originalIndex,
                  similarity: similarity,
                });
              }
            }

            // Sort by similarity and keep top connections
            connectionsForImage.sort((a, b) => b.similarity - a.similarity);
            connections[image1.originalIndex] = connectionsForImage.slice(0, 5); // More connections per image to see variation
          }
        });

        return connections;
      }

      function createImageSprite(texture, index, connections) {
        if (!texture) {
          // Create a placeholder sprite for missing images
          const canvas = document.createElement("canvas");
          canvas.width = 100;
          canvas.height = 100;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#333";
          ctx.fillRect(0, 0, 100, 100);
          ctx.fillStyle = "#666";
          ctx.font = "12px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Missing", 50, 50);

          const placeholderTexture = new THREE.CanvasTexture(canvas);
          texture = placeholderTexture;
        }

        const aspectRatio = texture.image.width / texture.image.height;
        const width = 20; // Much larger base width
        const height = width / aspectRatio;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
        });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(width, height, 1);

        // Position based on connection strength and keyword clusters
        const imageData = artisticData[index];
        const connectionCount = connections.length;

        // Calculate average similarity for this image
        const avgSimilarity =
          connections.length > 0
            ? connections.reduce((sum, conn) => sum + conn.similarity, 0) /
              connections.length
            : 0;

        // Use connection count and average similarity to determine radius
        // More connections and higher similarity = closer to center
        const maxRadius = 350;
        const minRadius = 0; // Allow images to be at the very center
        const connectionFactor = Math.min(1, connectionCount / 5); // Normalize to 0-1
        const similarityFactor = avgSimilarity;
        const combinedFactor = (connectionFactor + similarityFactor) / 2;
        const radius =
          minRadius + (maxRadius - minRadius) * (1 - combinedFactor);

        // Use vibe and keywords to determine angle
        const vibeAngles = {
          warm: 0,
          serene: Math.PI / 3,
          mysterious: (2 * Math.PI) / 3,
          neutral: Math.PI,
          cool: (4 * Math.PI) / 3,
          energetic: (5 * Math.PI) / 3,
        };

        const baseAngle = vibeAngles[imageData.vibe] || 0;
        const keywordHash = imageData.keywords.reduce(
          (sum, k) => sum + k.keyword.charCodeAt(0),
          0
        );
        const angleOffset = ((keywordHash % 100) / 100) * Math.PI * 0.5;

        const theta = baseAngle + angleOffset;
        const phi = Math.acos(1 - (2 * (index + 0.5)) / totalImages);

        // Reduce randomness for more predictable clustering
        const randomOffset = radius * 0.1; // Reduced from 0.2 to 0.1
        const offsetX = (Math.random() - 0.5) * randomOffset;
        const offsetY = (Math.random() - 0.5) * randomOffset;
        const offsetZ = (Math.random() - 0.5) * randomOffset;

        const targetX = radius * Math.sin(phi) * Math.cos(theta) + offsetX;
        const targetY = radius * Math.sin(phi) * Math.sin(theta) + offsetY;
        const targetZ = radius * Math.cos(phi) + offsetZ;

        sprite.position.set(targetX, targetY, targetZ);

        // Store data for animation and connections
        sprite.userData = {
          timeOffset: index * 0.1,
          originalX: targetX,
          originalY: targetY,
          originalZ: targetZ,
          connections: connections,
          imageData: imageData,
          index: index,
          avgSimilarity: avgSimilarity,
        };

        return sprite;
      }

        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";

        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;

      function createConnectionLine(similarity) {
        // Debug: Log similarity values to see the range
        console.log("Connection similarity:", similarity);

        // Calculate line weight based on similarity
        const baseWidth = 5; // Heavier base width
        const maxWidth = 200; // Maximum width for strongest connections
        const lineWidth = baseWidth + similarity * (maxWidth - baseWidth);

        // Calculate opacity based on similarity (stronger connections = more opaque)
        const minOpacity = 0.3;
        const maxOpacity = 1.0;
        const opacity = minOpacity + similarity * (maxOpacity - minOpacity);

        console.log("Line width:", lineWidth, "Opacity:", opacity);

        // White color for all edges
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: opacity,
          linewidth: lineWidth,
        });
        const geometry = new THREE.BufferGeometry();
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        return line;
      }

      function updateConnectionLines(entranceProgress = 0, entranceEase = 0) {
        // Remove old lines and dispose of geometries to prevent memory leaks
        connectionLines.forEach((line) => {
          scene.remove(line);
          if (line.geometry) {
            line.geometry.dispose();
          }
          if (line.material) {
            line.material.dispose();
          }
        });
        connectionLines = [];

        // Limit the number of connections to prevent performance issues
        let connectionCount = 0;
        const maxConnections = 300; // Increase limit to see more connections

        // Create new lines based on keyword similarity
        for (
          let i = 0;
          i < imageSprites.length && connectionCount < maxConnections;
          i++
        ) {
          const sprite = imageSprites[i];
          const connections = sprite.userData.connections;

          for (
            let j = 0;
            j < connections.length && connectionCount < maxConnections;
            j++
          ) {
            const connection = connections[j];
            const targetSprite = imageSprites[connection.targetIndex];
            if (targetSprite) {
              const line = createConnectionLine(connection.similarity);

              // Use the exact same rotation logic as the sprites to ensure consistency
              const entranceRotation = entranceEase * Math.PI * 0.5; // Same rotation as images
              const rotationMatrix = new THREE.Matrix4();
              rotationMatrix.makeRotationY(entranceRotation);

              // Get original positions and apply rotation
              const startOriginalX = sprite.userData.originalX;
              const startOriginalY = sprite.userData.originalY;
              const startOriginalZ = sprite.userData.originalZ;

              const endOriginalX = targetSprite.userData.originalX;
              const endOriginalY = targetSprite.userData.originalY;
              const endOriginalZ = targetSprite.userData.originalZ;

              // Apply rotation to start position
              const startPos = new THREE.Vector3(
                startOriginalX,
                startOriginalY,
                startOriginalZ
              );
              startPos.applyMatrix4(rotationMatrix);

              // Apply rotation to end position
              const endPos = new THREE.Vector3(
                endOriginalX,
                endOriginalY,
                endOriginalZ
              );
              endPos.applyMatrix4(rotationMatrix);

              const positions = new Float32Array([
                startPos.x,
                startPos.y,
                startPos.z,
                endPos.x,
                endPos.y,
                endPos.z,
              ]);
              line.geometry.setAttribute(
                "position",
                new THREE.BufferAttribute(positions, 3)
              );
              connectionLines.push(line);
              connectionCount++;
            }
          }
        }
      }

      function createParticleSystem() {
        const particleCount = 1500; // Much more particles for dramatic effect
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Distribute particles throughout the entire 3D environment
          let x, y, z;

          // 70% of particles in the outer space, 30% within the network area
          if (Math.random() < 0.7) {
            // Outer space particles (around the clusters)
            const radius = 800 + Math.random() * 400; // 800-1200 range
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            x = radius * Math.sin(phi) * Math.cos(theta);
            y = radius * Math.sin(phi) * Math.sin(theta);
            z = radius * Math.cos(phi);
          } else {
            // Inner network particles (within and around the clusters)
            const clusterRadius = 500; // Area where clusters are located
            x = (Math.random() - 0.5) * clusterRadius * 2;
            y = (Math.random() - 0.5) * clusterRadius * 2;
            z = (Math.random() - 0.5) * clusterRadius * 2;
          }

          particlePositions[i * 3] = x;
          particlePositions[i * 3 + 1] = y;
          particlePositions[i * 3 + 2] = z;

          // More vibrant colors based on position
          const hue = i / particleCount + Math.random() * 0.2;
          const saturation = 0.4 + Math.random() * 0.3;
          const lightness = 0.4 + Math.random() * 0.4;

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const hueX = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = hueX;
            b = 0;
          } else if (hue < 2 / 6) {
            r = hueX;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = hueX;
          } else if (hue < 4 / 6) {
            r = 0;
            g = hueX;
            b = c;
          } else if (hue < 5 / 6) {
            r = hueX;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = hueX;
          }

          particleColors[i * 3] = r + m;
          particleColors[i * 3 + 1] = g + m;
          particleColors[i * 3 + 2] = b + m;

          particleSpeeds[i] = Math.random() * 0.02; // Much slower particle movement
          particleSizes[i] = 3 + Math.random() * 4; // Much larger particles
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 2.5, // Much larger base size
          vertexColors: true,
          transparent: true,
          opacity: 0.8, // Slightly more opaque
          sizeAttenuation: true,
          depthWrite: false,
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount),
          originalPositions: new Float32Array(particlePositions), // Store original positions
        };
        scene.add(particles);
      }

      async function init() {
        // Load artistic data first
        await loadArtisticData();

        // Create strict spatial clusters
        const clusters = createStrictSpatialClusters();

        // Position images strictly within their cluster regions
        const imagePositions = positionImagesInStrictClusters(clusters);

        // Find connections only within the same cluster
        const intraClusterConnections = findIntraClusterConnections(clusters);
        console.log(
          "Found intra-cluster connections:",
          intraClusterConnections.length
        );

        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
          data[i + 3] = 20;
        }
        ctx.putImageData(imageData, 0, 0);

        // Create and set noise texture
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;
        scene.background = noiseTexture;

        // Create particle system
        createParticleSystem();

        // Load and create image sprites
        const textureResults = await loadImages();
        textureResults.forEach((result, index) => {
          if (result.texture) {
            const clusterPosition = imagePositions.get(index);
            const sprite = createImageSprite(
              result.texture,
              index,
              intraClusterConnections[index],
              clusterPosition
            );
            imageSprites.push(sprite);
            scene.add(sprite);
          }
        });

        // Initial creation of connection lines
        updateConnectionLines(0, 0); // Start with no rotation

        // Create camera with increased distance
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          2000
        );
        camera.position.set(0, 0, 800); // More zoomed out initial view

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        color.rgb *= vignette;
                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls with adjusted settings
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1; // Allow zooming extremely close
        controls.maxDistance = 3000; // Allow zooming much further out
        controls.target.set(0, 0, 0);
        controls.update();

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);

        // Initialize rings
        initRings();
      }

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              window.location.href = "views/temperament/temperament.html";
              break;
            case "eye-secret":
              window.location.href =
                "views/hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              window.location.href = "views/intimacy/Intimacy.html";
              break;
            case "eye-completeness":
              window.location.href = "views/Completeness/Completeness.html";
              break;
            case "eye-artist":
              window.location.href = "views/Artists/Artist.html";
              break;
            case "eye-rhizome":
              // Already on rhizome page
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        const time = Date.now();

        // Handle entrance animation (always calculate, regardless of frame rate limiting)
        if (entranceAnimationStart === 0) {
          entranceAnimationStart = time;
        }

        const entranceProgress = Math.min(
          1,
          (time - entranceAnimationStart) / entranceAnimationDuration
        );
        const entranceEase = 0.5 - 0.5 * Math.cos(entranceProgress * Math.PI); // Smooth ease-in-out

        // Update connection lines every frame during entrance animation for perfect sync
        if (entranceProgress < 1) {
          // Update every single frame during entrance for perfect synchronization
          updateConnectionLines(entranceProgress, entranceEase);
        } else if (time % 300 === 0) {
          // Much less frequent updates after entrance
          updateConnectionLines(1, 1); // Pass 1 for completed animation
        }

        // Add frame rate limiting to prevent excessive rendering
        if (time - (animate.lastTime || 0) < 16) {
          // Limit to ~60 FPS
          return;
        }
        animate.lastTime = time;

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        // Animate particles with slow, gentle movement and entrance rotation
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;

          // Apply entrance rotation to particles
          const entranceRotation = entranceEase * Math.PI * 0.5; // Same rotation as images (90 degrees)
          const particleRotationMatrix = new THREE.Matrix4();
          particleRotationMatrix.makeRotationY(entranceRotation);

          for (let i = 0; i < positions.length; i += 3) {
            const speed = speeds[i / 3];
            const time = Date.now() * 0.1 * speed; // Much slower time factor

            // Get original positions from stored data
            const originalX = particles.userData.originalPositions[i];
            const originalY = particles.userData.originalPositions[i + 1];
            const originalZ = particles.userData.originalPositions[i + 2];

            // Apply entrance rotation to particle positions
            const particlePosition = new THREE.Vector3(
              originalX,
              originalY,
              originalZ
            );
            particlePosition.applyMatrix4(particleRotationMatrix);

            // Very gentle, slow movement on top of rotation
            const movementX = Math.sin(time) * 0.1; // Reduced movement amplitude
            const movementY = Math.cos(time) * 0.1;
            const movementZ = Math.sin(time * 0.3) * 0.1; // Slower oscillation

            positions[i] = particlePosition.x + movementX;
            positions[i + 1] = particlePosition.y + movementY;
            positions[i + 2] = particlePosition.z + movementZ;
          }

          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Animate images with smooth, stable cluster positioning
        imageSprites.forEach((sprite, index) => {
          const floatTime = time * 0.00005 + sprite.userData.timeOffset; // Much slower time
          const connections = sprite.userData.connections;
          const clusterPosition = sprite.userData.clusterPosition;

          // Apply entrance rotation animation - only one direction
          const entranceRotation = entranceEase * Math.PI * 0.5; // 90 degrees (25% turn) in one direction
          const rotationMatrix = new THREE.Matrix4();
          rotationMatrix.makeRotationY(entranceRotation);

          // Get the original position relative to center
          const originalX = sprite.userData.originalX;
          const originalY = sprite.userData.originalY;
          const originalZ = sprite.userData.originalZ;

          // Apply rotation to original position
          const rotatedPosition = new THREE.Vector3(
            originalX,
            originalY,
            originalZ
          );
          rotatedPosition.applyMatrix4(rotationMatrix);

          // Use cluster position as the anchor point
          let targetX, targetY, targetZ;

          if (clusterPosition) {
            // Apply entrance rotation to cluster position
            const clusterCenter = new THREE.Vector3(
              clusterPosition.clusterCenter.x,
              clusterPosition.clusterCenter.y,
              clusterPosition.clusterCenter.z
            );

            // Get position relative to cluster center
            const relativeX = originalX - clusterCenter.x;
            const relativeY = originalY - clusterCenter.y;
            const relativeZ = originalZ - clusterCenter.z;

            // Apply rotation to relative position
            const relativePosition = new THREE.Vector3(
              relativeX,
              relativeY,
              relativeZ
            );
            relativePosition.applyMatrix4(rotationMatrix);

            // Add back cluster center
            targetX = clusterCenter.x + relativePosition.x;
            targetY = clusterCenter.y + relativePosition.y;
            targetZ = clusterCenter.z + relativePosition.z;
          } else {
            // Use rotated position for non-clustered images
            targetX = rotatedPosition.x;
            targetY = rotatedPosition.y;
            targetZ = rotatedPosition.z;
          }

          // Very gentle floating movement within cluster bounds
          const floatRadius = 0.8; // Reduced radius
          const floatX = Math.sin(floatTime * 0.05) * floatRadius; // Much slower movement
          const floatY = Math.cos(floatTime * 0.07) * floatRadius;
          const floatZ = Math.sin(floatTime * 0.04) * floatRadius;

          // Extremely weak connection-based attraction
          let connectionForceX = 0,
            connectionForceY = 0,
            connectionForceZ = 0;
          let totalConnectionWeight = 0;

          connections.forEach((connection) => {
            const targetSprite = imageSprites[connection.targetIndex];
            if (targetSprite) {
              const dx = targetSprite.position.x - sprite.position.x;
              const dy = targetSprite.position.y - sprite.position.y;
              const dz = targetSprite.position.z - sprite.position.z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (distance > 0) {
                // Very weak attraction
                const attractionForce = connection.similarity * 0.002; // Even weaker
                const weight = connection.similarity;

                connectionForceX += (dx / distance) * attractionForce * weight;
                connectionForceY += (dy / distance) * attractionForce * weight;
                connectionForceZ += (dz / distance) * attractionForce * weight;
                totalConnectionWeight += weight;
              }
            }
          });

          // Normalize connection forces
          if (totalConnectionWeight > 0) {
            connectionForceX /= totalConnectionWeight;
            connectionForceY /= totalConnectionWeight;
            connectionForceZ /= totalConnectionWeight;
          }

          // Add organic jitter with multiple frequency components for natural movement
          const jitterTime = time * 0.001 + sprite.userData.timeOffset; // Much faster for visible movement
          const jitterAmplitude = 2.0; // Much larger amplitude for visible jitter

          // Multiple sine waves at different frequencies for organic movement
          const jitterX =
            Math.sin(jitterTime * 0.7) * jitterAmplitude * 0.3 +
            Math.sin(jitterTime * 1.3) * jitterAmplitude * 0.2 +
            Math.sin(jitterTime * 2.1) * jitterAmplitude * 0.1;

          const jitterY =
            Math.cos(jitterTime * 0.9) * jitterAmplitude * 0.3 +
            Math.cos(jitterTime * 1.7) * jitterAmplitude * 0.2 +
            Math.cos(jitterTime * 2.5) * jitterAmplitude * 0.1;

          const jitterZ =
            Math.sin(jitterTime * 0.5) * jitterAmplitude * 0.3 +
            Math.sin(jitterTime * 1.1) * jitterAmplitude * 0.2 +
            Math.sin(jitterTime * 1.9) * jitterAmplitude * 0.1;

          // Add very subtle micro-movements on top of jitter
          const microMove = 0.05; // Much smaller micro-movements
          const microTime = time * 0.00002 + sprite.userData.timeOffset; // Much slower
          const microX = Math.sin(microTime * 0.3) * microMove;
          const microY = Math.cos(microTime * 0.4) * microMove;
          const microZ = Math.sin(microTime * 0.25) * microMove;

          // Smooth interpolation to target position
          const lerpFactor = entranceProgress < 1 ? 0.1 : 0.15; // Higher lerp factor to show jitter
          const targetPosX =
            targetX + floatX + connectionForceX + microX + jitterX;
          const targetPosY =
            targetY + floatY + connectionForceY + microY + jitterY;
          const targetPosZ =
            targetZ + floatZ + connectionForceZ + microZ + jitterZ;

          sprite.position.x += (targetPosX - sprite.position.x) * lerpFactor;
          sprite.position.y += (targetPosY - sprite.position.y) * lerpFactor;
          sprite.position.z += (targetPosZ - sprite.position.z) * lerpFactor;

          // Very gentle repulsion to prevent overlap (only within same cluster)
          imageSprites.forEach((otherSprite, otherIndex) => {
            if (index !== otherIndex) {
              const dx = sprite.position.x - otherSprite.position.x;
              const dy = sprite.position.y - otherSprite.position.y;
              const dz = sprite.position.z - otherSprite.position.z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

              // Check if these sprites are in the same cluster
              const sameCluster =
                clusterPosition &&
                otherSprite.userData.clusterPosition &&
                clusterPosition.category ===
                  otherSprite.userData.clusterPosition.category;

              // Only apply repulsion within the same cluster, and very gently
              if (sameCluster && distance < 6) {
                const repulsionForce = (6 - distance) / 6;
                const repulsionStrength = 0.001; // Very gentle repulsion

                sprite.position.x += dx * repulsionForce * repulsionStrength;
                sprite.position.y += dy * repulsionForce * repulsionStrength;
                sprite.position.z += dz * repulsionForce * repulsionStrength;
              }
            }
          });
        });

        // Update floating eye
        updateFloatingEye();

        controls.update();
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      // Organic Floating Eye Animation
      let eyeX = 100;
      let eyeY = 100;
      let eyeTargetX = 100;
      let eyeTargetY = 100;
      let eyeSpeed = 0.008; // Much slower movement
      let lastEyeMoveTime = 0;
      let eyeMoveInterval = 8000; // Longer intervals between movements
      let eyeIsHovered = false;
      let eyeDriftX = 0;
      let eyeDriftY = 0;
      let eyeDriftSpeed = 0.001; // Very slow drift
      let eyeDriftAmplitude = 15; // Small drift amplitude

      function initFloatingEye() {
        console.log("Initializing floating eye...");
        const eye = document.getElementById("floating-eye");
        const tooltip = document.getElementById("eye-tooltip");

        console.log("Eye element:", eye);

          }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      function initDockBehavior() {
        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px) - increased for easier access

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");

        // Show pixel arrow indicator initially since dock is hidden
        if (pixelArrowIndicator) {
          pixelArrowIndicator.classList.add("show");
        }

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;
            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior
        document.addEventListener("mousemove", (e) => {
          const mouseY = e.clientY;
          const windowHeight = window.innerHeight;
          const isInHoverZone = mouseY > windowHeight - hoverZoneHeight;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isInHoverZone) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          // Recalculate hover zone if needed
        });
      }

              timeIcons.forEach((icon, i) => {
                // Calculate opacity based on distance from current value
                const distance = Math.abs(value - i);
                const opacity = Math.max(0.3, 1 - distance * 0.7);
                icon.style.opacity = opacity;
              });
            });
            // Set initial state
            timeIcons.forEach((icon, i) => {
              icon.style.opacity = i === 0 ? "1" : "0.3";
            });
            break;
          case "tags":
            const tagExamples = questionInput.querySelector("#tag-examples");
            const customTagInput =
              questionInput.querySelector("#custom-tag-input");
            const userTagsDiv = questionInput.querySelector("#user-tags");
            let userTags = [];
            // Add example tag click
            tagExamples.querySelectorAll(".tag").forEach((tagBtn) => {
              tagBtn.addEventListener("click", () => {
                if (
                  userTags.length < 8 &&
                  !userTags.includes(tagBtn.textContent)
                ) {
                  userTags.push(tagBtn.textContent);
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
              });
            });
            // Add custom tag input
            customTagInput.addEventListener("input", (e) => {
              if (e.target.value.length > 0) {
                tagExamples.style.display = "none";
              } else {
                tagExamples.style.display = "";
              }
            });
            customTagInput.addEventListener("keydown", (e) => {
              if (
                (e.key === "Enter" || e.key === ",") &&
                customTagInput.value.trim() &&
                userTags.length < 8
              ) {
                const val = customTagInput.value.trim();
                if (!userTags.includes(val)) {
                  userTags.push(val);
                  customTagInput.value = "";
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
                e.preventDefault();
              }
            });
            function renderUserTags() {
              userTagsDiv.innerHTML = userTags
                .map(
                  (tag) =>
                    `<span class='tag selected'>${tag} <span style='cursor:pointer;color:#ff6b6b;' onclick='this.parentNode.remove();'>×</span></span>`
                )
                .join(" ");
            }
            break;
        }
      }

      function submitTextAnswer(textValue) {
        const question = questions[chatbotState.currentQuestion];
        let answer = textValue;

        // Store answer
        chatbotState.answers[question.id] = answer;

        // Show user's answer
        addUserMessage(answer);

        // Clear persistent input
        const textInput = document.getElementById("persistent-text-input");
        if (textInput) {
          textInput.value = "";
        }

        // Remove dynamic input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      function submitAnswer() {
        const question = questions[chatbotState.currentQuestion];
        const questionInput = document.getElementById("question-input");
        let answer = "";

        switch (question.type) {
          case "file":
            const fileInput = document.querySelector("#file-input");
            if (fileInput && fileInput.files.length === 0) {
              alert("Please select a file");
              return;
            }
            answer = fileInput.files[0].name;
            break;

          case "text":
          case "textarea":
            // Text questions are handled by submitTextAnswer function
            // This should not be called for text questions
            return;
          case "location":
            // Location questions are handled by submitTextAnswer function
            // This should not be called for location questions
            return;

          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            answer = slider ? `${slider.value}%` : "50%";
            break;

          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            const value = timeSlider ? parseFloat(timeSlider.value) : 0;
            // Find the closest label or create a blend
            const closestIndex = Math.round(value);
            const closestLabel = timeLabels[closestIndex];

            // If it's exactly on an icon, use that label
            if (Math.abs(value - closestIndex) < 0.1) {
              answer = closestLabel;
            } else {
              // If it's between icons, create a blend
              const lowerIndex = Math.floor(value);
              const upperIndex = Math.min(
                Math.ceil(value),
                timeLabels.length - 1
              );
              const lowerLabel = timeLabels[lowerIndex];
              const upperLabel = timeLabels[upperIndex];
              answer = `${lowerLabel}-${upperLabel}`;
            }
            break;

          case "tags":
            const selectedTags =
              questionInput.querySelectorAll(".tag.selected");
            const customTag = questionInput.querySelector("#custom-tag-input")
              ? questionInput.querySelector("#custom-tag-input").value.trim()
              : "";
            const tagTexts = Array.from(selectedTags).map((tag) =>
              tag.textContent.replace(" ×", "")
            );
            if (customTag) tagTexts.push(customTag);
            answer = tagTexts.join(", ");
            break;
        }

        // Store answer (even if empty)
        chatbotState.answers[question.id] = answer;

        // Show user's answer only if not empty
        if (answer) {
          addUserMessage(answer);
        } else {
          addUserMessage("Skipped");
        }

        // Remove input and disable persistent input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        // Remove upload area from messages if it exists
        const uploadMessage = document.querySelector(
          ".message .file-upload-area"
        );
        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      function goBack() {
        // Remove current input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"

        dynamicContainer.style.display = "none";
        disablePersistentInput();

          ".message .file-upload-area"

        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Go back to previous question
        chatbotState.currentQuestion--;

        // Ask the previous question again
        setTimeout(() => {
          askNextQuestion();
        }, 500);
      }

                    background-size: 100px 100px, 150px 150px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
                    background-position: 0 0, 0 0, 0 0, 0 10px, 10px -10px, -10px 0px;

                    cursor: crosshair;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border: 1px solid rgba(255, 255, 255, 0.3);

                " id="fallback-map">
