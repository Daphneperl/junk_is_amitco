    <script>
        let scene, camera, renderer, controls;
        let composer;
        let particles;
        let imageSprites = [];
        let connectionLines = [];
        let totalImages = 0;
        let loadedImages = 0;

        async function loadImages() {
            try {
                const response = await fetch('images/images.json');
                const imageList = await response.json();
                totalImages = imageList.length;
                
                return Promise.all(imageList.map(imageName => {
                    return new Promise((resolve, reject) => {
                        const loader = new THREE.TextureLoader();
                        loader.load(
                            `images/${imageName}`,
                            (texture) => {
                                loadedImages++;
                                updateLoadingUI((loadedImages / totalImages) * 100);
                                resolve(texture);
                            },
                            undefined,
                            (error) => reject(error)
                        );
                    });
                }));
            } catch (error) {
                console.error('Error loading images:', error);
                return [];
            }
        }

        function createImageSprite(texture, index) {
            const aspectRatio = texture.image.width / texture.image.height;
            const width = 10; // Base width
            const height = width / aspectRatio;

            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                opacity: 1
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, height, 1);

            // Calculate base position using golden ratio for even distribution
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            const theta = 2 * Math.PI * index / goldenRatio;
            const phi = Math.acos(1 - 2 * (index + 0.5) / totalImages);

            // Add randomness to the radius (between 30% and 100% of max radius)
            const maxRadius = 200; // Doubled from 100
            const minRadius = maxRadius * 0.3; // Reduced minimum to 30% for more spread
            const radius = minRadius + Math.random() * (maxRadius - minRadius);

            // Add larger random offset to the angles for less uniform distribution
            const thetaOffset = (Math.random() - 0.5) * Math.PI * 0.8; // Increased from 0.5 to 0.8
            const phiOffset = (Math.random() - 0.5) * Math.PI * 0.5;   // Increased from 0.3 to 0.5

            // Calculate final position with randomness
            const finalTheta = theta + thetaOffset;
            const finalPhi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + phiOffset));

            const targetX = radius * Math.sin(finalPhi) * Math.cos(finalTheta);
            const targetY = radius * Math.sin(finalPhi) * Math.sin(finalTheta);
            const targetZ = radius * Math.cos(finalPhi);

            // Add larger random offsets for more organic distribution
            const randomOffset = maxRadius * 0.25; // Increased from 0.15 to 0.25
            const offsetX = (Math.random() - 0.5) * randomOffset;
            const offsetY = (Math.random() - 0.5) * randomOffset;
            const offsetZ = (Math.random() - 0.5) * randomOffset;

            // Set final position with all offsets
            sprite.position.set(
                targetX + offsetX,
                targetY + offsetY,
                targetZ + offsetZ
            );

            // Store original position and time offset for movement
            sprite.userData = {
                timeOffset: index * 0.1,
                originalX: targetX + offsetX,
                originalY: targetY + offsetY,
                originalZ: targetZ + offsetZ
            };

            return sprite;
        }

        function createConnectionLine() {
            const material = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3, // Reduced opacity for better performance
                linewidth: 1
            });
            const geometry = new THREE.BufferGeometry();
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            return line;
        }

        function updateConnectionLines() {
            // Only update every 120 frames (about twice per second at 60fps) for better performance
            if (Date.now() % 120 !== 0) return;
            
            // Remove old lines
            connectionLines.forEach(line => {
                scene.remove(line);
                line.geometry.dispose();
                line.material.dispose();
            });
            connectionLines = [];

            // Limit the number of connection lines to prevent performance issues
            const maxConnections = Math.min(imageSprites.length, 50);
            const connectionsToCreate = Math.min(maxConnections, imageSprites.length);

            // Create new lines only for a subset of sprites
            for (let i = 0; i < connectionsToCreate; i++) {
                const sprite = imageSprites[i];
                let closestDistance = Infinity;
                let closestSprite = null;

                // Find closest sprite within a reasonable distance
                const maxConnectionDistance = 100; // Limit connection distance
                imageSprites.forEach((otherSprite, otherIndex) => {
                    if (i !== otherIndex) {
                        const dx = sprite.position.x - otherSprite.position.x;
                        const dy = sprite.position.y - otherSprite.position.y;
                        const dz = sprite.position.z - otherSprite.position.z;
                        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                        if (distance < closestDistance && distance < maxConnectionDistance) {
                            closestDistance = distance;
                            closestSprite = otherSprite;
                        }
                    }
                });

                if (closestSprite) {
                    const line = createConnectionLine();
                    const positions = new Float32Array([
                        sprite.position.x, sprite.position.y, sprite.position.z,
                        closestSprite.position.x, closestSprite.position.y, closestSprite.position.z
                    ]);
                    line.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    connectionLines.push(line);
                }
            }
        }

        function createParticleSystem() {
            const particleCount = 300;
            const particleGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSizes = new Float32Array(particleCount);
            const particleColors = new Float32Array(particleCount * 3);
            const particleSpeeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                // Random positions within a sphere
                const radius = 200; // Match the new larger radius
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                particlePositions[i * 3 + 2] = radius * Math.cos(phi);

                // Set particle sizes
                particleSizes[i] = 4; // Make particles larger and more visible

                // More vibrant colors
                const hue = Math.random(); // Random hue
                const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
                const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness
                
                // Convert HSL to RGB
                const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
                const x = c * (1 - Math.abs((hue * 6) % 2 - 1));
                const m = lightness - c/2;
                
                let r, g, b;
                if (hue < 1/6) {
                    r = c; g = x; b = 0;
                } else if (hue < 2/6) {
                    r = x; g = c; b = 0;
                } else if (hue < 3/6) {
                    r = 0; g = c; b = x;
                } else if (hue < 4/6) {
                    r = 0; g = x; b = c;
                } else if (hue < 5/6) {
                    r = x; g = 0; b = c;
                } else {
                    r = c; g = 0; b = x;
                }
                
                particleColors[i * 3] = r + m;     // R
                particleColors[i * 3 + 1] = g + m; // G
                particleColors[i * 3 + 2] = b + m; // B

                // Random speeds between 0.02 and 0.08 (much slower than before)
                particleSpeeds[i] = Math.random() * 0.06;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 2.0, // Increased size to make particles more visible
                vertexColors: true,
                transparent: true,
                opacity: 0.6, // Increased opacity to make particles more visible
                sizeAttenuation: true,
                depthWrite: false // Allow particles to be transparent when in front
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            particles.userData = { 
                speeds: particleSpeeds,
                opacities: new Float32Array(particleCount) // Store individual opacities
            };
            scene.add(particles);
        }

        async function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create noise texture
            const canvas = document.createElement('canvas');
            canvas.width = 3840;
            canvas.height = 2160;
            const ctx = canvas.getContext('2d');
            
            // Generate noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 50;
                data[i] = value;
                data[i + 1] = value;
                data[i + 2] = value;
                data[i + 3] = 20;
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Create and set noise texture
            const noiseTexture = new THREE.CanvasTexture(canvas);
            noiseTexture.wrapS = THREE.RepeatWrapping;
            noiseTexture.wrapT = THREE.RepeatWrapping;
            scene.background = noiseTexture;

            // Create particle system
            createParticleSystem();

            // Load and create image sprites
            const textures = await loadImages();
            textures.forEach((texture, index) => {
                const sprite = createImageSprite(texture, index);
                imageSprites.push(sprite);
                scene.add(sprite);
            });

            // Initial creation of connection lines
            updateConnectionLines();

            // Create camera with increased distance
            camera = new THREE.PerspectiveCamera(75, 3840 / 2160, 0.1, 2000);
            camera.position.set(0, 0, 500); // More zoomed out, centered position
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(3840, 2160);
            renderer.setClearColor(0x000000, 1);
            document.getElementById('visualization').appendChild(renderer.domElement);

            // Setup post-processing
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Add vignette effect
            const vignetteShader = {
                uniforms: {
                    "tDiffuse": { value: null },
                    "offset": { value: 1.0 },
                    "darkness": { value: 1.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        color.rgb *= vignette;
                        gl_FragColor = color;
                    }
                `
            };

            const vignettePass = new THREE.ShaderPass(vignetteShader);
            vignettePass.uniforms.offset.value = 1.0;
            vignettePass.uniforms.darkness.value = 1.0;
            composer.addPass(vignettePass);

            // Add orbit controls with adjusted settings
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 200;  // Prevent zooming in too close
            controls.maxDistance = 1000; // Prevent zooming out too far
            controls.target.set(0, 0, 0); // Ensure we're looking at the center
            controls.update();

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Fixed size - no window resize handling
            // window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = 3840 / 2160;
            camera.updateProjectionMatrix();
            renderer.setSize(3840, 2160);
            composer.setSize(3840, 2160);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now();
            
            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.userData.speeds;
                const opacities = particles.userData.opacities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Move particles in a circular motion
                    const speed = speeds[i / 3];
                    const time = Date.now() * 0.001 * speed;
                    
                    positions[i] += Math.sin(time) * 0.01;
                    positions[i + 1] += Math.cos(time) * 0.01;
                    positions[i + 2] += Math.sin(time * 0.5) * 0.01;

                    // Check if particle is in front of images (z > 0)
                    const z = positions[i + 2];
                    opacities[i / 3] = 0.6; // Temporarily disable depth-based transparency to make particles visible
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
                particles.material.opacity = 0.3; // Base opacity
            }

            // Animate images with simplified movement (no repulsion)
            imageSprites.forEach((sprite, index) => {
                const floatTime = time * 0.0001 + sprite.userData.timeOffset;
                const distanceFromCenter = Math.sqrt(
                    sprite.userData.originalX ** 2 + 
                    sprite.userData.originalY ** 2 + 
                    sprite.userData.originalZ ** 2
                );
                
                // Simplified float radius
                const floatRadius = 0.5 + (distanceFromCenter / 200) * 0.3;
                
                // Simplified movement patterns
                const floatX = Math.sin(floatTime * 0.2) * floatRadius;
                const floatY = Math.cos(floatTime * 0.3) * floatRadius;
                const floatZ = Math.sin(floatTime * 0.25) * floatRadius;

                // Reduced micro-movements
                const microMove = 0.1;
                const microTime = time * 0.0003 + sprite.userData.timeOffset;
                const microX = Math.sin(microTime * 1.5) * microMove;
                const microY = Math.cos(microTime * 1.7) * microMove;
                const microZ = Math.sin(microTime * 1.6) * microMove;

                sprite.position.x = sprite.userData.originalX + floatX + microX;
                sprite.position.y = sprite.userData.originalY + floatY + microY;
                sprite.position.z = sprite.userData.originalZ + floatZ + microZ;
            });

            // Update connection lines much less frequently (every 120 frames = twice per second)
            if (time % 120 === 0) {
                updateConnectionLines();
            }
            
            controls.update();
            composer.render();
        }

                document.getElementById('where-world').value = location;
            }
        }

        function closeMapPopup() {
            const mapPopup = document.getElementById('map-popup');
            mapPopup.style.opacity = '0';
            setTimeout(() => {
                mapPopup.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
