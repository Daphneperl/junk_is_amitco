<!DOCTYPE html>
<html>
<head>
    <title>UI Menu Overlay</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&callback=initGoogleMaps&loading=async" async defer></script>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('assets/pixel.ttf') format('truetype');
        }
        @font-face {
            font-family: 'VT323';

            font-style: normal;
        }
        body {
            margin: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }
        
        /* Overlay-specific styles */
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

        #rings-container {
            position: fixed;
            bottom: -90px;

        #hover-title {

<body>
    <div class="overlay-container">
        <div id="rings-container">
            <div id="hover-title"></div>
        </div>
        <!-- Search Bar (fixed) -->
        <input id="search-bar" type="text" placeholder="I want to see..." />
        <!-- Upload Hand Button (fixed, with image and overlaid text) -->
        <button id="upload-hand-btn">
            <img id="upload-hand-btn-img" src="UploadButton/BiggerHand.png" alt="Upload hand" />
            <div id="upload-hand-btn-text">Upload<br>junk</div>
        </button>
        
        <!-- Chatbot -->
        <div class="chatbot-backdrop" id="chatbot-backdrop">
            <div class="chatbot-container" id="chatbot-container">
                <div class="chatbot-header">
                    Upload Junk
                    <button class="close-btn" onclick="closeChatbot()">×</button>
                </div>
                <div class="chatbot-messages" id="chatbot-messages"></div>
                <div id="dynamic-input-container"></div>
                <div class="chatbot-input-area">
                    <div class="persistent-input">
                        <input type="text" id="persistent-text-input" placeholder="Type your answer..." disabled>
                        <div class="persistent-input-actions">
                            <button id="persistent-back-btn" disabled>Back</button>
                            <button id="persistent-skip-btn" disabled>Skip</button>
                            <button id="persistent-send-btn" disabled>Send</button>
                            <button id="persistent-finish-btn" disabled>Finish</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Map Popup -->
        <div class="map-popup-overlay" id="map-popup-overlay">
            <div class="map-popup-content">
                <div class="map-popup-header">
                    <span>Select Location</span>
                    <button class="map-popup-close" onclick="closeMapPopup()">×</button>
                </div>
                <div class="coordinates-display" id="coordinates-display">Click on the map to place a pin</div>
                <div class="map-controls">
                    <input type="text" class="map-input" id="map-location-input" placeholder="Search for a location...">
                </div>
                <div class="map-container">
                    <div id="map"></div>
                    <div class="map-overlay">
                        <div class="map-instructions">Click on the map to place a pin, or search for a location above</div>
                    </div>
                </div>
                <div class="map-popup-buttons">
                    <button class="map-popup-btn" onclick="closeMapPopup()">Cancel</button>
                    <button class="map-popup-btn primary" onclick="confirmLocation()">Confirm Location</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize the overlay menu
        document.addEventListener('DOMContentLoaded', function() {
            initRings();
            initSearchBar();
            initUploadButton();
            animateRings();
        });

        // Rings functionality (simplified for overlay)
        let ringsScene, ringsCamera, ringsRenderer;
        let rings;
        let ringsRotation = {
            isDragging: false,
            previousX: 0,
            previousY: 0,
            rotationSpeedX: 0.0003,
            rotationSpeedY: 0.0006,
            manualRotationX: 0,
            manualRotationY: 0,
            dragStartTime: 0,
            dragThreshold: 5,
            clickThreshold: 200
        };
        let eyeLabelGroups = [];
        let ringsRaycaster, ringsMouse;

        function createEyeSprite(imagePath) {
            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load(imagePath);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                opacity: 1.0
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(2, 2, 1);
            return sprite;
        }

        function createArcTextSprite(text, fontSize = 100) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            ctx.save();
            ctx.globalCompositeOperation = 'copy';
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
            ctx.font = `bold ${fontSize}px VT323, monospace`;
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            ctx.fillText(text, centerX, centerY);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0,
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(7, 1.5, 1);
            sprite.material.renderOrder = 9999;
            return sprite;
        }

        function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
            const group = new THREE.Group();
            const eye = createEyeSprite(eyePath);
            eye.position.copy(eyePos);
            eye.userData.eyeId = eyeId;
            eye.userData.title = labelText;
            group.add(eye);
            eyeLabelGroups.push({ eye });
            return group;
        }

        function createRings() {
            class CustomEllipseCurve extends THREE.Curve {
                constructor() {
                    super();
                }
                getPoint(t) {
                    const a = 8;
                    const b = 5;
                    const tx = Math.cos(2 * Math.PI * t) * a;
                    const ty = Math.sin(2 * Math.PI * t) * b;
                    return new THREE.Vector3(tx, ty, 0);
                }
            }

            const ringsGroup = new THREE.Group();
            eyeLabelGroups = [];
            
            const path = new CustomEllipseCurve();
            const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

            const ringMaterial1 = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide,
                depthWrite: true,
                depthTest: true,
                renderOrder: 1
            });
            const ringMaterial2 = ringMaterial1.clone();
            ringMaterial2.renderOrder = 2;
            const ringMaterial3 = ringMaterial1.clone();
            ringMaterial3.renderOrder = 3;

            const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
            const group1a = createEyeWithLabel("Eyes/Temperament_open.png", "Temperament", new THREE.Vector3(9, 0, 0), new THREE.Vector3(0, 1, 0), "eye-temperament");
            const group1b = createEyeWithLabel("Eyes/Rhizome_open.png", "Rhizome", new THREE.Vector3(-9, 0, 0), new THREE.Vector3(0, 1, 0), "eye-rhizome");
            ring1.add(group1a);
            ring1.add(group1b);
            ring1.position.z = 1;

            const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
            const group2a = createEyeWithLabel("Eyes/Artist_open.png", "Artist", new THREE.Vector3(0, 9, 0), new THREE.Vector3(0, 0, 1), "eye-artist");
            const group2b = createEyeWithLabel("Eyes/Completeness_open.png", "Completeness", new THREE.Vector3(0, -9, 0), new THREE.Vector3(0, 0, 1), "eye-completeness");
            ring2.rotation.x = Math.PI / 2;
            ring2.position.z = 0;
            ring2.add(group2a);
            ring2.add(group2b);

            const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
            const group3a = createEyeWithLabel("Eyes/SecretGallery_open.png", "idk", new THREE.Vector3(0, 6, 0), new THREE.Vector3(1, 0, 0), "eye-secret");
            const group3b = createEyeWithLabel("Eyes/Intimacy_open.png", "Intimacy", new THREE.Vector3(0, -6, 0), new THREE.Vector3(1, 0, 0), "eye-intimacy");
            ring3.rotation.y = Math.PI / 2;
            ring3.position.z = -1;
            ring3.add(group3a);
            ring3.add(group3b);

            ringsGroup.add(ring1);
            ringsGroup.add(ring2);
            ringsGroup.add(ring3);
            return ringsGroup;
        }

        function initRings() {
            ringsScene = new THREE.Scene();
            ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
            ringsCamera.position.z = 20;

            ringsRenderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                logarithmicDepthBuffer: true,
                preserveDrawingBuffer: true
            });
            ringsRenderer.setSize(500, 500);
            ringsRenderer.setClearColor(0x000000, 0);
            ringsRenderer.sortObjects = false;
            document.getElementById('rings-container').appendChild(ringsRenderer.domElement);

            rings = createRings();
            ringsScene.add(rings);

            ringsRenderer.domElement.addEventListener('mousedown', onRingsMouseDown);
            ringsRenderer.domElement.addEventListener('mousemove', onRingsMouseMove);
            ringsRenderer.domElement.addEventListener('mouseup', onRingsMouseUp);
            ringsRenderer.domElement.addEventListener('mouseleave', onRingsMouseUp);
            ringsRenderer.domElement.addEventListener('click', onRingsClick);
            ringsRaycaster = new THREE.Raycaster();
            ringsMouse = new THREE.Vector2();
            ringsRenderer.domElement.addEventListener('mousemove', onRingsMouseHover);
        }

        function onRingsMouseDown(event) {
            ringsRotation.dragStartTime = Date.now();
            ringsRotation.previousX = event.clientX;
            ringsRotation.previousY = event.clientY;
            ringsRotation.isDragging = false;
        }

        function onRingsMouseMove(event) {
            if (event.buttons !== 1) {
                return;
            }
            
            const deltaX = event.clientX - ringsRotation.previousX;
            const deltaY = event.clientY - ringsRotation.previousY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            if (!ringsRotation.isDragging && distance > ringsRotation.dragThreshold) {
                ringsRotation.isDragging = true;
            }
            
            if (ringsRotation.isDragging) {
                rings.rotation.y += deltaX * 0.01;
                rings.rotation.x += deltaY * 0.01;
                
                ringsRotation.previousX = event.clientX;
                ringsRotation.previousY = event.clientY;
            }
        }

        function onRingsMouseUp() {
            ringsRotation.isDragging = false;
        }

        function onRingsMouseHover(event) {
            const rect = ringsRenderer.domElement.getBoundingClientRect();
            ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
            const eyes = eyeLabelGroups.map(g => g.eye);
            const intersects = ringsRaycaster.intersectObjects(eyes, false);
            
            const hoverTitle = document.getElementById('hover-title');
            
            if (hoverTitle) {
                hoverTitle.style.opacity = '0';
            }
            
            if (intersects.length > 0) {
                const hoveredEye = intersects[0].object;
                if (hoveredEye.userData.title && hoverTitle) {
                    hoverTitle.textContent = hoveredEye.userData.title;
                    hoverTitle.style.opacity = '1';
                }
            }
        }

        function onRingsClick(event) {
            const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
            const deltaX = event.clientX - ringsRotation.previousX;
            const deltaY = event.clientY - ringsRotation.previousY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            if (ringsRotation.isDragging || 
                timeSinceMouseDown > ringsRotation.clickThreshold || 
                distance > ringsRotation.dragThreshold) {
                return;
            }
            
            const rect = ringsRenderer.domElement.getBoundingClientRect();
            ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
            const eyes = eyeLabelGroups.map(g => g.eye);
            const intersects = ringsRaycaster.intersectObjects(eyes, false);
            
            if (intersects.length > 0) {
                const clickedEye = intersects[0].object;
                const eyeId = clickedEye.userData.eyeId;
                
                // Send navigation message to parent window
                window.parent.postMessage({
                    type: 'navigation',
                    eyeId: eyeId,
                    title: clickedEye.userData.title
                }, '*');
                
                // Navigate to the appropriate view
                switch(eyeId) {
                    case 'eye-temperament':
                        window.parent.location.href = 'views/temperament/temperament0606.html';
                        break;
                    case 'eye-secret':
                        window.parent.location.href = 'views/hashtag_gallery/hashtag_gallery.html';
                        break;
                    case 'eye-intimacy':
                        window.parent.location.href = 'views/intimacy/Intimacy.html';
                        break;
                    case 'eye-completeness':
                        window.parent.location.href = 'views/Completeness/Completeness.html';
                        break;
                    case 'eye-artist':
                        window.parent.location.href = 'views/Artists/Artist.html';
                        break;
                    case 'eye-rhizome':
                        window.parent.location.href = 'views/rhizome/rhizome.html';
                        break;
                    default:
                        break;
                }
            }
        }

        function animateRings() {
            if (rings && !ringsRotation.isDragging) {
                rings.rotation.x += 0.0005;
                rings.rotation.y += 0.0008;
            }
            
            ringsRenderer.render(ringsScene, ringsCamera);
            requestAnimationFrame(animateRings);
        }

        // Search functionality
        function initSearchBar() {
            const searchBar = document.getElementById('search-bar');
            let searchTimeout;

            searchBar.addEventListener('input', (event) => {
                const query = event.target.value.trim();
                
                if (searchTimeout) {
                    clearTimeout(searchTimeout);
                }
                
                if (query.length > 0) {
                    searchTimeout = setTimeout(() => {
                        performSearch(query);
                    }, 500);
                }
            });

            searchBar.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    const query = event.target.value.trim();
                    if (query.length > 0) {
                        if (searchTimeout) {
                            clearTimeout(searchTimeout);
                        }
                        performSearch(query);
                    }
                }
            });
        }

        function performSearch(query) {
            console.log('Searching for:', query);
            // Send search message to parent window
            window.parent.postMessage({
                type: 'search',
                query: query
            }, '*');
        }

        // Upload functionality
        function initUploadButton() {
            const uploadBtn = document.getElementById('upload-hand-btn');
            if (uploadBtn) {
                uploadBtn.addEventListener('click', showChatbot);
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeChatbot();
                }
            });
            
            const backdrop = document.getElementById('chatbot-backdrop');
            if (backdrop) {
                backdrop.addEventListener('click', function(e) {
                    if (e.target === backdrop) {
                        closeChatbot();
                    }
                });
            }
        }

        // Chatbot functionality (simplified)
        let chatbotState = {
            currentQuestion: 0,
            answers: {},
            isTyping: false
        };

        const questions = [
            {
                id: 'upload',
                type: 'file',
                message: "",
                required: true
            },
            {
                id: 'name',
                type: 'text',
                message: "Wannna give it a name? Or not. Totally your call.",
                placeholder: "Give it a name...",
                required: false
            }
        ];

        function showChatbot() {
            const chatbot = document.getElementById('chatbot-container');
            const backdrop = document.getElementById('chatbot-backdrop');
            
            backdrop.style.display = 'block';
            setTimeout(() => {
                backdrop.style.opacity = '1';
            }, 10);
            
            chatbot.style.display = 'flex';
            chatbotState.currentQuestion = 0;
            chatbotState.answers = {};
            
            addBotMessage("Hi, friend. Before we dive in — a tiny heads-up: nothing here is mandatory except the junk. Everything else? Totally up to you.");
            
            disablePersistentInput();
            
            setTimeout(() => {
                addBotMessage("Let's begin. Upload your junk:");
                setTimeout(() => {
                    askNextQuestion();
                }, 1500);
            }, 2000);
        }

        function closeChatbot() {
            const chatbot = document.getElementById('chatbot-container');
            const backdrop = document.getElementById('chatbot-backdrop');
            
            chatbot.style.display = 'none';
            
            backdrop.style.opacity = '0';
            setTimeout(() => {
                backdrop.style.display = 'none';
            }, 300);
            
            const messagesContainer = document.getElementById('chatbot-messages');
            const dynamicContainer = document.getElementById('dynamic-input-container');
            messagesContainer.innerHTML = '';
            dynamicContainer.innerHTML = '';
            disablePersistentInput();
        }

        function addBotMessage(message) {
            const messagesContainer = document.getElementById('chatbot-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addUserMessage(message) {
            const messagesContainer = document.getElementById('chatbot-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function disablePersistentInput() {
            const textInput = document.getElementById('persistent-text-input');
            const sendBtn = document.getElementById('persistent-send-btn');
            const backBtn = document.getElementById('persistent-back-btn');
            const skipBtn = document.getElementById('persistent-skip-btn');
            const finishBtn = document.getElementById('persistent-finish-btn');
            if (textInput && sendBtn && backBtn && skipBtn && finishBtn) {
                textInput.disabled = true;
                sendBtn.disabled = true;
                backBtn.disabled = true;
                skipBtn.disabled = true;
                finishBtn.disabled = true;
                textInput.value = '';
            }
        }

        function askNextQuestion() {
            if (chatbotState.currentQuestion >= questions.length) {
                showSummary();
                return;
            }

            const question = questions[chatbotState.currentQuestion];
            
            if (question.message) {
                addBotMessage(question.message);
            }
            
            // Simplified question handling for overlay
            if (question.type === 'file') {
                addBotMessage("File upload functionality is available in the full version.");
                setTimeout(() => {
                    closeChatbot();
                }, 2000);
            }
        }

        function showSummary() {
            addBotMessage("Upload functionality is available in the full version.");
            setTimeout(() => {
                closeChatbot();
            }, 2000);
        }

        // Map functionality (simplified)
        function initGoogleMaps() {
            console.log('Google Maps API loaded successfully');
        }

        function closeMapPopup() {
            const mapPopup = document.getElementById('map-popup-overlay');
            mapPopup.style.display = 'none';
        }

        function confirmLocation() {
            // Simplified location confirmation
            closeMapPopup();
        }
    </script>
