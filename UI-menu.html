<!DOCTYPE html>
<html>
<head>
    <title>Base Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('../../assets/pixel.ttf') format('truetype');
        }
        @font-face {
            font-family: 'VT323';
            src: url('assets/VT323-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
        }
        #visualization {
            width: 100vw;
            height: 100vh;
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #rings-container {
            position: fixed;
            bottom: -90px;
            left: -10px;
            width: 500px;
            height: 500px;
            z-index: 2;
            pointer-events: auto;
        }
        #hover-title {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        #search-bar {
            position: fixed;
            left: 50%;
            bottom: 3vw;
            transform: translateX(-50%);
            width: 420px;
            max-width: 80vw;
            min-width: 280px;
            height: 54px;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 2px 16px #0003;
            font-size: 28px;
            font-family: 'VT323', monospace, sans-serif;
            color: #888;
            border: none;
            outline: none;
            padding: 0 32px;
            z-index: 1000;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        #loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
        
        /* Upload Button Styles */
        #upload-hand-btn {
            position: fixed;
            right: 2vw;
            bottom: 2vw;
            width: 280px;
            height: 280px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 2100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            flex-direction: unset;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #upload-hand-btn-text {
            position: absolute;
            left: 30%;
            top: 55%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-family: 'VT323', monospace, sans-serif;
            color: #888;
            background: none;
            border: none;
            text-align: center;
            pointer-events: none;
            width: 180px;
            line-height: 0.9;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-shadow: 0 0 1px rgba(0,0,0,0.1);
            letter-spacing: 0.5px;
        }
        #upload-hand-btn-img {
            width: 270px;
            height: 270px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }
        
        /* Chatbot Styles */
        .chatbot-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            max-width: 800px;
            height: 80vh;
            background: #000;
            border: 1px solid #fff;
            border-radius: 8px;
            z-index: 3000;
            display: none;
            flex-direction: column;
            font-family: 'Overpass Mono', monospace;
            color: #fff;
        }

        .chatbot-header {
            padding: 20px;
            border-bottom: 1px solid #fff;
            font-family: 'VT323', monospace;
            font-size: 24px;
            text-align: center;
        }

        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message.user {
            align-items: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 15px;
            border: 1px solid #fff;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.4;
        }

        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.05);
        }

        .message.user .message-content {
            background: rgba(255, 255, 255, 0.1);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px;
            border: 1px solid #fff;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            max-width: 80%;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-field {
            background: transparent;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 12px;
            color: #fff;
            font-family: 'Overpass Mono', monospace;
            font-size: 14px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
        }

        .input-field:focus {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .file-upload-area {
            border: 2px dashed #fff;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;

            transition: all 0.3s ease;

        .file-upload-area:hover {
            background: rgba(255, 255, 255, 0.05);

        .file-upload-area.dragover {
            background: rgba(255, 255, 255, 0.1);

        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.primary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.primary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .slider {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            min-width: 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .tag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            padding: 6px 12px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-family: 'Overpass Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag:hover,
        .tag.selected {
            background: rgba(255, 255, 255, 0.1);
        }

        .summary-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .summary-label {
            font-family: 'VT323', monospace;
            font-size: 16px;
        }

        .summary-value {
            font-family: 'Overpass Mono', monospace;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            font-family: 'VT323', monospace;
        }

        /* Map Popup Styles */
        .map-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 4000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .map-popup-content {
            background: #000;
            border: 1px solid #fff;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90vw;
            font-family: 'VT323', monospace;
            color: #fff;
        }

        .map-popup-header {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .map-popup-input {
            width: 100%;
            background: transparent;
            border: 1px solid #fff;
            border-radius: 4px;
            padding: 12px;
            color: #fff;
            font-family: 'Overpass Mono', monospace;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }

        .map-popup-input:focus {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .map-popup-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .map-popup-btn {
            padding: 10px 20px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .map-popup-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .map-popup-btn.primary {
            background: rgba(255, 255, 255, 0.1);
        }

        .map-popup-btn.primary:hover {
            background: rgba(255, 255, 255, 0.2);

    </style>
</head>
<body>
    <div id="black-overlay"></div>
    <div id="loading-container">
        <div class="loading-bar">
            <div id="loading-progress" class="loading-progress" style="width: 0%"></div>
        </div>
        <div id="loading-text" style="color: #ffffff; font-family: monospace; margin-top: 10px;">LOADING... 0%</div>
    </div>
    <div id="visualization"></div>
    <div id="rings-container">
        <div id="hover-title"></div>
    </div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see..." />
    <!-- Upload Hand Button (fixed, with image and overlaid text) -->
    <button id="upload-hand-btn">
        <img id="upload-hand-btn-img" src="UploadButton/BiggerHand.png" alt="Upload hand" />
        <div id="upload-hand-btn-text">Upload<br>junk</div>
    </button>
    <script>
        let scene, camera, renderer, controls;
        let composer;
        let particles;
        
        // Separate variables for rings
        let ringsScene, ringsCamera, ringsRenderer;
        let rings;
        let ringsRotation = {
            isDragging: false,
            previousX: 0,
            previousY: 0,
            rotationSpeedX: 0.0003,
            rotationSpeedY: 0.0006,
            manualRotationX: 0,
            manualRotationY: 0,
            dragStartTime: 0,
            dragThreshold: 5, // Minimum distance to be considered dragging
            clickThreshold: 200 // Minimum time difference to be considered a click vs drag
        };

        // Store references to eye-label groups for hover detection
        let eyeLabelGroups = [];
        let ringsRaycaster, ringsMouse;

        function createEyeSprite(imagePath) {
            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load(imagePath);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;

            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                opacity: 1.0
            });

            const sprite = new THREE.Sprite(spriteMaterial);

            // Set scale based on image aspect ratio
            const img = new window.Image();
            img.src = imagePath;
            img.onload = function() {
                const baseHeight = 2; // units
                const aspect = img.width / img.height;
                sprite.scale.set(baseHeight * aspect, baseHeight, 1);
            };
            // Fallback scale until image loads
            sprite.scale.set(2, 2, 1);
            return sprite;
        }

        // Helper to create a horizontal text sprite (label above the eye)
        function createArcTextSprite(text, fontSize = 100) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            // Ensure full transparency
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalAlpha = 1.0;
            ctx.save();
            ctx.globalCompositeOperation = 'copy';
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
            ctx.font = `bold ${fontSize}px VT323, monospace`;
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Draw the text as a single horizontal line
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            ctx.fillText(text, centerX, centerY);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0,
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(7, 1.5, 1);
            sprite.material.renderOrder = 9999;
            return sprite;
        }

        function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
            const group = new THREE.Group();
            const eye = createEyeSprite(eyePath);
            eye.position.copy(eyePos);
            eye.userData.eyeId = eyeId; // Store the eye ID for navigation
            eye.userData.title = labelText; // Store the title for hover display
            group.add(eye);
            // Store for raycasting
            eyeLabelGroups.push({ eye });
            return group;
        }

        function createRings() {
            // Create an elliptical curve for the oblong ring
            class CustomEllipseCurve extends THREE.Curve {
                constructor() {
                    super();
                }
                getPoint(t) {
                    const a = 8;  // major axis
                    const b = 5;  // minor axis
                    const tx = Math.cos(2 * Math.PI * t) * a;
                    const ty = Math.sin(2 * Math.PI * t) * b;
                    return new THREE.Vector3(tx, ty, 0);
                }
            }

            const ringsGroup = new THREE.Group(); // <-- ensure this is defined
            eyeLabelGroups = [];
            // Create the oblong ring geometry
            const path = new CustomEllipseCurve();
            const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

            // Create materials with different render orders
            const ringMaterial1 = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide,
                depthWrite: true,
                depthTest: true,
                renderOrder: 1
            });
            const ringMaterial2 = ringMaterial1.clone();
            ringMaterial2.renderOrder = 2;
            const ringMaterial3 = ringMaterial1.clone();
            ringMaterial3.renderOrder = 3;

            // Ring 1 (horizontal, up is +Y)
            const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
            const group1a = createEyeWithLabel("Eyes/Temperament_open.png", "Temperament", new THREE.Vector3(9, 0, 0), new THREE.Vector3(0, 1, 0), "eye-temperament");
            const group1b = createEyeWithLabel("Eyes/Rhizome_open.png", "Rhizome", new THREE.Vector3(-9, 0, 0), new THREE.Vector3(0, 1, 0), "eye-rhizome");
            ring1.add(group1a);
            ring1.add(group1b);
            ring1.position.z = 1;

            // Ring 2 (vertical, up is +Z)
            const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
            const group2a = createEyeWithLabel("Eyes/Artist_open.png", "Artist", new THREE.Vector3(0, 9, 0), new THREE.Vector3(0, 0, 1), "eye-artist");
            const group2b = createEyeWithLabel("Eyes/Completeness_open.png", "Completeness", new THREE.Vector3(0, -9, 0), new THREE.Vector3(0, 0, 1), "eye-completeness");
            ring2.rotation.x = Math.PI / 2;
            ring2.position.z = 0;
            ring2.add(group2a);
            ring2.add(group2b);

            // Ring 3 (side, up is +X)
            const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
            const group3a = createEyeWithLabel("Eyes/SecretGallery_open.png", "idk", new THREE.Vector3(0, 6, 0), new THREE.Vector3(1, 0, 0), "eye-secret");
            const group3b = createEyeWithLabel("Eyes/Intimacy_open.png", "Intimacy", new THREE.Vector3(0, -6, 0), new THREE.Vector3(1, 0, 0), "eye-intimacy");
            ring3.rotation.y = Math.PI / 2;
            ring3.position.z = -1;
            ring3.add(group3a);
            ring3.add(group3b);

            ringsGroup.add(ring1);
            ringsGroup.add(ring2);
            ringsGroup.add(ring3);
            return ringsGroup;
        }

        function initRings() {
            // Create separate scene for rings
            ringsScene = new THREE.Scene();
            ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
            ringsCamera.position.z = 20;

            // Create separate renderer for rings
            ringsRenderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                logarithmicDepthBuffer: true,
                preserveDrawingBuffer: true
            });
            ringsRenderer.setSize(500, 500);
            ringsRenderer.setClearColor(0x000000, 0);
            ringsRenderer.sortObjects = false; // Disable automatic sorting
            document.getElementById('rings-container').appendChild(ringsRenderer.domElement);

            // Create and add rings
            rings = createRings();
            ringsScene.add(rings);

            // Add event listeners for rings rotation
            ringsRenderer.domElement.addEventListener('mousedown', onRingsMouseDown);
            ringsRenderer.domElement.addEventListener('mousemove', onRingsMouseMove);
            ringsRenderer.domElement.addEventListener('mouseup', onRingsMouseUp);
            ringsRenderer.domElement.addEventListener('mouseleave', onRingsMouseUp);
            ringsRenderer.domElement.addEventListener('click', onRingsClick);
            ringsRaycaster = new THREE.Raycaster();
            ringsMouse = new THREE.Vector2();
            ringsRenderer.domElement.addEventListener('mousemove', onRingsMouseHover);
        }

        function init() {
            // Create main scene
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 2000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1);
            document.getElementById('visualization').appendChild(renderer.domElement);

            // Set up composer for postprocessing (if needed)
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Add event listener for resizing
            window.addEventListener('resize', onWindowResize);

            // Initialize rings
            initRings();
        }

        function onRingsMouseDown(event) {
            ringsRotation.dragStartTime = Date.now();
            ringsRotation.previousX = event.clientX;
            ringsRotation.previousY = event.clientY;
            ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
        }

        function onRingsMouseMove(event) {
            // Only handle dragging if mouse button is pressed
            if (event.buttons !== 1) {
                return; // No mouse button pressed, don't handle dragging
            }
            
            const deltaX = event.clientX - ringsRotation.previousX;
            const deltaY = event.clientY - ringsRotation.previousY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            // Check if we should start dragging (movement exceeds threshold)
            if (!ringsRotation.isDragging && distance > ringsRotation.dragThreshold) {
                ringsRotation.isDragging = true;
            }
            
            if (ringsRotation.isDragging) {
                rings.rotation.y += deltaX * 0.01;
                rings.rotation.x += deltaY * 0.01;
                
                ringsRotation.previousX = event.clientX;
                ringsRotation.previousY = event.clientY;
            }
        }

        function onRingsMouseUp() {
            ringsRotation.isDragging = false;
        }

        function onRingsMouseHover(event) {
            // Calculate mouse position in normalized device coordinates
            const rect = ringsRenderer.domElement.getBoundingClientRect();
            ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            // Raycast
            ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
            // Collect all eye meshes
            const eyes = eyeLabelGroups.map(g => g.eye);
            const intersects = ringsRaycaster.intersectObjects(eyes, false);
            
            const hoverTitle = document.getElementById('hover-title');
            
            // Hide title by default
            if (hoverTitle) {
                hoverTitle.style.opacity = '0';
            }
            
            // Show title for hovered eye
            if (intersects.length > 0) {
                const hoveredEye = intersects[0].object;
                if (hoveredEye.userData.title && hoverTitle) {
                    hoverTitle.textContent = hoveredEye.userData.title;
                    hoverTitle.style.opacity = '1';
                }
            }
        }

        function onRingsClick(event) {
            // Check if this was a drag or a click
            const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
            const deltaX = event.clientX - ringsRotation.previousX;
            const deltaY = event.clientY - ringsRotation.previousY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            // Only handle clicks if:
            // 1. Not dragging (or very minimal movement)
            // 2. Quick click (less than threshold time)
            // 3. Small movement (less than threshold distance)
            if (ringsRotation.isDragging || 
                timeSinceMouseDown > ringsRotation.clickThreshold || 
                distance > ringsRotation.dragThreshold) {
                return;
            }
            
            // Calculate mouse position in normalized device coordinates
            const rect = ringsRenderer.domElement.getBoundingClientRect();
            ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            // Raycast
            ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
            const eyes = eyeLabelGroups.map(g => g.eye);
            const intersects = ringsRaycaster.intersectObjects(eyes, false);
            
            if (intersects.length > 0) {
                const clickedEye = intersects[0].object;
                const eyeId = clickedEye.userData.eyeId;
                
                // Navigation logic
                switch(eyeId) {
                    case 'eye-temperament':
                        window.location.href = 'views/temperament/temperament0606.html';
                        break;
                    case 'eye-secret':
                        window.location.href = 'views/hashtag_gallery/hashtag_gallery.html';
                        break;
                    case 'eye-intimacy':
                        window.location.href = 'views/intimacy/Intimacy.html';
                        break;

                    case 'eye-rhizome':
                        window.location.href = 'views/rhizome/rhizome.html';
                        break;
                    default:
                        // Silently ignore unknown eye IDs
                        break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.userData.speeds;
                const opacities = particles.userData.opacities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Move particles in a circular motion
                    const speed = speeds[i / 3];
                    const time = Date.now() * 0.001 * speed;
                    
                    positions[i] += Math.sin(time) * 0.01;
                    positions[i + 1] += Math.cos(time) * 0.01;
                    positions[i + 2] += Math.sin(time * 0.5) * 0.01;

                    // Check if particle is in front of images (z > 0)
                    const z = positions[i + 2];
                    opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
                particles.material.opacity = 0.3; // Base opacity
            }
            
            // Animate rings - natural slow rotation when not dragging
            if (rings && !ringsRotation.isDragging) {
                // Very slow, natural rotation
                rings.rotation.x += 0.0005; // Reduced from 0.0003
                rings.rotation.y += 0.0008; // Reduced from 0.0006
            }
            
            // Render both scenes
            composer.render();
            ringsRenderer.render(ringsScene, ringsCamera);
        }

        function submitAnswer() {
            const question = questions[chatbotState.currentQuestion];
            const questionInput = document.getElementById('question-input');
            let answer = '';
            
            switch (question.type) {
                case 'file':
                    const fileInput = questionInput.querySelector('#file-input');
                    if (fileInput.files.length === 0) {
                        alert('Please select a file');
                        return;
                    }
                    answer = fileInput.files[0].name;
                    break;
                    
                case 'text':
                case 'textarea':
                case 'location':
                    const textInput = questionInput.querySelector('#text-input') || questionInput.querySelector('#location-input');
                    answer = textInput ? textInput.value.trim() : '';
                    break;
                    
                case 'slider':
                    const slider = questionInput.querySelector('#slider-input');
                    answer = slider ? `${slider.value}%` : '50%';
                    break;
                    
                case 'time_slider':
                    const timeSlider = questionInput.querySelector('#time-slider-input');
                    const timeLabels = ['Sun', 'Coffee', 'Pasta', 'Wine', 'Moon'];
                    const idx = timeSlider ? parseInt(timeSlider.value) : 0;
                    answer = timeLabels[idx];
                    break;
                    
                case 'tags':
                    const selectedTags = questionInput.querySelectorAll('.tag.selected');
                    const customTag = questionInput.querySelector('#custom-tag-input') ? questionInput.querySelector('#custom-tag-input').value.trim() : '';
                    const tagTexts = Array.from(selectedTags).map(tag => tag.textContent.replace(' ×', ''));
                    if (customTag) tagTexts.push(customTag);
                    answer = tagTexts.join(', ');
                    break;
            }
            
            // Store answer (even if empty)
            chatbotState.answers[question.id] = answer;
            
            // Show user's answer only if not empty
            if (answer) {
                addUserMessage(answer);
            } else {
                addUserMessage('Skipped');
            }
            
            // Remove input
            questionInput.remove();
            
            // Move to next question
            chatbotState.currentQuestion++;
            setTimeout(() => {
                askNextQuestion();

        }

        function closeMapPopup() {
            const mapPopup = document.getElementById('map-popup-overlay');
            const mapInput = document.getElementById('map-location-input');
            
            mapPopup.style.display = 'none';
            mapInput.value = '';
            window.mapLocationCallback = null;
        }

        function confirmMapLocation() {
            const mapInput = document.getElementById('map-location-input');
            const location = mapInput.value.trim();
            
            if (location && window.mapLocationCallback) {
                window.mapLocationCallback(location);
            }
            
            closeMapPopup();
        }

        // Start the visualization when the page loads
        window.addEventListener('load', startVisualization);
    </script>
    
    <!-- Chatbot Upload Interface -->
    <div id="chatbot-container" class="chatbot-container">
        <button class="close-btn" onclick="closeChatbot()">×</button>
        <div class="chatbot-header">Junk Upload Bot</div>
        <div class="chatbot-messages" id="chatbot-messages">
            <!-- Messages will be added here dynamically -->
        </div>
    </div>

    <!-- Map Popup -->
    <div id="map-popup-overlay" class="map-popup-overlay">
        <div class="map-popup-content">
            <div class="map-popup-header">Pin your location!</div>
            <input type="text" class="map-popup-input" id="map-location-input" placeholder="Enter lat,lng or a place name...">
            <div class="map-popup-buttons">
                <button class="map-popup-btn" onclick="closeMapPopup()">Cancel</button>
                <button class="map-popup-btn primary" onclick="confirmMapLocation()">Confirm</button>
            </div>
        </div>
    </div>
</body>
</html>
