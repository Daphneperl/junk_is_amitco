<!DOCTYPE html>
<html>
  <head>
    <title>Base Visualization</title>

    <script

      defer
    ></script>
    <style>

      /* Chatbot Styles */

  <body>
    <div id="black-overlay"></div>
    <div id="loading-container">
      <div class="loading-bar">

          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING... 0%
      </div>
    </div>
    <div id="visualization"></div>
    <div id="rings-container">
      <div id="hover-title"></div>
    </div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see..." />
    <!-- Upload Hand Button (fixed, with image and overlaid text) -->
    <button id="upload-hand-btn">
      <img
        id="upload-hand-btn-img"
        src="UploadButton/BiggerHand.png"
        alt="Upload hand"
      />
      <div id="upload-hand-btn-text">Upload<br />junk</div>
    </button>
    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;

      // Separate variables for rings
      let ringsScene, ringsCamera, ringsRenderer;
      let rings;
      let ringsRotation = {
        isDragging: false,
        previousX: 0,
        previousY: 0,
        rotationSpeedX: 0.0003,
        rotationSpeedY: 0.0006,
        manualRotationX: 0,
        manualRotationY: 0,
        dragStartTime: 0,
        dragThreshold: 5, // Minimum distance to be considered dragging
        clickThreshold: 200, // Minimum time difference to be considered a click vs drag
      };

      // Store references to eye-label groups for hover detection
      let eyeLabelGroups = [];
      let ringsRaycaster, ringsMouse;

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
        const group = new THREE.Group();
        const eye = createEyeSprite(eyePath);
        eye.position.copy(eyePos);
        eye.userData.eyeId = eyeId; // Store the eye ID for navigation
        eye.userData.title = labelText; // Store the title for hover display
        group.add(eye);
        // Store for raycasting
        eyeLabelGroups.push({ eye });
        return group;
      }

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          renderOrder: 1,
        });
        const ringMaterial2 = ringMaterial1.clone();
        ringMaterial2.renderOrder = 2;
        const ringMaterial3 = ringMaterial1.clone();
        ringMaterial3.renderOrder = 3;

        // Ring 1 (horizontal, up is +Y)
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
        const group1a = createEyeWithLabel(
          "Eyes/Temperature_open.png",
          "Temperature",
          new THREE.Vector3(9, 0, 0),

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperature":
              window.location.href = "views/temperature/temperature.html";
              break;
            case "eye-secret":
              window.location.href =
                "views/hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":

              break;
            case "eye-completeness":

              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function onWindowResize() {
        // Update main scene
        camera.aspect = window.innerWidth / window.innerHeight;

        composer.setSize(window.innerWidth, window.innerHeight);

      function animate() {
        requestAnimationFrame(animate);

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        // Render both scenes
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      function setupInputHandlers(question) {
        const questionInput = document.getElementById("question-input");
        switch (question.type) {
          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            const sliderValue = questionInput.querySelector("#slider-value");
            slider.addEventListener("input", (e) => {
              sliderValue.textContent = `${e.target.value}%`;
            });
            break;
          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeIcons = [
              questionInput.querySelector("#icon-sun"),
              questionInput.querySelector("#icon-coffee"),
              questionInput.querySelector("#icon-pasta"),
              questionInput.querySelector("#icon-wine"),
              questionInput.querySelector("#icon-moon"),
            ];
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            timeSlider.addEventListener("input", (e) => {
              const value = parseFloat(e.target.value);
              timeIcons.forEach((icon, i) => {
                // Calculate opacity based on distance from current value
                const distance = Math.abs(value - i);
                const opacity = Math.max(0.3, 1 - distance * 0.7);
                icon.style.opacity = opacity;
              });
            });
            // Set initial state
            timeIcons.forEach((icon, i) => {
              icon.style.opacity = i === 0 ? "1" : "0.3";
            });
            break;
          case "tags":
            const tagExamples = questionInput.querySelector("#tag-examples");
            const customTagInput =
              questionInput.querySelector("#custom-tag-input");
            const userTagsDiv = questionInput.querySelector("#user-tags");
            let userTags = [];
            // Add example tag click
            tagExamples.querySelectorAll(".tag").forEach((tagBtn) => {
              tagBtn.addEventListener("click", () => {
                if (
                  userTags.length < 8 &&
                  !userTags.includes(tagBtn.textContent)
                ) {
                  userTags.push(tagBtn.textContent);
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
              });
            });
            // Add custom tag input
            customTagInput.addEventListener("input", (e) => {
              if (e.target.value.length > 0) {
                tagExamples.style.display = "none";
              } else {
                tagExamples.style.display = "";
              }
            });
            customTagInput.addEventListener("keydown", (e) => {
              if (
                (e.key === "Enter" || e.key === ",") &&
                customTagInput.value.trim() &&
                userTags.length < 8
              ) {
                const val = customTagInput.value.trim();
                if (!userTags.includes(val)) {
                  userTags.push(val);
                  customTagInput.value = "";
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
                e.preventDefault();
              }
            });
            function renderUserTags() {
              userTagsDiv.innerHTML = userTags
                .map(
                  (tag) =>
                    `<span class='tag selected'>${tag} <span style='cursor:pointer;color:#ff6b6b;' onclick='this.parentNode.remove();'>×</span></span>`
                )
                .join(" ");
            }
            break;
        }
      }

      function submitTextAnswer(textValue) {
        const question = questions[chatbotState.currentQuestion];
        let answer = textValue;

        // Store answer
        chatbotState.answers[question.id] = answer;

        // Show user's answer
        addUserMessage(answer);

        // Clear persistent input
        const textInput = document.getElementById("persistent-text-input");
        if (textInput) {
          textInput.value = "";
        }

        // Remove dynamic input
        const dynamicContainer = document.getElementById(

        dynamicContainer.innerHTML = "";

        disablePersistentInput();

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      function submitAnswer() {
        const question = questions[chatbotState.currentQuestion];
        const questionInput = document.getElementById("question-input");
        let answer = "";

        switch (question.type) {
          case "file":
            const fileInput = document.querySelector("#file-input");
            if (fileInput && fileInput.files.length === 0) {
              alert("Please select a file");
              return;
            }
            answer = fileInput.files[0].name;
            break;

          case "text":
          case "textarea":
            // Text questions are handled by submitTextAnswer function
            // This should not be called for text questions
            return;
          case "location":
            // Location questions are handled by submitTextAnswer function
            // This should not be called for location questions
            return;

          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            answer = slider ? `${slider.value}%` : "50%";
            break;

          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            const value = timeSlider ? parseFloat(timeSlider.value) : 0;
            // Find the closest label or create a blend
            const closestIndex = Math.round(value);
            const closestLabel = timeLabels[closestIndex];

            // If it's exactly on an icon, use that label
            if (Math.abs(value - closestIndex) < 0.1) {
              answer = closestLabel;
            } else {
              // If it's between icons, create a blend
              const lowerIndex = Math.floor(value);
              const upperIndex = Math.min(
                Math.ceil(value),
                timeLabels.length - 1
              );
              const lowerLabel = timeLabels[lowerIndex];
              const upperLabel = timeLabels[upperIndex];
              answer = `${lowerLabel}-${upperLabel}`;
            }
            break;

          case "tags":
            const selectedTags =
              questionInput.querySelectorAll(".tag.selected");
            const customTag = questionInput.querySelector("#custom-tag-input")
              ? questionInput.querySelector("#custom-tag-input").value.trim()
              : "";
            const tagTexts = Array.from(selectedTags).map((tag) =>
              tag.textContent.replace(" ×", "")
            );
            if (customTag) tagTexts.push(customTag);
            answer = tagTexts.join(", ");
            break;
        }

        // Store answer (even if empty)
        chatbotState.answers[question.id] = answer;

        // Show user's answer only if not empty
        if (answer) {
          addUserMessage(answer);
        } else {
          addUserMessage("Skipped");
        }

        // Remove input and disable persistent input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        // Remove upload area from messages if it exists
        const uploadMessage = document.querySelector(
          ".message .file-upload-area"
        );
        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      // Wait for Google Maps to be ready

        let attempts = 0;
        const checkInterval = setInterval(() => {
          attempts++;
          if (checkGoogleMapsLoaded() && checkGoogleMapsWorking()) {
            clearInterval(checkInterval);
            console.log("Google Maps is ready and working");

            console.log(

            callback();

          "Map element dimensions:",
          mapElement.offsetWidth,
          "x",
          mapElement.offsetHeight
        );

        // Create map centered on a default location
        mapState.map = new google.maps.Map(mapElement, {
          center: { lat: 40.7128, lng: -74.006 }, // New York City
          zoom: 10,
          mapTypeId: google.maps.MapTypeId.ROADMAP,
          disableDefaultUI: false,
          zoomControl: true,
          mapTypeControl: true,
          scaleControl: true,
          streetViewControl: true,
          rotateControl: true,
          fullscreenControl: true,
          styles: [
            { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
            {
              elementType: "labels.text.stroke",
              stylers: [{ color: "#242f3e" }],
            },
            {
              elementType: "labels.text.fill",
              stylers: [{ color: "#746855" }],
            },
            {
              featureType: "administrative.locality",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "poi",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "poi.park",
              elementType: "geometry",
              stylers: [{ color: "#263c3f" }],
            },
            {
              featureType: "poi.park",
              elementType: "labels.text.fill",
              stylers: [{ color: "#6b9a76" }],
            },
            {
              featureType: "road",
              elementType: "geometry",
              stylers: [{ color: "#38414e" }],
            },
            {
              featureType: "road",
              elementType: "geometry.stroke",
              stylers: [{ color: "#212a37" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.fill",
              stylers: [{ color: "#9ca5b3" }],
            },
            {
              featureType: "road.highway",
              elementType: "geometry",
              stylers: [{ color: "#746855" }],
            },
            {
              featureType: "road.highway",
              elementType: "geometry.stroke",
              stylers: [{ color: "#1f2835" }],
            },
            {
              featureType: "road.highway",
              elementType: "labels.text.fill",
              stylers: [{ color: "#f3d19c" }],
            },
            {
              featureType: "transit",
              elementType: "geometry",
              stylers: [{ color: "#2f3948" }],
            },
            {
              featureType: "transit.station",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "water",
              elementType: "geometry",
              stylers: [{ color: "#17263c" }],
            },
            {
              featureType: "water",
              elementType: "labels.text.fill",
              stylers: [{ color: "#515c6d" }],
            },
            {
              featureType: "water",
              elementType: "labels.text.stroke",
              stylers: [{ color: "#17263c" }],
            },
          ],
        });

        // Add click listener to map
        mapState.map.addListener("click", (event) => {
          placeMarker(event.latLng);
        });

        // Trigger a resize event to ensure proper rendering
        setTimeout(() => {
          if (mapState.map) {
            google.maps.event.trigger(mapState.map, "resize");
            console.log("Map resize triggered");
          }
        }, 300);
      }

      function initializeAutocomplete() {
        const input = document.getElementById("map-location-input");
        mapState.autocomplete = new google.maps.places.Autocomplete(input);

        mapState.autocomplete.addListener("place_changed", () => {
          const place = mapState.autocomplete.getPlace();

          if (place.geometry) {
            // Center map on selected place
            mapState.map.setCenter(place.geometry.location);
            mapState.map.setZoom(15);

            // Place marker at the selected location
            placeMarker(place.geometry.location);

            // Update coordinates display
            updateCoordinatesDisplay(place.geometry.location);
          }
        });
      }

      function initializeFallbackAutocomplete() {
        const input = document.getElementById("map-location-input");

        // Simple location suggestions
        const commonLocations = [
          "Home",
          "Work",
          "School",
          "Gym",
          "Coffee Shop",
          "Restaurant",
          "Park",
          "Mall",
          "Airport",
          "Train Station",
          "Bus Stop",
          "Hospital",
          "Library",
          "Museum",
          "Theater",
          "Stadium",
        ];

        // Create a simple datalist for suggestions
        const datalist = document.createElement("datalist");
        datalist.id = "location-suggestions";

        commonLocations.forEach((location) => {
          const option = document.createElement("option");
          option.value = location;
          datalist.appendChild(option);
        });

        // Add datalist to input
        input.setAttribute("list", "location-suggestions");
        document.body.appendChild(datalist);

        // Add placeholder text
        input.placeholder =
          "Type location name (e.g., Home, Work, Coffee Shop)";
      }

      function placeMarker(latLng) {
        // Remove existing marker
        if (mapState.marker) {
          mapState.marker.setMap(null);
        }

        // Create new marker
        mapState.marker = new google.maps.Marker({
          position: latLng,
          map: mapState.map,
          title: "Selected Location",
          icon: {
            url:
              "data:image/svg+xml;charset=UTF-8," +
              encodeURIComponent(`
                        <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="15" cy="15" r="12" fill="#ff4444" stroke="#fff" stroke-width="2"/>
                            <text x="15" y="20" text-anchor="middle" fill="#fff" font-size="16">📍</text>
                        </svg>
                    `),
            scaledSize: new google.maps.Size(30, 30),
            anchor: new google.maps.Point(15, 15),
          },
        });

        mapState.selectedLocation = latLng;
        updateCoordinatesDisplay(latLng);
      }

      function updateCoordinatesDisplay(latLng) {
        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent = `Pinned at: ${latLng
          .lat()
          .toFixed(6)}, ${latLng.lng().toFixed(6)}`;
      }

      function clearPin() {
        if (mapState.marker) {
          mapState.marker.setMap(null);
          mapState.marker = null;
        }

        // Also clear fallback pin
        const fallbackPin = document.querySelector(".fallback-pin");
        if (fallbackPin) {
          fallbackPin.remove();
        }

        mapState.selectedLocation = null;

        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent =
          "Click on the map to pin your location";
      }

      function showMapPopup(callback) {
        const mapPopup = document.getElementById("map-popup-overlay");
        const mapInput = document.getElementById("map-location-input");

        // Store callback for later use
        window.mapLocationCallback = callback;

        // Show popup
        mapPopup.style.display = "flex";
        mapInput.focus();

        // Handle Enter key
        mapInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            confirmMapLocation();
          }
        });
      }

      function closeMapPopup() {
        const mapPopup = document.getElementById("map-popup-overlay");
        const mapInput = document.getElementById("map-location-input");

        mapPopup.style.display = "none";
        mapInput.value = "";

        // Clear pin state
        clearPin();

        // Reset coordinates display
        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent =
          "Click on the map to pin your location";
      }

      function confirmMapLocation() {
        const mapInput = document.getElementById("map-location-input");
        const locationDescription = mapInput.value.trim();

        if (!mapState.selectedLocation) {
          alert("Please pin a location on the map first!");
          return;
        }

        // Create location string
        const lat = mapState.selectedLocation.lat().toFixed(6);
        const lng = mapState.selectedLocation.lng().toFixed(6);
        const locationString = locationDescription
          ? `${locationDescription} (${lat}, ${lng})`
          : `Location: ${lat}, ${lng}`;

        // Submit the location answer
        submitTextAnswer(locationString);

        closeMapPopup();
      }

      // Start the visualization when the page loads
      window.addEventListener("load", startVisualization);

      // Initialize Google Maps when the API loads
      function initGoogleMaps() {
        mapState.googleMapsLoaded = true;
        console.log("Google Maps API loaded successfully");
      }

      // Make the function globally available
      window.initGoogleMaps = initGoogleMaps;
    </script>

    <!-- Chatbot Backdrop -->
    <div id="chatbot-backdrop" class="chatbot-backdrop"></div>

    <!-- Chatbot Upload Interface -->
    <div id="chatbot-container" class="chatbot-container">
      <button class="close-btn" onclick="closeChatbot()">×</button>
      <div class="chatbot-header">Junk Upload Bot</div>
      <div class="chatbot-messages" id="chatbot-messages">
        <!-- Messages will be added here dynamically -->
      </div>
      <div class="chatbot-input-area" id="chatbot-input-area">
        <div class="persistent-input">
          <button id="persistent-back-btn" disabled>Back</button>
          <input
            type="text"
            id="persistent-text-input"
            placeholder="Type your message..."
            disabled
          />
          <div class="persistent-input-actions">
            <button id="persistent-send-btn" disabled>Send</button>
            <button id="persistent-skip-btn" disabled>Skip</button>
            <button id="persistent-finish-btn" disabled>Finish</button>
          </div>
        </div>
        <div id="dynamic-input-container">
          <!-- Dynamic input elements will be added here -->
        </div>
      </div>
    </div>

    <!-- Map Popup -->
    <div id="map-popup-overlay" class="map-popup-overlay">
      <div class="map-popup-content">
        <div class="map-popup-header">
          <span>Pin your location!</span>
          <button class="map-popup-close" onclick="closeMapPopup()">×</button>
        </div>
        <div class="coordinates-display" id="coordinates-display">
          Click on the map to pin your location
        </div>
        <div class="map-controls">
          <input
            type="text"
            class="map-input"
            id="map-location-input"
            placeholder="Enter location name or description..."
          />
          <button class="map-popup-btn" onclick="clearPin()">Clear Pin</button>
        </div>
        <div class="map-container">
          <div id="map"></div>
          <div class="map-overlay">
            <div class="map-instructions">
              Click on the map to place a pin, or search for an address above
            </div>
          </div>
          <div class="map-pin-button" id="map-pin-button">📍</div>
        </div>
        <div class="map-popup-buttons">
          <button class="map-popup-btn" onclick="closeMapPopup()">
            Cancel
          </button>
          <button class="map-popup-btn primary" onclick="confirmMapLocation()">
            Confirm Location
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
