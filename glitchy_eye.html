<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitchy Eye Animation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            color: #fff;
        }
        
        .container {
            text-align: center;
        }
        
        canvas {
            border: 1px solid #333;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="glitchCanvas" width="600" height="400"></canvas>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('glitchCanvas');
        const ctx = canvas.getContext('2d');
        
        // Image loading
        const eyeImage = new Image();
        eyeImage.src = 'assets/GlitchyEye.png';
        
        // Animation parameters (easily adjustable)
        const params = {
            scanlineSpeed: 3,
            jitterIntensity: 3,
            distortionFreq: 8,
            colorIntensity: 100
        };
        
        // Animation state
        let time = 0;
        let lastJitterTime = 0;
        let lastDistortionTime = 0;
        let jitterOffset = { x: 0, y: 0 };
        let distortionActive = false;
        let distortionOffset = 0;
        
        // Utility functions
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        function noise(x) {
            return Math.sin(x * 0.1) * Math.sin(x * 0.2) * Math.sin(x * 0.3);
        }
        
        // Draw RGB scanlines
        function drawScanlines() {
            const lineHeight = 2;
            const speed = params.scanlineSpeed;
            
            for (let y = 0; y < canvas.height; y += lineHeight * 3) {
                const offset = Math.sin(time * 0.01 + y * 0.1) * speed;
                const intensity = Math.sin(time * 0.02 + y * 0.05) * 0.5 + 0.5;
                
                // Red channel
                ctx.fillStyle = `rgba(255, 0, 0, ${intensity * params.colorIntensity / 255})`;
                ctx.fillRect(0, y + offset, canvas.width, lineHeight);
                
                // Green channel
                ctx.fillStyle = `rgba(0, 255, 0, ${intensity * params.colorIntensity / 255})`;
                ctx.fillRect(0, y + lineHeight + offset * 0.8, canvas.width, lineHeight);
                
                // Blue channel
                ctx.fillStyle = `rgba(0, 0, 255, ${intensity * params.colorIntensity / 255})`;
                ctx.fillRect(0, y + lineHeight * 2 + offset * 1.2, canvas.width, lineHeight);
            }
        }
        
        // Apply horizontal distortion
        function applyDistortion() {
            if (!distortionActive) return;
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const newData = new Uint8ClampedArray(data.length);
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const offset = Math.sin(y * 0.1 + time * 0.05) * distortionOffset;
                    const sourceX = Math.max(0, Math.min(canvas.width - 1, x + offset));
                    
                    const sourceIndex = (y * canvas.width + sourceX) * 4;
                    const targetIndex = (y * canvas.width + x) * 4;
                    
                    newData[targetIndex] = data[sourceIndex];     // R
                    newData[targetIndex + 1] = data[sourceIndex + 1]; // G
                    newData[targetIndex + 2] = data[sourceIndex + 2]; // B
                    newData[targetIndex + 3] = data[sourceIndex + 3]; // A
                }
            }
            
            ctx.putImageData(new ImageData(newData, canvas.width, canvas.height), 0, 0);
        }
        
        // Main render function
        function render() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update time
            time += 1;
            
            // Handle jitter effect
            if (time - lastJitterTime > random(30, 120)) {
                jitterOffset.x = random(-params.jitterIntensity, params.jitterIntensity);
                jitterOffset.y = random(-params.jitterIntensity, params.jitterIntensity);
                lastJitterTime = time;
            }
            
            // Handle distortion effect
            if (time - lastDistortionTime > random(60, 300) / params.distortionFreq) {
                distortionActive = true;
                distortionOffset = random(5, 20);
                lastDistortionTime = time;
                
                // Reset distortion after a short time
                setTimeout(() => {
                    distortionActive = false;
                }, random(100, 300));
            }
            
            // Draw the eye image with jitter
            if (eyeImage.complete) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const imageWidth = 200;
                const imageHeight = 200;
                
                ctx.save();
                ctx.translate(centerX + jitterOffset.x, centerY + jitterOffset.y);
                ctx.drawImage(
                    eyeImage,
                    -imageWidth / 2,
                    -imageHeight / 2,
                    imageWidth,
                    imageHeight
                );
                ctx.restore();
            }
            
            // Apply distortion if active
            if (distortionActive) {
                applyDistortion();
            }
            
            // Draw scanlines on top
            drawScanlines();
            
            // Continue animation
            requestAnimationFrame(render);
        }
        
        // Start animation when image loads
        eyeImage.onload = () => {
            render();
        };
        
        // Fallback if image fails to load
        eyeImage.onerror = () => {
            console.warn('Failed to load eye image, using fallback circle');
            // Draw a simple white circle with black pupil as fallback
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();
            
            render();
        };
    </script>
</body>
</html>
