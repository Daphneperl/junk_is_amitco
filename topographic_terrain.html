<!DOCTYPE html>
<html>
<head>
    <title>Topographic Terrain (Semantic Landscape)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
        }
        #terrain-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #no-images {
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="terrain-canvas"></div>
    <div id="no-images" style="display:none;">No images found in /images/</div>
    <script>
    // --- Config ---
    const IMAGE_DIR = 'images/';
    const GRID_COLS = 10;
    const GRID_SPACING = 8;
    const MAX_HEIGHT = 8;
    const IMAGE_SIZE = 4;
    const SEED = 42; // For reproducibility

    // --- List of image filenames (manually copied from directory for now) ---
    const imageFiles = [
        // Only a subset for demo, add more as needed
        'image1.jpg','image2.jpg','image3.jpg','image4.jpg','image5.jpg','image6.jpg','image7.jpg','image8.jpg','image9.jpg','image10.jpg',
        'image11.jpg','image12.jpg','image13.jpg','image14.jpg','image15.jpg','image16.jpg','image17.jpg','image18.jpg','image19.jpg','image20.jpg',
        'image21.jpg','image22.jpg','image23.jpg','image24.jpg','image25.jpg','image26.jpg','image27.jpg','image28.jpg','image29.jpg','image30.jpg',
        'image31.jpg','image32.jpg','image33.jpg','image34.jpg','image35.jpg','image36.jpg','image37.jpg','image38.jpg','image39.jpg','image40.jpg',
        'image41.jpg','image42.jpg','image43.jpg','image44.jpg','image45.jpg','image46.jpg','image47.jpg','image48.jpg','image49.jpg','image50.jpg',
        // Add png, gif, webp, etc. as needed
        'image528.png','image529.png','image530.png','image498.png','image497.png','image496.png','image495.png','image494.png','image493.png','image492.png',
        'image491.png','image490.png','image489.png','image488.png','image509.gif','image508.gif','image507.gif','image506.gif','image505.gif','image504.gif',
        'image503.gif','image502.gif','image501.gif','image500.gif','image499.gif','image527.webp','image526.webp','image525.webp','image524.webp','image523.webp',
        'image522.webp','image521.webp','image520.webp','image519.webp','image518.webp','image517.webp','image516.webp','image515.webp','image514.webp','image513.webp',
        'image512.webp','image511.webp','image510.webp'
    ];
    const IMAGE_COUNT = imageFiles.length;
    const GRID_ROWS = Math.ceil(IMAGE_COUNT / GRID_COLS);

    // --- Seeded random for mock semantic relevance ---
    function seededRandom(seed) {
        let x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
    }
    function getSeed(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return Math.abs(hash);
    }

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = width / height;
    const camera = new THREE.OrthographicCamera(
        -aspect * 30, aspect * 30, 30, -30, 1, 1000
    );
    camera.position.set(40, 40, 40);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setClearColor(0x111111, 1);
    renderer.shadowMap.enabled = true;
    document.getElementById('terrain-canvas').appendChild(renderer.domElement);

    // --- Lighting ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(30, 50, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- Load Images and Place on Terrain ---
    const imageMeshes = [];
    let loaded = 0;
    if (IMAGE_COUNT === 0) {
        document.getElementById('no-images').style.display = 'block';
    } else {
        for (let i = 0; i < IMAGE_COUNT; i++) {
            const col = i % GRID_COLS;
            const row = Math.floor(i / GRID_COLS);
            const x = (col - GRID_COLS / 2) * GRID_SPACING;
            const y = (row - GRID_ROWS / 2) * GRID_SPACING;
            const filename = imageFiles[i];
            const imgPath = IMAGE_DIR + filename;
            // Mock semantic relevance with seeded random
            const relevance = seededRandom(getSeed(filename + SEED));
            const z = relevance * MAX_HEIGHT;
            const texture = new THREE.TextureLoader().load(imgPath, () => {
                loaded++;
                if (loaded === IMAGE_COUNT) animate();
            });
            const material = new THREE.MeshPhongMaterial({ map: texture, shininess: 10 });
            const geometry = new THREE.PlaneGeometry(IMAGE_SIZE, IMAGE_SIZE);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            // Tilt for isometric effect
            mesh.rotation.x = -Math.PI / 4;
            mesh.rotation.z = Math.PI / 4;
            scene.add(mesh);
            imageMeshes.push(mesh);
        }
    }

    // --- Ground Plane (for shadow) ---
    const groundGeo = new THREE.PlaneGeometry(200, 100, 10, 10);
    const groundMat = new THREE.MeshPhongMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -25;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Render Loop ---
    function animate() {
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    // --- Responsive Resize ---
    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;
        camera.left = -aspect * 30;
        camera.right = aspect * 30;
        camera.top = 30;
        camera.bottom = -30;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    });
    </script>
</body>
</html>
