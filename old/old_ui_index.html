<!DOCTYPE html>
<html>
  <head>
    <title>Base Visualization</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("assets/VT323-Regular.ttf") format("truetype");
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }
      #main-viewport {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3840px;
        height: 2160px;
        transform: translate(-50%, -50%);
        background: transparent;
        transform-origin: center center;
      }
      #eyes-interface {
        position: fixed;
        left: 2vw;
        bottom: 3vw;
        width: 340px;
        height: 220px;
        pointer-events: none;
        z-index: 2000;
        /* background: rgba(255,0,0,0.12); */
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .eye-blob {
        position: absolute;
        pointer-events: auto;
        cursor: pointer;
        user-select: none;
        border: 2px solid #f00; /* DEBUG: visible border */
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 18px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #upload-hand-btn {
        position: fixed;
        right: 2vw;
        bottom: 2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: unset;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #upload-hand-btn-text {
        position: absolute;
        left: 30%;
        top: 60%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 1.2;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
      }
      #upload-hand-btn-img {
        width: 270px;
        height: 270px;
        object-fit: contain;
        display: block;
        pointer-events: none;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
      #eyes-menu {
        position: fixed;
        left: 2vw;
        bottom: 3vw;
        width: 260px;
        height: 180px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .eye-btn {
        position: absolute;
        width: 64px;
        height: 48px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border: none;
        outline: none;
        cursor: pointer;
        pointer-events: auto;
        background-color: transparent;
        transition: filter 0.2s;
      }
      .eye-btn:hover,
      .eye-btn:focus {
        filter: brightness(1.2) drop-shadow(0 0 8px #fff8);
      }

      .eye-tooltip {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        font-family: "VT323", monospace, sans-serif;
        white-space: nowrap;
        pointer-events: none;
        z-index: 3000;
        opacity: 0;
        transition: opacity 0.2s ease;
        transform: translateX(-50%);
        top: -40px;
        left: 50%;
      }

      .eye-tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: rgba(0, 0, 0, 0.8);
      }
      #eye-artist {
        left: 98px;
        top: 0px;
      }
      #eye-temperament {
        left: 200px;
        top: 38px;
      }
      #eye-intimacy {
        left: 130px;
        top: 80px;
      }
      #eye-rhizome {
        left: 0px;
        top: 38px;
      }
      #eye-completeness {
        left: 30px;
        top: 110px;
      }
      #eye-secret {
        left: 98px;
        top: 140px;
      }

      /* Popup Styles */
      .popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 3000;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .popup-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: transparent;
        border-radius: 20px;
        padding: 0;
        max-width: 95vw;
        max-height: 95vh;
        width: auto;
        overflow: auto;
        box-shadow: none;
      }

      .popup-close {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
        font-weight: bold;
      }

      .popup-close:hover {
        color: #000;
      }

      .popup-image {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        border-radius: 10px;
      }

      /* Form Styles */
      .upload-form-container {
        background: #000000;
        color: #ffffff;
        padding: 40px;
        border-radius: 0;
        max-width: 95vw;
        width: auto;
        max-height: 90vh;
        overflow-y: auto;
        display: grid;
        grid-template-columns: minmax(350px, 421px) minmax(400px, 471px) minmax(
            380px,
            460px
          );
        grid-template-rows: auto auto auto;
        gap: 40px;
        position: relative;
      }

      .upload-section {
        grid-column: 1;
        grid-row: 1 / 3;
      }

      .metadata-section {
        grid-column: 2;
        grid-row: 1 / 3;
      }

      .details-section {
        grid-column: 3;
        grid-row: 1 / 3;
      }

      .submit-section {
        grid-column: 3;
        grid-row: 3;
        text-align: right;
        margin-top: 20px;
      }

      /* Typography */
      .upload-title {
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        margin: 0 0 12px 0;
        color: #ffffff;
      }

      .upload-subtitle {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: #ffffff;
        margin: 0 0 30px 0;
        opacity: 0.8;
      }

      /* Form Groups */
      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        font-family: "Overpass Mono", monospace;
        font-size: 13px;
        color: #ffffff;
        margin-bottom: 8px;
        font-weight: normal;
      }

      .form-group input[type="text"],
      .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        font-family: "Overpass Mono", monospace;
        font-size: 13px;
        box-sizing: border-box;
        border-radius: 0;
      }

      .form-group input[type="text"]::placeholder,
      .form-group textarea::placeholder {
        color: #999999;
        opacity: 1;
      }

      .form-group textarea {
        height: 80px;
        resize: vertical;
      }

      /* Drag & Drop Zone */
      .drag-drop-zone {
        border: 2px dashed #ffffff;
        background: transparent;
        padding: 50px 20px;
        text-align: center;
        margin-bottom: 30px;
        cursor: pointer;
        transition: border-color 0.3s ease;
      }

      .drag-drop-zone:hover {
        border-color: #cccccc;
      }

      .drag-drop-zone.dragover {
        border-color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
      }

      .drag-drop-text {
        font-family: "VT323", monospace;
        font-size: 18px;
        color: #ffffff;
        line-height: 1.5;
      }

      /* Location Input */
      .location-input {
        position: relative;
      }

      .location-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        z-index: 1;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }

      .location-icon:hover {
        opacity: 0.7;
      }

      .location-input input {
        padding-left: 30px;
        cursor: pointer;
      }

      /* Time Window Slider */
      .time-window-slider-container {
        margin-top: 8px;
      }

      .time-window-slider {
        width: 100%;
        height: 3px;
        background: transparent;
        border: 1px solid #ffffff;
        outline: none;
        -webkit-appearance: none;
        margin-bottom: 8px;
      }

      .time-window-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid #ffffff;
        cursor: pointer;
      }

      .time-window-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid #ffffff;
        cursor: pointer;
      }

      .time-icons {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
      }

      .time-icon {
        font-size: 14px;
        color: #ffffff;
        opacity: 0.5;
        transition: opacity 0.3s ease;
      }

      .time-icon.active {
        opacity: 1;
      }

      /* Slider */
      .slider-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
      }

      .slider-label {
        font-family: "Overpass Mono", monospace;
        font-size: 10px;
        color: #ffffff;
        white-space: nowrap;
      }

      .cooked-slider {
        flex: 1;
        height: 3px;
        background: transparent;
        border: 1px solid #ffffff;
        outline: none;
        -webkit-appearance: none;
      }

      .cooked-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid #ffffff;
        cursor: pointer;
      }

      .cooked-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid #ffffff;
        cursor: pointer;
      }

      .slider-value {
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        color: #ffffff;
        min-width: 16px;
        text-align: center;
      }

      /* Submit Button - moved to right column */
      .submit-section {
        margin-top: 20px;
        text-align: right;
      }

      .launch-btn {
        font-family: "VT323", monospace;
        font-size: 18px;
        font-weight: bold;
        padding: 12px 30px;
        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        cursor: pointer;
        border-radius: 0;
        transition: all 0.3s ease;
      }

      .launch-btn:hover {
        background: #ffffff;
        color: #000000;
      }
      /* Chatbot Styles */
      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        flex-direction: column;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-header {
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
      }

      .chatbot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 40px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }

      .slider-value {
        font-family: "VT323", monospace;
        font-size: 18px;
        min-width: 60px;
        text-align: center;
      }

      .time-picker {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .time-option {
        padding: 8px 16px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .time-option:hover,
      .time-option.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Map Popup Styles */
      .map-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 4000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .map-popup-content {
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        padding: 30px;
        max-width: 500px;
        width: 90vw;
        font-family: "VT323", monospace;
        color: #fff;
      }

      .map-popup-header {
        font-size: 24px;
        margin-bottom: 20px;
        text-align: center;
      }

      .map-popup-input {
        width: 100%;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        margin-bottom: 20px;
      }

      .map-popup-input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .map-popup-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .map-popup-btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .map-popup-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="black-overlay"></div>
    <div
      id="loading-container"
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      "
    >
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING... 0%
      </div>
    </div>
    <div id="main-viewport">
      <div id="visualization"></div>
    </div>
    <!-- Eyes Interface Overlay (fixed) -->
    <div id="eyes-interface"></div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see..." />
    <!-- Upload Hand Button (fixed, with image and overlaid text) -->

    <!-- Chatbot Upload Interface -->
    <div id="chatbot-container" class="chatbot-container">

    <!-- Map Popup -->
    <div id="map-popup-overlay" class="map-popup-overlay">
      <div class="map-popup-content">
        <div class="map-popup-header">Pin your location!</div>

          type="text"

          id="map-location-input"
          placeholder="Enter lat,lng or a place name..."
        />
        <div class="map-popup-buttons">
          <button class="map-popup-btn" onclick="closeMapPopup()">
            Cancel

    </div>
    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;
      let imageSprites = [];
      let connectionLines = [];
      let totalImages = 0;
      let loadedImages = 0;

      async function loadImages() {
        try {
          const response = await fetch("images/images.json");
          const imageList = await response.json();
          totalImages = imageList.length;

          return Promise.all(
            imageList.map((imageName) => {
              return new Promise((resolve, reject) => {
                const loader = new THREE.TextureLoader();
                loader.load(
                  `images/${imageName}`,
                  (texture) => {
                    loadedImages++;
                    updateLoadingUI((loadedImages / totalImages) * 100);
                    resolve(texture);
                  },
                  undefined,
                  (error) => reject(error)
                );
              });
            })
          );
        } catch (error) {
          console.error("Error loading images:", error);
          return [];
        }
      }

      function createImageSprite(texture, index) {
        const aspectRatio = texture.image.width / texture.image.height;
        const width = 10; // Base width
        const height = width / aspectRatio;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
        });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(width, height, 1);

        // Calculate base position using golden ratio for even distribution
        const goldenRatio = (1 + Math.sqrt(5)) / 2;
        const theta = (2 * Math.PI * index) / goldenRatio;
        const phi = Math.acos(1 - (2 * (index + 0.5)) / totalImages);

        // Add randomness to the radius (between 30% and 100% of max radius)
        const maxRadius = 200; // Doubled from 100
        const minRadius = maxRadius * 0.3; // Reduced minimum to 30% for more spread
        const radius = minRadius + Math.random() * (maxRadius - minRadius);

        // Add larger random offset to the angles for less uniform distribution
        const thetaOffset = (Math.random() - 0.5) * Math.PI * 0.8; // Increased from 0.5 to 0.8
        const phiOffset = (Math.random() - 0.5) * Math.PI * 0.5; // Increased from 0.3 to 0.5

        // Calculate final position with randomness
        const finalTheta = theta + thetaOffset;
        const finalPhi = Math.max(
          0.1,
          Math.min(Math.PI - 0.1, phi + phiOffset)
        );

        const targetX = radius * Math.sin(finalPhi) * Math.cos(finalTheta);
        const targetY = radius * Math.sin(finalPhi) * Math.sin(finalTheta);
        const targetZ = radius * Math.cos(finalPhi);

        // Add larger random offsets for more organic distribution
        const randomOffset = maxRadius * 0.25; // Increased from 0.15 to 0.25
        const offsetX = (Math.random() - 0.5) * randomOffset;
        const offsetY = (Math.random() - 0.5) * randomOffset;
        const offsetZ = (Math.random() - 0.5) * randomOffset;

        // Set final position with all offsets
        sprite.position.set(
          targetX + offsetX,
          targetY + offsetY,
          targetZ + offsetZ
        );

        // Store original position and time offset for movement
        sprite.userData = {
          timeOffset: index * 0.1,
          originalX: targetX + offsetX,
          originalY: targetY + offsetY,
          originalZ: targetZ + offsetZ,
        };

        return sprite;
      }

      function createConnectionLine() {
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.3, // Reduced opacity for better performance
          linewidth: 1,
        });
        const geometry = new THREE.BufferGeometry();
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        return line;
      }

      function updateConnectionLines() {
        // Only update every 120 frames (about twice per second at 60fps) for better performance
        if (Date.now() % 120 !== 0) return;

        // Remove old lines
        connectionLines.forEach((line) => {
          scene.remove(line);
          line.geometry.dispose();
          line.material.dispose();
        });
        connectionLines = [];

        // Limit the number of connection lines to prevent performance issues
        const maxConnections = Math.min(imageSprites.length, 50);
        const connectionsToCreate = Math.min(
          maxConnections,
          imageSprites.length
        );

        // Create new lines only for a subset of sprites
        for (let i = 0; i < connectionsToCreate; i++) {
          const sprite = imageSprites[i];
          let closestDistance = Infinity;
          let closestSprite = null;

          // Find closest sprite within a reasonable distance
          const maxConnectionDistance = 100; // Limit connection distance
          imageSprites.forEach((otherSprite, otherIndex) => {
            if (i !== otherIndex) {
              const dx = sprite.position.x - otherSprite.position.x;
              const dy = sprite.position.y - otherSprite.position.y;
              const dz = sprite.position.z - otherSprite.position.z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

              if (
                distance < closestDistance &&
                distance < maxConnectionDistance
              ) {
                closestDistance = distance;
                closestSprite = otherSprite;
              }
            }
          });

          if (closestSprite) {
            const line = createConnectionLine();
            const positions = new Float32Array([
              sprite.position.x,
              sprite.position.y,
              sprite.position.z,
              closestSprite.position.x,
              closestSprite.position.y,
              closestSprite.position.z,
            ]);
            line.geometry.setAttribute(
              "position",
              new THREE.BufferAttribute(positions, 3)
            );
            connectionLines.push(line);
          }
        }
      }

      function createParticleSystem() {
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 200; // Match the new larger radius
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // Set particle sizes
          particleSizes[i] = 4; // Make particles larger and more visible

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 2.0, // Increased size to make particles more visible
          vertexColors: true,
          transparent: true,
          opacity: 0.6, // Increased opacity to make particles more visible
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);
      }

      async function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 3840;
        canvas.height = 2160;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
          data[i + 3] = 20;
        }
        ctx.putImageData(imageData, 0, 0);

        // Create and set noise texture
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;
        scene.background = noiseTexture;

        // Create particle system
        createParticleSystem();

        // Load and create image sprites
        const textures = await loadImages();
        textures.forEach((texture, index) => {
          const sprite = createImageSprite(texture, index);
          imageSprites.push(sprite);
          scene.add(sprite);
        });

        // Initial creation of connection lines
        updateConnectionLines();

        // Create camera with increased distance
        camera = new THREE.PerspectiveCamera(75, 3840 / 2160, 0.1, 2000);
        camera.position.set(0, 0, 500); // More zoomed out, centered position

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(3840, 2160);
        renderer.setClearColor(0x000000, 1);
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        color.rgb *= vignette;
                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 1.0;
        vignettePass.uniforms.darkness.value = 1.0;
        composer.addPass(vignettePass);

        // Add orbit controls with adjusted settings
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 200; // Prevent zooming in too close
        controls.maxDistance = 1000; // Prevent zooming out too far
        controls.target.set(0, 0, 0); // Ensure we're looking at the center
        controls.update();

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Fixed size - no window resize handling
        // window.addEventListener('resize', onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = 3840 / 2160;
        camera.updateProjectionMatrix();
        renderer.setSize(3840, 2160);
        composer.setSize(3840, 2160);
      }

      function animate() {
        requestAnimationFrame(animate);

        const time = Date.now();

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = 0.6; // Temporarily disable depth-based transparency to make particles visible
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Animate images with simplified movement (no repulsion)
        imageSprites.forEach((sprite, index) => {
          const floatTime = time * 0.0001 + sprite.userData.timeOffset;
          const distanceFromCenter = Math.sqrt(
            sprite.userData.originalX ** 2 +
              sprite.userData.originalY ** 2 +
              sprite.userData.originalZ ** 2
          );

          // Simplified float radius
          const floatRadius = 0.5 + (distanceFromCenter / 200) * 0.3;

          // Simplified movement patterns
          const floatX = Math.sin(floatTime * 0.2) * floatRadius;
          const floatY = Math.cos(floatTime * 0.3) * floatRadius;
          const floatZ = Math.sin(floatTime * 0.25) * floatRadius;

          // Reduced micro-movements
          const microMove = 0.1;
          const microTime = time * 0.0003 + sprite.userData.timeOffset;
          const microX = Math.sin(microTime * 1.5) * microMove;
          const microY = Math.cos(microTime * 1.7) * microMove;
          const microZ = Math.sin(microTime * 1.6) * microMove;

          sprite.position.x = sprite.userData.originalX + floatX + microX;
          sprite.position.y = sprite.userData.originalY + floatY + microY;
          sprite.position.z = sprite.userData.originalZ + floatZ + microZ;
        });

        // Update connection lines much less frequently (every 120 frames = twice per second)
        if (time % 120 === 0) {
          updateConnectionLines();
        }

        controls.update();
        composer.render();
      }

      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
        }
      }

      // Initialize the visualization
      async function startVisualization() {
        // Ensure loading page is visible
        document.getElementById("loading-container").style.display = "block";
        document.getElementById("black-overlay").style.display = "block";
        document.getElementById("black-overlay").style.opacity = "1";
        document.getElementById("visualization").style.display = "none";

        try {
          // Initialize the scene
          await init();

          // Hide loading page and show visualization
          document.getElementById("loading-container").style.display = "none";
          document.getElementById("visualization").style.display = "block";
          document.getElementById("black-overlay").style.opacity = "0";
          setTimeout(() => {
            document.getElementById("black-overlay").style.display = "none";

            // Show UI elements with fade-in effect
            const uiElements = [
              document.getElementById("eyes-interface"),
              document.getElementById("search-bar"),
              document.getElementById("upload-hand-btn"),
              document.getElementById("eyes-menu"),
            ];

            uiElements.forEach((element) => {
              if (element) {
                element.style.opacity = "1";
              }
            });
          }, 500);

          // Start animation
          animate();
        } catch (error) {
          console.error("Error starting visualization:", error);
          document.getElementById("loading-text").textContent =
            "Error loading visualization. Please refresh the page.";
        }
      }

      // Cleanup function to prevent memory leaks
      function cleanup() {
        // Dispose of geometries and materials
        if (particles) {
          particles.geometry.dispose();
          particles.material.dispose();
        }

        connectionLines.forEach((line) => {
          line.geometry.dispose();
          line.material.dispose();
        });

        imageSprites.forEach((sprite) => {
          if (sprite.material) {
            sprite.material.dispose();
          }
        });

        // Dispose of renderer
        if (renderer) {
          renderer.dispose();
        }

        // Dispose of composer
        if (composer) {
          composer.dispose();
        }
      }

      // Cleanup on page unload
      window.addEventListener("beforeunload", cleanup);

      // Start the visualization when the page loads
      window.addEventListener("load", startVisualization);

      // --- Eyes Interface Logic (with PNGs) ---
      // Arrange eyes in a cluster matching the reference screenshot
      const EYE_FIXED_POSITIONS = [
        { x: 10, y: 120, scale: 1.0 }, // leftmost
        { x: 70, y: 30, scale: 1.13 }, // top
        { x: 180, y: 10, scale: 1.0 }, // top right
        { x: 250, y: 60, scale: 1.0 }, // rightmost
        { x: 210, y: 150, scale: 1.0 }, // bottom right
        { x: 90, y: 170, scale: 1.0 }, // bottom left
      ];

      const EYE_VIEWS = [
        { key: "Artist", name: "Artist" },
        { key: "Temperament", name: "Temperament" },
        { key: "Intimacy", name: "Intimacy" },
        { key: "Rhizome", name: "Rhizome" },
        { key: "Completeness", name: "Completeness" },
        { key: "SecretGallery", name: "Secret Gallery" },
      ];

      let selectedEye = -1;
      let hoverEye = -1;
      function renderEyes() {
        console.log("Rendering eyes");
        const container = document.getElementById("eyes-interface");
        const positions = EYE_FIXED_POSITIONS;
        container.innerHTML = "";
        positions.forEach((pos, i) => {
          const eyeDiv = document.createElement("div");
          eyeDiv.className = "eye-blob";
          eyeDiv.style.left = pos.x + "px";
          eyeDiv.style.top = pos.y + "px";
          const size = Math.round(70 * pos.scale);
          eyeDiv.style.width = size + "px";
          eyeDiv.style.height = size + "px";
          eyeDiv.style.filter =
            selectedEye === i || hoverEye === i
              ? "drop-shadow(0 0 16px #fff8)"
              : "drop-shadow(0 0 6px #fff4)";
          const viewKey = EYE_VIEWS[i].key;
          const isOpen = selectedEye === i || hoverEye === i;
          const imgSrc = `Eyes/${viewKey}_${isOpen ? "open" : "closed"}.png`;
          console.log(`Eye ${i} img src:`, imgSrc);
          eyeDiv.innerHTML = `<img src="${imgSrc}" style="width:100%;height:100%;display:block;position:relative;z-index:1;transition:filter 0.5s;image-rendering:auto;object-fit:contain;" draggable="false" alt="${EYE_VIEWS[i].name} eye"/>`;
          container.appendChild(eyeDiv);
        });
      }

      // Fixed size for #main-viewport - no responsive scaling
      function setupMainViewport() {
        const main = document.getElementById("main-viewport");
        main.style.transform = `translate(-50%, -50%)`;
      }
      window.addEventListener("load", setupMainViewport);

      document.addEventListener("DOMContentLoaded", function () {
        const eyes = [
          {
            id: "eye-artist",
            closed: "Eyes/Artist_closed.png",
            open: "Eyes/Artist_open.png",
          },
          {
            id: "eye-temperament",
            closed: "Eyes/Temperament_closed.png",
            open: "Eyes/Temperament_open.png",
          },
          {
            id: "eye-intimacy",
            closed: "Eyes/Intimacy_closed.png",
            open: "Eyes/Intimacy_open.png",
          },
          {
            id: "eye-rhizome",
            closed: "Eyes/Rhizome_closed.png",
            open: "Eyes/Rhizome_open.png",
          },
          {
            id: "eye-completeness",
            closed: "Eyes/Completeness_closed.png",
            open: "Eyes/Completeness_open.png",
          },
          {
            id: "eye-secret",
            closed: "Eyes/SecretGallery_closed.png",
            open: "Eyes/SecretGallery_open.png",
          },
        ];

        const tooltip = document.getElementById("eye-tooltip");

        eyes.forEach((eye) => {
          const btn = document.getElementById(eye.id);

          // Set rhizome eye to always be open
          if (eye.id === "eye-rhizome") {
            btn.style.backgroundImage = `url('${eye.open}')`;

            // Show tooltip permanently for rhizome
            tooltip.textContent = btn.title;
            tooltip.style.opacity = "1";

            // Position tooltip above the rhizome eye
            const rect = btn.getBoundingClientRect();
            const menuRect = document
              .getElementById("eyes-menu")
              .getBoundingClientRect();
            tooltip.style.left =
              rect.left - menuRect.left + rect.width / 2 + "px";
            tooltip.style.top = rect.top - menuRect.top - 40 + "px";
          } else {
            btn.style.backgroundImage = `url('${eye.closed}')`;
          }

          btn.addEventListener("mouseenter", () => {
            if (eye.id !== "eye-rhizome") {
              btn.style.backgroundImage = `url('${eye.open}')`;

              // Show tooltip
              tooltip.textContent = btn.title;
              tooltip.style.opacity = "1";

              // Position tooltip above the eye
              const rect = btn.getBoundingClientRect();
              const menuRect = document
                .getElementById("eyes-menu")
                .getBoundingClientRect();
              tooltip.style.left =
                rect.left - menuRect.left + rect.width / 2 + "px";
              tooltip.style.top = rect.top - menuRect.top - 40 + "px";
            }
          });

          btn.addEventListener("mouseleave", () => {
            if (eye.id !== "eye-rhizome") {
              btn.style.backgroundImage = `url('${eye.closed}')`;

              // Hide tooltip
              tooltip.style.opacity = "0";
            }
          });

          btn.addEventListener("click", () => {
            // Navigation logic here
            switch (btn.id) {
              case "eye-temperament":
                window.location.href = "views/temperament/temperament.html";
                break;
              case "eye-secret":
                window.location.href =
                  "views/hashtag_gallery/hashtag_gallery.html";
                break;
              case "eye-intimacy":
                window.location.href = "views/intimacy/Intimacy.html";
                break;
              case "eye-completeness":
                window.location.href = "views/Completeness/Completeness.html";
                break;
              case "eye-artist":
                window.location.href = "views/Artists/Artist.html";
                break;
              case "eye-rhizome":
                window.location.href = "views/rhizome/rhizome.html";
                break;
              default:
                alert(`Clicked: ${btn.title}`);
            }
          });
        });
      });

      // Chatbot state
      let chatbotState = {
        currentQuestion: 0,
        answers: {},
        isTyping: false,
      };

      const questions = [
        {
          id: "upload",
          type: "file",
          message:
            "Let's begin. Upload your junk — drag & drop your file or click to browse.",
          required: true,
        },
        {
          id: "name",
          type: "text",
          message: "Want to give it a name? Or not. Totally your call.",
          placeholder: "Give it a name...",
          required: false,
        },
        {
          id: "artist",
          type: "text",
          message:
            "Who made it? Drop an alter ego, emoji, tag name… or stay anonymous.",
          placeholder: "Your alter ego...",
          required: false,
        },
        {
          id: "location",
          type: "location",
          message: "Where on Earth were you when this junk was born?",
          placeholder: "Click to select location on map...",
          required: false,
        },
        {
          id: "specific_location",
          type: "text",
          message: "Be real — bed? Park? Coffee shop? Closet floor?",
          placeholder: "Bed, park, coffee shop...",
          required: false,
        },
        {
          id: "date",
          type: "text",
          message: "Roughly when? A year, a season, a fuzzy memory...",
          placeholder: "2020, last winter...",
          required: false,
        },
        {
          id: "time_window",
          type: "time_slider",
          message:
            "What time of day are we talking? Morning sun or midnight soup?",
          required: false,
        },
        {
          id: "cooked_level",
          type: "slider",
          message: "How cooked is this piece? Raw mess or nearly done?",
          required: false,
        },
        {
          id: "artwork_type",
          type: "text",
          message: "What kind of junk is this? Sketch? Note? Blurry thing?",
          placeholder: "Sketch, note, blurry thing...",
          required: false,
        },
        {
          id: "notes",
          type: "textarea",
          message: "Leave a note, a rant, or a cryptic message... or not.",
          placeholder: "Your note here...",
          required: false,
        },
        {
          id: "tags",
          type: "tags",
          message:
            "Choose some tags — Weird? Wrong? Unfinished? Or type your own.",
          required: false,
        },
      ];

      // Add click event listener to upload button
      document.addEventListener("DOMContentLoaded", function () {
        const uploadBtn = document.getElementById("upload-hand-btn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", showChatbot);
        }

        // Close chatbot with Escape key
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeChatbot();
          }
        });
      });

      // Chatbot functions
      function showChatbot() {
        const chatbot = document.getElementById("chatbot-container");
        chatbot.style.display = "flex";
        chatbotState.currentQuestion = 0;
        chatbotState.answers = {};

        // Start with opening message
        addBotMessage(
          "Hi, friend. Before we dive in — a tiny heads-up: nothing here is mandatory except the junk. Everything else? Totally up to you."
        );

        // Start the conversation after a delay
        setTimeout(() => {
          addBotMessage(
            "Let's begin. Upload your junk — drag & drop your file or click to browse."
          );
          setTimeout(() => {
            askNextQuestion();
          }, 1500);
        }, 2000);
      }

      function closeChatbot() {
        const chatbot = document.getElementById("chatbot-container");
        chatbot.style.display = "none";

        // Clear messages
        const messagesContainer = document.getElementById("chatbot-messages");
        messagesContainer.innerHTML = "";
      }

      function addBotMessage(message) {
        const messagesContainer = document.getElementById("chatbot-messages");
        const messageDiv = document.createElement("div");
        messageDiv.className = "message bot";
        messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function addUserMessage(message) {
        const messagesContainer = document.getElementById("chatbot-messages");
        const messageDiv = document.createElement("div");
        messageDiv.className = "message user";
        messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function showTypingIndicator() {
        const messagesContainer = document.getElementById("chatbot-messages");
        const typingDiv = document.createElement("div");
        typingDiv.className = "message bot";
        typingDiv.id = "typing-indicator";
        typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
        messagesContainer.appendChild(typingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function hideTypingIndicator() {
        const typingIndicator = document.getElementById("typing-indicator");
        if (typingIndicator) {
          typingIndicator.remove();
        }
      }

      function askNextQuestion() {
        if (chatbotState.currentQuestion >= questions.length) {
          showSummary();
          return;
        }

        const question = questions[chatbotState.currentQuestion];

        showTypingIndicator();

        setTimeout(() => {
          hideTypingIndicator();
          addBotMessage(question.message);
          showQuestionInput(question);
        }, 1500);
      }

      function showQuestionInput(question) {
        const messagesContainer = document.getElementById("chatbot-messages");
        const inputDiv = document.createElement("div");
        inputDiv.className = "message bot";
        inputDiv.id = "question-input";

        let inputHTML = '<div class="input-group">';

        switch (question.type) {
          case "file":
            inputHTML += `
                        <div class="file-upload-area" id="file-upload-area">
                            <div id="file-upload-text">Drag & drop your file here or click to browse</div>
                            <input type="file" id="file-input" accept="image/*" style="display: none;">
                        </div>
                    `;
            break;
          case "location":
            inputHTML += `
                        <input type="text" class="input-field" id="location-input" placeholder="${question.placeholder}" readonly style="cursor:pointer;width:100%;box-sizing:border-box;">
                    `;
            break;
          case "text":
            inputHTML += `
                        <input type="text" class="input-field" id="text-input" placeholder="${question.placeholder}" style="width:100%;box-sizing:border-box;">
                    `;
            break;
          case "textarea":
            inputHTML += `
                        <textarea class="input-field" id="text-input" placeholder="${question.placeholder}" rows="3" style="width:100%;box-sizing:border-box;resize:vertical;min-width:0;"></textarea>
                    `;
            break;
          case "slider":
            inputHTML += `
                        <div style="width:100%;display:flex;align-items:center;gap:15px;box-sizing:border-box;">
                            <span style="white-space:nowrap;flex-shrink:0;">Raw</span>
                            <input type="range" class="slider" id="slider-input" min="0" max="100" value="50" style="flex:1;min-width:0;width:100%;">
                            <span style="white-space:nowrap;flex-shrink:0;">Done</span>
                            <div class="slider-value" id="slider-value" style="white-space:nowrap;flex-shrink:0;">50%</div>
                        </div>
                    `;
            break;
          case "time_slider":
            inputHTML += `
                        <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:15px;box-sizing:border-box;">
                            <div style="width:100%;display:flex;align-items:center;box-sizing:border-box;">
                                <input type="range" class="slider" id="time-slider-input" min="0" max="4" value="0" step="1" style="flex:1;min-width:0;width:100%;">
                            </div>
                            <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
                                <img src="assets/Sun.png" class="time-icon" id="icon-sun" style="width:32px;height:32px;filter:brightness(0) invert(1);opacity:1;object-fit:contain;">
                                <img src="assets/Coffee.png" class="time-icon" id="icon-coffee" style="width:32px;height:32px;filter:brightness(0) invert(1);opacity:0.5;object-fit:contain;">
                                <img src="assets/Pasta.png" class="time-icon" id="icon-pasta" style="width:32px;height:32px;filter:brightness(0) invert(1);opacity:0.5;object-fit:contain;">
                                <img src="assets/Wine.png" class="time-icon" id="icon-wine" style="width:32px;height:32px;filter:brightness(0) invert(1);opacity:0.5;object-fit:contain;">
                                <img src="assets/Moon2.png" class="time-icon" id="icon-moon" style="width:32px;height:32px;filter:brightness(0) invert(1);opacity:0.5;object-fit:contain;">
                            </div>
                        </div>
                    `;
            break;
          case "tags":
            inputHTML += `
                        <div class="tag-selector" id="tag-examples">
                            <button class="tag" data-tag="weird">Weird</button>
                            <button class="tag" data-tag="wrong">Wrong</button>
                            <button class="tag" data-tag="unfinished">Unfinished</button>
                            <button class="tag" data-tag="raw">Raw</button>
                            <button class="tag" data-tag="personal">Personal</button>
                            <button class="tag" data-tag="experimental">Experimental</button>
                        </div>
                        <input type="text" class="input-field" id="custom-tag-input" placeholder="Or type your own... (up to 8 tags)">
                        <div id="user-tags" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
                    `;
            break;
        }

        inputHTML += '<div class="button-group">';
        if (chatbotState.currentQuestion > 0) {
          inputHTML += '<button class="btn" id="back-btn">Back</button>';
        }
        inputHTML +=
          '<button class="btn primary" id="continue-btn">Continue</button>';
        inputHTML += "</div></div>";

        inputDiv.innerHTML = inputHTML;
        messagesContainer.appendChild(inputDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Setup input handlers
        setupInputHandlers(question);

        // Setup button handlers
        const backBtn = inputDiv.querySelector("#back-btn");
        const continueBtn = inputDiv.querySelector("#continue-btn");

        if (backBtn) {
          backBtn.addEventListener("click", goBack);
        }
        if (continueBtn) {
          continueBtn.addEventListener("click", submitAnswer);
        }
      }

      function setupInputHandlers(question) {
        const questionInput = document.getElementById("question-input");
        switch (question.type) {
          case "file":
            const fileArea = questionInput.querySelector("#file-upload-area");
            const fileInput = questionInput.querySelector("#file-input");
            const fileText = questionInput.querySelector("#file-upload-text");
            fileArea.addEventListener("click", () => fileInput.click());
            fileArea.addEventListener("dragover", (e) => {
              e.preventDefault();
              fileArea.classList.add("dragover");
            });
            fileArea.addEventListener("dragleave", () => {
              fileArea.classList.remove("dragover");
            });
            fileArea.addEventListener("drop", (e) => {
              e.preventDefault();
              fileArea.classList.remove("dragover");
              const files = e.dataTransfer.files;
              if (files.length > 0) {
                fileInput.files = files;
                fileText.innerHTML = `File selected: ${files[0].name} <span style=\"color: #ff6b6b; cursor: pointer; margin-left: 10px;\" onclick=\"removeFile(event)\">×</span>`;
              }
            });
            fileInput.addEventListener("change", (e) => {
              if (e.target.files.length > 0) {
                fileText.innerHTML = `File selected: ${e.target.files[0].name} <span style=\"color: #ff6b6b; cursor: pointer; margin-left: 10px;\" onclick=\"removeFile(event)\">×</span>`;
              }
            });
            break;
          case "location":
            const locationInput =
              questionInput.querySelector("#location-input");
            locationInput.addEventListener("click", () => {
              // Show map popup (stub)
              showMapPopup((latlng) => {
                locationInput.value = latlng;
              });
            });
            break;
          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            const sliderValue = questionInput.querySelector("#slider-value");
            slider.addEventListener("input", (e) => {
              sliderValue.textContent = `${e.target.value}%`;
            });
            break;
          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeIcons = [
              questionInput.querySelector("#icon-sun"),
              questionInput.querySelector("#icon-coffee"),
              questionInput.querySelector("#icon-pasta"),
              questionInput.querySelector("#icon-wine"),
              questionInput.querySelector("#icon-moon"),
            ];
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            timeSlider.addEventListener("input", (e) => {
              const idx = parseInt(e.target.value);
              timeIcons.forEach((icon, i) => {
                icon.style.opacity = i === idx ? "1" : "0.5";
              });
            });
            // Set initial state
            timeIcons.forEach((icon, i) => {
              icon.style.opacity = i === 0 ? "1" : "0.5";
            });
            break;
          case "tags":
            const tagExamples = questionInput.querySelector("#tag-examples");
            const customTagInput =
              questionInput.querySelector("#custom-tag-input");
            const userTagsDiv = questionInput.querySelector("#user-tags");
            let userTags = [];
            // Add example tag click
            tagExamples.querySelectorAll(".tag").forEach((tagBtn) => {
              tagBtn.addEventListener("click", () => {
                if (
                  userTags.length < 8 &&
                  !userTags.includes(tagBtn.textContent)
                ) {
                  userTags.push(tagBtn.textContent);
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
              });
            });
            // Add custom tag input
            customTagInput.addEventListener("input", (e) => {
              if (e.target.value.length > 0) {
                tagExamples.style.display = "none";
              } else {
                tagExamples.style.display = "";
              }
            });
            customTagInput.addEventListener("keydown", (e) => {
              if (
                (e.key === "Enter" || e.key === ",") &&
                customTagInput.value.trim() &&
                userTags.length < 8
              ) {
                const val = customTagInput.value.trim();
                if (!userTags.includes(val)) {
                  userTags.push(val);
                  customTagInput.value = "";
                  renderUserTags();
                  if (userTags.length === 8) {
                    setTimeout(() => submitAnswer(), 500);
                  }
                }
                e.preventDefault();
              }
            });
            function renderUserTags() {
              userTagsDiv.innerHTML = userTags
                .map(
                  (tag) =>
                    `<span class='tag selected'>${tag} <span style='cursor:pointer;color:#ff6b6b;' onclick='this.parentNode.remove();'>×</span></span>`
                )
                .join(" ");
            }
            break;
        }
      }

      function submitAnswer() {
        const question = questions[chatbotState.currentQuestion];
        const questionInput = document.getElementById("question-input");
        let answer = "";

        switch (question.type) {
          case "file":
            const fileInput = questionInput.querySelector("#file-input");
            if (fileInput.files.length === 0) {
              alert("Please select a file");
              return;
            }
            answer = fileInput.files[0].name;
            break;

          case "text":
          case "textarea":
          case "location":
            const textInput =
              questionInput.querySelector("#text-input") ||
              questionInput.querySelector("#location-input");
            answer = textInput ? textInput.value.trim() : "";
            break;

          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            answer = slider ? `${slider.value}%` : "50%";
            break;

          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            const idx = timeSlider ? parseInt(timeSlider.value) : 0;
            answer = timeLabels[idx];
            break;

          case "tags":
            const selectedTags =
              questionInput.querySelectorAll(".tag.selected");
            const customTag = questionInput.querySelector("#custom-tag-input")
              ? questionInput.querySelector("#custom-tag-input").value.trim()
              : "";
            const tagTexts = Array.from(selectedTags).map((tag) =>
              tag.textContent.replace(" ×", "")
            );
            if (customTag) tagTexts.push(customTag);
            answer = tagTexts.join(", ");
            break;
        }

        // Store answer (even if empty)
        chatbotState.answers[question.id] = answer;

        // Show user's answer only if not empty
        if (answer) {
          addUserMessage(answer);
        } else {
          addUserMessage("Skipped");
        }

        // Remove input
        questionInput.remove();

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      function goBack() {
        // Remove current input
        const questionInput = document.getElementById("question-input");
        if (questionInput) questionInput.remove();

        // Remove the last user message
        const messagesContainer = document.getElementById("chatbot-messages");
        const lastUserMessage = messagesContainer.querySelector(
          ".message.user:last-child"
        );
        if (lastUserMessage) lastUserMessage.remove();

        // Go back to previous question
        chatbotState.currentQuestion--;

        // Ask the previous question again
        setTimeout(() => {
          askNextQuestion();
        }, 500);
      }

      function showSummary() {
        addBotMessage("Here's what you gave me. Ready to launch the junk?");

        const messagesContainer = document.getElementById("chatbot-messages");
        const summaryDiv = document.createElement("div");
        summaryDiv.className = "message bot";
        summaryDiv.innerHTML = `
                <div class="summary-screen">
                    ${Object.entries(chatbotState.answers)
                      .map(([key, value]) => {
                        if (!value) return "";
                        const question = questions.find((q) => q.id === key);
                        return `
                            <div class="summary-item">
                                <span class="summary-label">${
                                  question
                                    ? question.message.split("?")[0] + "?"
                                    : key
                                }:</span>
                                <span class="summary-value">${value}</span>
                            </div>
                        `;
                      })
                      .join("")}
                </div>
                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn primary" id="launch-btn">Launch the junk</button>
                </div>
            `;
        messagesContainer.appendChild(summaryDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Setup launch button handler
        const launchBtn = summaryDiv.querySelector("#launch-btn");
        if (launchBtn) {
          launchBtn.addEventListener("click", launchJunk);
        }
      }

      function launchJunk() {
        // Log the form data (in a real app, you'd send this to a server)
        console.log("Junk launched:", chatbotState.answers);

        // Show success message
        addBotMessage(
          "Junk launched! (This is a demo - no actual upload occurred)"
        );

        // Close chatbot after a delay
        setTimeout(() => {
          closeChatbot();
        }, 3000);
      }

      function removeFile(event) {
        event.stopPropagation();
        const questionInput = document.getElementById("question-input");
        const fileInput = questionInput.querySelector("#file-input");
        const fileText = questionInput.querySelector("#file-upload-text");

        fileInput.value = "";
        fileText.innerHTML = "Drag & drop your file here or click to browse";
      }

      function showMapPopup(callback) {
        const mapPopup = document.getElementById("map-popup-overlay");
        const mapInput = document.getElementById("map-location-input");

        // Store callback for later use
        window.mapLocationCallback = callback;

        // Show popup
        mapPopup.style.display = "flex";
        mapInput.focus();

        // Handle Enter key
        mapInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            confirmMapLocation();
          }
        });
      }

      function closeMapPopup() {
        const mapPopup = document.getElementById("map-popup-overlay");
        const mapInput = document.getElementById("map-location-input");

        mapPopup.style.display = "none";
        mapInput.value = "";
        window.mapLocationCallback = null;
      }

      function confirmMapLocation() {
        const mapInput = document.getElementById("map-location-input");
        const location = mapInput.value.trim();

        if (location && window.mapLocationCallback) {
          window.mapLocationCallback(location);
        }

        closeMapPopup();
      }
    </script>
  </body>
</html>
