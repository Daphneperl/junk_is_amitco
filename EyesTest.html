<!DOCTYPE html>
<html>
<head>
    <title>Base Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('../../assets/pixel.ttf') format('truetype');
        }
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #main-viewport {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 1920px;
            height: 1080px;
            transform: translate(-50%, -50%) scale(1);
            background: transparent;
            transform-origin: center center;
        }
        #eyes-interface {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100vw;
            height: 50vh;
            pointer-events: none;
            z-index: 2000;
            background: rgba(255,0,0,0.12); /* DEBUG: red background */
        }
        .eye-blob {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
        }
        #search-bar {
            position: fixed;
            left: 50%;
            bottom: 4vw;
            transform: translateX(-50%);
            width: 28vw;
            min-width: 320px;
            max-width: 600px;
            height: 54px;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 2px 16px #0003;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-family: 'VT323', monospace, sans-serif;
            color: #222;
            border: none;
            outline: none;
            padding: 0 32px;
            z-index: 2100;
        }
        #upload-hand-btn {
            position: fixed;
            right: 2vw;
            bottom: 3vw;
            width: 160px;
            height: 54px;
            background: #fff;
            border-radius: 32px;
            border: none;
            cursor: pointer;
            z-index: 2100;
            font-size: 18px;
            font-family: 'VT323', monospace, sans-serif;
            color: #222;
            box-shadow: 0 2px 16px #0003;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #upload-hand-btn svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        #upload-hand-label {
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-family: 'VT323', monospace, sans-serif;
            color: #222;
            pointer-events: none;
            white-space: nowrap;
        }
        #visualization {
            width: 100vw;
            height: 100vh;
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        #loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="black-overlay"></div>
    <div id="loading-container" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div class="loading-bar">
            <div id="loading-progress" class="loading-progress" style="width: 0%"></div>
        </div>
        <div id="loading-text" style="color: #ffffff; font-family: monospace; margin-top: 10px;">LOADING... 0%</div>
    </div>
    <div id="main-viewport">
        <div id="visualization"></div>
    </div>
    <!-- Eyes Interface Overlay (fixed) -->
    <div id="eyes-interface"></div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see" />
    <!-- Upload Placeholder Button (fixed) -->
    <button id="upload-hand-btn">Upload your junk</button>
    <script>
        let scene, camera, renderer, controls;
        let composer;
        let particles;

        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // Set black background immediately
            
            // Create noise texture
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Generate noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 50;
                data[i] = value;     // R
                data[i + 1] = value; // G
                data[i + 2] = value; // B
                data[i + 3] = 20;    // A
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Create texture from canvas
            const noiseTexture = new THREE.CanvasTexture(canvas);
            noiseTexture.wrapS = THREE.RepeatWrapping;
            noiseTexture.wrapT = THREE.RepeatWrapping;
            
            // Set as background
            scene.background = noiseTexture;

            // Create particles
            const particleCount = 300;
            const particleGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSizes = new Float32Array(particleCount);
            const particleColors = new Float32Array(particleCount * 3);
            const particleSpeeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                // Random positions within a sphere
                const radius = 80;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                particlePositions[i * 3 + 2] = radius * Math.cos(phi);


                // More vibrant colors
                const hue = Math.random(); // Random hue
                const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
                const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness
                
                // Convert HSL to RGB
                const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
                const x = c * (1 - Math.abs((hue * 6) % 2 - 1));
                const m = lightness - c/2;
                
                let r, g, b;
                if (hue < 1/6) {
                    r = c; g = x; b = 0;
                } else if (hue < 2/6) {
                    r = x; g = c; b = 0;
                } else if (hue < 3/6) {
                    r = 0; g = c; b = x;
                } else if (hue < 4/6) {
                    r = 0; g = x; b = c;
                } else if (hue < 5/6) {
                    r = x; g = 0; b = c;
                } else {
                    r = c; g = 0; b = x;
                }
                
                particleColors[i * 3] = r + m;     // R
                particleColors[i * 3 + 1] = g + m; // G
                particleColors[i * 3 + 2] = b + m; // B

                // Random speeds between 0.02 and 0.08 (much slower than before)
                particleSpeeds[i] = Math.random() * 0.06 ;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.3,
                sizeAttenuation: true,
                depthWrite: false // Allow particles to be transparent when in front
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            particles.userData = { 
                speeds: particleSpeeds,
                opacities: new Float32Array(particleCount) // Store individual opacities
            };
            scene.add(particles);

            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1); // Set black background color immediately
            document.getElementById('visualization').appendChild(renderer.domElement);

            // Setup post-processing
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Add vignette effect
            const vignetteShader = {
                uniforms: {
                    "tDiffuse": { value: null },
                    "offset": { value: 1.0 },
                    "darkness": { value: 1.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        
                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        
                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        
                        // Apply vignette
                        color.rgb *= vignette;
                        
                        gl_FragColor = color;
                    }
                `
            };

            const vignettePass = new THREE.ShaderPass(vignetteShader);
            vignettePass.uniforms.offset.value = 0.5;
            vignettePass.uniforms.darkness.value = 0.5;
            composer.addPass(vignettePass);

            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.userData.speeds;
                const opacities = particles.userData.opacities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Move particles in a circular motion
                    const speed = speeds[i / 3];
                    const time = Date.now() * 0.001 * speed;
                    
                    positions[i] += Math.sin(time) * 0.01;
                    positions[i + 1] += Math.cos(time) * 0.01;
                    positions[i + 2] += Math.sin(time * 0.5) * 0.01;

                    // Check if particle is in front of images (z > 0)
                    const z = positions[i + 2];
                    opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
                particles.material.opacity = 0.3; // Base opacity
            }
            
            controls.update();
            composer.render();
        }

        function updateLoadingUI(progress) {
            const progressBar = document.getElementById('loading-progress');
            const loadingText = document.getElementById('loading-text');
            
            if (progressBar && loadingText) {
                progressBar.style.width = `${progress}%`;
                loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
            }
        }

        // Initialize the visualization
        function startVisualization() {
            // Ensure loading page is visible
            document.getElementById('loading-container').style.display = 'block';
            document.getElementById('black-overlay').style.display = 'block';
            document.getElementById('black-overlay').style.opacity = '1';
            document.getElementById('visualization').style.display = 'none';

            // Simulate loading progress
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += 2;
                updateLoadingUI(progress);
                
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    
                    // Initialize the scene
                    init();
                    
                    // Hide loading page and show visualization
                    document.getElementById('loading-container').style.display = 'none';
                    document.getElementById('visualization').style.display = 'block';
                    document.getElementById('black-overlay').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('black-overlay').style.display = 'none';
                    }, 500);
                    
                    // Start animation
                    animate();
                }
            }, 50);
        }

        // Start the visualization when the page loads
        window.addEventListener('load', startVisualization);

        // --- Eyes Interface Logic (with PNGs) ---
        // Arrange eyes in a cluster matching the reference screenshot
        const EYE_FIXED_POSITIONS = [
          { x: 10,  y: 120, scale: 1.0 },   // leftmost
          { x: 70,  y: 30,  scale: 1.13 },  // top
          { x: 180, y: 10,  scale: 1.0 },   // top right
          { x: 250, y: 60,  scale: 1.0 },   // rightmost
          { x: 210, y: 150, scale: 1.0 },   // bottom right
          { x: 90,  y: 170, scale: 1.0 }    // bottom left
        ];
        function renderEyes() {
          console.log('Rendering eyes');
          const container = document.getElementById('eyes-interface');
          const positions = EYE_FIXED_POSITIONS;
          container.innerHTML = '';
          positions.forEach((pos, i) => {
            const eyeDiv = document.createElement('div');
            eyeDiv.className = 'eye-blob';
            // Place all eyes in the center for debug
            const size = 80;
            eyeDiv.style.left = 'calc(50vw - 40px)';
            eyeDiv.style.top = (60 + i * 90) + 'px';
            eyeDiv.style.width = size + 'px';
            eyeDiv.style.height = size + 'px';
            eyeDiv.style.filter = (selectedEye===i||hoverEye===i)?'drop-shadow(0 0 16px #fff8)':'drop-shadow(0 0 6px #fff4)';
            const viewKey = EYE_VIEWS[i].key;
            const isOpen = (selectedEye===i||hoverEye===i);
            const imgSrc = `Eyes/${viewKey}_${isOpen?'open':'closed'}.png`;
            console.log(`Eye ${i} img src:`, imgSrc);
            eyeDiv.innerHTML = `<img src="${imgSrc}" style="width:100%;height:100%;display:block;position:relative;z-index:1;transition:filter 0.5s;image-rendering:auto;object-fit:contain;" draggable="false" alt="${EYE_VIEWS[i].name} eye"/>`;
            container.appendChild(eyeDiv);
          });
        }

        // Responsive scaling for #main-viewport
        function scaleMainViewport() {
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const scale = Math.min(vw / 1920, vh / 1080);
          const main = document.getElementById('main-viewport');
          main.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', scaleMainViewport);
        window.addEventListener('load', scaleMainViewport);
    </script>
</body>
</html>
