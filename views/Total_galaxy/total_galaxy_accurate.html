<!DOCTYPE html>
<html>
  <head>
    <title>Total Galaxy - Accurate Views</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      #visualization {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }

      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }

      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING GALAXY... 0%
      </div>
    </div>

    <div id="visualization"></div>

    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;
      let viewGroups = {};
      let currentView = "galaxy";
      let loadedImages = 0;
      let totalImages = 0;
      let artisticData = [];
      let tooltip = null;
      let globalRotationGroup; // Container for all content that will rotate
      let viewTitles = {}; // Store title sprites for each view
      let titleFadeInStartTime = 0; // When titles start fading in
      let cameraAnimation = {
        isActive: false,
        startTime: 0,
        duration: 6000, // Reduced from 10 seconds to 6 seconds for smoother feel
        startPosition: new THREE.Vector3(),
        startAngle: 0, // Starting angle around the environment
        targetDistance: 800, // Distance from center (reduced from 1000)
        targetAngle: -Math.PI * 1.6, // End at 135 degrees counter-clockwise (leftward) - showing the spiral prominently
        targetHeight: 200, // Slightly elevated view for better perspective
      };

      // Continuous rotation after animation
      let continuousRotation = {
        isActive: false,
        speed: -0.5, // Slow rotation speed (degrees per second) - negative for clockwise
      };

      // View positions in 3D space
      const viewPositions = {
        rhizome: { x: 0, y: 0, z: 0 },
        artist: { x: -400, y: 50, z: 300 },
        "open-question": { x: 150, y: -150, z: 250 },
        "hashtag-gallery": { x: -230, y: -250, z: 200 },
        completeness: { x: 250, y: 200, z: -150 },
        intimacy: { x: -500, y: 80, z: -150 },
        temperature: { x: 350, y: 100, z: 180 },
      };

      // View display names
      const viewDisplayNames = {
        rhizome: "RHIZOME",
        artist: "ARTIST",
        "open-question": "OPEN QUESTION",
        "hashtag-gallery": "HASHTAG GALLERY",
        completeness: "COMPLETENESS",
        intimacy: "INTIMACY",
        temperature: "TEMPERATURE",
      };

      // Create title sprite for a view
      function createTitleSprite(text, position) {
        // Create canvas for the title text
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // Set canvas size
        canvas.width = 512;
        canvas.height = 128;

        // Set font style (pixelated)
        ctx.font = "48px VT323, monospace";
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Add text shadow for better visibility
        ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        // Draw the text
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        // Create texture from canvas
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        // Create sprite material
        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0, // Start invisible
        });

        // Create sprite
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(80, 20, 1); // Large size
        sprite.position.copy(position);

        // Add jitter properties
        sprite.userData = {
          originalPosition: position.clone(),
          jitterOffset: new THREE.Vector3(
            (Math.random() - 0.5) * 0.1,
            (Math.random() - 0.5) * 0.1,
            (Math.random() - 0.5) * 0.1
          ),
          jitterSpeed: 0.5 + Math.random() * 0.5,
          jitterTime: Math.random() * Math.PI * 2,
        };

        return sprite;
      }

      // Update loading UI
      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING GALAXY... ${Math.floor(
            progress
          )}%`;
        }
      }

      // Load artistic analysis data
      async function loadArtisticData() {
        try {
          const response = await fetch(
            "../../image_analysis/artistic_analysis_filtered.json"
          );
          artisticData = await response.json();
          console.log(
            `Loaded ${artisticData.length} artistic analysis records`
          );
          return artisticData;
        } catch (error) {
          console.error("Error loading artistic data:", error);
          return [];
        }
      }

      // Load images with progress tracking and parallel loading
      async function loadImages() {
        try {
          const response = await fetch("../../images/images.json");
          const imageList = await response.json();
          totalImages = imageList.length;

          const textureLoader = new THREE.TextureLoader();
          const textures = new Array(imageList.length);
          const loadPromises = [];

          // Create all load promises in parallel
          for (let i = 0; i < imageList.length; i++) {
            const imageName = imageList[i];
            const loadPromise = new Promise((resolve) => {
              textureLoader.load(
                `../../images/${imageName}`,
                (texture) => {
                  // Optimize texture for performance
                  texture.generateMipmaps = false;
                  texture.minFilter = THREE.LinearFilter;
                  texture.magFilter = THREE.LinearFilter;
                  texture.format = THREE.RGBFormat;
                  texture.flipY = true; // Fix upside-down images

                  textures[i] = { texture, filename: imageName, index: i };
                  loadedImages++;
                  updateLoadingUI((loadedImages / totalImages) * 100);
                  resolve();
                },
                undefined,
                (error) => {
                  console.warn(`Failed to load ${imageName}:`, error);
                  textures[i] = {
                    texture: null,
                    filename: imageName,
                    index: i,
                  };
                  loadedImages++;
                  updateLoadingUI((loadedImages / totalImages) * 100);
                  resolve();
                }
              );
            });
            loadPromises.push(loadPromise);
          }

          // Wait for all images to load
          await Promise.all(loadPromises);

          // Filter out null textures and return
          return textures.filter((t) => t !== null);
        } catch (error) {
          console.error("Error loading images:", error);
          return [];
        }
      }

      // Create Rhizome view - random sphere with white connections
      function createRhizomeView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.rhizome.x,
          viewPositions.rhizome.y,
          viewPositions.rhizome.z
        );

        // Create sprites and store their positions for connections
        const sprites = [];
        const spritePositions = [];
        const sphereRadius = 70;

        // Position images randomly in a sphere
        textures.forEach((textureData, index) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            const width = 6; // Smaller size for better density
            const height = width / aspectRatio;

            const material = new THREE.SpriteMaterial({
              map: textureData.texture,
              transparent: true,
              opacity: 0.9,
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, height, 1);

            // Random position within blobby shape (less spherical, more organic)
            const baseRadius = sphereRadius * Math.pow(Math.random(), 0.6); // More bias toward center
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            // Add noise to create blobby, irregular shape
            const noiseX = (Math.random() - 0.5) * 0.4;
            const noiseY = (Math.random() - 0.5) * 0.4;
            const noiseZ = (Math.random() - 0.5) * 0.4;

            // Create irregular radius variations
            const radiusVariation =
              1 + Math.sin(theta * 3) * 0.3 + Math.cos(phi * 2) * 0.2;
            const radius = baseRadius * radiusVariation;

            const x =
              radius * Math.sin(phi) * Math.cos(theta) + noiseX * sphereRadius;
            const y =
              radius * Math.sin(phi) * Math.sin(theta) + noiseY * sphereRadius;
            const z = radius * Math.cos(phi) + noiseZ * sphereRadius;

            sprite.position.set(x, y, z);
            sprites.push(sprite);
            spritePositions.push({ x, y, z, index });

            group.add(sprite);
          }
        });

        // Create white connecting lines between nearby sprites
        // Ensure each image has at least 2 connections
        const connections = [];
        const connectionCounts = new Array(spritePositions.length).fill(0);
        const maxConnections = 800; // Increased limit for guaranteed connectivity
        let totalConnections = 0;

        // First pass: ensure each sprite has at least 2 connections
        for (let i = 0; i < spritePositions.length; i++) {
          const pos1 = spritePositions[i];

          // Find the 2 closest sprites that aren't already connected
          const distances = [];
          for (let j = 0; j < spritePositions.length; j++) {
            if (i !== j) {
              const pos2 = spritePositions[j];
              const dx = pos2.x - pos1.x;
              const dy = pos2.y - pos1.y;
              const dz = pos2.z - pos1.z;
              const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
              distances.push({ index: j, distance: distance });
            }
          }

          // Sort by distance and connect to closest available sprites
          distances.sort((a, b) => a.distance - b.distance);

          let connectionsMade = 0;
          for (const dist of distances) {
            if (connectionsMade >= 2) break; // Ensure exactly 2 minimum connections

            const j = dist.index;
            const connectionKey = i < j ? `${i}-${j}` : `${j}-${i}`;

            // Check if this connection already exists
            if (!connections.includes(connectionKey) && dist.distance < 80) {
              connections.push(connectionKey);
              connectionCounts[i]++;
              connectionCounts[j]++;
              connectionsMade++;
              totalConnections++;
            }
          }
        }

        // Second pass: add additional random connections for variety
        for (
          let i = 0;
          i < spritePositions.length && totalConnections < maxConnections;
          i++
        ) {
          const pos1 = spritePositions[i];

          for (
            let j = i + 1;
            j < spritePositions.length && totalConnections < maxConnections;
            j++
          ) {
            const pos2 = spritePositions[j];

            const dx = pos2.x - pos1.x;
            const dy = pos2.y - pos1.y;
            const dz = pos2.z - pos1.z;
            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

            const connectionKey = `${i}-${j}`;

            // Add random connections if not already connected and within distance
            if (
              !connections.includes(connectionKey) &&
              distance < 80 &&
              Math.random() < 0.7
            ) {
              connections.push(connectionKey);
              connectionCounts[i]++;
              connectionCounts[j]++;
              totalConnections++;
            }
          }
        }

        // Create the actual line geometries
        connections.forEach((connectionKey) => {
          const [i, j] = connectionKey.split("-").map(Number);
          const pos1 = spritePositions[i];
          const pos2 = spritePositions[j];

          const geometry = new THREE.BufferGeometry();
          const positions = new Float32Array([
            pos1.x,
            pos1.y,
            pos1.z,
            pos2.x,
            pos2.y,
            pos2.z,
          ]);
          geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
          );

          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            linewidth: 2,
          });

          const line = new THREE.Line(geometry, material);
          group.add(line);
        });

        return group;
      }

      // Create Artist view (exact replica of original)
      function createArtistView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.artist.x,
          viewPositions.artist.y,
          viewPositions.artist.z
        );

        // Create helix structure exactly as in original (shorter)
        const turns = 12; // Reduced from 20
        const radius = 40;
        const totalHeight = 800; // Reduced from 1500
        const segments = 800; // Reduced from 1200

        // Create helix outline
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2 * turns;
          const y = (i / segments) * totalHeight - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);
          points.push(new THREE.Vector3(x, y, z));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          linewidth: 6,
        });
        const helixLine = new THREE.Line(geometry, material);
        group.add(helixLine);

        // Create spiral guide lines
        const spiralGuides = 6;
        for (let guide = 0; guide <= spiralGuides; guide++) {
          const guideRadius = radius * (0.2 + guide * 0.15);
          const guidePoints = [];
          const guideSegments = 600; // Reduced from 800

          for (let i = 0; i <= guideSegments; i++) {
            const angle = (i / guideSegments) * Math.PI * 2 * turns;
            const y = (i / guideSegments) * totalHeight - totalHeight / 2;
            const x = guideRadius * Math.cos(angle);
            const z = guideRadius * Math.sin(angle);
            guidePoints.push(new THREE.Vector3(x, y, z));
          }

          const isOutermost = guide === spiralGuides;
          const lineWidth = isOutermost ? 5 : 3 + guide * 0.5;
          const opacity = isOutermost ? 0.8 : 0.4 + guide * 0.05;

          const guideGeometry = new THREE.BufferGeometry().setFromPoints(
            guidePoints
          );
          const guideMaterial = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: opacity,
            linewidth: lineWidth,
          });
          const guideLine = new THREE.Line(guideGeometry, guideMaterial);
          group.add(guideLine);
        }

        // Position images along helix
        const avgClusterSize = 8; // Increased from 5
        const estimatedClusters = Math.ceil(textures.length / avgClusterSize);

        for (
          let clusterIndex = 0;
          clusterIndex < estimatedClusters;
          clusterIndex++
        ) {
          const clusterGroup = new THREE.Group();

          // Position cluster on helix - more clustered along the axis
          const angle =
            (clusterIndex / estimatedClusters) * Math.PI * 2 * turns;
          const y =
            (clusterIndex * totalHeight) / estimatedClusters - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);

          clusterGroup.position.set(x, y, z);

          // Add images to cluster
          const clusterSize = Math.min(
            Math.floor(Math.random() * 6) + 5, // Increased from 3-7 to 5-10
            textures.length - clusterIndex * avgClusterSize
          );
          for (let i = 0; i < clusterSize; i++) {
            const textureIndex = clusterIndex * avgClusterSize + i;
            if (textureIndex < textures.length) {
              const textureData = textures[textureIndex];
              if (textureData.texture) {
                const aspectRatio =
                  textureData.texture.image.width /
                  textureData.texture.image.height;
                const baseSize = 5; // Increased from 3

                const material = new THREE.SpriteMaterial({
                  map: textureData.texture,
                  transparent: true,
                  opacity: 1.0,
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(baseSize * aspectRatio, baseSize, 1);

                // Tighter grid layout within cluster
                const gridCols = Math.ceil(Math.sqrt(clusterSize));
                const gridRows = Math.ceil(clusterSize / gridCols);
                const spacing = Math.max(8, baseSize * 1.1); // Reduced spacing from 10 to 8

                const col = i % gridCols;
                const row = Math.floor(i / gridCols);
                const offsetX = (col - (gridCols - 1) / 2) * spacing;
                const offsetY = (row - (gridRows - 1) / 2) * spacing;

                sprite.position.set(offsetX, offsetY, 0);
                clusterGroup.add(sprite);
              }
            }
          }

          group.add(clusterGroup);
        }

        return group;
      }

      // Create Intimacy view - true spiraling tunnel
      function createIntimacyView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.intimacy.x,
          viewPositions.intimacy.y + 50, // Move higher
          viewPositions.intimacy.z
        );

        // Create true spiraling tunnel structure (larger and higher)
        const tunnelLength = 350; // Reduced from 500
        const spiralTurns = 8; // Reduced from 12
        const segments = 150; // Reduced from 200
        const startRadius = 120; // Increased from 80
        const endRadius = 15; // Increased from 10

        // Create tube grid that wraps around the spiral
        const tubeGroup = new THREE.Group();
        const tubeSegments = 20; // Increased from 16 - Number of segments around the tube circumference
        const tubeRings = 20; // Reduced from 35 - Number of rings along the tube length

        for (let ring = 0; ring < tubeRings; ring++) {
          const progress = ring / (tubeRings - 1);
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);

          for (let segment = 0; segment < tubeSegments; segment++) {
            const segmentAngle = (segment / tubeSegments) * Math.PI * 2;
            const tubeRadius = radius + 12; // Increased from 8 - Slightly larger than image radius

            const x = tubeRadius * Math.cos(segmentAngle);
            const y = tubeRadius * Math.sin(segmentAngle);

            // Create small wireframe points at tube intersections
            const geometry = new THREE.SphereGeometry(0.5, 4, 4);
            const material = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0.6,
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            tubeGroup.add(sphere);
          }
        }

        // Create longitudinal lines along the tube
        for (let segment = 0; segment < tubeSegments; segment++) {
          const segmentAngle = (segment / tubeSegments) * Math.PI * 2;
          const points = [];

          for (let i = 0; i <= tubeRings; i++) {
            const progress = i / tubeRings;
            const z = (progress - 0.5) * tunnelLength;
            const spiralAngle = progress * Math.PI * 2 * spiralTurns;
            const radius =
              startRadius * Math.pow(endRadius / startRadius, progress);
            const tubeRadius = radius + 12;

            const x = tubeRadius * Math.cos(segmentAngle);
            const y = tubeRadius * Math.sin(segmentAngle);
            points.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const line = new THREE.Line(geometry, material);
          tubeGroup.add(line);
        }

        // Create spiral rings around the tube
        for (let ring = 0; ring < tubeRings; ring++) {
          const progress = ring / (tubeRings - 1);
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);
          const tubeRadius = radius + 12;

          const ringPoints = [];
          for (let j = 0; j <= tubeSegments; j++) {
            const angle = (j / tubeSegments) * Math.PI * 2;
            const x = tubeRadius * Math.cos(angle);
            const y = tubeRadius * Math.sin(angle);
            ringPoints.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(ringPoints);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const ringLine = new THREE.Line(geometry, material);
          tubeGroup.add(ringLine);
        }

        group.add(tubeGroup);

        // Position images along the true spiral
        const imagesPerSegment = Math.ceil(textures.length / segments);

        for (let segment = 0; segment < segments; segment++) {
          const progress = segment / segments;
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);

          const startIndex = segment * imagesPerSegment;
          const endIndex = Math.min(
            startIndex + imagesPerSegment,
            textures.length
          );
          const segmentImages = textures.slice(startIndex, endIndex);

          segmentImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 3 + progress * 1.5; // Increased from 2 + progress * 1
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.9,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Position images along the spiral with natural variation
              const imageAngle =
                spiralAngle + (index / segmentImages.length) * Math.PI * 0.3;
              const imageRadius = radius * 0.85; // Slightly inside the wireframe

              sprite.position.set(
                imageRadius * Math.cos(imageAngle),
                imageRadius * Math.sin(imageAngle),
                z
              );

              group.add(sprite);
            }
          });
        }

        return group;
      }

      // Create other views with simplified but recognizable structures
      function createOpenQuestionView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["open-question"].x,
          viewPositions["open-question"].y,
          viewPositions["open-question"].z
        );

        // Ultra-dense disk-like arrangement with tightly packed images
        const layers = 8; // Reduced number of layers
        const baseRadius = 5; // Smaller inner radius
        const radiusIncrement = 8; // Consistent spacing between layers

        for (let layer = 0; layer < layers; layer++) {
          const layerRadius = baseRadius + layer * radiusIncrement;

          // Calculate how many images should be in this layer based on circumference
          const circumference = 2 * Math.PI * layerRadius;
          const imageWidth = 4.0; // Larger images
          const imagesInLayer = Math.max(
            8,
            Math.floor(circumference / (imageWidth * 1.1))
          ); // Tight packing with minimal gaps

          // Distribute images evenly around this layer
          for (let i = 0; i < imagesInLayer; i++) {
            const textureIndex = (layer * 50 + i) % textures.length; // Use more images per layer
            const textureData = textures[textureIndex];

            if (textureData && textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = imageWidth;
              const height = width / aspectRatio;

              // Use sprites instead of planes to always face the camera
              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.95,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (i / imagesInLayer) * Math.PI * 2;

              // Create exponential volcano-like shape - center raised, edges at ground
              const maxRadius = baseRadius + (layers - 1) * radiusIncrement;
              const normalizedRadius = layerRadius / maxRadius; // 0 at center, 1 at edge
              const heightFactor = Math.pow(1 - normalizedRadius, 2); // Exponential curve
              const yPosition = heightFactor * 20; // Maximum height of 20 units at center

              sprite.position.set(
                layerRadius * Math.cos(angle),
                yPosition, // Raised center effect
                layerRadius * Math.sin(angle)
              );

              // Sprites automatically face the camera, no rotation needed

              group.add(sprite);
            }
          }
        }

        return group;
      }

      function createHashtagGalleryView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["hashtag-gallery"].x,
          viewPositions["hashtag-gallery"].y,
          viewPositions["hashtag-gallery"].z
        );

        // Create circular wireframe grid floor (like hashtag gallery)
        const gridRadius = 120; // Increased from 80
        const floorGeometry = new THREE.BufferGeometry();
        const floorVertices = [];
        const floorIndices = [];

        // Create a full circular grid for the floor
        const floorSegments = 24; // Number of segments around the full circle
        const radialSegments = 6; // Number of radial lines
        const y = -30; // Floor height - moved lower to accommodate larger structure

        // Generate vertices for full circular floor grid
        for (let i = 0; i <= radialSegments; i++) {
          for (let j = 0; j <= floorSegments; j++) {
            const angle = (2 * Math.PI * j) / floorSegments; // Full 360 degrees
            const currentRadius = (gridRadius * i) / radialSegments;
            const x = currentRadius * Math.cos(angle);
            const z = currentRadius * Math.sin(angle);
            floorVertices.push(x, y, z);
          }
        }

        // Generate indices for rounded floor grid
        for (let i = 0; i < radialSegments; i++) {
          for (let j = 0; j < floorSegments; j++) {
            const a = i * (floorSegments + 1) + j;
            const b = a + 1;
            const c = (i + 1) * (floorSegments + 1) + j;
            const d = c + 1;

            // Radial lines (from center outward)
            floorIndices.push(a, c);
            floorIndices.push(b, d);

            // Arc lines (around the circle)
            floorIndices.push(a, b);
            floorIndices.push(c, d);
          }
        }

        floorGeometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(floorVertices, 3)
        );
        floorGeometry.setIndex(floorIndices);

        const floorMaterial = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.3,
          linewidth: 1,
          depthWrite: false,
          depthTest: false,
        });
        const floorWireframe = new THREE.LineSegments(
          floorGeometry,
          floorMaterial
        );
        floorWireframe.renderOrder = -999; // Render behind everything
        group.add(floorWireframe);

        // Create curved wall arrangement (like hashtag gallery)
        const wallRadius = 100; // Increased from 70
        const arcAngle = Math.PI * 1.22; // 220 degrees (same as hashtag gallery)
        const yCenter = 15; // Images positioned higher above floor
        const fixedHeight = 18; // Increased fixed height for all images
        const gap = 4; // Increased gap between images

        // Calculate how many images to show (limit to fit the arc nicely)
        const maxImages = Math.min(15, textures.length);
        const imagesToShow = textures.slice(0, maxImages);

        // Calculate total width needed
        const widths = imagesToShow.map((textureData) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            return aspectRatio * fixedHeight;
          }
          return 1.5; // Default aspect ratio
        });

        const totalWidth =
          widths.reduce((a, b) => a + b, 0) + gap * (imagesToShow.length - 1);
        const arcLength = wallRadius * arcAngle;

        // Adjust radius if needed
        let usedRadius = wallRadius;
        if (totalWidth > arcLength) {
          usedRadius = totalWidth / arcAngle;
        }

        // Calculate starting position to center images
        const startArc =
          -arcAngle / 2 + (arcLength - totalWidth) / (2 * usedRadius);

        let currentArc = startArc;
        imagesToShow.forEach((textureData, index) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            const width = aspectRatio * fixedHeight;
            const angle = currentArc + width / (2 * usedRadius);

            const material = new THREE.SpriteMaterial({
              map: textureData.texture,
              transparent: true,
              opacity: 0.9,
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, fixedHeight, 1);

            // Position along the curved wall
            sprite.position.set(
              usedRadius * Math.cos(angle),
              yCenter,
              usedRadius * Math.sin(angle)
            );

            // Make sprite always face forward (toward the viewer)
            // Calculate the normal vector pointing toward the center
            const normalX = -Math.cos(angle);
            const normalZ = -Math.sin(angle);
            sprite.rotation.y = Math.atan2(normalX, normalZ);

            group.add(sprite);

            // Move to next position
            currentArc += (width + gap) / usedRadius;
          }
        });

        return group;
      }

      function createCompletenessView(textures) {

      function createTemperatureView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.temperature.x,
          viewPositions.temperature.y,
          viewPositions.temperature.z
        );

        // Scattered ball arrangement with colored squares
        const ballRadius = 50; // Reduced from 80 to 50
        const innerRadius = 25; // Reduced from 40 to 25

        // Create gradient squares from red center to blue outskirts
        const totalSquareCount = 400; // Reduced from 2800 to 400 for better performance
        for (let i = 0; i < totalSquareCount; i++) {
          const size = 1.5 + Math.random() * 2.5; // Larger sizes to compensate for fewer squares

          // Random position throughout the ball
          const radius = ballRadius * Math.pow(Math.random(), 0.7);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          const x = radius * Math.sin(phi) * Math.cos(theta);
          const y = radius * Math.sin(phi) * Math.sin(theta);
          const z = radius * Math.cos(phi);

          // Calculate gradient based on distance from center
          const distanceFromCenter = radius / ballRadius; // 0 = center, 1 = edge
          const redComponent = Math.max(0, 1 - distanceFromCenter * 0.8); // Red fades out more slowly
          const blueComponent = Math.min(1, distanceFromCenter * 0.8); // Blue increases more gradually

          const color = new THREE.Color(redComponent, 0, blueComponent);

          // Create a canvas texture for the colored square
          const canvas = document.createElement("canvas");
          canvas.width = 32;
          canvas.height = 32;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = `rgb(${Math.floor(
            redComponent * 255
          )}, 0, ${Math.floor(blueComponent * 255)})`;
          ctx.fillRect(0, 0, 32, 32);

          const texture = new THREE.CanvasTexture(canvas);
          const material = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            opacity: 0.6, // Slightly higher opacity to compensate for fewer squares
          });
          const square = new THREE.Sprite(material);

          square.position.set(x, y, z);
          square.scale.set(size, size, 1);

          group.add(square);
        }

        // Add scattered images throughout the ball
        textures.forEach((textureData, index) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            const width = 5 + Math.random() * 3; // Further reduced image sizes
            const height = width / aspectRatio;

            const material = new THREE.SpriteMaterial({
              map: textureData.texture,
              transparent: true,
              opacity: 0.9,
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, height, 1);

            // Random position throughout the entire ball
            const radius = ballRadius * Math.pow(Math.random(), 0.7);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            sprite.position.set(x, y, z);
            sprite.rotation.z = Math.random() * Math.PI * 2;

            group.add(sprite);
          }
        });

        return group;
      }

      // Create particle system
      function createParticleSystem() {
        const particleCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a much larger sphere to match the environment scale
          const radius = 1200;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 8.0,
          vertexColors: true,
          transparent: true,
          opacity: 0.5,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        globalRotationGroup.add(particles);
      }

      // Initialize the scene
      async function init() {
        console.log("Starting initialization...");

        // Create scene first
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create global rotation group
        globalRotationGroup = new THREE.Group();
        scene.add(globalRotationGroup);

        // Create noise texture background
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create camera
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          3000
        );
        camera.position.set(0, 0, 70);

        // Pre-allocate camera direction vector for reuse
        camera.direction = new THREE.Vector3();

        // Pre-calculate camera matrices to ensure proper initialization
        camera.updateMatrix();
        camera.updateMatrixWorld();

        // Create renderer
        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance",
          stencil: false,
          depth: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float offset;
            uniform float darkness;
            varying vec2 vUv;
            
            void main() {
              vec2 uv = vUv;
              vec4 color = texture2D(tDiffuse, uv);
              
              // Calculate distance from center
              vec2 center = vec2(0.5, 0.5);
              float dist = distance(uv, center);
              
              // Create vignette effect
              float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
              
              // Apply vignette
              color.rgb *= vignette;
              
              gl_FragColor = color;
            }
          `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1;
        controls.maxDistance = 2000;
        controls.target.set(0, 0, 0);
        controls.enabled = false; // Disable controls initially

        // Enable mouse scroll for zooming
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;

        // Enable dragging to rotate the environment
        controls.enablePan = false; // Disable panning to keep rotation behavior
        controls.enableRotate = true;
        controls.rotateSpeed = 1.0;

        // Enable automatic rotation (this will be controlled by our custom logic)
        controls.autoRotate = false; // We'll handle this manually
        controls.autoRotateSpeed = continuousRotation.speed; // Set the speed

        // Set the rotation center to the global rotation group
        controls.target.set(0, 0, 0);

        // Pre-initialize controls to prevent glitchy behavior
        controls.update();

        // Force a few update cycles to ensure stable initialization
        for (let i = 0; i < 5; i++) {
          controls.update();
        }

        // Pre-allocate vectors for controls to reduce garbage collection
        controls._spherical = new THREE.Spherical();
        controls._sphericalDelta = new THREE.Spherical();

        // Remove tooltip functionality since we're using floating titles now
        // renderer.domElement.addEventListener("mousemove", onMouseMove);

        // Add event listeners to pause auto-rotation during user interaction
        renderer.domElement.addEventListener("mousedown", () => {
          if (controls && continuousRotation.isActive) {
            controls.autoRotate = false;
          }
        });
        renderer.domElement.addEventListener("mouseup", () => {
          if (controls && continuousRotation.isActive) {
            controls.autoRotate = true;
          }
        });
        renderer.domElement.addEventListener("mouseleave", () => {
          if (controls && continuousRotation.isActive) {
            controls.autoRotate = true;
          }
        });

        // Add light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Create particle system first (no dependencies)
        createParticleSystem();

        // Load artistic data and images in parallel
        console.log("Loading data and images in parallel...");
        const [artisticDataResult, textures] = await Promise.all([
          loadArtisticData(),
          loadImages(),
        ]);
        artisticData = artisticDataResult;
        console.log(
          `Loaded ${textures.length} textures and ${artisticData.length} artistic records`
        );

        // Create all views with accurate structures
        console.log("Creating views...");
        viewGroups.rhizome = createRhizomeView(textures);
        viewGroups.artist = createArtistView(textures);
        viewGroups["open-question"] = createOpenQuestionView(textures);
        viewGroups["hashtag-gallery"] = createHashtagGalleryView(textures);
        viewGroups.completeness = createCompletenessView(textures);
        viewGroups.intimacy = createIntimacyView(textures);
        viewGroups.temperature = createTemperatureView(textures);

        // Add all groups to global rotation group
        Object.values(viewGroups).forEach((group) =>
          globalRotationGroup.add(group)
        );

        // Create and position title sprites above each view
        Object.entries(viewGroups).forEach(([viewName, group]) => {
          if (viewDisplayNames[viewName]) {
            // Position title above the view
            const titlePosition = new THREE.Vector3(
              group.position.x,
              group.position.y + 100, // 100 units above the view
              group.position.z
            );

            const titleSprite = createTitleSprite(
              viewDisplayNames[viewName],
              titlePosition
            );

            viewTitles[viewName] = titleSprite;
            globalRotationGroup.add(titleSprite);
          }
        });

        // Ensure scene is fully rendered before proceeding
        renderer.render(scene, camera);

        // Force controls to update one more time
        if (controls) {
          controls.update();
        }

        console.log("Initialization complete!");
      }

      // Simple smooth easing function for better performance
      function easeInOutSmooth(t) {
        // Simple cubic ease-in-out for smoother animation
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        // Handle camera animation
        if (cameraAnimation.isActive) {
          const currentTime = Date.now();
          const elapsed = currentTime - cameraAnimation.startTime;
          const progress = Math.min(elapsed / cameraAnimation.duration, 1);
          const easedProgress = easeInOutSmooth(progress);

          // Pre-calculate values to avoid repeated calculations
          const startDistance = cameraAnimation.startPosition.length();
          const distanceDelta = cameraAnimation.targetDistance - startDistance;
          const angleDelta =
            cameraAnimation.targetAngle - cameraAnimation.startAngle;
          const heightDelta =
            cameraAnimation.targetHeight - cameraAnimation.startPosition.y;

          // Calculate current position
          const currentDistance = startDistance + distanceDelta * easedProgress;
          const currentAngle =
            cameraAnimation.startAngle + angleDelta * easedProgress;
          const currentHeight =
            cameraAnimation.startPosition.y + heightDelta * easedProgress;

          // Position camera in orbit around the environment
          camera.position.x = currentDistance * Math.cos(currentAngle);
          camera.position.z = currentDistance * Math.sin(currentAngle);
          camera.position.y = currentHeight;

          // Make camera look at the center of the environment
          camera.lookAt(0, 0, 0);

          // Only update matrix once for better performance
          camera.updateMatrixWorld();

          // Start continuous rotation when animation is 90% complete for smooth blending
          if (progress >= 0.9 && !continuousRotation.isActive) {
            continuousRotation.isActive = true;
            console.log("Starting continuous slow rotation (blended)");
          }

          // Start title fade-in when animation completes
          if (progress >= 1 && titleFadeInStartTime === 0) {
            titleFadeInStartTime = Date.now();
            console.log("Starting title fade-in animation");
          }

          // End animation when complete
          if (progress >= 1) {
            cameraAnimation.isActive = false;
            console.log("Camera animation completed");

            // Re-enable controls after animation completes
            if (controls) {
              // Set controls target to center of the galaxy (0,0,0)
              controls.target.set(0, 0, 0);
              controls.update();

              // Enable controls with zoom and rotate functionality
              controls.enabled = true;
              controls.enableZoom = true;
              controls.enableRotate = true;
              controls.enablePan = false;
              console.log("Orbit controls re-enabled after camera animation");
            }
          }
        }

        // Handle continuous rotation after initial animation
        if (continuousRotation.isActive && controls && controls.enabled) {
          // Enable auto-rotate when continuous rotation is active
          controls.autoRotate = true;
        }

        // Animate titles
        if (titleFadeInStartTime > 0) {
          const currentTime = Date.now();
          const fadeInDuration = 3000; // 3 seconds fade-in
          const elapsed = currentTime - titleFadeInStartTime;
          const fadeProgress = Math.min(elapsed / fadeInDuration, 1);

          // Animate each title
          Object.values(viewTitles).forEach((titleSprite) => {
            // Fade in
            if (titleSprite.material) {
              titleSprite.material.opacity = fadeProgress;
            }

            // Make title always face the camera
            titleSprite.lookAt(camera.position);

            // Add subtle jitter
            const time = Date.now() * 0.001;
            const jitterData = titleSprite.userData;
            const jitterTime =
              time * jitterData.jitterSpeed + jitterData.jitterTime;

            const jitterX = Math.sin(jitterTime) * 0.5;
            const jitterY = Math.cos(jitterTime * 0.7) * 0.3;
            const jitterZ = Math.sin(jitterTime * 0.5) * 0.2;

            titleSprite.position.set(
              jitterData.originalPosition.x + jitterX,
              jitterData.originalPosition.y + jitterY,
              jitterData.originalPosition.z + jitterZ
            );
          });
        }

        // Animate particles (optimized for performance)
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const time = Date.now() * 0.001;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const particleTime = time * speed;

            positions[i] += Math.sin(particleTime) * 0.3; // Reduced movement for better performance
            positions[i + 1] += Math.cos(particleTime) * 0.3;
            positions[i + 2] += Math.sin(particleTime * 0.5) * 0.3;
          }

          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Global rotation around Y-axis (like a dreidel) - DISABLED
        // globalRotationGroup.rotation.y += 0.0005; // Much slower constant rotation

        // Individual view rotations - each view rotates around different axes and directions (slower)
        // Reduce rotation speed during camera animation for better performance
        const rotationMultiplier = cameraAnimation.isActive ? 0.5 : 1.0;

        if (viewGroups.rhizome) {
          viewGroups.rhizome.rotation.y += 0.001 * rotationMultiplier; // Clockwise around Y (slower)
          viewGroups.rhizome.rotation.x += 0.0005 * rotationMultiplier; // Tilt forward (slower)
        }
        if (viewGroups.artist) {
          viewGroups.artist.rotation.y += 0.001 * rotationMultiplier; // Rotate around Y-axis (upright rotation)
        }
        if (viewGroups["open-question"]) {
          viewGroups["open-question"].rotation.x += 0.001 * rotationMultiplier; // Forward tilt (slower)
          viewGroups["open-question"].rotation.y += 0.0005 * rotationMultiplier; // Slow clockwise (slower)
        }
        if (viewGroups["hashtag-gallery"]) {
          // Rotate the gallery wall around its own Y-axis
          viewGroups["hashtag-gallery"].rotation.y +=
            0.002 * rotationMultiplier; // Rotate wall around itself
        }
        if (viewGroups.completeness) {
          viewGroups.completeness.rotation.x -= 0.0008 * rotationMultiplier; // Backward tilt (slower)
          viewGroups.completeness.rotation.y += 0.001 * rotationMultiplier; // Clockwise (slower)
        }
        if (viewGroups.intimacy) {
          viewGroups.intimacy.rotation.z += 0.0005 * rotationMultiplier; // Roll (slower)
          viewGroups.intimacy.rotation.y -= 0.0003 * rotationMultiplier; // Very slow counter-clockwise (slower)
        }
        if (viewGroups.temperature) {
          viewGroups.temperature.rotation.x += 0.0008 * rotationMultiplier; // Forward tilt (slower)
          viewGroups.temperature.rotation.z += 0.0005 * rotationMultiplier; // Roll (slower)
          viewGroups.temperature.rotation.y += 0.0008 * rotationMultiplier; // Clockwise (slower)
        }

        // Only update controls if they are enabled
        if (controls && controls.enabled) {
          controls.update();
        }
        composer.render();
      }

      // Handle window resize
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      // Start the visualization
      async function startVisualization() {
        try {
          console.log("Starting visualization...");
          await init();

          // Hide loading screen
          document.getElementById("loading-container").style.display = "none";

          // Start animation
          animate();

          // Setup resize handler
          window.addEventListener("resize", onWindowResize, false);

          // Pre-warm the GPU by rendering a few frames
          for (let i = 0; i < 10; i++) {
            composer.render();
            await new Promise((resolve) => setTimeout(resolve, 16)); // ~60fps
          }

          // Start camera animation after 2 seconds
          setTimeout(() => {
            // Store current camera state
            cameraAnimation.startPosition.copy(camera.position);
            cameraAnimation.startAngle = Math.atan2(
              camera.position.z,
              camera.position.x
            );
            cameraAnimation.startTime = Date.now();
            cameraAnimation.isActive = true;
            console.log(
              "Starting camera animation: zoom out and orbit leftward"
            );
          }, 2000);

          // Note: Controls will be re-enabled automatically when camera animation completes

          console.log("Visualization started successfully!");
        } catch (error) {
          console.error("Error starting visualization:", error);
          const loadingText = document.getElementById("loading-text");
          if (loadingText) {
            loadingText.textContent = "ERROR: Failed to load. Please refresh.";
            loadingText.style.color = "#ff4444";
          }
        }
      }

      // Start when page loads
      window.addEventListener("load", startVisualization);
    </script>
  </body>
</html>
