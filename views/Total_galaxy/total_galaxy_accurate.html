<!DOCTYPE html>
<html>
  <head>
    <title>Total Galaxy - Accurate Views</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      #visualization {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }

      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }

      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      #view-tooltip {
        position: fixed;
        color: white;
        font-family: "VT323", monospace;
        font-size: 18px;
        background: rgba(0, 0, 0, 0.8);
        padding: 8px 12px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #view-tooltip.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING GALAXY... 0%
      </div>
    </div>

    <div id="visualization"></div>

    <div id="view-tooltip"></div>

    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;
      let viewGroups = {};
      let currentView = "galaxy";
      let loadedImages = 0;
      let totalImages = 0;
      let artisticData = [];
      let raycaster, mouse;
      let tooltip = null;

      // View positions in 3D space
      const viewPositions = {
        rhizome: { x: 0, y: 0, z: 0 },
        artist: { x: 800, y: 200, z: 400 },
        "open-question": { x: -600, y: 300, z: 500 },
        "hashtag-gallery": { x: 400, y: -400, z: 600 },
        completeness: { x: -400, y: -600, z: 300 },
        intimacy: { x: 600, y: 500, z: -400 },
        temperament: { x: -800, y: 100, z: -200 },
      };

      // View display names
      const viewDisplayNames = {
        rhizome: "Rhizome",
        artist: "Artist",
        "open-question": "Open Question",
        "hashtag-gallery": "Hashtag Gallery",
        completeness: "Completeness",
        intimacy: "Intimacy",
        temperament: "Temperament",
      };

      // Tooltip functions
      function showTooltip(text, x, y) {
        if (!tooltip) {
          tooltip = document.getElementById("view-tooltip");
        }
        tooltip.textContent = text;
        tooltip.style.left = x + 10 + "px";
        tooltip.style.top = y - 10 + "px";
        tooltip.classList.add("visible");
      }

      function hideTooltip() {
        if (tooltip) {
          tooltip.classList.remove("visible");
        }
      }

      function onMouseMove(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Check intersection with view groups
        const intersects = raycaster.intersectObjects(scene.children, true);

        if (intersects.length > 0) {
          // Find which view group the intersected object belongs to
          let currentObject = intersects[0].object;
          let viewName = null;

          // Traverse up the parent chain to find the view group
          while (currentObject && !viewName) {
            for (const [name, group] of Object.entries(viewGroups)) {
              if (
                currentObject === group ||
                group.children.includes(currentObject)
              ) {
                viewName = name;
                break;
              }
            }
            if (!viewName) {
              currentObject = currentObject.parent;
            }
          }

          if (viewName && viewDisplayNames[viewName]) {
            showTooltip(
              viewDisplayNames[viewName],
              event.clientX,
              event.clientY
            );
          } else {
            hideTooltip();
          }
        } else {
          hideTooltip();
        }
      }

      // Update loading UI
      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING GALAXY... ${Math.floor(
            progress
          )}%`;
        }
      }

      // Load artistic analysis data
      async function loadArtisticData() {
        try {
          const response = await fetch(
            "../../image_analysis/artistic_analysis_filtered.json"
          );
          artisticData = await response.json();
          console.log(
            `Loaded ${artisticData.length} artistic analysis records`
          );
          return artisticData;
        } catch (error) {
          console.error("Error loading artistic data:", error);
          return [];
        }
      }

      // Load images with progress tracking
      async function loadImages() {
        try {
          const response = await fetch("../../images/images.json");
          const imageList = await response.json();
          totalImages = imageList.length;

          const textureLoader = new THREE.TextureLoader();
          const textures = [];

          for (let i = 0; i < imageList.length; i++) {
            const imageName = imageList[i];
            try {
              const texture = await new Promise((resolve, reject) => {
                textureLoader.load(
                  `../../images/${imageName}`,
                  resolve,
                  undefined,
                  reject
                );
              });
              textures.push({ texture, filename: imageName, index: i });
            } catch (error) {
              console.warn(`Failed to load ${imageName}:`, error);
              textures.push({ texture: null, filename: imageName, index: i });
            }

            loadedImages++;
            updateLoadingUI((loadedImages / totalImages) * 100);
          }

          return textures;
        } catch (error) {
          console.error("Error loading images:", error);
          return [];
        }
      }

      // Create Rhizome view (exact replica of original)
      function createRhizomeView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.rhizome.x,
          viewPositions.rhizome.y,
          viewPositions.rhizome.z
        );

        // Define semantic categories exactly as in original
        const semanticCategories = {
          text_documents: [
            "manuscript",
            "document",
            "text",
            "writing",
            "letter",
            "signature",
            "list",
            "catalogue",
            "menu",
            "notes",
            "scripts",
            "correspondence",
            "point",
            "word",
            "boundary",
            "names",
            "roster",
          ],
          people_faces: [
            "face",
            "head",
            "person",
            "people",
            "portrait",
            "figure",
            "human",
          ],
          nature_landscape: [
            "landscape",
            "nature",
            "tree",
            "plant",
            "flower",
            "sky",
            "mountain",
            "water",
            "ocean",
            "forest",
            "animals",
            "zebra",
            "center",
          ],
          architecture_buildings: [
            "building",
            "architecture",
            "house",
            "structure",
            "wall",
            "door",
            "window",
            "room",
          ],
          objects_things: [
            "object",
            "thing",
            "item",
            "tool",
            "instrument",
            "device",
            "machine",
          ],
          abstract_patterns: [
            "pattern",
            "abstract",
            "design",
            "shape",
            "form",
            "texture",
            "color",
          ],
          animals_creatures: [
            "animal",
            "creature",
            "bird",
            "fish",
            "insect",
            "mammal",
          ],
          food_dining: [
            "food",
            "meal",
            "dish",
            "plate",
            "cup",
            "drink",
            "wine",
            "coffee",
            "pasta",
          ],
        };

        // Group images by category
        const categoryGroups = {};
        textures.forEach((textureData, index) => {
          const imageData = artisticData.find(
            (item) => item.filename === textureData.filename
          );
          if (imageData) {
            const keywordTexts = imageData.keywords.map((k) =>
              k.keyword.toLowerCase()
            );
            let bestCategory = "other";
            let maxScore = 0;

            for (const [category, keywords] of Object.entries(
              semanticCategories
            )) {
              let score = 0;
              for (const keyword of keywords) {
                if (keywordTexts.includes(keyword)) {
                  score += 1;
                }
              }
              if (score > maxScore) {
                maxScore = score;
                bestCategory = category;
              }
            }

            if (!categoryGroups[bestCategory]) {
              categoryGroups[bestCategory] = [];
            }
            categoryGroups[bestCategory].push({
              textureData,
              imageData,
              index,
            });
          }
        });

        // Position categories exactly as in original
        const clusterPositions = {
          text_documents: { x: -400, y: 0, z: 0 },
          people_faces: { x: 400, y: 0, z: 0 },
          nature_landscape: { x: 0, y: 400, z: 0 },
          architecture_buildings: { x: 0, y: -400, z: 0 },
          objects_things: { x: 0, y: 0, z: 400 },
          abstract_patterns: { x: 0, y: 0, z: -400 },
          animals_creatures: { x: -400, y: 400, z: 0 },
          food_dining: { x: 400, y: -400, z: 0 },
          other: { x: 0, y: 0, z: 0 },
        };

        Object.entries(categoryGroups).forEach(([category, images]) => {
          const categoryGroup = new THREE.Group();
          const pos = clusterPositions[category] || { x: 0, y: 0, z: 0 };
          categoryGroup.position.set(pos.x, pos.y, pos.z);

          // Position images in spiral within cluster (exact replica)
          images.forEach((imageData, imageIndex) => {
            if (imageData.textureData.texture) {
              const aspectRatio =
                imageData.textureData.texture.image.width /
                imageData.textureData.texture.image.height;
              const width = 20; // Much larger base width as in original
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: imageData.textureData.texture,
                transparent: true,
                opacity: 1,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Exact spiral pattern from original
              const angle = (imageIndex / images.length) * Math.PI * 4; // 2 full rotations
              const radius = (imageIndex / images.length) * 60 * 0.8; // clusterRadius = 60
              const heightOffset = Math.sin(angle * 2) * 60 * 0.3;

              sprite.position.set(
                radius * Math.cos(angle),
                radius * Math.sin(angle),
                heightOffset
              );

              categoryGroup.add(sprite);
            }
          });

          group.add(categoryGroup);
        });

        return group;
      }

      // Create Artist view (exact replica of original)
      function createArtistView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.artist.x,
          viewPositions.artist.y,
          viewPositions.artist.z
        );

        // Create helix structure exactly as in original
        const turns = 20;
        const radius = 40;
        const totalHeight = 1500;
        const segments = 1200;

        // Create helix outline
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2 * turns;
          const y = (i / segments) * totalHeight - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);
          points.push(new THREE.Vector3(x, y, z));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          linewidth: 6,
        });
        const helixLine = new THREE.Line(geometry, material);
        group.add(helixLine);

        // Create spiral guide lines
        const spiralGuides = 6;
        for (let guide = 0; guide <= spiralGuides; guide++) {
          const guideRadius = radius * (0.2 + guide * 0.15);
          const guidePoints = [];
          const guideSegments = 800;

          for (let i = 0; i <= guideSegments; i++) {
            const angle = (i / guideSegments) * Math.PI * 2 * turns;
            const y = (i / guideSegments) * totalHeight - totalHeight / 2;
            const x = guideRadius * Math.cos(angle);
            const z = guideRadius * Math.sin(angle);
            guidePoints.push(new THREE.Vector3(x, y, z));
          }

          const isOutermost = guide === spiralGuides;
          const lineWidth = isOutermost ? 5 : 3 + guide * 0.5;
          const opacity = isOutermost ? 0.8 : 0.4 + guide * 0.05;

          const guideGeometry = new THREE.BufferGeometry().setFromPoints(
            guidePoints
          );
          const guideMaterial = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: opacity,
            linewidth: lineWidth,
          });
          const guideLine = new THREE.Line(guideGeometry, guideMaterial);
          group.add(guideLine);
        }

        // Position images along helix
        const avgClusterSize = 5;
        const estimatedClusters = Math.ceil(textures.length / avgClusterSize);

        for (
          let clusterIndex = 0;
          clusterIndex < estimatedClusters;
          clusterIndex++
        ) {
          const clusterGroup = new THREE.Group();

          // Position cluster on helix
          const angle =
            (clusterIndex / estimatedClusters) * Math.PI * 2 * turns;
          const y =
            (clusterIndex * totalHeight) / estimatedClusters - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);

          clusterGroup.position.set(x, y, z);

          // Add images to cluster
          const clusterSize = Math.min(
            Math.floor(Math.random() * 5) + 3,
            textures.length - clusterIndex * avgClusterSize
          );
          for (let i = 0; i < clusterSize; i++) {
            const textureIndex = clusterIndex * avgClusterSize + i;
            if (textureIndex < textures.length) {
              const textureData = textures[textureIndex];
              if (textureData.texture) {
                const aspectRatio =
                  textureData.texture.image.width /
                  textureData.texture.image.height;
                const baseSize = 8;

                const material = new THREE.SpriteMaterial({
                  map: textureData.texture,
                  transparent: true,
                  opacity: 1.0,
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(baseSize * aspectRatio, baseSize, 1);

                // Grid layout within cluster
                const gridCols = Math.ceil(Math.sqrt(clusterSize));
                const gridRows = Math.ceil(clusterSize / gridCols);
                const spacing = Math.max(10, baseSize * 1.3);

                const col = i % gridCols;
                const row = Math.floor(i / gridCols);
                const offsetX = (col - (gridCols - 1) / 2) * spacing;
                const offsetY = (row - (gridRows - 1) / 2) * spacing;

                sprite.position.set(offsetX, offsetY, 0);
                clusterGroup.add(sprite);
              }
            }
          }

          group.add(clusterGroup);
        }

        return group;
      }

      // Create Intimacy view - true spiraling tunnel
      function createIntimacyView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.intimacy.x,
          viewPositions.intimacy.y,
          viewPositions.intimacy.z
        );

        // Create true spiraling tunnel structure
        const tunnelLength = 500;
        const spiralTurns = 12;
        const segments = 300;
        const startRadius = 80;
        const endRadius = 10;

        // Create tube grid that wraps around the spiral
        const tubeGroup = new THREE.Group();
        const tubeSegments = 16; // Number of segments around the tube circumference
        const tubeRings = 40; // Number of rings along the tube length

        for (let ring = 0; ring < tubeRings; ring++) {
          const progress = ring / (tubeRings - 1);
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);

          for (let segment = 0; segment < tubeSegments; segment++) {
            const segmentAngle = (segment / tubeSegments) * Math.PI * 2;
            const tubeRadius = radius + 8; // Slightly larger than image radius

            const x = tubeRadius * Math.cos(segmentAngle);
            const y = tubeRadius * Math.sin(segmentAngle);

            // Create small wireframe points at tube intersections
            const geometry = new THREE.SphereGeometry(0.5, 4, 4);
            const material = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              transparent: true,
              opacity: 0.6,
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            tubeGroup.add(sphere);
          }
        }

        // Create longitudinal lines along the tube
        for (let segment = 0; segment < tubeSegments; segment++) {
          const segmentAngle = (segment / tubeSegments) * Math.PI * 2;
          const points = [];

          for (let i = 0; i <= tubeRings; i++) {
            const progress = i / tubeRings;
            const z = (progress - 0.5) * tunnelLength;
            const spiralAngle = progress * Math.PI * 2 * spiralTurns;
            const radius =
              startRadius * Math.pow(endRadius / startRadius, progress);
            const tubeRadius = radius + 8;

            const x = tubeRadius * Math.cos(segmentAngle);
            const y = tubeRadius * Math.sin(segmentAngle);
            points.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const line = new THREE.Line(geometry, material);
          tubeGroup.add(line);
        }

        // Create spiral rings around the tube
        for (let ring = 0; ring < tubeRings; ring++) {
          const progress = ring / (tubeRings - 1);
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);
          const tubeRadius = radius + 8;

          const ringPoints = [];
          for (let j = 0; j <= tubeSegments; j++) {
            const angle = (j / tubeSegments) * Math.PI * 2;
            const x = tubeRadius * Math.cos(angle);
            const y = tubeRadius * Math.sin(angle);
            ringPoints.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(ringPoints);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const ringLine = new THREE.Line(geometry, material);
          tubeGroup.add(ringLine);
        }

        group.add(tubeGroup);

        // Position images along the true spiral
        const imagesPerSegment = Math.ceil(textures.length / segments);

        for (let segment = 0; segment < segments; segment++) {
          const progress = segment / segments;
          const z = (progress - 0.5) * tunnelLength;
          const spiralAngle = progress * Math.PI * 2 * spiralTurns;
          const radius =
            startRadius * Math.pow(endRadius / startRadius, progress);

          const startIndex = segment * imagesPerSegment;
          const endIndex = Math.min(
            startIndex + imagesPerSegment,
            textures.length
          );
          const segmentImages = textures.slice(startIndex, endIndex);

          segmentImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 4 + progress * 2; // Images get smaller as tunnel narrows
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.9,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Position images along the spiral with natural variation
              const imageAngle =
                spiralAngle + (index / segmentImages.length) * Math.PI * 0.3;
              const imageRadius = radius * 0.8; // Slightly inside the wireframe

              sprite.position.set(
                imageRadius * Math.cos(imageAngle),
                imageRadius * Math.sin(imageAngle),
                z
              );

              group.add(sprite);
            }
          });
        }

        return group;
      }

      // Create other views with simplified but recognizable structures
      function createOpenQuestionView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["open-question"].x,
          viewPositions["open-question"].y,
          viewPositions["open-question"].z
        );

        // Layered circular arrangement
        const layers = 5;
        const imagesPerLayer = Math.ceil(textures.length / layers);

        for (let layer = 0; layer < layers; layer++) {
          const layerGroup = new THREE.Group();
          const layerRadius = 40 + layer * 20;
          const layerHeight = layer * 25;

          const startIndex = layer * imagesPerLayer;
          const endIndex = Math.min(
            startIndex + imagesPerLayer,
            textures.length
          );
          const layerImages = textures.slice(startIndex, endIndex);

          layerImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 10;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.8,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (index / layerImages.length) * Math.PI * 2;
              sprite.position.set(
                layerRadius * Math.cos(angle),
                layerHeight,
                layerRadius * Math.sin(angle)
              );

              layerGroup.add(sprite);
            }
          });

          group.add(layerGroup);
        }

        return group;
      }

      function createHashtagGalleryView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["hashtag-gallery"].x,
          viewPositions["hashtag-gallery"].y,
          viewPositions["hashtag-gallery"].z
        );

        // Curved wall arrangement
        const wallRadius = 80;
        const imagesPerRow = 10;
        const rows = Math.ceil(textures.length / imagesPerRow);

        for (let row = 0; row < rows; row++) {
          const rowGroup = new THREE.Group();
          const rowHeight = (row - rows / 2) * 20;

          const startIndex = row * imagesPerRow;
          const endIndex = Math.min(startIndex + imagesPerRow, textures.length);
          const rowImages = textures.slice(startIndex, endIndex);

          rowImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 12;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 1,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (index / rowImages.length) * Math.PI * 1.5; // Curved wall
              sprite.position.set(
                wallRadius * Math.cos(angle),
                rowHeight,
                wallRadius * Math.sin(angle)
              );

              rowGroup.add(sprite);
            }
          });

          group.add(rowGroup);
        }

        return group;
      }

      function createCompletenessView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.completeness.x,
          viewPositions.completeness.y,
          viewPositions.completeness.z
        );

        // Score-based arrangement
        const scoreGroups = {
          high: textures.slice(0, Math.floor(textures.length / 3)),
          medium: textures.slice(
            Math.floor(textures.length / 3),
            Math.floor((2 * textures.length) / 3)
          ),
          low: textures.slice(Math.floor((2 * textures.length) / 3)),
        };

        const groupPositions = {
          high: { x: 0, y: 80, z: 0 },
          medium: { x: 0, y: 0, z: 0 },
          low: { x: 0, y: -80, z: 0 },
        };

        Object.entries(scoreGroups).forEach(([scoreLevel, images]) => {
          const scoreGroup = new THREE.Group();
          const pos = groupPositions[scoreLevel];
          scoreGroup.position.set(pos.x, pos.y, pos.z);

          images.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 10;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.8,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Grid layout
              const gridCols = Math.ceil(Math.sqrt(images.length));
              const gridRows = Math.ceil(images.length / gridCols);
              const spacing = 15;

              const row = Math.floor(index / gridCols);
              const col = index % gridCols;

              sprite.position.set(
                (col - gridCols / 2) * spacing,
                (row - gridRows / 2) * spacing,
                0
              );

              scoreGroup.add(sprite);
            }
          });

          group.add(scoreGroup);
        });

        return group;
      }

      function createTemperamentView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.temperament.x,
          viewPositions.temperament.y,
          viewPositions.temperament.z
        );

        // Scattered ball arrangement with colored squares
        const ballRadius = 60;
        const innerRadius = 30; // Boundary between red and blue squares

        // Create gradient squares from red center to blue outskirts
        const totalSquareCount = 1400;
        for (let i = 0; i < totalSquareCount; i++) {
          const size = 0.5 + Math.random() * 1.5; // Varying sizes from 0.5-2 units
          const geometry = new THREE.PlaneGeometry(size, size);

          // Random position throughout the ball
          const radius = ballRadius * Math.pow(Math.random(), 0.7);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          const x = radius * Math.sin(phi) * Math.cos(theta);
          const y = radius * Math.sin(phi) * Math.sin(theta);
          const z = radius * Math.cos(phi);

          // Calculate gradient based on distance from center
          const distanceFromCenter = radius / ballRadius; // 0 = center, 1 = edge
          const redComponent = Math.max(0, 1 - distanceFromCenter * 0.8); // Red fades out more slowly
          const blueComponent = Math.min(1, distanceFromCenter * 0.8); // Blue increases more gradually

          const color = new THREE.Color(redComponent, 0, blueComponent);

          const material = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide,
          });
          const square = new THREE.Mesh(geometry, material);

          square.position.set(x, y, z);
          // Make squares always face the viewer (like sprites)
          square.userData = { isSprite: true }; // Mark for camera-facing update

          group.add(square);
        }

        // Add scattered images throughout the ball
        textures.forEach((textureData, index) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            const width = 6 + Math.random() * 3; // Smaller images to fit with squares
            const height = width / aspectRatio;

            const material = new THREE.SpriteMaterial({
              map: textureData.texture,
              transparent: true,
              opacity: 0.9,
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, height, 1);

            // Random position throughout the entire ball
            const radius = ballRadius * Math.pow(Math.random(), 0.7);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            sprite.position.set(x, y, z);
            sprite.rotation.z = Math.random() * Math.PI * 2;

            group.add(sprite);
          }
        });

        return group;
      }

      // Create particle system
      function createParticleSystem() {
        const particleCount = 1500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a much larger sphere to match the environment scale
          const radius = 1200;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 8.0,
          vertexColors: true,
          transparent: true,
          opacity: 0.5,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);
      }

      // Initialize the scene
      async function init() {
        console.log("Starting initialization...");

        // Load artistic data first
        await loadArtisticData();

        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create noise texture background
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create camera
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          3000
        );
        camera.position.set(0, 0, 2000);

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float offset;
            uniform float darkness;
            varying vec2 vUv;
            
            void main() {
              vec2 uv = vUv;
              vec4 color = texture2D(tDiffuse, uv);
              
              // Calculate distance from center
              vec2 center = vec2(0.5, 0.5);
              float dist = distance(uv, center);
              
              // Create vignette effect
              float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
              
              // Apply vignette
              color.rgb *= vignette;
              
              gl_FragColor = color;
            }
          `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Initialize raycaster and mouse
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Add controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 100;
        controls.maxDistance = 2000;
        controls.target.set(0, 0, 0);
        controls.update();

        // Set camera to maximum zoom out
        camera.position.set(0, 0, 2000);
        controls.update();

        // Add mouse move event listener for tooltips
        renderer.domElement.addEventListener("mousemove", onMouseMove);

        // Add light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Load images
        console.log("Loading images...");
        const textures = await loadImages();
        console.log(`Loaded ${textures.length} textures`);

        // Create particle system
        createParticleSystem();

        // Create all views with accurate structures
        console.log("Creating views...");
        viewGroups.rhizome = createRhizomeView(textures);
        viewGroups.artist = createArtistView(textures);
        viewGroups["open-question"] = createOpenQuestionView(textures);
        viewGroups["hashtag-gallery"] = createHashtagGalleryView(textures);
        viewGroups.completeness = createCompletenessView(textures);
        viewGroups.intimacy = createIntimacyView(textures);
        viewGroups.temperament = createTemperamentView(textures);

        // Add all groups to scene
        Object.values(viewGroups).forEach((group) => scene.add(group));

        console.log("Initialization complete!");
      }

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.5;
            positions[i + 1] += Math.cos(time) * 0.5;
            positions[i + 2] += Math.sin(time * 0.5) * 0.5;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Animate view groups with gentle rotation
        Object.values(viewGroups).forEach((group, index) => {
          group.rotation.y += 0.0005 + index * 0.0002;
          group.rotation.x += 0.0002 + index * 0.0001;

          // Make temperament squares always face the camera
          if (index === 6) {
            // Temperament view index
            group.children.forEach((child) => {
              if (child.userData && child.userData.isSprite) {
                child.lookAt(camera.position);
              }
            });
          }
        });

        controls.update();
        composer.render();
      }

      // Handle window resize
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      // Start the visualization
      async function startVisualization() {
        try {
          console.log("Starting visualization...");
          await init();

          // Hide loading screen
          document.getElementById("loading-container").style.display = "none";

          // Start animation
          animate();

          // Setup resize handler
          window.addEventListener("resize", onWindowResize, false);

          console.log("Visualization started successfully!");
        } catch (error) {
          console.error("Error starting visualization:", error);
          const loadingText = document.getElementById("loading-text");
          if (loadingText) {
            loadingText.textContent = "ERROR: Failed to load. Please refresh.";
            loadingText.style.color = "#ff4444";
          }
        }
      }

      // Start when page loads
      window.addEventListener("load", startVisualization);
    </script>
  </body>
