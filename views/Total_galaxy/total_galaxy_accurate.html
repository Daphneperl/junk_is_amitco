<!DOCTYPE html>
<html>
  <head>
    <title>Total Galaxy - Accurate Views</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
        font-family: "VT323", monospace;
      }

      #visualization {
        width: 100vw;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }

      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }

      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      #view-labels {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
        color: white;
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .view-label {
        margin-bottom: 10px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .view-label:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.6);
      }

      .view-label.active {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.8);
      }

      #camera-info {
        position: fixed;
        bottom: 20px;
        right: 20px;
        color: white;
        font-family: "VT323", monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 4px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="loading-container">
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING GALAXY... 0%
      </div>
    </div>

    <div id="visualization"></div>

    <div id="view-labels">
      <div class="view-label" data-view="rhizome">Rhizome</div>
      <div class="view-label" data-view="artist">Artist</div>
      <div class="view-label" data-view="open-question">Open Question</div>
      <div class="view-label" data-view="hashtag-gallery">Hashtag Gallery</div>
      <div class="view-label" data-view="completeness">Completeness</div>
      <div class="view-label" data-view="intimacy">Intimacy</div>
      <div class="view-label" data-view="temperament">Temperament</div>
    </div>

    <div id="camera-info">
      <div>Camera Position: <span id="camera-pos">0, 0, 0</span></div>
      <div>Current View: <span id="current-view">Galaxy Overview</span></div>
    </div>

    <script>
      let scene, camera, renderer, controls;
      let particles;
      let viewGroups = {};
      let currentView = "galaxy";
      let loadedImages = 0;
      let totalImages = 0;
      let artisticData = [];

      // View positions in 3D space
      const viewPositions = {
        rhizome: { x: 0, y: 0, z: 0 },
        artist: { x: 800, y: 200, z: 400 },
        "open-question": { x: -600, y: 300, z: 500 },
        "hashtag-gallery": { x: 400, y: -400, z: 600 },
        completeness: { x: -400, y: -600, z: 300 },
        intimacy: { x: 600, y: 500, z: -400 },
        temperament: { x: -800, y: 100, z: -200 },
      };

      // Update loading UI
      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING GALAXY... ${Math.floor(
            progress
          )}%`;
        }
      }

      // Load artistic analysis data
      async function loadArtisticData() {
        try {
          const response = await fetch(
            "../../image_analysis/artistic_analysis_filtered.json"
          );
          artisticData = await response.json();
          console.log(
            `Loaded ${artisticData.length} artistic analysis records`
          );
          return artisticData;
        } catch (error) {
          console.error("Error loading artistic data:", error);
          return [];
        }
      }

      // Load images with progress tracking
      async function loadImages() {
        try {
          const response = await fetch("../../images/images.json");
          const imageList = await response.json();
          totalImages = imageList.length;

          const textureLoader = new THREE.TextureLoader();
          const textures = [];

          for (let i = 0; i < imageList.length; i++) {
            const imageName = imageList[i];
            try {
              const texture = await new Promise((resolve, reject) => {
                textureLoader.load(
                  `../../images/${imageName}`,
                  resolve,
                  undefined,
                  reject
                );
              });
              textures.push({ texture, filename: imageName, index: i });
            } catch (error) {
              console.warn(`Failed to load ${imageName}:`, error);
              textures.push({ texture: null, filename: imageName, index: i });
            }

            loadedImages++;
            updateLoadingUI((loadedImages / totalImages) * 100);
          }

          return textures;
        } catch (error) {
          console.error("Error loading images:", error);
          return [];
        }
      }

      // Create Rhizome view (exact replica of original)
      function createRhizomeView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.rhizome.x,
          viewPositions.rhizome.y,
          viewPositions.rhizome.z
        );

        // Define semantic categories exactly as in original
        const semanticCategories = {
          text_documents: [
            "manuscript",
            "document",
            "text",
            "writing",
            "letter",
            "signature",
            "list",
            "catalogue",
            "menu",
            "notes",
            "scripts",
            "correspondence",
            "point",
            "word",
            "boundary",
            "names",
            "roster",
          ],
          people_faces: [
            "face",
            "head",
            "person",
            "people",
            "portrait",
            "figure",
            "human",
          ],
          nature_landscape: [
            "landscape",
            "nature",
            "tree",
            "plant",
            "flower",
            "sky",
            "mountain",
            "water",
            "ocean",
            "forest",
            "animals",
            "zebra",
            "center",
          ],
          architecture_buildings: [
            "building",
            "architecture",
            "house",
            "structure",
            "wall",
            "door",
            "window",
            "room",
          ],
          objects_things: [
            "object",
            "thing",
            "item",
            "tool",
            "instrument",
            "device",
            "machine",
          ],
          abstract_patterns: [
            "pattern",
            "abstract",
            "design",
            "shape",
            "form",
            "texture",
            "color",
          ],
          animals_creatures: [
            "animal",
            "creature",
            "bird",
            "fish",
            "insect",
            "mammal",
          ],
          food_dining: [
            "food",
            "meal",
            "dish",
            "plate",
            "cup",
            "drink",
            "wine",
            "coffee",
            "pasta",
          ],
        };

        // Group images by category
        const categoryGroups = {};
        textures.forEach((textureData, index) => {
          const imageData = artisticData.find(
            (item) => item.filename === textureData.filename
          );
          if (imageData) {
            const keywordTexts = imageData.keywords.map((k) =>
              k.keyword.toLowerCase()
            );
            let bestCategory = "other";
            let maxScore = 0;

            for (const [category, keywords] of Object.entries(
              semanticCategories
            )) {
              let score = 0;
              for (const keyword of keywords) {
                if (keywordTexts.includes(keyword)) {
                  score += 1;
                }
              }
              if (score > maxScore) {
                maxScore = score;
                bestCategory = category;
              }
            }

            if (!categoryGroups[bestCategory]) {
              categoryGroups[bestCategory] = [];
            }
            categoryGroups[bestCategory].push({
              textureData,
              imageData,
              index,
            });
          }
        });

        // Position categories exactly as in original
        const clusterPositions = {
          text_documents: { x: -400, y: 0, z: 0 },
          people_faces: { x: 400, y: 0, z: 0 },
          nature_landscape: { x: 0, y: 400, z: 0 },
          architecture_buildings: { x: 0, y: -400, z: 0 },
          objects_things: { x: 0, y: 0, z: 400 },
          abstract_patterns: { x: 0, y: 0, z: -400 },
          animals_creatures: { x: -400, y: 400, z: 0 },
          food_dining: { x: 400, y: -400, z: 0 },
          other: { x: 0, y: 0, z: 0 },
        };

        Object.entries(categoryGroups).forEach(([category, images]) => {
          const categoryGroup = new THREE.Group();
          const pos = clusterPositions[category] || { x: 0, y: 0, z: 0 };
          categoryGroup.position.set(pos.x, pos.y, pos.z);

          // Position images in spiral within cluster (exact replica)
          images.forEach((imageData, imageIndex) => {
            if (imageData.textureData.texture) {
              const aspectRatio =
                imageData.textureData.texture.image.width /
                imageData.textureData.texture.image.height;
              const width = 20; // Much larger base width as in original
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: imageData.textureData.texture,
                transparent: true,
                opacity: 1,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Exact spiral pattern from original
              const angle = (imageIndex / images.length) * Math.PI * 4; // 2 full rotations
              const radius = (imageIndex / images.length) * 60 * 0.8; // clusterRadius = 60
              const heightOffset = Math.sin(angle * 2) * 60 * 0.3;

              sprite.position.set(
                radius * Math.cos(angle),
                radius * Math.sin(angle),
                heightOffset
              );

              categoryGroup.add(sprite);
            }
          });

          group.add(categoryGroup);
        });

        return group;
      }

      // Create Artist view (exact replica of original)
      function createArtistView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.artist.x,
          viewPositions.artist.y,
          viewPositions.artist.z
        );

        // Create helix structure exactly as in original
        const turns = 20;
        const radius = 40;
        const totalHeight = 1500;
        const segments = 1200;

        // Create helix outline
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2 * turns;
          const y = (i / segments) * totalHeight - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);
          points.push(new THREE.Vector3(x, y, z));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          linewidth: 6,
        });
        const helixLine = new THREE.Line(geometry, material);
        group.add(helixLine);

        // Create spiral guide lines
        const spiralGuides = 6;
        for (let guide = 0; guide <= spiralGuides; guide++) {
          const guideRadius = radius * (0.2 + guide * 0.15);
          const guidePoints = [];
          const guideSegments = 800;

          for (let i = 0; i <= guideSegments; i++) {
            const angle = (i / guideSegments) * Math.PI * 2 * turns;
            const y = (i / guideSegments) * totalHeight - totalHeight / 2;
            const x = guideRadius * Math.cos(angle);
            const z = guideRadius * Math.sin(angle);
            guidePoints.push(new THREE.Vector3(x, y, z));
          }

          const isOutermost = guide === spiralGuides;
          const lineWidth = isOutermost ? 5 : 3 + guide * 0.5;
          const opacity = isOutermost ? 0.8 : 0.4 + guide * 0.05;

          const guideGeometry = new THREE.BufferGeometry().setFromPoints(
            guidePoints
          );
          const guideMaterial = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: opacity,
            linewidth: lineWidth,
          });
          const guideLine = new THREE.Line(guideGeometry, guideMaterial);
          group.add(guideLine);
        }

        // Position images along helix
        const avgClusterSize = 5;
        const estimatedClusters = Math.ceil(textures.length / avgClusterSize);

        for (
          let clusterIndex = 0;
          clusterIndex < estimatedClusters;
          clusterIndex++
        ) {
          const clusterGroup = new THREE.Group();

          // Position cluster on helix
          const angle =
            (clusterIndex / estimatedClusters) * Math.PI * 2 * turns;
          const y =
            (clusterIndex * totalHeight) / estimatedClusters - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);

          clusterGroup.position.set(x, y, z);

          // Add images to cluster
          const clusterSize = Math.min(
            Math.floor(Math.random() * 5) + 3,
            textures.length - clusterIndex * avgClusterSize
          );
          for (let i = 0; i < clusterSize; i++) {
            const textureIndex = clusterIndex * avgClusterSize + i;
            if (textureIndex < textures.length) {
              const textureData = textures[textureIndex];
              if (textureData.texture) {
                const aspectRatio =
                  textureData.texture.image.width /
                  textureData.texture.image.height;
                const baseSize = 8;

                const material = new THREE.SpriteMaterial({
                  map: textureData.texture,
                  transparent: true,
                  opacity: 1.0,
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(baseSize * aspectRatio, baseSize, 1);

                // Grid layout within cluster
                const gridCols = Math.ceil(Math.sqrt(clusterSize));
                const gridRows = Math.ceil(clusterSize / gridCols);
                const spacing = Math.max(10, baseSize * 1.3);

                const col = i % gridCols;
                const row = Math.floor(i / gridCols);
                const offsetX = (col - (gridCols - 1) / 2) * spacing;
                const offsetY = (row - (gridRows - 1) / 2) * spacing;

                sprite.position.set(offsetX, offsetY, 0);
                clusterGroup.add(sprite);
              }
            }
          }

          group.add(clusterGroup);
        }

        return group;
      }

      // Create Intimacy view (exact replica of original)
      function createIntimacyView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.intimacy.x,
          viewPositions.intimacy.y,
          viewPositions.intimacy.z
        );

        // Create tunnel structure
        const tunnelRadius = 75;
        const tunnelLength = 300;
        const rings = 10;

        // Create tunnel wireframe
        const wireGroup = new THREE.Group();
        const numVerticalLines = 48;
        const numHorizontalRings = 60;

        // Vertical lines
        for (let v = 0; v < numVerticalLines; v++) {
          const angle = (v / numVerticalLines) * Math.PI * 2;
          const points = [];
          for (let i = 0; i <= rings; i++) {
            const z = (i - rings / 2) * 30;
            const x = tunnelRadius * Math.cos(angle);
            const y = tunnelRadius * Math.sin(angle);
            points.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const line = new THREE.Line(geometry, material);
          wireGroup.add(line);
        }

        // Horizontal rings
        for (let i = 0; i < numHorizontalRings; i++) {
          const z = (i - numHorizontalRings / 2) * 5;
          const points = [];
          for (let j = 0; j <= 48; j++) {
            const angle = (j / 48) * Math.PI * 2;
            const x = tunnelRadius * Math.cos(angle);
            const y = tunnelRadius * Math.sin(angle);
            points.push(new THREE.Vector3(x, y, z));
          }

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.3,
          });
          const line = new THREE.Line(geometry, material);
          wireGroup.add(line);
        }

        group.add(wireGroup);

        // Position images in rings
        for (let ring = 0; ring < rings; ring++) {
          const ringGroup = new THREE.Group();
          const ringZ = (ring - rings / 2) * 30;

          const startIndex = ring * Math.ceil(textures.length / rings);
          const endIndex = Math.min(
            startIndex + Math.ceil(textures.length / rings),
            textures.length
          );
          const ringImages = textures.slice(startIndex, endIndex);

          ringImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 8;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.9,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (index / ringImages.length) * Math.PI * 2;
              const radius = tunnelRadius - ring * 3; // Decreasing radius for tunnel effect

              sprite.position.set(
                radius * Math.cos(angle),
                radius * Math.sin(angle),
                ringZ
              );

              ringGroup.add(sprite);
            }
          });

          group.add(ringGroup);
        }

        return group;
      }

      // Create other views with simplified but recognizable structures
      function createOpenQuestionView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["open-question"].x,
          viewPositions["open-question"].y,
          viewPositions["open-question"].z
        );

        // Layered circular arrangement
        const layers = 5;
        const imagesPerLayer = Math.ceil(textures.length / layers);

        for (let layer = 0; layer < layers; layer++) {
          const layerGroup = new THREE.Group();
          const layerRadius = 40 + layer * 20;
          const layerHeight = layer * 25;

          const startIndex = layer * imagesPerLayer;
          const endIndex = Math.min(
            startIndex + imagesPerLayer,
            textures.length
          );
          const layerImages = textures.slice(startIndex, endIndex);

          layerImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 10;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.8,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (index / layerImages.length) * Math.PI * 2;
              sprite.position.set(
                layerRadius * Math.cos(angle),
                layerHeight,
                layerRadius * Math.sin(angle)
              );

              layerGroup.add(sprite);
            }
          });

          group.add(layerGroup);
        }

        return group;
      }

      function createHashtagGalleryView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions["hashtag-gallery"].x,
          viewPositions["hashtag-gallery"].y,
          viewPositions["hashtag-gallery"].z
        );

        // Curved wall arrangement
        const wallRadius = 80;
        const imagesPerRow = 10;
        const rows = Math.ceil(textures.length / imagesPerRow);

        for (let row = 0; row < rows; row++) {
          const rowGroup = new THREE.Group();
          const rowHeight = (row - rows / 2) * 20;

          const startIndex = row * imagesPerRow;
          const endIndex = Math.min(startIndex + imagesPerRow, textures.length);
          const rowImages = textures.slice(startIndex, endIndex);

          rowImages.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 12;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 1,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              const angle = (index / rowImages.length) * Math.PI * 1.5; // Curved wall
              sprite.position.set(
                wallRadius * Math.cos(angle),
                rowHeight,
                wallRadius * Math.sin(angle)
              );

              rowGroup.add(sprite);
            }
          });

          group.add(rowGroup);
        }

        return group;
      }

      function createCompletenessView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.completeness.x,
          viewPositions.completeness.y,
          viewPositions.completeness.z
        );

        // Score-based arrangement
        const scoreGroups = {
          high: textures.slice(0, Math.floor(textures.length / 3)),
          medium: textures.slice(
            Math.floor(textures.length / 3),
            Math.floor((2 * textures.length) / 3)
          ),
          low: textures.slice(Math.floor((2 * textures.length) / 3)),
        };

        const groupPositions = {
          high: { x: 0, y: 80, z: 0 },
          medium: { x: 0, y: 0, z: 0 },
          low: { x: 0, y: -80, z: 0 },
        };

        Object.entries(scoreGroups).forEach(([scoreLevel, images]) => {
          const scoreGroup = new THREE.Group();
          const pos = groupPositions[scoreLevel];
          scoreGroup.position.set(pos.x, pos.y, pos.z);

          images.forEach((textureData, index) => {
            if (textureData.texture) {
              const aspectRatio =
                textureData.texture.image.width /
                textureData.texture.image.height;
              const width = 10;
              const height = width / aspectRatio;

              const material = new THREE.SpriteMaterial({
                map: textureData.texture,
                transparent: true,
                opacity: 0.8,
              });
              const sprite = new THREE.Sprite(material);
              sprite.scale.set(width, height, 1);

              // Grid layout
              const gridCols = Math.ceil(Math.sqrt(images.length));
              const gridRows = Math.ceil(images.length / gridCols);
              const spacing = 15;

              const row = Math.floor(index / gridCols);
              const col = index % gridCols;

              sprite.position.set(
                (col - gridCols / 2) * spacing,
                (row - gridRows / 2) * spacing,
                0
              );

              scoreGroup.add(sprite);
            }
          });

          group.add(scoreGroup);
        });

        return group;
      }

      function createTemperamentView(textures) {
        const group = new THREE.Group();
        group.position.set(
          viewPositions.temperament.x,
          viewPositions.temperament.y,
          viewPositions.temperament.z
        );

        // Spiral arrangement
        const spiralTurns = 6;
        const spiralRadius = 50;
        const spiralHeight = 200;

        textures.forEach((textureData, index) => {
          if (textureData.texture) {
            const aspectRatio =
              textureData.texture.image.width /
              textureData.texture.image.height;
            const width = 10;
            const height = width / aspectRatio;

            const material = new THREE.SpriteMaterial({
              map: textureData.texture,
              transparent: true,
              opacity: 0.8,
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(width, height, 1);

            const progress = index / textures.length;
            const angle = progress * Math.PI * 2 * spiralTurns;
            const radius = spiralRadius * (1 - progress * 0.5); // Decreasing radius
            const spiralZ = (progress - 0.5) * spiralHeight;

            sprite.position.set(
              radius * Math.cos(angle),
              spiralZ,
              radius * Math.sin(angle)
            );

            group.add(sprite);
          }
        });

        return group;
      }

      // Create particle system
      function createParticleSystem() {
        const particleCount = 1000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const radius = 800 + Math.random() * 500;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = radius * Math.cos(phi);

          colors[i * 3] = 0.5 + Math.random() * 0.5;
          colors[i * 3 + 1] = 0.5 + Math.random() * 0.5;
          colors[i * 3 + 2] = 0.5 + Math.random() * 0.5;
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 3,
          vertexColors: true,
          transparent: true,
          opacity: 0.6,
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);
      }

      // Initialize the scene
      async function init() {
        console.log("Starting initialization...");

        // Load artistic data first
        await loadArtisticData();

        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          3000
        );
        camera.position.set(0, 0, 1000);

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Add controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 100;
        controls.maxDistance = 2000;
        controls.target.set(0, 0, 0);
        controls.update();

        // Add light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // Load images
        console.log("Loading images...");
        const textures = await loadImages();
        console.log(`Loaded ${textures.length} textures`);

        // Create particle system
        createParticleSystem();

        // Create all views with accurate structures
        console.log("Creating views...");
        viewGroups.rhizome = createRhizomeView(textures);
        viewGroups.artist = createArtistView(textures);
        viewGroups["open-question"] = createOpenQuestionView(textures);
        viewGroups["hashtag-gallery"] = createHashtagGalleryView(textures);
        viewGroups.completeness = createCompletenessView(textures);
        viewGroups.intimacy = createIntimacyView(textures);
        viewGroups.temperament = createTemperamentView(textures);

        // Add all groups to scene
        Object.values(viewGroups).forEach((group) => scene.add(group));

        // Setup navigation
        setupNavigation();

        console.log("Initialization complete!");
      }

      // Setup navigation
      function setupNavigation() {
        const viewLabels = document.querySelectorAll(".view-label");

        viewLabels.forEach((label) => {
          label.addEventListener("click", () => {
            const viewName = label.dataset.view;
            navigateToView(viewName);

            viewLabels.forEach((l) => l.classList.remove("active"));
            label.classList.add("active");
          });
        });
      }

      // Navigate to view
      function navigateToView(viewName) {
        if (viewPositions[viewName]) {
          const pos = viewPositions[viewName];
          camera.position.set(pos.x, pos.y, pos.z + 200);
          controls.target.set(pos.x, pos.y, pos.z);
          currentView = viewName;
          document.getElementById("current-view").textContent =
            viewName.charAt(0).toUpperCase() +
            viewName.slice(1).replace("-", " ");
        }
        controls.update();
      }

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const time = Date.now() * 0.001;

          for (let i = 0; i < positions.length; i += 3) {
            positions[i] += Math.sin(time + i) * 0.1;
            positions[i + 1] += Math.cos(time + i) * 0.1;
            positions[i + 2] += Math.sin(time * 0.5 + i) * 0.1;
          }

          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Animate view groups with gentle rotation
        Object.values(viewGroups).forEach((group, index) => {
          group.rotation.y += 0.0005 + index * 0.0002;
          group.rotation.x += 0.0002 + index * 0.0001;
        });

        // Update camera info
        const cameraPos = camera.position;
        document.getElementById("camera-pos").textContent = `${Math.round(
          cameraPos.x
        )}, ${Math.round(cameraPos.y)}, ${Math.round(cameraPos.z)}`;

        controls.update();
        renderer.render(scene, camera);
      }

      // Handle window resize
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      // Start the visualization
      async function startVisualization() {
        try {
          console.log("Starting visualization...");
          await init();

          // Hide loading screen
          document.getElementById("loading-container").style.display = "none";

          // Start animation
          animate();

          // Setup resize handler
          window.addEventListener("resize", onWindowResize, false);

          console.log("Visualization started successfully!");
        } catch (error) {
          console.error("Error starting visualization:", error);
          const loadingText = document.getElementById("loading-text");
          if (loadingText) {
            loadingText.textContent = "ERROR: Failed to load. Please refresh.";
            loadingText.style.color = "#ff4444";
          }
        }
      }

      // Start when page loads
      window.addEventListener("load", startVisualization);
    </script>
  </body>
</html>
