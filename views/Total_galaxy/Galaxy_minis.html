<!DOCTYPE html>
<html>
  <head>
    <title>Base Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }
      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="black-overlay"></div>
    <div
      id="loading-container"
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      "
    >
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING... 0%
      </div>
    </div>
    <div id="visualization"></div>
    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;
      let intimacyTunnel, intimacyParticles, intimacyImages;

      function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set black background immediately

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create miniature intimacy tunnel
        createIntimacyTunnel();

        // Create particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 100;

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        
                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        
                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        
                        // Apply vignette
                        color.rgb *= vignette;
                        
                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);
      }

      function createIntimacyTunnel() {
        // Create a miniature looping tunnel curve
        const tunnelCurve = new THREE.CatmullRomCurve3(
          Array.from({ length: 100 }, (_, i) => {
            const t = i / 99;
            const angle = t * Math.PI * 2; // Full circle
            const radius = 15; // Smaller radius for miniature
            const height = 8; // Add some height variation
            return new THREE.Vector3(
              Math.sin(angle) * radius,
              Math.sin(angle * 2) * height, // Wavy height
              Math.cos(angle) * radius
            );
          })
        );

        // Create wire grid for the tunnel
        const wireGroup = new THREE.Group();
        const numVerticalLines = 12; // Fewer lines for miniature
        const numHorizontalRings = 20;
        const numCurveSamples = 50;
        const numRingSegments = 12;
        const tunnelRadius = 3; // Smaller tunnel radius

        // Precompute Frenet frames along the curve
        const tunnelFrenetFrames = tunnelCurve.computeFrenetFrames(
          numCurveSamples,
          false
        );

        // Vertical lines (meridians)
        for (let v = 0; v < numVerticalLines; v++) {
          const angle = (v / numVerticalLines) * Math.PI * 2;
          const points = [];
          for (let i = 0; i < numCurveSamples; i++) {
            const t = i / (numCurveSamples - 1);
            const center = tunnelCurve.getPoint(t);
            const normal = tunnelFrenetFrames.normals[i];
            const binormal = tunnelFrenetFrames.binormals[i];
            const x = Math.cos(angle) * tunnelRadius;
            const y = Math.sin(angle) * tunnelRadius;
            const pos = center
              .clone()
              .add(normal.clone().multiplyScalar(x))
              .add(binormal.clone().multiplyScalar(y));
            points.push(pos);
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            depthWrite: false,
          });
          const line = new THREE.Line(geometry, material);
          wireGroup.add(line);
        }

        // Horizontal rings (latitudes)
        for (let i = 0; i < numHorizontalRings; i++) {
          const t = i / (numHorizontalRings - 1);
          const center = tunnelCurve.getPoint(t);
          const tangent = tunnelCurve.getTangent(t).clone().normalize();
          let up = new THREE.Vector3(0, 1, 0);
          if (Math.abs(tangent.dot(up)) > 0.99) up = new THREE.Vector3(1, 0, 0);
          const binormal = new THREE.Vector3()
            .crossVectors(tangent, up)
            .normalize();

          const ringPoints = [];
          for (let j = 0; j <= numRingSegments; j++) {
            const angle = (j / numRingSegments) * Math.PI * 2;
            const x = Math.cos(angle) * tunnelRadius;
            const y = Math.sin(angle) * tunnelRadius;
            const pos = center
              .clone()
              .add(up.clone().multiplyScalar(x))
              .add(binormal.clone().multiplyScalar(y));
            ringPoints.push(pos);
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(ringPoints);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            depthWrite: false,
          });
          const line = new THREE.Line(geometry, material);
          wireGroup.add(line);
        }

        intimacyTunnel = wireGroup;
        scene.add(intimacyTunnel);

        // Create particles around the tunnel
        const tunnelParticleCount = 150;
        const tunnelParticleGeometry = new THREE.BufferGeometry();
        const tunnelParticlePositions = new Float32Array(
          tunnelParticleCount * 3
        );
        const tunnelParticleColors = new Float32Array(tunnelParticleCount * 3);
        const tunnelParticleSpeeds = new Float32Array(tunnelParticleCount);

        for (let i = 0; i < tunnelParticleCount; i++) {
          const t = Math.random();
          const center = tunnelCurve.getPoint(t);
          const normal =
            tunnelFrenetFrames.normals[Math.floor(t * (numCurveSamples - 1))];
          const binormal =
            tunnelFrenetFrames.binormals[Math.floor(t * (numCurveSamples - 1))];

          // Place particles around the tunnel
          const angle = Math.random() * Math.PI * 2;
          const radius = tunnelRadius + 2 + Math.random() * 8;
          const offset = normal
            .clone()
            .multiplyScalar(Math.cos(angle) * radius)
            .add(binormal.clone().multiplyScalar(Math.sin(angle) * radius));

          const pos = center.clone().add(offset);
          tunnelParticlePositions[i * 3] = pos.x;
          tunnelParticlePositions[i * 3 + 1] = pos.y;
          tunnelParticlePositions[i * 3 + 2] = pos.z;

          // Color gradient from cyan to purple to red
          const cyan = new THREE.Color(0x00ffff);
          const purple = new THREE.Color(0x8000ff);
          const red = new THREE.Color(0xff0000);
          let color;
          if (t < 0.5) {
            color = new THREE.Color().lerpColors(cyan, purple, t * 2);
          } else {
            color = new THREE.Color().lerpColors(purple, red, (t - 0.5) * 2);
          }

          tunnelParticleColors[i * 3] = color.r;
          tunnelParticleColors[i * 3 + 1] = color.g;
          tunnelParticleColors[i * 3 + 2] = color.b;

          tunnelParticleSpeeds[i] = 0.001 + Math.random() * 0.002;
        }

        tunnelParticleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(tunnelParticlePositions, 3)
        );
        tunnelParticleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(tunnelParticleColors, 3)
        );

        const tunnelParticleMaterial = new THREE.PointsMaterial({
          size: 0.3,
          vertexColors: true,
          transparent: true,
          opacity: 0.7,
          sizeAttenuation: true,
        });

        intimacyParticles = new THREE.Points(
          tunnelParticleGeometry,
          tunnelParticleMaterial
        );
        intimacyParticles.userData = {
          speeds: tunnelParticleSpeeds,
          curve: tunnelCurve,
          frenetFrames: tunnelFrenetFrames,
        };
        scene.add(intimacyParticles);

        // Create miniature images scattered throughout the tunnel
        createIntimacyImages(tunnelCurve, tunnelFrenetFrames, tunnelRadius);
      }

      function createIntimacyImages(
        tunnelCurve,
        tunnelFrenetFrames,
        tunnelRadius
      ) {
        intimacyImages = new THREE.Group();
        const numImages = 12; // Fewer images for miniature
        const imageRingRadius = tunnelRadius + 4;

        // Load a few sample images
        const textureLoader = new THREE.TextureLoader();
        const imageUrls = [
          "../../images/image1.jpg",
          "../../images/image2.jpg",
          "../../images/image3.jpg",
          "../../images/image4.jpg",
          "../../images/image5.jpg",
          "../../images/image6.jpg",
        ];

        for (let i = 0; i < numImages; i++) {
          const t = i / numImages;
          const center = tunnelCurve.getPoint(t);
          const normal =
            tunnelFrenetFrames.normals[
              Math.floor(t * (tunnelFrenetFrames.normals.length - 1))
            ];
          const binormal =
            tunnelFrenetFrames.binormals[
              Math.floor(t * (tunnelFrenetFrames.binormals.length - 1))
            ];

          const angle = (i / numImages) * Math.PI * 2;
          const x = Math.cos(angle) * imageRingRadius;
          const y = Math.sin(angle) * imageRingRadius;

          // Create a small plane for the image
          const geometry = new THREE.PlaneGeometry(2, 2);
          const material = new THREE.MeshBasicMaterial({
            color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6),
            transparent: true,
            opacity: 0.8,
          });

          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.copy(center);
          mesh.position.add(normal.clone().multiplyScalar(x));
          mesh.position.add(binormal.clone().multiplyScalar(y));

          // Store original position for animation
          mesh.userData = {
            originalPosition: mesh.position.clone(),
            jitterSeed: Math.random() * 1000,
            jitterSpeed: 0.5 + Math.random() * 1.0,
            jitterAmplitude: 0.5 + Math.random() * 1.0,
          };

          intimacyImages.add(mesh);
        }

        scene.add(intimacyImages);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        // Animate intimacy tunnel particles
        if (intimacyParticles && intimacyParticles.userData.curve) {
          const positions =
            intimacyParticles.geometry.attributes.position.array;
          const speeds = intimacyParticles.userData.speeds;
          const curve = intimacyParticles.userData.curve;
          const frenetFrames = intimacyParticles.userData.frenetFrames;

          for (let i = 0; i < positions.length; i += 3) {
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            // Move particles along the curve
            const t = time % 1;
            const center = curve.getPoint(t);
            const normal =
              frenetFrames.normals[
                Math.floor(t * (frenetFrames.normals.length - 1))
              ];
            const binormal =
              frenetFrames.binormals[
                Math.floor(t * (frenetFrames.binormals.length - 1))
              ];

            const angle = time * 2;
            const radius = 5 + Math.sin(time * 3) * 2;
            const offset = normal
              .clone()
              .multiplyScalar(Math.cos(angle) * radius)
              .add(binormal.clone().multiplyScalar(Math.sin(angle) * radius));

            positions[i] = center.x + offset.x;
            positions[i + 1] = center.y + offset.y;
            positions[i + 2] = center.z + offset.z;
          }

          intimacyParticles.geometry.attributes.position.needsUpdate = true;
        }

        // Animate intimacy images
        if (intimacyImages) {
          const time = Date.now() * 0.001;
          intimacyImages.children.forEach((mesh) => {
            if (mesh.userData && mesh.userData.jitterSpeed) {
              const speed = mesh.userData.jitterSpeed;
              const amplitude = mesh.userData.jitterAmplitude;
              const seed = mesh.userData.jitterSeed;

              const jitterX = Math.sin(time * speed + seed) * amplitude * 0.1;
              const jitterY =
                Math.cos(time * speed * 0.8 + seed) * amplitude * 0.1;
              const jitterZ =
                Math.sin(time * speed * 0.6 + seed) * amplitude * 0.05;

              mesh.position.set(
                mesh.userData.originalPosition.x + jitterX,
                mesh.userData.originalPosition.y + jitterY,
                mesh.userData.originalPosition.z + jitterZ
              );

              // Make images face the camera
              mesh.lookAt(camera.position);
            }
          });
        }

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        controls.update();
        composer.render();
      }

      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
        }
      }

      // Initialize the visualization
      function startVisualization() {
        // Ensure loading page is visible
        document.getElementById("loading-container").style.display = "block";
        document.getElementById("black-overlay").style.display = "block";
        document.getElementById("black-overlay").style.opacity = "1";
        document.getElementById("visualization").style.display = "none";

        // Simulate loading progress
        let progress = 0;
        const loadingInterval = setInterval(() => {
          progress += 2;
          updateLoadingUI(progress);

          if (progress >= 100) {
            clearInterval(loadingInterval);

            // Initialize the scene
            init();

            // Hide loading page and show visualization
            document.getElementById("loading-container").style.display = "none";
            document.getElementById("visualization").style.display = "block";
            document.getElementById("black-overlay").style.opacity = "0";
            setTimeout(() => {
              document.getElementById("black-overlay").style.display = "none";
            }, 500);

            // Start animation
            animate();
          }
        }, 50);
      }

      // Start the visualization when the page loads
      window.addEventListener("load", startVisualization);
    </script>
  </body>
</html>
