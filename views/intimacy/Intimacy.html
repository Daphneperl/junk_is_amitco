        );
        ring3.rotation.y = Math.PI / 2;
        ring3.position.z = -1;
        ring3.add(group3a);
        ring3.add(group3b);

        ringsGroup.add(ring1);
        ringsGroup.add(ring2);
        ringsGroup.add(ring3);
        return ringsGroup;
      }

      function initRings() {
        // Create separate scene for rings
        ringsScene = new THREE.Scene();
        ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
        ringsCamera.position.z = 20;

        // Create separate renderer for rings
        ringsRenderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          logarithmicDepthBuffer: true,
          preserveDrawingBuffer: true,
        });
        ringsRenderer.setSize(500, 500);
        ringsRenderer.setClearColor(0x000000, 0);
        ringsRenderer.sortObjects = false; // Disable automatic sorting
        document
          .getElementById("rings-container")
          .appendChild(ringsRenderer.domElement);

        // Create and add rings
        rings = createRings();
        ringsScene.add(rings);

        // Add event listeners for rings rotation
        ringsRenderer.domElement.addEventListener(
          "mousedown",
          onRingsMouseDown
        );
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseMove
        );
        ringsRenderer.domElement.addEventListener("mouseup", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("mouseleave", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("click", onRingsClick);
        ringsRaycaster = new THREE.Raycaster();
        ringsMouse = new THREE.Vector2();
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseHover
        );
      }

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              window.location.href = "../temperament/temperament.html";
              break;
            case "eye-secret":
              window.location.href = "../hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              // Already on intimacy page
              break;
            case "eye-completeness":
              window.location.href = "../Completeness/Completeness.html";
              break;
            case "eye-artist":
              window.location.href = "../Artists/Artist.html";
              break;
            case "eye-rhizome":
              window.location.href = "../rhizome/rhizome.html";
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function updateTunnelWireOpacity() {
        if (!tunnelWire) return;

        const minOpacity = 0.01;
        const maxOpacity = 1.0;
        const fadeStart = 200;
        const fadeEnd = 1200;

        tunnelWire.children.forEach((line) => {
          if (line.userData && line.userData.type === "vertical") {
            // Per-vertex alpha for vertical lines
            const geometry = line.userData.geometry;
            const alphas = line.userData.alphas;
            const positions = geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
              const x = positions.getX(i);
              const y = positions.getY(i);
              const z = positions.getZ(i);
              const pos = new THREE.Vector3(x, y, z);
              const dist = camera.position.distanceTo(pos);
              let opacity = maxOpacity;
              if (dist > fadeStart) {
                opacity =
                  maxOpacity -
                  (maxOpacity - minOpacity) *
                    ((dist - fadeStart) / (fadeEnd - fadeStart));
              }
              opacity = Math.max(minOpacity, Math.min(maxOpacity, opacity));
              alphas[i] = opacity; // direct value for shader
            }
            geometry.attributes.alpha.needsUpdate = true;
          } else if (
            line.userData &&
            line.userData.type === "horizontal" &&
            line.material
          ) {
            // Horizontal rings: single opacity for whole ring
            let totalDistance = 0;
            const points = line.userData.points;
            for (let i = 0; i < points.length; i++) {
              totalDistance += camera.position.distanceTo(points[i]);
            }
            const avgDistance = totalDistance / points.length;
            let opacity = maxOpacity;
            if (avgDistance > fadeStart) {
              opacity =
                maxOpacity -
                (maxOpacity - minOpacity) *
                  ((avgDistance - fadeStart) / (fadeEnd - fadeStart));
            }
            opacity = Math.max(minOpacity, Math.min(maxOpacity, opacity));
            line.material.opacity = opacity;
          }
        });
      }

      // 7. Animate: smooth camera movement with mouse scroll
      // Camera movement along the curve
      let cameraT = 0; // 0=start, 1=end
      const minCameraT = 0;
      const maxCameraT = 1;
      const scrollSpeedT = 0.0001; // Adjust for faster/slower scroll

      function animate() {
        requestAnimationFrame(animate);

        // Animate square particles
        if (squareParticleGroup && tunnelFrenetFrames) {
          const numCurveSamples = tunnelFrenetFrames.normals.length;
          squareParticleGroup.children.forEach((square, idx) => {
            if (square.userData && square.userData.speed) {
              const t = square.userData.t;
              const curveIdx = Math.floor(t * (numCurveSamples - 1));
              const center = tunnelCurve.getPoint(t);
              const normal = tunnelFrenetFrames.normals[curveIdx];
              const binormal = tunnelFrenetFrames.binormals[curveIdx];
              // Animate angle
              const time = Date.now() * 0.001 * square.userData.speed;
              const newAngle = square.userData.angle + time;
              const offset = normal
                .clone()
                .multiplyScalar(Math.cos(newAngle) * square.userData.radius)
                .add(
                  binormal
                    .clone()
                    .multiplyScalar(Math.sin(newAngle) * square.userData.radius)
                );
              // Add jitter: small, smooth, unique per particle
              const jitterTime = Date.now() * 0.002;
              const jitterAmount = 7.0; // max jitter in units (increased for larger effect)
              const jitterX = Math.sin(jitterTime + idx) * jitterAmount;
              const jitterY = Math.cos(jitterTime + idx * 1.7) * jitterAmount;
              // Jitter in the normal/binormal plane
              const jitterOffset = normal
                .clone()
                .multiplyScalar(jitterX)
                .add(binormal.clone().multiplyScalar(jitterY));
              square.position.copy(
                center.clone().add(offset).add(jitterOffset)
              );
              // Always face the camera
              square.lookAt(camera.position);
            }
          });
        }

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;
          }

          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Animate image jitter - slow and organic
        const time = Date.now() * 0.001; // Faster overall time factor
        visibleMeshes.forEach((mesh) => {
          if (mesh.userData && mesh.userData.jitterSpeed) {
            const speed = mesh.userData.jitterSpeed;
            const amplitude = mesh.userData.jitterAmplitude;
            const phase = mesh.userData.jitterPhase;
            const seed = mesh.userData.jitterSeed;

            // Create organic jitter using multiple sine waves with different frequencies
            const jitterX =
              Math.sin(time * speed + phase) * amplitude * 0.3 +
              Math.sin(time * speed * 0.7 + seed) * amplitude * 0.2 +
              Math.sin(time * speed * 0.3 + phase * 2) * amplitude * 0.1;

            const jitterY =
              Math.cos(time * speed * 0.8 + phase) * amplitude * 0.3 +
              Math.cos(time * speed * 0.5 + seed) * amplitude * 0.2 +
              Math.cos(time * speed * 0.2 + phase * 3) * amplitude * 0.1;

            const jitterZ =
              Math.sin(time * speed * 0.6 + seed) * amplitude * 0.1 +
              Math.cos(time * speed * 0.4 + phase) * amplitude * 0.05;

            // Apply jitter to original position
            mesh.position.set(
              mesh.userData.originalX + jitterX,
              mesh.userData.originalY + jitterY,
              mesh.userData.originalZ + jitterZ
            );

            // Add subtle rotation jitter
            const rotationJitter = Math.sin(time * speed * 0.3 + seed) * 0.02;
            mesh.rotation.z = rotationJitter;
          }
        });

        // Camera follows the curve
        const camPos = tunnelCurve.getPoint(cameraT);
        // Opacity gradient update using 3D distance
        const minOpacity = 0.01;
        const maxOpacity = 1.0;
        const fadeStart = 200;
        const fadeEnd = 1200;
        ringObjects.forEach(({ center, titleSprite, imageMeshes }) => {
          const dist = camPos.distanceTo(center);
          let opacity = maxOpacity;
          if (dist > fadeStart) {
            opacity =
              maxOpacity -
              (maxOpacity - minOpacity) *
                ((dist - fadeStart) / (fadeEnd - fadeStart));
          }
          opacity = Math.max(minOpacity, Math.min(maxOpacity, opacity));
          if (titleSprite && titleSprite.material) {
            titleSprite.material.opacity = opacity;
          }
          imageMeshes.forEach((mesh) => {
            if (mesh.material) mesh.material.opacity = opacity;
          });
        });

        camera.position.copy(camPos);
        camera.up.set(0, 1, 0);
        const camTangent = tunnelCurve.getTangent(cameraT);
        camera.lookAt(camPos.clone().add(camTangent));

        // Update tunnel wire opacity based on distance from camera
        updateTunnelWireOpacity();
        // --- DYNAMICALLY ORIENT RINGS TO FACE CAMERA ---
        scene.traverse((obj) => {
          if (obj.type === "Group" && obj.userData.stationIdx !== undefined) {
            obj.up.set(0, 1, 0);
            obj.lookAt(camera.position);
          }
        });

        // Update floating eye
        updateFloatingEye();

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005;
          rings.rotation.y += 0.0008;
        }

        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);

        // Update station labels
        visibleLabels.forEach(({ label, z, labelY }) => {
          // Place label at (0, labelY, z) - moved up
          const pos = new THREE.Vector3(0, labelY + imageRingRadius * 0.2, z);
          const vector = pos.clone().project(camera);
          const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
          // Calculate distance-based font size
          const distance = Math.abs(currentZ - z);
          const baseFontSize = 24;
          const maxDistance = tunnelLength;
          const fontSize = Math.max(
            12,
            baseFontSize * (1 - distance / maxDistance)
          );

          label.style.left = `${x}px`;
          label.style.top = `${y}px`;
          label.style.transform = "translateX(-50%)"; // Center horizontally
          label.style.textAlign = "center";
          label.style.fontSize = `${fontSize}px`;
          label.style.display =
            vector.z > 1 || vector.z < -1 ? "none" : "block";
        });
      }

      // 8. Mouse wheel navigation: update cameraT
      document.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          cameraT -= e.deltaY * scrollSpeedT;
          cameraT = Math.max(minCameraT, Math.min(maxCameraT, cameraT));
        },
        { passive: false }
      );

      // Organic Floating Eye Animation
      let eyeX = 100;
      let eyeY = 100;
      let eyeTargetX = 100;
      let eyeTargetY = 100;
      let eyeSpeed = 0.008; // Much slower movement
      let lastEyeMoveTime = 0;
      let eyeMoveInterval = 8000; // Longer intervals between movements
      let eyeIsHovered = false;
      let eyeDriftX = 0;
      let eyeDriftY = 0;
      let eyeDriftSpeed = 0.001; // Very slow drift
      let eyeDriftAmplitude = 15; // Small drift amplitude

      function initFloatingEye() {
        console.log("Initializing floating eye...");
        const eye = document.getElementById("floating-eye");
        const tooltip = document.getElementById("eye-tooltip");

        console.log("Eye element:", eye);
        console.log("Tooltip element:", tooltip);

        if (!eye || !tooltip) {
          console.error("Missing elements!");
          return;
        }

        // Set up hover events
        eye.addEventListener("mouseenter", () => {
          console.log("Eye hovered!");
          eyeIsHovered = true;
          tooltip.classList.add("show");
        });

        eye.addEventListener("mouseleave", () => {
          console.log("Eye unhovered!");
          eyeIsHovered = false;
          tooltip.classList.remove("show");
        });

        // Update tooltip position
        eye.addEventListener("mousemove", (e) => {
          const rect = eye.getBoundingClientRect();
          const eyeCenterX = rect.left + rect.width / 2;
          const screenCenterX = window.innerWidth / 2;

          // Determine if eye is on left or right side of screen
          if (eyeCenterX < screenCenterX) {
            // Eye is on left side - show tooltip on the right
            tooltip.style.left = rect.right + 10 + "px";
            tooltip.style.transform = "translateX(0)"; // Reset transform
          } else {
            // Eye is on right side - show tooltip on the left
            tooltip.style.left = rect.left - 10 + "px";
            tooltip.style.transform = "translateX(-100%)"; // Move tooltip to the left of the eye
          }

          tooltip.style.top = rect.top - 10 + "px";
        });

        // Set initial position
        eye.style.left = eyeX + "px";
        eye.style.top = eyeY + "px";

        // Show the floating eye after initialization
        eye.style.display = "block";

        console.log("Eye positioned at:", eyeX, eyeY);
        console.log("Eye should be visible now!");
      }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      // macOS Dock-like functionality
      function initDockBehavior() {
        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px)

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");

        // Show pixel arrow indicator initially since dock is hidden
        if (pixelArrowIndicator) {
          pixelArrowIndicator.classList.add("show");
        }

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;
            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior
        document.addEventListener("mousemove", (e) => {
          const mouseY = e.clientY;
          const windowHeight = window.innerHeight;
          const isInHoverZone = mouseY > windowHeight - hoverZoneHeight;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isInHoverZone) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });
      }

      function submitAnswer() {
        const question = questions[chatbotState.currentQuestion];
        const questionInput = document.getElementById("question-input");

          case "file":

              alert("Please select a file");
              return;

          case "slider":

            answer = slider ? `${slider.value}%` : "50%";

          case "tags":
            const selectedTags =
              questionInput.querySelectorAll(".tag.selected");
            const customTag = questionInput.querySelector("#custom-tag-input")
              ? questionInput.querySelector("#custom-tag-input").value.trim()
              : "";
            const tagTexts = Array.from(selectedTags).map((tag) =>
              tag.textContent.replace(" ×", "")
            );
            if (customTag) tagTexts.push(customTag);
            answer = tagTexts.join(", ");
            break;
        }

        // Store answer (even if empty)
        chatbotState.answers[question.id] = answer;

        // Show user's answer only if not empty
        if (answer) {
          addUserMessage(answer);
        } else {
          addUserMessage("Skipped");

        // Remove input and disable persistent input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"

        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        const uploadMessage = document.querySelector(
          ".message .file-upload-area"
        );
        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

      function goBack() {
        // Remove current input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        // Remove the last user message
        const messagesContainer = document.getElementById("chatbot-messages");
        const lastUserMessage = messagesContainer.querySelector(
          ".message.user:last-child"
        );
        if (lastUserMessage) lastUserMessage.remove();

        // Remove upload area from messages if it exists
        const uploadMessage = document.querySelector(
          ".message .file-upload-area"
        );
        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Go back to previous question
        chatbotState.currentQuestion--;

        // Ask the previous question again
        setTimeout(() => {
          askNextQuestion();
        }, 500);
      }

      function showSummary() {
        addBotMessage("Here's what you gave me. Ready to launch the junk?");

        const messagesContainer = document.getElementById("chatbot-messages");
        const summaryDiv = document.createElement("div");
        summaryDiv.className = "message bot";
        summaryDiv.innerHTML = `
                <div class="summary-screen">
                    ${Object.entries(chatbotState.answers)
                      .map(([key, value]) => {
                        if (!value) return "";
                        const question = questions.find((q) => q.id === key);
                        return `
                            <div class="summary-item">
                                <span class="summary-label">${
                                  question
                                    ? question.message.split("?")[0] + "?"
                                    : key
                                }:</span>
                                <span class="summary-value">${value}</span>
                            </div>
                        `;
                      })
                      .join("")}
                </div>
            `;
        messagesContainer.appendChild(summaryDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Add launch button to dynamic container
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        const launchDiv = document.createElement("div");
        launchDiv.innerHTML = `
                <div class="button-group" style="margin-top: 20px;">
                    <button class="btn primary" id="launch-btn">Launch the junk</button>
                </div>
            `;
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "block";
        dynamicContainer.appendChild(launchDiv);
        disablePersistentInput();

        // Setup launch button handler
        const launchBtn = launchDiv.querySelector("#launch-btn");
        if (launchBtn) {
          launchBtn.addEventListener("click", launchJunk);
        }
      }

      function launchJunk() {
        // Log the form data (in a real app, you'd send this to a server)
        console.log("Junk launched:", chatbotState.answers);

        // Show success message
        addBotMessage(
          "Junk launched! (This is a demo - no actual upload occurred)"
        );

        // Close chatbot after a delay
        setTimeout(() => {
          closeChatbot();
        }, 3000);
      }

      function removeFile(event) {
        event.stopPropagation();
        const fileInput = document.querySelector("#file-input");
        const fileText = document.querySelector("#file-upload-text");
        const uploadIcon = document.querySelector("#upload-icon");
        const fileArea = document.querySelector("#file-upload-area");

        if (fileInput && fileText && uploadIcon && fileArea) {
          fileInput.value = "";
          fileText.innerHTML = "Drag & drop your file here or click to browse";

          // Remove image preview if exists
          const uploadedImage = fileArea.querySelector(".uploaded-image");
          if (uploadedImage) {
            uploadedImage.remove();
          }

          // Show upload icon again
          uploadIcon.style.display = "block";

          // Disable continue button
          const continueBtn = document.querySelector("#continue-btn");
          if (continueBtn) {
            continueBtn.disabled = true;
            continueBtn.style.opacity = "0.5";
            continueBtn.style.cursor = "not-allowed";
            continueBtn.classList.remove("primary");
          }
        }
      }

      // Search functionality
      function performSearch(query) {
        console.log("Searching for:", query);
        // For now, just log the search query
        alert(`Searching for: ${query}`);
      }

      // Search bar event listeners
      document.addEventListener("DOMContentLoaded", function () {
        const searchBar = document.getElementById("search-bar");
        let searchTimeout;

        searchBar.addEventListener("input", (event) => {
          const query = event.target.value.trim();

          // Clear previous timeout
          if (searchTimeout) {
            clearTimeout(searchTimeout);
          }

          // Set new timeout for search (debounce)
          if (query.length > 0) {
            searchTimeout = setTimeout(() => {
              performSearch(query);
            }, 500); // Wait 500ms after user stops typing
          }
        });

        searchBar.addEventListener("keypress", (event) => {
          if (event.key === "Enter") {
            const query = event.target.value.trim();
            if (query.length > 0) {
              // Clear timeout and perform search immediately
              if (searchTimeout) {
                clearTimeout(searchTimeout);
              }
              performSearch(query);
            }
          }
        });

        // Add click event listener to upload button
        const uploadBtn = document.getElementById("upload-hand-btn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", showChatbot);

          // Add hover functionality for hand image
          const handImg = document.getElementById("upload-hand-btn-img");
          if (handImg) {
            uploadBtn.addEventListener("mouseenter", () => {
              handImg.src = "../../assets/ClosedHand.png";
            });

            uploadBtn.addEventListener("mouseleave", () => {
              handImg.src = "../../assets/OpenHand.png";
            });
          }
        }

        // Close chatbot with Escape key
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeChatbot();
          }
        });

        // Close chatbot when clicking on backdrop
        const backdrop = document.getElementById("chatbot-backdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) {
              closeChatbot();
            }
          });
        }
      });

      // Drawer Modal Functions
      let raycaster, mouse;

      function initDrawerModal() {
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Add click event listener to the renderer
        renderer.domElement.addEventListener("click", onArtworkClick);
      }

      function onArtworkClick(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Update the picking ray with the camera and mouse position
        raycaster.setFromCamera(mouse, camera);

        // Calculate objects intersecting the picking ray
        const intersects = raycaster.intersectObjects(visibleMeshes);

        if (intersects.length > 0) {
          const clickedMesh = intersects[0].object;
          const artworkData = clickedMesh.userData.artworkData;

          if (artworkData) {
            // Create or update drawer modal for the clicked artwork
            createDrawerModal(artworkData, clickedMesh);
          }
        }
      }

      function createDrawerModal(artworkData, mesh) {
        // Remove existing drawer modal if any
        const existingModal = document.querySelector(".drawer-backdrop");
        if (existingModal) {
          existingModal.remove();
        }

        // Create backdrop
        const backdrop = document.createElement("div");
        backdrop.className = "drawer-backdrop";

        // Create drawer container
        const drawerContainer = document.createElement("div");
        drawerContainer.className = "drawer-container";

        // Create close button
        const closeButton = document.createElement("button");
        closeButton.className = "drawer-close";
        closeButton.innerHTML = "×";
        closeButton.onclick = closeDrawerModal;

        // Create artwork section
        const artworkSection = document.createElement("div");
        artworkSection.className = "drawer-artwork";
        const artworkImg = document.createElement("img");
        artworkImg.src = `../../images/${artworkData.image}`;
        artworkImg.alt = artworkData.title || "Artwork";
        artworkImg.onerror = function () {
          artworkSection.innerHTML =
            '<div style="color: #666; font-size: 16px;">Image not available</div>';
        };
        artworkSection.appendChild(artworkImg);

        // Create info section
        const infoSection = document.createElement("div");
        infoSection.className = "drawer-info";

        // Create info content
        infoSection.innerHTML = `
              <div class="drawer-field">
                  <div class="drawer-label">Title</div>
                  <div class="drawer-value">${
                    artworkData.title || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Signed by</div>
                  <div class="drawer-value">${
                    artworkData.signedBy || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Zone</div>
                  <div class="drawer-value">${
                    artworkData.zone || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Exact spot</div>
                  <div class="drawer-value">${
                    artworkData.exactSpot || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Date stamp</div>
                  <div class="drawer-value">${
                    artworkData.date || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Daytime</div>
                  <div class="drawer-value">${
                    artworkData.daytime || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Rawness</div>
                  <div class="drawer-value">${
                    artworkData.rawness !== undefined
                      ? artworkData.rawness
                      : "Not specified"
                  }</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Format type</div>
                  <div class="drawer-value">${
                    artworkData.format || "Not specified"
                  }</div>
              </div>
              <div class="drawer-field full-width">
                  <div class="drawer-label">Scene/Context</div>
                  <div class="drawer-context">${
                    artworkData.context || "No context provided"
                  }</div>
              </div>
              <div class="drawer-field full-width">
                  <div class="drawer-label">Vibes/Tags</div>
                  <div class="drawer-tags">
                      ${
                        artworkData.tags && artworkData.tags.length > 0
                          ? artworkData.tags
                              .map(
                                (tag) =>
                                  `<span class="drawer-tag">${tag}</span>`
                              )
                              .join("")
                          : '<span class="drawer-tag">No tags</span>'
                      }
                  </div>
              </div>
          `;

        // Assemble the modal
        drawerContainer.appendChild(closeButton);
        drawerContainer.appendChild(artworkSection);
        drawerContainer.appendChild(infoSection);
        backdrop.appendChild(drawerContainer);
        document.body.appendChild(backdrop);

        // Add click outside to close
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) {
            closeDrawerModal();
          }
        });

        // Add escape key to close
        const escapeHandler = function (e) {
          if (e.key === "Escape") {
            closeDrawerModal();
            document.removeEventListener("keydown", escapeHandler);
          }
        };
        document.addEventListener("keydown", escapeHandler);

        // Animate in
        requestAnimationFrame(() => {
          backdrop.classList.add("show");
          requestAnimationFrame(() => {
            drawerContainer.classList.add("show");
          });
        });

        // Store reference to mesh for potential future use
        backdrop.mesh = mesh;
      }

      function closeDrawerModal() {
        const backdrop = document.querySelector(".drawer-backdrop");
        if (backdrop) {
          const container = backdrop.querySelector(".drawer-container");
          container.classList.remove("show");
          backdrop.classList.remove("show");

          // Remove after animation
          setTimeout(() => {
            backdrop.remove();
          }, 400);
        }
      }
      // Start the visualization when the page loads
      window.addEventListener("load", main);
    </script>
  </body>
</html>
