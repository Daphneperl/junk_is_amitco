<!DOCTYPE html>
<html>
  <head>
    <title>3D Intimacy Tunnel Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../../assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("../../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      /* Rings Container Styles */
      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }

      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }

      /* Search Bar Styles */
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Drawer Modal Styles */
      .drawer-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .drawer-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      .drawer-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        z-index: 3001;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: flex;
        align-items: flex-start;
        gap: 20px;
        max-width: 95vw;
        max-height: 90vh;
        justify-content: center;
        position: relative;
      }

      .drawer-container.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .drawer-artwork {
        position: relative;
        width: auto;
        height: auto;
        max-width: 45vw;
        max-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        overflow: hidden;
        z-index: 2;
        flex-shrink: 0;
      }

      .drawer-artwork img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 4px;
        display: block;
      }

      .drawer-info {
        position: relative;
        width: 350px;
        height: auto;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 20px;
        font-family: "Overpass Mono", monospace;
        color: #fff;
        font-size: 14px;
        transform: translateX(-100%);
        transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 1;
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .drawer-container.show .drawer-info {
        transform: translateX(0);
      }

      .drawer-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .drawer-field.full-width {
        grid-column: 1 / -1;
      }

      .drawer-close {
        position: absolute;
        top: -40px;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        font-family: "VT323", monospace;
        z-index: 3002;
        opacity: 0;
        transition: opacity 0.3s ease;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      .drawer-close:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .drawer-container.show .drawer-close {
        opacity: 1;
      }

      .drawer-label {
        font-weight: bold;
        font-family: "Overpass Mono", monospace;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .drawer-value {
        font-weight: normal;
        font-family: "Overpass Mono", monospace;
        font-style: italic;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        color: rgba(255, 255, 255, 0.7);
      }

      .drawer-context {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 12px;
        min-height: 80px;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 4px;
      }

      .drawer-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .drawer-tag {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 4px 10px;
        font-size: 11px;
        white-space: nowrap;
        transition: all 0.2s ease;
      }

      .drawer-tag:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Mobile responsive */
      @media (max-width: 768px) {
        .drawer-container {
          flex-direction: column;
          max-width: 95vw;
          max-height: 90vh;
          gap: 15px;
          padding: 10px;
        }

        .drawer-artwork {
          max-width: 100%;
          max-height: 50vh;
        }

        .drawer-info {
          position: relative;
          width: 100%;
          height: auto;
          max-height: 40vh;
          transform: translateY(-100%);
          padding: 15px;
          font-size: 13px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .drawer-container.show .drawer-info {
          transform: translateY(0);
        }

        .drawer-field {
          margin-bottom: 8px;
        }

        .drawer-label {
          font-size: 14px;
        }

        .drawer-value {
          font-size: 13px;
          font-weight: normal;
          font-family: "Overpass Mono", monospace;
          font-style: italic;
          color: rgba(255, 255, 255, 0.7);
        }

        .drawer-context {
          font-size: 12px;
          padding: 10px;
          min-height: 60px;
        }

        .drawer-tag {
          font-size: 10px;
          padding: 3px 8px;
        }
      }

      .focus-tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 5px;
      }

      .focus-tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;

    <script>
      // 1. Define stations and Z mapping
      const stations = [
        { name: "", flower: "" }, // Empty first layer
        { name: "The Beach", flower: "Sand in your soul and sketchbook" },
        { name: "The Park", flower: "So poetic" },
        { name: "Museum", flower: "It's not stealing if you make it your own" },
        { name: "Cafe", flower: "Coffee stains everywhere" },
        { name: "Pub", flower: "Who needs friends when there's beer?" },
        { name: "Class", flower: "Teacher's pet!" },
        { name: "Studio", flower: "Artist's layer" },
        { name: "Living room", flower: "Couchpotato or artistic genius?" },
        { name: "Bedroom", flower: "Where the magic happens" },
        { name: "Toilet", flower: "Where shit gets real" },
      ];

      const imageRingRadius = 75;
      const tunnelMargin = 3;
      const tunnelRadius = imageRingRadius + tunnelMargin;
      const minRingRadius = 55;
      const maxRingRadius = 75;
      const tunnelLength = 5500; // total Z length (increased for additional layer)
      const zStart = 0;
      const zEnd = -tunnelLength;
      const stationStep = tunnelLength / (stations.length - 1);

      // Define a left-turning curve using CatmullRomCurve3
      const tunnelCurve = new THREE.CatmullRomCurve3(
        Array.from({ length: 200 }, (_, i) => {
          const t = i / 199;
          const angle = t * Math.PI * 1.8; // 1.8 radians = ~103 degrees (increased turn for longer tunnel)
          const radius = 1500; // Increased radius for smoother curve with longer distance
          return new THREE.Vector3(
            Math.sin(angle) * radius,
            0,
            -Math.cos(angle) * radius
          );
        })
      );

      // 1. Add the custom shader for vertical lines at the top of the script section:
      const verticalLineVertexShader = `
        attribute float alpha;
        varying float vAlpha;
        void main() {
            vAlpha = alpha;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;
      const verticalLineFragmentShader = `
        varying float vAlpha;
        void main() {
            gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha);
        }
    `;

      // 2. Load images from JSON and assign stations
      async function loadArtworks() {
        let imageList = [];
        try {
          const response = await fetch("../../images/images.json");
          imageList = await response.json();
        } catch (e) {
          document.getElementById("loading-text").textContent =
            "Error loading images.json";
          return [];
        }

        // Shuffle the image list to randomize selection
        const shuffledImages = [...imageList].sort(() => Math.random() - 0.5);

        // Calculate how many images per station (ensure equal distribution)
        const imagesPerStation = Math.floor(
          shuffledImages.length / stations.length
        );
        const totalImagesToUse = imagesPerStation * stations.length;

        // Distribute images evenly across stations
        const artworks = [];
        for (let stationIdx = 0; stationIdx < stations.length; stationIdx++) {
          for (let i = 0; i < imagesPerStation; i++) {
            const imageIndex = stationIdx * imagesPerStation + i;
            if (imageIndex < shuffledImages.length) {
              artworks.push({
                id: imageIndex,
                stationIdx,
                station: stations[stationIdx],
                image: shuffledImages[imageIndex],
              });
            }
          }
        }

        return artworks;
      }

      // 3. Map station index to Z and ring radius
      function stationZ(stationIdx) {
        return zStart - stationIdx * stationStep;
      }
      function stationRadius(stationIdx) {
        // Optional: make more intimate stations smaller
        return (
          maxRingRadius -
          (maxRingRadius - minRingRadius) * (stationIdx / (stations.length - 1))
        );
      }

      // 4. Place artworks in tunnel
      let scene,
        camera,
        renderer,
        tunnelWire,
        composer,
        particles,
        squareParticleGroup;
      // Add these arrays to store references and t values
      let visibleMeshes = [];
      let visibleLabels = [];
      let ringObjects = [];
      let artworksByStation = [];
      let stationZs = [];
      let artworksData = [];

      // Store Frenet frames globally for reuse
      let tunnelFrenetFrames = null;

      // Separate variables for rings
      let ringsScene, ringsCamera, ringsRenderer;
      let rings;
      let ringsRotation = {
        isDragging: false,
        previousX: 0,
        previousY: 0,
        rotationSpeedX: 0.0003,
        rotationSpeedY: 0.0006,
        manualRotationX: 0,
        manualRotationY: 0,
        dragStartTime: 0,
        dragThreshold: 5, // Minimum distance to be considered dragging
        clickThreshold: 200, // Minimum time difference to be considered a click vs drag
      };

      // Store references to eye-label groups for hover detection
      let eyeLabelGroups = [];
      let ringsRaycaster, ringsMouse;

      // Chatbot state
      let chatbotState = {
        currentQuestion: 0,
        answers: {},
        isTyping: false,
      };

      // Create wire grid for the tunnel
      function createTunnelWireGrid() {
        const wireGroup = new THREE.Group();
        const numVerticalLines = 48;
        const numHorizontalRings = 60;
        const numCurveSamples = 200;
        const numRingSegments = 48;

        // Precompute Frenet frames along the curve
        tunnelFrenetFrames = tunnelCurve.computeFrenetFrames(
          numCurveSamples,
          false
        );

        // Vertical lines (meridians)
        for (let v = 0; v < numVerticalLines; v++) {
          const angle = (v / numVerticalLines) * Math.PI * 2;
          const points = [];
          for (let i = 0; i < numCurveSamples; i++) {
            const t = i / (numCurveSamples - 1);
            const center = tunnelCurve.getPoint(t);
            const normal = tunnelFrenetFrames.normals[i];
            const binormal = tunnelFrenetFrames.binormals[i];
            const x = Math.cos(angle) * tunnelRadius;
            const y = Math.sin(angle) * tunnelRadius;
            // Local position in the ring's frame
            const pos = center
              .clone()
              .add(normal.clone().multiplyScalar(x))
              .add(binormal.clone().multiplyScalar(y));
            points.push(pos);
          }
          // Create geometry with per-vertex alpha
          const positions = new Float32Array(points.length * 3);
          const alphas = new Float32Array(points.length);
          for (let i = 0; i < points.length; i++) {
            positions[i * 3] = points[i].x;
            positions[i * 3 + 1] = points[i].y;
            positions[i * 3 + 2] = points[i].z;
            alphas[i] = 1.0; // default, will be updated each frame
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3)
          );
          geometry.setAttribute("alpha", new THREE.BufferAttribute(alphas, 1));
          const material = new THREE.ShaderMaterial({
            vertexShader: verticalLineVertexShader,
            fragmentShader: verticalLineFragmentShader,
            transparent: true,
            depthWrite: false,
            depthTest: true,
          });
          const line = new THREE.Line(geometry, material);
          line.renderOrder = 1;
          line.userData = {
            type: "vertical",
            points: points,
            geometry: geometry,
            alphas: alphas,
          };
          wireGroup.add(line);
        }

        // Horizontal rings (latitudes) - unchanged except for userData
        for (let i = 0; i < numHorizontalRings; i++) {
          const t = i / (numHorizontalRings - 1);
          const center = tunnelCurve.getPoint(t);
          const tangent = tunnelCurve.getTangent(t).clone().normalize();
          // Find a perpendicular vector for the ring's plane
          let up = new THREE.Vector3(0, 1, 0);
          if (Math.abs(tangent.dot(up)) > 0.99) up = new THREE.Vector3(1, 0, 0);
          const binormal = new THREE.Vector3()
            .crossVectors(tangent, up)
            .normalize();
          const ringPoints = [];
          for (let j = 0; j <= numRingSegments; j++) {
            const angle = (j / numRingSegments) * Math.PI * 2;
            const x = Math.cos(angle) * tunnelRadius;
            const y = Math.sin(angle) * tunnelRadius;
            // Local position in the ring's frame
            const pos = center
              .clone()
              .add(up.clone().multiplyScalar(x))
              .add(binormal.clone().multiplyScalar(y));
            ringPoints.push(pos);
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(ringPoints);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 1.0,
            depthWrite: false,
            depthTest: true,
          });
          const line = new THREE.Line(geometry, material);
          line.renderOrder = 1;
          line.userData = { type: "horizontal", points: ringPoints };
          wireGroup.add(line);
        }

        tunnelWire = wireGroup;
        scene.add(tunnelWire);
      }

      function clearVisible() {
        visibleMeshes.forEach((mesh) => scene.remove(mesh));
        visibleMeshes = [];
        visibleLabels.forEach((label) => label.remove());
        visibleLabels = [];
      }

      function createTextSprite(title, subtitle = null) {
        // Create a temporary canvas to measure text
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");

        // Measure title text
        tempCtx.font = "bold 300px VT323, monospace";
        const titleMetrics = tempCtx.measureText(title);
        const titleWidth = Math.ceil(titleMetrics.width);
        const titleHeight = 450; // Bigger height for bigger font

        // Measure subtitle text if provided
        let subtitleWidth = 0;
        let subtitleHeight = 0;
        let subtitleLines = [];
        if (subtitle) {
          tempCtx.font = '400 80px "Overpass Mono", monospace';

          // Set maximum width for subtitle (narrower box)
          const maxSubtitleWidth = 1400; // Reduced from previous width

          // Check if subtitle needs to be split into multiple lines
          const subtitleMetrics = tempCtx.measureText(subtitle);
          if (subtitleMetrics.width <= maxSubtitleWidth) {
            // Single line
            subtitleWidth = Math.ceil(subtitleMetrics.width);
            subtitleLines = [subtitle];
            subtitleHeight = 120;
          } else {
            // Split into multiple lines
            const words = subtitle.split(" ");
            let currentLine = "";
            subtitleLines = [];

            for (let i = 0; i < words.length; i++) {
              const testLine =
                currentLine + (currentLine ? " " : "") + words[i];
              const testMetrics = tempCtx.measureText(testLine);

              if (testMetrics.width <= maxSubtitleWidth) {
                currentLine = testLine;
              } else {
                if (currentLine) {
                  subtitleLines.push(currentLine);
                  currentLine = words[i];
                } else {
                  // Single word is too long, force it
                  subtitleLines.push(words[i]);
                  currentLine = "";
                }
              }
            }

            if (currentLine) {
              subtitleLines.push(currentLine);
            }

            // Calculate width and height for multiple lines
            subtitleWidth = maxSubtitleWidth;
            subtitleHeight = 120 * subtitleLines.length;
          }
        }

        // Calculate total dimensions with narrower subtitle width
        const totalWidth = Math.max(titleWidth, subtitleWidth) + 160;
        const totalHeight = titleHeight + (subtitle ? subtitleHeight : 0) + 200; // Increased padding to prevent cutoff

        // Now create the actual canvas
        const canvas = document.createElement("canvas");
        canvas.width = totalWidth;
        canvas.height = totalHeight;
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Draw title
        context.font = "bold 300px VT323, monospace";
        context.fillStyle = "rgba(255,255,255,1)";
        context.textAlign = "center";
        context.textBaseline = "middle";
        const titleY = totalHeight / 2 - 50; // Fixed title position
        context.fillText(title, canvas.width / 2, titleY);

        // Draw subtitle if provided
        if (subtitle && subtitleLines.length > 0) {
          context.font = '400 80px "Overpass Mono", monospace';
          context.fillStyle = "rgba(255,255,255,1)"; // Full opacity white
          context.textAlign = "center";
          context.textBaseline = "middle";

          const lineHeight = 120; // Match the subtitleHeight per line
          const fixedGap = 200; // Fixed gap between title and subtitle
          const startY = titleY + fixedGap;

          subtitleLines.forEach((line, index) => {
            const lineY = startY + index * lineHeight;
            context.fillText(line, canvas.width / 2, lineY);
          });
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.premultiplyAlpha = true;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          alphaTest: 0.5, // Discard low-alpha pixels
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        // Set scale to match the canvas aspect ratio for natural look, but bigger
        const scaleX = (0.7 * canvas.width) / 10;
        const scaleY = (0.7 * canvas.height) / 10;
        sprite.scale.set(scaleX, scaleY, 1);
        return sprite;
      }

      function showTunnelRings() {
        clearVisible();
        ringObjects = [];
        for (let stationIdx = 0; stationIdx < stations.length; stationIdx++) {
          const t = stationIdx / (stations.length - 1);
          const center = tunnelCurve.getPoint(t);
          let arts = artworksByStation[stationIdx];
          const maxImagesPerRing = 8;
          if (arts.length > maxImagesPerRing) {
            arts = arts
              .slice(0, maxImagesPerRing)
              .sort(() => Math.random() - 0.5);
          } else if (arts.length < maxImagesPerRing) {
            const originalArts = [...arts];
            while (arts.length < maxImagesPerRing) {
              arts.push(
                ...originalArts.slice(
                  0,
                  Math.min(maxImagesPerRing - arts.length, originalArts.length)
                )
              );
            }
            arts = arts
              .slice(0, maxImagesPerRing)
              .sort(() => Math.random() - 0.5);
          }
          const N = arts.length;
          const ringGroup = new THREE.Group();
          ringGroup.position.copy(center);
          ringGroup.userData = { stationIdx, t };
          scene.add(ringGroup);
          // Title sprite (only create if station name is not empty)
          if (stations[stationIdx].name.trim() !== "") {
            const titleSprite = createTextSprite(
              stations[stationIdx].name,
              stations[stationIdx].flower
            );
            titleSprite.position.set(0, 0, 0);
            ringGroup.add(titleSprite);
            // Store for dynamic opacity, now with center
            ringObjects.push({
              t,
              center: center.clone(),
              titleSprite,
              imageMeshes: [],
            });
          } else {
            // For empty first layer, just store the ring object without title
            ringObjects.push({
              t,
              center: center.clone(),
              titleSprite: null,
              imageMeshes: [],
            });
          }

          // Skip creating images for the first (empty) layer
          if (stationIdx === 0) {
            continue;
          }

          for (let i = 0; i < N; i++) {
            const angle = (i / N) * Math.PI * 2;
            const art = arts[i];
            const texture = art._texture;
            let mesh,
              imageWidth = 18;
            if (texture) {
              const aspect = texture.image.width / texture.image.height;
              const height = 30;
              imageWidth = height * aspect;
              const geometry = new THREE.PlaneGeometry(imageWidth, height);
              const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
              });
              mesh = new THREE.Mesh(geometry, material);
            } else {
              const geometry = new THREE.BoxGeometry(30, 20, 2);
              const color = `hsl(${Math.floor(360 * Math.random())},70%,60%)`;
              const material = new THREE.MeshPhongMaterial({
                color,
                transparent: true,
              });
              mesh = new THREE.Mesh(geometry, material);
            }
            // Ensure images render above the grid but respect depth
            mesh.renderOrder = 100;
            mesh.material.depthTest = true;
            mesh.material.depthWrite = true;
            const x = Math.cos(angle) * imageRingRadius;
            const y = Math.sin(angle) * imageRingRadius;
            mesh.position.set(x, y, 0);
            mesh.rotation.set(0, 0, 0);
            // Store original position for jitter calculations and artwork data
            mesh.userData = {
              originalX: x,
              originalY: y,
              originalZ: 0,
              jitterSeed: Math.random() * 1000, // Random seed for unique jitter
              jitterSpeed: 0.5 + Math.random() * 2.0, // Random speed between 0.5-1.5
              jitterAmplitude: 2 + Math.random() * 3, // Random amplitude between 2-5
              jitterPhase: Math.random() * Math.PI * 2, // Random starting phase
              artworkData: art, // Store the artwork data for flip card
            };
            ringGroup.add(mesh);
            visibleMeshes.push(mesh);
            ringObjects[ringObjects.length - 1].imageMeshes.push(mesh);
          }
        }
      }

      function updateArtworkOrientations() {
        // Make all images face the camera
        visibleMeshes.forEach((mesh) => {
          mesh.lookAt(camera.position);
        });
      }

      function preloadTextures(artworks, onDone) {
        const textureLoader = new THREE.TextureLoader();
        let loaded = 0;
        let total = artworks.length;
        if (total === 0) {
          onDone();
          return;
        }
        artworks.forEach((art) => {
          textureLoader.load(
            `../../images/${art.image}`,
            (texture) => {
              art._texture = texture;
              loaded++;
              updateLoadingUI((loaded / total) * 100);
              if (loaded === total) onDone();
            },
            undefined,
            () => {
              art._texture = null;
              loaded++;
              updateLoadingUI((loaded / total) * 100);
              if (loaded === total) onDone();
            }
          );
        });
      }

      function placeArtworksTunnel(artworks) {
        // Group artworks by station
        artworksByStation = Array.from({ length: stations.length }, () => []);
        stationZs = [];
        for (let i = 0; i < stations.length; i++) {
          stationZs.push(stationZ(i));
        }
        artworks.forEach((art) => artworksByStation[art.stationIdx].push(art));
        showTunnelRings();
      }

      // 5. Camera, scene, controls
      async function main() {
        // Ensure fonts are loaded before proceeding
        await document.fonts.load("bold 300px VT323");
        await document.fonts.load('400 120px "Overpass Mono"');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 100, tunnelLength + 800);

        // Create noise texture background
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create the wire grid FIRST (sets tunnelFrenetFrames)
        createTunnelWireGrid();

        // Now create background square particles (after tunnelFrenetFrames is set)
        const squareParticleCount = 3000;
        squareParticleGroup = new THREE.Group();
        const numCurveSamples = tunnelFrenetFrames.normals.length;
        for (let i = 0; i < squareParticleCount; i++) {
          // Position particles along the tunnel curve
          const t = Math.random(); // Random position along the curve
          const curveIdx = Math.floor(t * (numCurveSamples - 1));
          const center = tunnelCurve.getPoint(t);
          // Use Frenet frames for local normal/binormal
          const normal = tunnelFrenetFrames.normals[curveIdx];
          const binormal = tunnelFrenetFrames.binormals[curveIdx];
          // Place outside the tunnel
          const angle = Math.random() * Math.PI * 2;
          const radius = tunnelRadius + 20 + Math.random() * 50;
          const offset = normal
            .clone()
            .multiplyScalar(Math.cos(angle) * radius)
            .add(binormal.clone().multiplyScalar(Math.sin(angle) * radius));
          // Create square geometry
          const squareSize = 2 + Math.random() * 3; // Random size between 2-5
          const geometry = new THREE.PlaneGeometry(squareSize, squareSize);
          // Color gradient from cyan (start) to purple (middle) to red (end) based on t position
          const cyan = new THREE.Color(0x00ffff); // Cyan
          const purple = new THREE.Color(0x8000ff); // Purple
          const red = new THREE.Color(0xff0000); // Red
          let color;
          if (t < 0.5) {
            color = new THREE.Color().lerpColors(cyan, purple, t * 2);
          } else {
            color = new THREE.Color().lerpColors(purple, red, (t - 0.5) * 2);
          }
          const material = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 0.3 + Math.random() * 0.6, // Random opacity between 0.3 and 0.9
            side: THREE.DoubleSide,
          });
          const square = new THREE.Mesh(geometry, material);
          square.position.copy(center.clone().add(offset));
          // Store original data for animation
          square.userData = {
            t: t,
            angle: angle,
            radius: radius,
            speed: 0.001 + Math.random() * 0.002,
          };
          squareParticleGroup.add(square);
        }
        scene.add(squareParticleGroup);

        // Create original spherical particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: true,
          depthTest: true,
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
        };
        scene.add(particles);

        // Create the wire grid
        // createTunnelWireGrid(); // This line is now redundant as it's called above

        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          1,
          10000
        );
        camera.position.set(0, 0, 200); // Start outside tunnel, looking at z=0
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
          fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float offset;
                uniform float darkness;
                varying vec2 vUv;
                
                void main() {
                    vec2 uv = vUv;
                    vec4 color = texture2D(tDiffuse, uv);
                    
                    // Calculate distance from center
                    vec2 center = vec2(0.5, 0.5);
                    float dist = distance(uv, center);
                    
                    // Create vignette effect
                    float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                    
                    // Apply vignette
                    color.rgb *= vignette;
                    
                    gl_FragColor = color;
                }
            `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();

        // Load artworks and textures

        preloadTextures(artworks, () => {

      function updateLoadingUI(progress) {

      // Rings functionality
      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
        const group = new THREE.Group();
        const eye = createEyeSprite(eyePath);
        eye.position.copy(eyePos);
        eye.userData.eyeId = eyeId; // Store the eye ID for navigation
        eye.userData.title = labelText; // Store the title for hover display
        group.add(eye);
        // Store for raycasting
        eyeLabelGroups.push({ eye });
        return group;
      }

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group();
        eyeLabelGroups = [];

        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          renderOrder: 1,
        });
        const ringMaterial2 = ringMaterial1.clone();
        ringMaterial2.renderOrder = 2;
        const ringMaterial3 = ringMaterial1.clone();
        ringMaterial3.renderOrder = 3;

        // Ring 1 (horizontal, up is +Y)
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
        const group1a = createEyeWithLabel(
          "../../Eyes/Temperament_open.png",

        );
        const group1b = createEyeWithLabel(
          "../../Eyes/Rhizome_open.png",

          new THREE.Vector3(-9, 0, 0),

        );
        ring1.add(group1a);
        ring1.add(group1b);
        ring1.position.z = 1;

        // Ring 2 (vertical, up is +Z)
        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
        const group2a = createEyeWithLabel(
          "../../Eyes/Artist_open.png",
          "Artist",
          new THREE.Vector3(0, 9, 0),
          new THREE.Vector3(0, 0, 1),
          "eye-artist"
        );
        const group2b = createEyeWithLabel(
          "../../Eyes/Completeness_open.png",
          "Completeness",
          new THREE.Vector3(0, -9, 0),

          "eye-completeness"
        );
        ring2.rotation.x = Math.PI / 2;
        ring2.position.z = 0;
        ring2.add(group2a);
        ring2.add(group2b);

        // Ring 3 (side, up is +X)
        const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
        const group3a = createEyeWithLabel(
          "../../Eyes/SecretGallery_open.png",
          "idk",
          new THREE.Vector3(0, 6, 0),
          new THREE.Vector3(1, 0, 0),
          "eye-secret"
        );
        const group3b = createEyeWithLabel(

          "Intimacy",
