<!DOCTYPE html>
<html>
<head>
    <title>3D Intimacy Tunnel Gallery</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #visualization { width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
        #loading-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; z-index: 1001;
        }
    </style>
</head>
<body>
    <div id="loading-container">
        <h2>Loading Intimacy Tunnel...</h2>
        <div id="loading-text">Loading artworks...</div>
    </div>
    <div id="visualization"></div>
    <script>
    // 1. Define stations and Z mapping
    const stations = [
        "Park",
        "Coffee shop",
        "Studio",
        "Bed"
    ];
    const imageRingRadius = 75;
    const tunnelMargin = 3;
    const tunnelRadius = imageRingRadius + tunnelMargin;
    const minRingRadius = 55;
    const maxRingRadius = 75;
    const tunnelLength = 2000; // total Z length
    const zStart = 0;
    const zEnd = -tunnelLength;
    const stationStep = tunnelLength / (stations.length - 1);

    // 2. Load images from JSON and assign stations
    async function loadArtworks() {
        let imageList = [];
        try {
            const response = await fetch('../../images/images.json');
            imageList = await response.json();
        } catch (e) {
            document.getElementById('loading-text').textContent = 'Error loading images.json';
            return [];
        }
        // Assign each image a random station
        return imageList.map((img, i) => {
            const stationIdx = Math.floor(Math.random() * stations.length);
            return {
                id: i,
                stationIdx,
                station: stations[stationIdx],
                image: img
            };
        });
    }

    // 3. Map station index to Z and ring radius
    function stationZ(stationIdx) {
        return zStart - stationIdx * stationStep;
    }
    function stationRadius(stationIdx) {
        // Optional: make more intimate stations smaller
        return maxRingRadius - (maxRingRadius - minRingRadius) * (stationIdx / (stations.length - 1));
    }

    // 4. Place artworks in tunnel
    let scene, camera, renderer, controls, tunnelWire;
    let visibleMeshes = [];
    let visibleLabels = [];
    let artworksByStation = [];
    let stationZs = [];
    let artworksData = [];
    function clearVisible() {
        visibleMeshes.forEach(mesh => scene.remove(mesh));
        visibleMeshes = [];
        visibleLabels.forEach(label => label.remove());
        visibleLabels = [];
    }
    function showTunnelRings() {
        clearVisible();
        for (let stationIdx = 0; stationIdx < stations.length; stationIdx++) {
            const z = stationZ(stationIdx);
            const r = stationRadius(stationIdx);
            let arts = artworksByStation[stationIdx];
            // Only show up to 8 images per station
            if (arts.length > 8) {
                arts = arts.slice(0, 8).sort(() => Math.random() - 0.5);
            }
            const N = arts.length;
            // Place a single station label at the top of the ring
            const labelY = imageRingRadius + 0.2 * imageRingRadius;
            const fontSize = Math.max(16, Math.round(imageRingRadius * 0.3));
            const label = document.createElement('div');
            label.textContent = stations[stationIdx];
            label.style.position = 'absolute';
            label.style.color = 'white';
            label.style.fontSize = fontSize + 'px';
            label.style.fontFamily = 'monospace';
            label.style.pointerEvents = 'none';
            label.style.textShadow = '0 0 4px #000, 0 0 2px #000';
            document.body.appendChild(label);
            visibleLabels.push({label, z, labelY});
            for (let i = 0; i < N; i++) {
                const angle = (i / N) * Math.PI * 2;
                const art = arts[i];
                const texture = art._texture;
                let mesh, imageWidth = 18;
                if (texture) {
                    const aspect = texture.image.width / texture.image.height;
                    const height = 18;
                    imageWidth = height * aspect;
                    const geometry = new THREE.PlaneGeometry(imageWidth, height);
                    const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                    mesh = new THREE.Mesh(geometry, material);
                } else {
                    const geometry = new THREE.BoxGeometry(18, 12, 2);
                    const color = `hsl(${Math.floor(360 * Math.random())},70%,60%)`;
                    const material = new THREE.MeshPhongMaterial({ color });
                    mesh = new THREE.Mesh(geometry, material);
                }
                const x = Math.cos(angle) * imageRingRadius;
                const y = Math.sin(angle) * imageRingRadius;
                mesh.position.set(x, y, z);
                // Face the tunnel center
                mesh.lookAt(0, 0, z);
                scene.add(mesh);
                visibleMeshes.push(mesh);
            }
        }
    }
    function updateArtworkOrientations() {
        // Make all images face the camera
        visibleMeshes.forEach(mesh => {
            mesh.lookAt(camera.position);
        });
    }
    function preloadTextures(artworks, onDone) {
        const textureLoader = new THREE.TextureLoader();
        let loaded = 0;
        let total = artworks.length;
        if (total === 0) { onDone(); return; }
        artworks.forEach(art => {
            textureLoader.load(
                `../../images/${art.image}`,
                (texture) => { art._texture = texture; loaded++; if (loaded === total) onDone(); },
                undefined,
                () => { art._texture = null; loaded++; if (loaded === total) onDone(); }
            );
        });
    }
    function placeArtworksTunnel(artworks) {
        // Group artworks by station
        artworksByStation = Array.from({length: stations.length}, () => []);
        stationZs = [];
        for (let i = 0; i < stations.length; i++) {
            stationZs.push(stationZ(i));
        }
        artworks.forEach(art => artworksByStation[art.stationIdx].push(art));
        showTunnelRings();
    }

    // 5. Camera, scene, controls
    async function main() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 100, tunnelLength + 400);
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.set(0, 0, 200); // Start outside tunnel, looking at z=0
        camera.lookAt(0, 0, 0);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('visualization').appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;
        controls.minDistance = 30;
        controls.maxDistance = imageRingRadius * 2;
        controls.target.set(0, 0, 0);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // Load artworks and textures
        const artworks = await loadArtworks();
        artworksData = artworks;
        preloadTextures(artworks, () => {
            placeArtworksTunnel(artworks);
            document.getElementById('loading-container').style.display = 'none';
            animate();
        });
    }

    // 7. Animate: move camera along Z with W/S or Up/Down
    let cameraSpeed = 0;
    function animate() {
        requestAnimationFrame(animate);
        // Move camera
        if (cameraSpeed !== 0) {
            camera.position.z += cameraSpeed;
            camera.position.z = Math.max(zEnd - 100, Math.min(zStart + 200, camera.position.z));
        }
        controls.update();
        updateArtworkOrientations();
        renderer.render(scene, camera);
        // Update station labels
        visibleLabels.forEach(({label, z, labelY}) => {
            // Place label at (0, labelY, z)
            const pos = new THREE.Vector3(0, labelY, z);
            const vector = pos.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            label.style.display = (vector.z > 1 || vector.z < -1) ? 'none' : 'block';
        });
    }

    // 8. Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') cameraSpeed = -20;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') cameraSpeed = 20;
    });
    document.addEventListener('keyup', (e) => {
        if (["KeyW","ArrowUp","KeyS","ArrowDown"].includes(e.code)) cameraSpeed = 0;
    });

    window.addEventListener('load', main);
    </script>
</body>
</html>
