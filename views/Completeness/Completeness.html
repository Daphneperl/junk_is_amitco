<!DOCTYPE html>
<html>
<head>
    <title>Completeness</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('../../assets/pixel.ttf') format('truetype');
        }
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
        }
        #visualization {
            width: 100vw;
            height: 100vh;
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        #image-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: auto;
            background: transparent;
        }
        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        #loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
        .score-label {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 3;
            transform: translateX(-50%);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="black-overlay"></div>
    <div id="loading-container" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div class="loading-bar">
            <div id="loading-progress" class="loading-progress" style="width: 0%"></div>
        </div>
        <div id="loading-text" style="color: #ffffff; font-family: monospace; margin-top: 10px;">LOADING... 0%</div>
    </div>
    <div id="visualization"></div>
    <canvas id="image-canvas"></canvas>
    <script>
        let scene, camera, renderer, controls;
        let composer;
        let particles;
        let imageCanvas, imageCtx;
        let imageParticles = [];
        let sketchinessScores = {};

        // Load sketchiness scores
        async function loadSketchinessScores() {
            try {
                const response = await fetch('inverted_sketchiness_scores.json');
                sketchinessScores = await response.json();
            } catch (error) {
                console.error('Error loading sketchiness scores:', error);
            }
        }

        class ImageParticle {
            constructor(filename, score, thresholds) {
                this.filename = filename;
                this.score = score;
                this.image = new Image();
                this.image.crossOrigin = 'anonymous';
                this.image.src = `../../images/${filename}`;
                this.image.onload = () => { this.loaded = true; };
                this.image.onerror = () => { this.loaded = false; };
                this.loaded = false;

                // Start position is a wide horizontal cloud
                this.startX = Math.random() * (window.innerWidth - 100) + 50;
                this.startY = Math.random() * 120 + 80;
                this.x = this.startX;
                this.y = this.startY;
                this.transitionFrame = 0;
                this.offset = Math.random() * 1000;

                // Jitter parameters mapped to score (solid/liquid/gas analogy)
                const minJitter = 0.2, maxJitter = 60;
                const minSpeed = 0.05, maxSpeed = 2.5;
                this.jitterAmplitude = minJitter + ((thresholds.max - this.score) / (thresholds.max - thresholds.min)) * (maxJitter - minJitter);
                this.jitterSpeed = minSpeed + ((thresholds.max - this.score) / (thresholds.max - thresholds.min)) * (maxSpeed - minSpeed);
                this.jitterPhase = Math.random() * Math.PI * 2;

                // Score thresholds for type
                this.type = this.getType(thresholds);
                this.anchorX = this.startX;

                if (this.type === 'complete') {
                    // Spread complete images from near the bottom to the very bottom
                    this.anchorY = this.mapScore(
                        this.score,
                        thresholds.complete, thresholds.max,
                        window.innerHeight - 120, window.innerHeight - 40
                    );
                    this.velY = 0;
                    // Map accY to score: higher score = higher accY (faster fall)
                    const minAccY = 0.08;
                    const maxAccY = 0.25;
                    const minScore = thresholds.complete;
                    const maxScore = thresholds.max;
                    this.accY = minAccY + ((this.score - minScore) / (maxScore - minScore)) * (maxAccY - minAccY);
                    this.bounced = false;
                } else if (this.type === 'mid') {
                    // Map score to 20%-90% of screen height (larger range)
                    this.anchorY = this.mapScore(this.score, thresholds.midLow, thresholds.midHigh, window.innerHeight * 0.2, window.innerHeight * 0.9);
                } else {
                    this.anchorY = this.startY; // rough ideas stay up
                }

                this.size = 80;
                this.hoverSize = 400;
                this.currentSize = this.size;
                this.isHovered = false;
            }

            getType(thresholds) {
                if (this.score <= thresholds.rough) return 'rough';
                else if (this.score >= thresholds.complete) return 'complete';
                else return 'mid';
            }

            mapScore(val, min, max, outMin, outMax) {
                return outMin + ((val - min) / (max - min)) * (outMax - outMin);
            }

            update() {
                if (!this.loaded) return;

                if (this.type === 'mid') {
                    if (this.transitionFrame < 480) {
                        let progress = this.transitionFrame / 480;
                        let eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
                        this.y = this.lerp(this.startY, this.anchorY, eased);
                        this.transitionFrame++;
                    } else {
                        // Jitter for mid (liquid)
                        let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
                        this.y = this.anchorY + Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
                        this.x = this.anchorX + Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
                    }
                }

                if (this.type === 'complete') {
                    // Simulate gravity fall + bounce
                    if (!this.bounced) {
                        this.velY += this.accY;
                        this.y += this.velY;
                        if (this.y >= this.anchorY) {
                            this.y = this.anchorY;
                            this.velY *= -0.3;
                            if (Math.abs(this.velY) < 1) {
                                this.bounced = true;
                                this.velY = 0;
                            }
                        }
                    } else {
                        // Jitter for complete (solid)
                        let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
                        this.y = this.anchorY + Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
                        this.x = this.anchorX + Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
                    }
                }

                if (this.type === 'rough') {
                    // Jitter for rough (gas)
                    let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
                    this.y = this.anchorY + Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
                    this.x = this.anchorX + Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
                }

                // Smooth size transition for hover effect
                if (this.isHovered) {
                    this.currentSize += (this.hoverSize - this.currentSize) * 0.1;
                } else {
                    this.currentSize += (this.size - this.currentSize) * 0.1;
                }
            }

            lerp(a, b, t) {
                return a + (b - a) * t;
            }

            draw(ctx) {
                if (!this.loaded) return;
                ctx.save();
                ctx.globalAlpha = 0.8;
                const halfSize = this.currentSize / 2;
                ctx.drawImage(this.image, this.x - halfSize, this.y - halfSize, this.currentSize, this.currentSize);
                if (this.isHovered) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(this.x - 30, this.y - this.currentSize/2 - 30, 60, 20);
                    ctx.fillStyle = 'white';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.score.toString(), this.x, this.y - this.currentSize/2 - 15);
                }
                ctx.restore();
            }

            drawWithZoom(ctx, zoomFactor) {
                if (!this.loaded) return;
                ctx.save();
                ctx.globalAlpha = 1.0;
                
                // Scale position and size based on zoom
                const scaledX = this.x * zoomFactor;
                const scaledY = this.y * zoomFactor;
                const scaledSize = this.currentSize * zoomFactor;
                
                // Calculate aspect ratio to maintain original proportions
                const aspectRatio = this.image.naturalWidth / this.image.naturalHeight;
                let scaledWidth, scaledHeight;
                
                if (aspectRatio > 1) {
                    // Landscape image
                    scaledWidth = scaledSize;
                    scaledHeight = scaledSize / aspectRatio;
                } else {
                    // Portrait or square image
                    scaledHeight = scaledSize;
                    scaledWidth = scaledSize * aspectRatio;
                }
                
                const halfWidth = scaledWidth / 2;
                const halfHeight = scaledHeight / 2;
                
                ctx.drawImage(this.image, scaledX - halfWidth, scaledY - halfHeight, scaledWidth, scaledHeight);
                
                if (this.isHovered) {
                    const scaledScoreBoxWidth = 60 * zoomFactor;
                    const scaledScoreBoxHeight = 20 * zoomFactor;
                    const scaledFontSize = 12 * zoomFactor;
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(scaledX - scaledScoreBoxWidth/2, scaledY - halfHeight - scaledScoreBoxHeight - 10*zoomFactor, scaledScoreBoxWidth, scaledScoreBoxHeight);
                    ctx.fillStyle = 'white';
                    ctx.font = `${scaledFontSize}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText(this.score.toString(), scaledX, scaledY - halfHeight - scaledScoreBoxHeight/2 - 10*zoomFactor);
                }
                ctx.restore();
            }

            checkHover(mouseX, mouseY) {
                // Calculate aspect ratio to maintain original proportions
                const aspectRatio = this.image.naturalWidth / this.image.naturalHeight;
                let width, height;
                
                if (aspectRatio > 1) {
                    // Landscape image
                    width = this.currentSize;
                    height = this.currentSize / aspectRatio;
                } else {
                    // Portrait or square image
                    height = this.currentSize;
                    width = this.currentSize * aspectRatio;
                }
                
                const halfWidth = width / 2;
                const halfHeight = height / 2;
                
                this.isHovered = mouseX >= this.x - halfWidth && mouseX <= this.x + halfWidth &&
                       mouseY >= this.y - halfHeight && mouseY <= this.y + halfHeight;
            }
        }

        function getScoreThresholds(scores) {
            // Sort scores ascending
            const sorted = [...scores].sort((a, b) => a - b);
            const n = sorted.length;
            return {
                rough: sorted[Math.floor(n * 0.15)], // bottom 15%
                midLow: sorted[Math.floor(n * 0.15)],
                midHigh: sorted[Math.floor(n * 0.85)],
                complete: sorted[Math.floor(n * 0.85)], // top 15%
                max: sorted[n - 1],
                min: sorted[0]
            };
        }

        function preloadAllImages(imageFiles, onAllLoaded) {
            let loadedCount = 0;
            const total = imageFiles.length;
            const images = {};
            imageFiles.forEach(filename => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = `../../images/${filename}`;
                img.onload = () => {
                    loadedCount++;
                    images[filename] = img;
                    // Update loading UI
                    const percent = Math.floor((loadedCount / total) * 100);
                    updateLoadingUI(percent);
                    if (loadedCount === total) {
                        onAllLoaded(images);
                    }
                };
                img.onerror = () => {
                    loadedCount++;
                    images[filename] = null;
                    updateLoadingUI(Math.floor((loadedCount / total) * 100));
                    if (loadedCount === total) {
                        onAllLoaded(images);
                    }
                };
            });
        }

        function initImageCanvas(preloadedImages) {
            imageCanvas = document.getElementById('image-canvas');
            imageCtx = imageCanvas.getContext('2d');
            imageCanvas.width = window.innerWidth;
            imageCanvas.height = window.innerHeight;
            const imageFiles = Object.keys(sketchinessScores);
            const scores = Object.values(sketchinessScores);
            const thresholds = getScoreThresholds(scores);
            imageParticles = [];
            imageFiles.forEach(filename => {
                const score = sketchinessScores[filename];
                const particle = new ImageParticle(filename, score, thresholds);
                // Use preloaded image
                if (preloadedImages[filename]) {
                    particle.image = preloadedImages[filename];
                    particle.loaded = true;
                } else {
                    particle.loaded = false;
                }
                imageParticles.push(particle);
            });
            imageCanvas.addEventListener('mousemove', (e) => {
                const rect = imageCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const baseDistance = 100;
                const zoomFactor = baseDistance / camera.position.z;
                const scaledMouseX = mouseX / zoomFactor;
                const scaledMouseY = mouseY / zoomFactor;
                imageParticles.forEach(particle => {
                    particle.checkHover(scaledMouseX, scaledMouseY);
                });
            });
        }

        function animateImages() {
            // Clear canvas completely to show 3D environment behind
            imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            
            // Calculate zoom factor based on camera distance
            const baseDistance = 100;
            const zoomFactor = baseDistance / camera.position.z;
            
            // Update all particles first
            let loadedCount = 0;
            imageParticles.forEach(particle => {
                particle.update();
                if (particle.loaded) loadedCount++;
            });
            
            // Draw non-hovered images first (background)
            imageParticles.forEach(particle => {
                if (!particle.isHovered) {
                    particle.drawWithZoom(imageCtx, zoomFactor);
                }
            });
            
            // Draw hovered images last (foreground)
            imageParticles.forEach(particle => {
                if (particle.isHovered) {
                    particle.drawWithZoom(imageCtx, zoomFactor);
                }
            });
            
            // Log loading progress occasionally
            if (Math.random() < 0.01) { // Log ~1% of the time
                console.log(`Loaded: ${loadedCount}/${imageParticles.length} images`);
            }
            
            requestAnimationFrame(animateImages);
        }

        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000); // Set black background immediately
            
            // Create noise texture
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Generate noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 50;
                data[i] = value;     // R
                data[i + 1] = value; // G
                data[i + 2] = value; // B
                data[i + 3] = 20;    // A
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Create texture from canvas
            const noiseTexture = new THREE.CanvasTexture(canvas);
            noiseTexture.wrapS = THREE.RepeatWrapping;
            noiseTexture.wrapT = THREE.RepeatWrapping;
            
            // Set as background
            scene.background = noiseTexture;

            // Create particles
            const particleCount = 300;
            const particleGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleSizes = new Float32Array(particleCount);
            const particleColors = new Float32Array(particleCount * 3);
            const particleSpeeds = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                // Random positions within a sphere
                const radius = 80;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                particlePositions[i * 3 + 2] = radius * Math.cos(phi);


                // More vibrant colors
                const hue = Math.random(); // Random hue
                const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
                const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness
                
                // Convert HSL to RGB
                const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
                const x = c * (1 - Math.abs((hue * 6) % 2 - 1));
                const m = lightness - c/2;
                
                let r, g, b;
                if (hue < 1/6) {
                    r = c; g = x; b = 0;
                } else if (hue < 2/6) {
                    r = x; g = c; b = 0;
                } else if (hue < 3/6) {
                    r = 0; g = c; b = x;
                } else if (hue < 4/6) {
                    r = 0; g = x; b = c;
                } else if (hue < 5/6) {
                    r = x; g = 0; b = c;
                } else {
                    r = c; g = 0; b = x;
                }
                
                particleColors[i * 3] = r + m;     // R
                particleColors[i * 3 + 1] = g + m; // G
                particleColors[i * 3 + 2] = b + m; // B

                // Random speeds between 0.02 and 0.08 (much slower than before)
                particleSpeeds[i] = Math.random() * 0.06 ;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.3,
                sizeAttenuation: true,
                depthWrite: false // Allow particles to be transparent when in front
            });

            particles = new THREE.Points(particleGeometry, particleMaterial);
            particles.userData = { 
                speeds: particleSpeeds,
                opacities: new Float32Array(particleCount) // Store individual opacities
            };
            scene.add(particles);

            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1); // Set black background color immediately
            document.getElementById('visualization').appendChild(renderer.domElement);

            // Setup post-processing
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Add vignette effect
            const vignetteShader = {
                uniforms: {
                    "tDiffuse": { value: null },
                    "offset": { value: 1.0 },
                    "darkness": { value: 1.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        
                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        
                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        
                        // Apply vignette
                        color.rgb *= vignette;
                        
                        gl_FragColor = color;
                    }
                `
            };

            const vignettePass = new THREE.ShaderPass(vignetteShader);
            vignettePass.uniforms.offset.value = 0.5;
            vignettePass.uniforms.darkness.value = 0.5;
            composer.addPass(vignettePass);

            // Add orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            
            // Resize image canvas
            imageCanvas.width = window.innerWidth;
            imageCanvas.height = window.innerHeight;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.userData.speeds;
                const opacities = particles.userData.opacities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Move particles in a circular motion
                    const speed = speeds[i / 3];
                    const time = Date.now() * 0.001 * speed;
                    
                    positions[i] += Math.sin(time) * 0.01;
                    positions[i + 1] += Math.cos(time) * 0.01;
                    positions[i + 2] += Math.sin(time * 0.5) * 0.01;

                    // Check if particle is in front of images (z > 0)
                    const z = positions[i + 2];
                    opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
                particles.material.opacity = 0.3; // Base opacity
            }
            
            controls.update();
            composer.render();
        }

        function updateLoadingUI(progress) {
            const progressBar = document.getElementById('loading-progress');
            const loadingText = document.getElementById('loading-text');
            
            if (progressBar && loadingText) {
                progressBar.style.width = `${progress}%`;
                loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
            }
        }

        // Initialize the visualization
        function startVisualization() {
            // Ensure loading page is visible
            document.getElementById('loading-container').style.display = 'block';
            document.getElementById('black-overlay').style.display = 'block';
            document.getElementById('black-overlay').style.opacity = '1';
            document.getElementById('visualization').style.display = 'none';

            // Simulate loading progress
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += 2;
                updateLoadingUI(progress);
                
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    
                    // Initialize the scene
                    init();
                    
                    // Initialize image canvas
                    loadSketchinessScores().then(() => {
                        const imageFiles = Object.keys(sketchinessScores);
                        preloadAllImages(imageFiles, (preloadedImages) => {
                            initImageCanvas(preloadedImages);
                            animateImages();
                            // Hide loading page and show visualization
                            document.getElementById('loading-container').style.display = 'none';
                            document.getElementById('visualization').style.display = 'block';
                            document.getElementById('black-overlay').style.opacity = '0';
                            setTimeout(() => {
                                document.getElementById('black-overlay').style.display = 'none';
                            }, 500);
                        });
                    });

                    // Start animation
                    animate();
                }
            }, 50);
        }

        // Start the visualization when the page loads
        window.addEventListener('load', startVisualization);
    </script>
</body>
</html>
