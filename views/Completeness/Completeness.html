<!DOCTYPE html>
<html>
  <head>
    <title>Completeness</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&callback=initGoogleMaps&loading=async"
      async
      defer
    ></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      /* Page Title */
      .page-title {
        position: fixed;
        top: 10px;
        right: 20px;
        color: white;
        font-family: "VT323", monospace;
        font-size: 30px;
        text-align: right;
        z-index: 2000;
        pointer-events: none;
        display: none;
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #image-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        pointer-events: auto;
        background: transparent;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
      .score-label {
        position: absolute;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        pointer-events: none;
        z-index: 3;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 1600;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: none;
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Dock hover zone indicator (for debugging - can be removed) */
      .dock-hover-zone {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: rgba(255, 0, 0, 0.1);
        pointer-events: none;
        z-index: 1;
        display: none; /* Hidden by default, can be enabled for debugging */
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
        display: none;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
        display: block;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1600;
        display: none;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;

        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 1600;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Map Popup Styles */
      .map-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 4000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .map-popup-content {
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        padding: 20px;
        max-width: 800px;
        width: 90vw;
        max-height: 80vh;
        font-family: "VT323", monospace;
        color: #fff;
        display: flex;
        flex-direction: column;
      }

      .map-popup-header {
        font-size: 24px;
        margin-bottom: 15px;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .map-popup-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      .map-container {
        flex: 1;
        min-height: 400px;
        border: 1px solid #fff;
        border-radius: 4px;
        margin-bottom: 15px;
        position: relative;
        background: #1a1a1a;
        overflow: visible;
        display: flex;
        flex-direction: column;
      }

      #map {
        width: 100%;
        height: 100%;
        min-height: 400px;
        flex: 1;
        position: relative;
        background: #1a1a1a;
      }

      .map-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        padding: 10px;
        border-radius: 4px;
        z-index: 1000;
      }

      .map-instructions {
        color: #fff;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
      }

      .map-pin-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #ff4444;
        border: 2px solid #fff;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
        z-index: 1001;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .map-pin-button:hover {
        background: #ff6666;
      }

      .map-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .map-input {
        flex: 1;
        min-width: 200px;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 8px 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .map-input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .map-popup-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .map-popup-btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .map-popup-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .coordinates-display {
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 10px;
        text-align: center;
      }
      /* Mobile responsive */
      @media (max-width: 768px) {
        #upload-hand-btn {
          width: 60px;
          height: 60px;
        }

        #upload-hand-btn-text {
          font-size: 8px;
        }

        #upload-hand-btn-img {
          width: 25px;
          height: 25px;
        }
      }

      /* Drawer Modal Styles */
      .drawer-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .drawer-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      .drawer-container {
        position: fixed;
        top: 50%;
        left: 50%;

    <script>
      let scene, camera, renderer, controls;

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
        const group = new THREE.Group();
        const eye = createEyeSprite(eyePath);
        eye.position.copy(eyePos);
        eye.userData.eyeId = eyeId; // Store the eye ID for navigation
        eye.userData.title = labelText; // Store the title for hover display
        group.add(eye);
        // Store for raycasting
        eyeLabelGroups.push({ eye });
        return group;
      }

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          renderOrder: 1,
        });
        const ringMaterial2 = ringMaterial1.clone();
        ringMaterial2.renderOrder = 2;
        const ringMaterial3 = ringMaterial1.clone();
        ringMaterial3.renderOrder = 3;

        // Ring 1 (horizontal, up is +Y)
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
        const group1a = createEyeWithLabel(
          "../../Eyes/Temperament_open.png",
          "Temperature",
          new THREE.Vector3(9, 0, 0),
          new THREE.Vector3(0, 1, 0),
          "eye-temperament"
        );
        const group1b = createEyeWithLabel(
          "../../Eyes/Rhizome_open.png",
          "Rhizome",
          new THREE.Vector3(-9, 0, 0),
          new THREE.Vector3(0, 1, 0),
          "eye-rhizome"
        );
        ring1.add(group1a);
        ring1.add(group1b);
        ring1.position.z = 1;

        // Ring 2 (vertical, up is +Z)
        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
        const group2a = createEyeWithLabel(
          "../../Eyes/Artist_open.png",
          "Creator",
          new THREE.Vector3(0, 9, 0),
          new THREE.Vector3(0, 0, 1),
          "eye-artist"
        );
        const group2b = createEyeWithLabel(
          "../../Eyes/Completeness_open.png",
          "Completeness",
          new THREE.Vector3(0, -9, 0),
          new THREE.Vector3(0, 0, 1),
          "eye-completeness"
        );
        ring2.rotation.x = Math.PI / 2;
        ring2.position.z = 0;
        ring2.add(group2a);
        ring2.add(group2b);

        // Ring 3 (side, up is +X)
        const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
        const group3a = createEyeWithLabel(
          "../../Eyes/SecretGallery_open.png",
          "Gallery",
          new THREE.Vector3(0, 6, 0),
          new THREE.Vector3(1, 0, 0),
          "eye-secret"
        );
        const group3b = createEyeWithLabel(
          "../../Eyes/Intimacy_open.png",
          "Intimacy",
          new THREE.Vector3(0, -6, 0),
          new THREE.Vector3(1, 0, 0),
          "eye-intimacy"
        );
        ring3.rotation.y = Math.PI / 2;
        ring3.position.z = -1;
        ring3.add(group3a);
        ring3.add(group3b);

        ringsGroup.add(ring1);
        ringsGroup.add(ring2);
        ringsGroup.add(ring3);
        return ringsGroup;
      }

      function initRings() {
        // Create separate scene for rings
        ringsScene = new THREE.Scene();
        ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
        ringsCamera.position.z = 20;

        // Create separate renderer for rings
        ringsRenderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          logarithmicDepthBuffer: true,
          preserveDrawingBuffer: true,
        });
        ringsRenderer.setSize(500, 500);
        ringsRenderer.setClearColor(0x000000, 0);
        ringsRenderer.sortObjects = false; // Disable automatic sorting
        document
          .getElementById("rings-container")
          .appendChild(ringsRenderer.domElement);

        // Create and add rings
        rings = createRings();
        ringsScene.add(rings);

        // Add event listeners for rings rotation
        ringsRenderer.domElement.addEventListener(
          "mousedown",
          onRingsMouseDown
        );
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseMove
        );
        ringsRenderer.domElement.addEventListener("mouseup", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("mouseleave", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("click", onRingsClick);
        ringsRaycaster = new THREE.Raycaster();
        ringsMouse = new THREE.Vector2();
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseHover
        );
      }

      class ImageParticle {
        constructor(filename, score, thresholds) {
          this.filename = filename;
          this.score = score;
          this.image = new Image();
          this.image.crossOrigin = "anonymous";
          this.image.src = `../../images2/${filename}`;
          this.image.onload = () => {
            this.loaded = true;
          };
          this.image.onerror = () => {
            this.loaded = false;
          };
          this.loaded = false;

          // Start position is a wide horizontal cloud
          this.startX = Math.random() * (window.innerWidth - 100) + 50;
          this.startY = Math.random() * 120 + 80;
          this.x = this.startX;
          this.y = this.startY;
          this.transitionFrame = 0;
          this.offset = Math.random() * 1000;

          // Jitter parameters mapped to score (solid/liquid/gas analogy)
          const minJitter = 0.2,
            maxJitter = 60;
          const minSpeed = 0.05,
            maxSpeed = 2.5;
          this.jitterAmplitude =
            minJitter +
            ((thresholds.max - this.score) /
              (thresholds.max - thresholds.min)) *
              (maxJitter - minJitter);
          this.jitterSpeed =
            minSpeed +
            ((thresholds.max - this.score) /
              (thresholds.max - thresholds.min)) *
              (maxSpeed - minSpeed);
          this.jitterPhase = Math.random() * Math.PI * 2;

          // Score thresholds for type
          this.type = this.getType(thresholds);
          this.anchorX = this.startX;

          if (this.type === "complete") {
            // Spread complete images from near the bottom to the very bottom
            this.anchorY = this.mapScore(
              this.score,
              thresholds.complete,
              thresholds.max,
              window.innerHeight - 120,
              window.innerHeight - 40
            );
            this.velY = 0;
            // Map accY to score: higher score = higher accY (faster fall)
            const minAccY = 0.08;
            const maxAccY = 0.25;
            const minScore = thresholds.complete;
            const maxScore = thresholds.max;
            this.accY =
              minAccY +
              ((this.score - minScore) / (maxScore - minScore)) *
                (maxAccY - minAccY);
            this.bounced = false;
          } else if (this.type === "mid") {
            // Map score to 20%-90% of screen height (larger range)
            this.anchorY = this.mapScore(
              this.score,
              thresholds.midLow,
              thresholds.midHigh,
              window.innerHeight * 0.2,
              window.innerHeight * 0.9
            );

            // Calculate animation timing based on score position
            // Higher scores (lower end positions) should reach their position first
            // Lower scores (higher end positions) should reach their position last
            const scoreProgress =
              (this.score - thresholds.midLow) /
              (thresholds.midHigh - thresholds.midLow);
            const minDuration = 300; // Fastest animation (top scores)
            const maxDuration = 720; // Slowest animation (bottom scores)
            this.animationDuration =
              minDuration + (1 - scoreProgress) * (maxDuration - minDuration);
            this.transitionDuration = 10; // Much shorter transition to reduce delay
          } else {
            this.anchorY = this.startY; // rough ideas stay up
          }

          this.size = 80;
          this.hoverSize = 800;
          this.currentSize = this.size;
          this.isHovered = false;

          // Z-position for 3D hover effect
          this.z = 0; // Base z position
          this.hoverZ = -50; // Z position when hovered (closer to camera)
          this.currentZ = this.z;
        }

        getType(thresholds) {
          if (this.score <= thresholds.rough) return "rough";
          else if (this.score >= thresholds.complete) return "complete";
          else return "mid";
        }

        mapScore(val, min, max, outMin, outMax) {
          return outMin + ((val - min) / (max - min)) * (outMax - outMin);
        }

        update() {
          if (!this.loaded) return;

          if (this.type === "mid") {
            if (this.transitionFrame < this.animationDuration) {
              let progress = this.transitionFrame / this.animationDuration;
              let eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic

              // Start jittering during the fall with gradually increasing amplitude
              let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
              let jitterIntensity = Math.max(0, (progress - 0.7) / 0.3); // Start jittering in last 30% of fall
              let currentJitterAmplitude =
                this.jitterAmplitude * jitterIntensity;

              // Calculate base falling position
              let baseY = this.lerp(this.startY, this.anchorY, eased);
              let baseX = this.anchorX;

              // Add jitter to the falling motion
              this.y =
                baseY + Math.sin(t + this.jitterPhase) * currentJitterAmplitude;
              this.x =
                baseX + Math.cos(t + this.jitterPhase) * currentJitterAmplitude;

              this.transitionFrame++;
            } else {
              // Full jitter for mid (liquid)
              let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
              this.y =
                this.anchorY +
                Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
              this.x =
                this.anchorX +
                Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
            }
          }

          if (this.type === "complete") {
            // Simulate gravity fall + bounce
            if (!this.bounced) {
              this.velY += this.accY;
              this.y += this.velY;
              if (this.y >= this.anchorY) {
                this.y = this.anchorY;
                this.velY *= -0.3;
                if (Math.abs(this.velY) < 1) {
                  this.bounced = true;
                  this.velY = 0;
                }
              }
            } else {
              // Jitter for complete (solid)
              let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
              this.y =
                this.anchorY +
                Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
              this.x =
                this.anchorX +
                Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
            }
          }

          if (this.type === "rough") {
            // Jitter for rough (gas)
            let t = Date.now() * 0.001 * this.jitterSpeed + this.offset;
            this.y =
              this.anchorY +
              Math.sin(t + this.jitterPhase) * this.jitterAmplitude;
            this.x =
              this.anchorX +
              Math.cos(t + this.jitterPhase) * this.jitterAmplitude;
          }

          // Smooth size and z-position transition for hover effect
          if (this.isHovered) {
            this.currentSize += (this.hoverSize - this.currentSize) * 0.1;
            this.currentZ += (this.hoverZ - this.currentZ) * 0.1;
          } else {
            this.currentSize += (this.size - this.currentSize) * 0.1;
            this.currentZ += (this.z - this.currentZ) * 0.1;
          }
        }

        lerp(a, b, t) {
          return a + (b - a) * t;
        }

        draw(ctx) {
          if (!this.loaded) return;
          ctx.save();
          ctx.globalAlpha = 0.8;
          const halfSize = this.currentSize / 2;
          ctx.drawImage(
            this.image,
            this.x - halfSize,
            this.y - halfSize,
            this.currentSize,
            this.currentSize
          );
          if (this.isHovered) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(
              this.x - 30,
              this.y - this.currentSize / 2 - 30,
              60,
              20
            );
            ctx.fillStyle = "white";
            ctx.font = "12px monospace";
            ctx.textAlign = "center";
            ctx.fillText(
              this.score.toString(),
              this.x,
              this.y - this.currentSize / 2 - 15
            );
          }
          ctx.restore();
        }

        drawWithZoom(ctx, zoomFactor) {
          if (!this.loaded) return;
          ctx.save();
          ctx.globalAlpha = 1.0;

          // Calculate z-based scaling factor (closer to camera = larger)
          const zScaleFactor = 1 + this.currentZ / 100; // Adjust this formula as needed

          // Scale position and size based on zoom and z-position
          const scaledX = this.x * zoomFactor;
          const scaledY = this.y * zoomFactor;
          const scaledSize = this.currentSize * zoomFactor * zScaleFactor;

          // Calculate aspect ratio to maintain original proportions
          const aspectRatio =
            this.image.naturalWidth / this.image.naturalHeight;
          let scaledWidth, scaledHeight;

          if (aspectRatio > 1) {
            // Landscape image
            scaledWidth = scaledSize;
            scaledHeight = scaledSize / aspectRatio;
          } else {
            // Portrait or square image
            scaledHeight = scaledSize;
            scaledWidth = scaledSize * aspectRatio;
          }

          const halfWidth = scaledWidth / 2;
          const halfHeight = scaledHeight / 2;

          ctx.drawImage(
            this.image,
            scaledX - halfWidth,
            scaledY - halfHeight,
            scaledWidth,
            scaledHeight
          );

          if (this.isHovered) {
            const scaledScoreBoxWidth = 60 * zoomFactor;
            const scaledScoreBoxHeight = 20 * zoomFactor;
            const scaledFontSize = 12 * zoomFactor;

            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(
              scaledX - scaledScoreBoxWidth / 2,
              scaledY - halfHeight - scaledScoreBoxHeight - 10 * zoomFactor,
              scaledScoreBoxWidth,
              scaledScoreBoxHeight
            );
            ctx.fillStyle = "white";
            ctx.font = `${scaledFontSize}px monospace`;
            ctx.textAlign = "center";
            ctx.fillText(
              this.score.toString(),
              scaledX,
              scaledY - halfHeight - scaledScoreBoxHeight / 2 - 10 * zoomFactor
            );
          }
          ctx.restore();
        }

        checkHover(mouseX, mouseY) {
          // Calculate aspect ratio to maintain original proportions
          const aspectRatio =
            this.image.naturalWidth / this.image.naturalHeight;
          let width, height;

          if (aspectRatio > 1) {
            // Landscape image
            width = this.currentSize;
            height = this.currentSize / aspectRatio;
          } else {
            // Portrait or square image
            height = this.currentSize;
            width = this.currentSize * aspectRatio;
          }

          const halfWidth = width / 2;
          const halfHeight = height / 2;

          this.isHovered =
            mouseX >= this.x - halfWidth &&
            mouseX <= this.x + halfWidth &&
            mouseY >= this.y - halfHeight &&
            mouseY <= this.y + halfHeight;
        }
      }

      function getScoreThresholds(scores) {
        // Sort scores ascending
        const sorted = [...scores].sort((a, b) => a - b);
        const n = sorted.length;
        return {
          rough: sorted[Math.floor(n * 0.15)], // bottom 15%
          midLow: sorted[Math.floor(n * 0.15)],
          midHigh: sorted[Math.floor(n * 0.85)],
          complete: sorted[Math.floor(n * 0.85)], // top 15%
          max: sorted[n - 1],
          min: sorted[0],
        };
      }

      function preloadAllImages(imageFiles, onAllLoaded) {
        let loadedCount = 0;
        const total = imageFiles.length;
        const images = {};
        imageFiles.forEach((filename) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = `../../images2/${filename}`;
          img.onload = () => {
            loadedCount++;
            images[filename] = img;
            // Update loading UI
            const percent = Math.floor((loadedCount / total) * 100);
            updateLoadingUI(percent);
            if (loadedCount === total) {
              onAllLoaded(images);
            }
          };
          img.onerror = () => {
            loadedCount++;
            images[filename] = null;
            updateLoadingUI(Math.floor((loadedCount / total) * 100));
            if (loadedCount === total) {
              onAllLoaded(images);
            }
          };
        });
      }

          const score = sketchinessScores[filename];
          const particle = new ImageParticle(filename, score, thresholds);
          // Use preloaded image
          if (preloadedImages[filename]) {

            particle.loaded = false;
          }
          imageParticles.push(particle);
        });
        imageCanvas.addEventListener("mousemove", (e) => {
          const rect = imageCanvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          const baseDistance = 100;
          const zoomFactor = baseDistance / camera.position.z;
          const scaledMouseX = mouseX / zoomFactor;
          const scaledMouseY = mouseY / zoomFactor;

          // First, reset all hover states
          imageParticles.forEach((particle) => {
            particle.isHovered = false;
          });

          // Find the most prominent image under the cursor (closest to center)
          let mostProminentParticle = null;
          let minDistanceToCenter = Infinity;

          imageParticles.forEach((particle) => {
            const aspectRatio =
              particle.image.naturalWidth / particle.image.naturalHeight;
            let width, height;
            if (aspectRatio > 1) {
              width = particle.currentSize;
              height = particle.currentSize / aspectRatio;
            } else {
              height = particle.currentSize;
              width = particle.currentSize * aspectRatio;
            }
            const halfWidth = width / 2;
            const halfHeight = height / 2;

            // Check if mouse is within this particle's bounds
            if (
              scaledMouseX >= particle.x - halfWidth &&
              scaledMouseX <= particle.x + halfWidth &&
              scaledMouseY >= particle.y - halfHeight &&
              scaledMouseY <= particle.y + halfHeight
            ) {
              // Calculate distance from mouse to particle center
              const distanceToCenter = Math.sqrt(
                Math.pow(scaledMouseX - particle.x, 2) +
                  Math.pow(scaledMouseY - particle.y, 2)
              );

              // Select the particle whose center is closest to the mouse
              if (distanceToCenter < minDistanceToCenter) {
                minDistanceToCenter = distanceToCenter;
                mostProminentParticle = particle;
              }
            }
          });

          // Only hover the most prominent particle
          if (mostProminentParticle) {
            mostProminentParticle.isHovered = true;

        });

        // Add click event listener for drawer modal
        imageCanvas.addEventListener("click", (e) => {

          }

          const rect = imageCanvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          const baseDistance = 100;
          const zoomFactor = baseDistance / camera.position.z;
          const scaledMouseX = mouseX / zoomFactor;
          const scaledMouseY = mouseY / zoomFactor;

          // Find all particles under cursor and select the most appropriate one
          let selectedParticle = null;
          let hoveredParticle = null;
          let largestParticle = null;
          let maxSize = 0;

          for (const particle of imageParticles) {
            const aspectRatio =
              particle.image.naturalWidth / particle.image.naturalHeight;
            let width, height;
            if (aspectRatio > 1) {
              width = particle.currentSize;
              height = particle.currentSize / aspectRatio;
            } else {
              height = particle.currentSize;
              width = particle.currentSize * aspectRatio;
            }
            const halfWidth = width / 2;
            const halfHeight = height / 2;
            if (
              scaledMouseX >= particle.x - halfWidth &&
              scaledMouseX <= particle.x + halfWidth &&
              scaledMouseY >= particle.y - halfHeight &&
              scaledMouseY <= particle.y + halfHeight
            ) {
              // Track the largest particle under cursor
              const area = width * height;
              if (area > maxSize) {
                maxSize = area;
                largestParticle = particle;
              }

              // Track if any particle is currently hovered
              if (particle.isHovered) {
                hoveredParticle = particle;
              }
            }
          }

          // Priority: 1) Hovered particle, 2) Largest particle
          if (hoveredParticle) {
            selectedParticle = hoveredParticle;
          } else if (largestParticle) {
            selectedParticle = largestParticle;
          }

          if (selectedParticle) {

              /\.[^/.]+$/,

              score: selectedParticle.score,
              completeness: selectedParticle.score,
              filename: selectedParticle.filename,
              signedBy: dfItem?.["@creator"] || "Anonymous",
              zone: dfItem?.location || "Unknown",
              exactSpot: dfItem?.exact_spot || "Unknown",
              date: dfItem?.date_stamp || "Unknown",
              daytime: dfItem?.daytime_icon || "Unknown",
              context:
                dfItem?.context ||
                `This artwork has a completeness score of ${selectedParticle.score}. The higher the score, the more complete the artwork appears to be.`,
              tags: dfItem?.keywords || ["completeness", "artwork", "digital"],
            };
            createDrawerModal(artworkData, selectedParticle);
          }
        });
      }

      // Rings event handlers
      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              window.location.href = "../temperament/temperament.html";
              break;
            case "eye-secret":
              window.location.href = "../hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              window.location.href = "../intimacy/Intimacy.html";
              break;
            case "eye-completeness":
              // Already on completeness page
              break;
            case "eye-artist":
              window.location.href = "../Artists/Artist.html";
              break;
            case "eye-rhizome":
              window.location.href = "../rhizome/rhizome.html";
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      function animateImages() {
        imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
        const baseDistance = 100;
        const zoomFactor = baseDistance / camera.position.z;

        // Update all particles first
        let loadedCount = 0;
        imageParticles.forEach((particle) => {
          particle.update();
          if (particle.loaded) loadedCount++;
        });

        // Draw non-hovered images first (background)
        imageParticles.forEach((particle) => {
          if (!particle.isHovered) {
            particle.drawWithZoom(imageCtx, zoomFactor);
          }
        });

        // Draw hovered images last (foreground)
        imageParticles.forEach((particle) => {
          if (particle.isHovered) {
            particle.drawWithZoom(imageCtx, zoomFactor);
          }
        });

        // Log loading progress occasionally
        if (Math.random() < 0.01) {
          console.log(`Loaded: ${loadedCount}/${imageParticles.length} images`);
        }

        requestAnimationFrame(animateImages);
      }

      function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set black background immediately

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 100;

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        
                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        
                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        
                        // Apply vignette
                        color.rgb *= vignette;
                        
                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);

        // Resize image canvas
        imageCanvas.width = window.innerWidth;
        imageCanvas.height = window.innerHeight;

        // Resize rings renderer if it exists
        if (ringsRenderer) {
          ringsRenderer.setSize(500, 500);
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        // Update floating eye
        updateFloatingEye();

        controls.update();
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      // macOS Dock-like functionality
      function initDockBehavior() {
        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );
        const blackPopupOverlay = document.getElementById(
          "black-popup-overlay"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px) - increased for easier access

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");
        blackPopupOverlay.classList.add("dock-hidden");

        // All UI elements start hidden until loading is complete
        // They will be shown in the startVisualization function

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;
            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");
            blackPopupOverlay.classList.remove("dock-hidden");
            blackPopupOverlay.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");
            blackPopupOverlay.classList.remove("dock-visible");
            blackPopupOverlay.classList.add("dock-hidden");

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior - only trigger on pixel arrow hover
        document.addEventListener("mousemove", (e) => {
          const pixelArrow = document.getElementById("pixel-arrow-indicator");
          if (!pixelArrow) return;

          const arrowRect = pixelArrow.getBoundingClientRect();
          const mouseX = e.clientX;
          const mouseY = e.clientY;

          // Check if mouse is over the pixel arrow
          const isOverArrow =
            mouseX >= arrowRect.left &&
            mouseX <= arrowRect.right &&
            mouseY >= arrowRect.top &&
            mouseY <= arrowRect.bottom;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isOverArrow) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          // Recalculate hover zone if needed
        });
      }
