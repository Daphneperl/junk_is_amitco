        const backBtn = document.getElementById("persistent-back-btn");
        const skipBtn = document.getElementById("persistent-skip-btn");
        const finishBtn = document.getElementById("persistent-finish-btn");
        const textInput = document.getElementById("persistent-text-input");

        if (sendBtn) {
          sendBtn.onclick = () => handleAnswer();
        }
        if (backBtn) {
          backBtn.onclick = () => goBack();
        }
        if (skipBtn) {
          skipBtn.onclick = () => skipQuestion();
        }
        if (finishBtn) {
          finishBtn.onclick = () => finishChatbot();
        }
        if (textInput) {
          textInput.onkeypress = (e) => {
            if (e.key === "Enter") {
              handleAnswer();
            }
          };
        }

        // Set up specific input type listeners
        switch (question.type) {
          case "slider":
            const slider = document.getElementById("slider-input");
            const sliderValue = document.getElementById("slider-value");
            if (slider && sliderValue) {
              slider.oninput = (e) => {
                sliderValue.textContent = e.target.value + "%";
              };
            }
            break;
          case "time_slider":
            const timeSlider = document.getElementById("time-slider-input");
            if (timeSlider) {
              timeSlider.oninput = (e) => {
                const value = parseFloat(e.target.value);
                let timeLabel = "";
                if (value <= 1) timeLabel = "Dawn";
                else if (value <= 2) timeLabel = "Noon";
                else if (value <= 3) timeLabel = "Dusk";
                else timeLabel = "Midnight";
                // You can update a display element here if needed
              };
            }
            break;
          case "tags":
            const tags = document.querySelectorAll(".tag");
            tags.forEach((tag) => {
              tag.onclick = () => {
                tag.classList.toggle("selected");
              };
            });
            break;
        }
      }

      function handleFileUpload(file) {
        const fileUploadArea = document.getElementById("file-upload-area");
        const continueBtn = document.getElementById("continue-btn");
        const uploadIcon = document.getElementById("upload-icon");
        const uploadText = document.getElementById("file-upload-text");

        if (file && file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (e) => {
            // Create preview image
            const img = document.createElement("img");
            img.src = e.target.result;
            img.className = "uploaded-image";

            // Clear existing content and add preview
            fileUploadArea.innerHTML = "";
            fileUploadArea.appendChild(img);
            fileUploadArea.appendChild(uploadText);

            // Enable continue button
            continueBtn.disabled = false;
            continueBtn.style.opacity = "1";
            continueBtn.style.cursor = "pointer";

            // Store the file
            chatbotState.answers.upload = file;

            // Add click handler to continue
            continueBtn.onclick = () => {
              chatbotState.currentQuestion++;
              askNextQuestion();
            };
          };
          reader.readAsDataURL(file);
        }
      }

      function handleAnswer() {
        const question = questions[chatbotState.currentQuestion];
        const textInput = document.getElementById("persistent-text-input");

        if (question.type === "text" || question.type === "textarea") {
          const answer = textInput.value.trim();
          if (answer) {
            chatbotState.answers[question.id] = answer;
            addUserMessage(answer);
            textInput.value = "";
            chatbotState.currentQuestion++;
            askNextQuestion();
          }
        }
      }

      function skipQuestion() {
        chatbotState.currentQuestion++;
        askNextQuestion();
      }

      function goBack() {
        if (chatbotState.currentQuestion > 0) {
          chatbotState.currentQuestion--;
          askNextQuestion();
        }
      }

      function finishChatbot() {
        showSummary();
      }

      function showSummary() {
        const messagesContainer = document.getElementById("chatbot-messages");
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );

        // Clear dynamic input
        dynamicContainer.innerHTML = "";
        disablePersistentInput();

        // Show summary
        addBotMessage("Here's what you've shared:");

        const summaryDiv = document.createElement("div");
        summaryDiv.className = "message bot";
        summaryDiv.innerHTML = `
            <div class="summary-screen">
                ${Object.entries(chatbotState.answers)
                  .map(
                    ([key, value]) => `
                    <div class="summary-item">
                        <span class="summary-label">${key}:</span>
                        <span class="summary-value">${value}</span>
                    </div>
                `
                  )
                  .join("")}
            </div>
        `;
        messagesContainer.appendChild(summaryDiv);

        // Add finish message
        setTimeout(() => {
          addBotMessage(
            "Thanks for sharing your junk! It's been added to the collection."
          );
        }, 1000);
      }

      // Map functions
      function initGoogleMaps() {
        mapState.googleMapsLoaded = true;
      }

      function showMapPopup() {
        const mapPopup = document.getElementById("map-popup-overlay");
        mapPopup.style.display = "flex";

        if (!mapState.map) {
          initMap();
        }
      }

      function closeMapPopup() {
        const mapPopup = document.getElementById("map-popup-overlay");
        mapPopup.style.display = "none";
      }

      function initMap() {
        if (!mapState.googleMapsLoaded) return;

        const mapElement = document.getElementById("map");
        mapState.map = new google.maps.Map(mapElement, {
          center: { lat: 0, lng: 0 },
          zoom: 2,
          styles: [
            { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
            {
              elementType: "labels.text.stroke",
              stylers: [{ color: "#242f3e" }],
            },
            {
              elementType: "labels.text.fill",
              stylers: [{ color: "#746855" }],
            },
            {
              featureType: "administrative.locality",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "poi",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "poi.park",
              elementType: "geometry",
              stylers: [{ color: "#263c3f" }],
            },
            {
              featureType: "poi.park",
              elementType: "labels.text.fill",
              stylers: [{ color: "#6b9a76" }],
            },
            {
              featureType: "road",
              elementType: "geometry",
              stylers: [{ color: "#38414e" }],
            },
            {
              featureType: "road",
              elementType: "geometry.stroke",
              stylers: [{ color: "#212a37" }],
            },
            {
              featureType: "road",
              elementType: "labels.text.fill",
              stylers: [{ color: "#9ca5b3" }],
            },
            {
              featureType: "road.highway",
              elementType: "geometry",
              stylers: [{ color: "#746855" }],
            },
            {
              featureType: "road.highway",
              elementType: "geometry.stroke",
              stylers: [{ color: "#1f2835" }],
            },
            {
              featureType: "road.highway",
              elementType: "labels.text.fill",
              stylers: [{ color: "#f3d19c" }],
            },
            {
              featureType: "transit",
              elementType: "geometry",
              stylers: [{ color: "#2f3948" }],
            },
            {
              featureType: "transit.station",
              elementType: "labels.text.fill",
              stylers: [{ color: "#d59563" }],
            },
            {
              featureType: "water",
              elementType: "geometry",
              stylers: [{ color: "#17263c" }],
            },
            {
              featureType: "water",
              elementType: "labels.text.fill",
              stylers: [{ color: "#515c6d" }],
            },
            {
              featureType: "water",
              elementType: "labels.text.stroke",
              stylers: [{ color: "#17263c" }],
            },
          ],
        });

        // Add click listener to map
        mapState.map.addListener("click", (event) => {
          const lat = event.latLng.lat();
          const lng = event.latLng.lng();

          // Update marker
          if (mapState.marker) {
            mapState.marker.setMap(null);
          }

          mapState.marker = new google.maps.Marker({
            position: { lat, lng },
            map: mapState.map,
          });

          mapState.selectedLocation = { lat, lng };

          // Update coordinates display
          const coordinatesDisplay = document.getElementById(
            "coordinates-display"
          );
          coordinatesDisplay.textContent = `Selected: ${lat.toFixed(
            6
          )}, ${lng.toFixed(6)}`;
        });

        // Set up autocomplete
        const searchInput = document.getElementById("map-search-input");
        if (searchInput) {
          mapState.autocomplete = new google.maps.places.Autocomplete(
            searchInput
          );
          mapState.autocomplete.addListener("place_changed", () => {
            const place = mapState.autocomplete.getPlace();
            if (place.geometry) {
              mapState.map.setCenter(place.geometry.location);
              mapState.map.setZoom(15);

              // Add marker
              if (mapState.marker) {
                mapState.marker.setMap(null);
              }

              mapState.marker = new google.maps.Marker({
                position: place.geometry.location,
                map: mapState.map,
              });

              mapState.selectedLocation = {
                lat: place.geometry.location.lat(),
                lng: place.geometry.location.lng(),
              };

              // Update coordinates display
              const coordinatesDisplay = document.getElementById(
                "coordinates-display"
              );
              coordinatesDisplay.textContent = `Selected: ${place.geometry.location
                .lat()
                .toFixed(6)}, ${place.geometry.location.lng().toFixed(6)}`;
            }
          });
        }
      }

      function searchLocation() {
        const searchInput = document.getElementById("map-search-input");
        if (searchInput && mapState.autocomplete) {
          const geocoder = new google.maps.Geocoder();
          geocoder.geocode(
            { address: searchInput.value },
            (results, status) => {
              if (status === "OK" && results[0]) {
                const location = results[0].geometry.location;
                mapState.map.setCenter(location);
                mapState.map.setZoom(15);

                // Add marker
                if (mapState.marker) {
                  mapState.marker.setMap(null);
                }

                mapState.marker = new google.maps.Marker({
                  position: location,
                  map: mapState.map,
                });

                mapState.selectedLocation = {
                  lat: location.lat(),
                  lng: location.lng(),
                };

                // Update coordinates display
                const coordinatesDisplay = document.getElementById(
                  "coordinates-display"
                );
                coordinatesDisplay.textContent = `Selected: ${location
                  .lat()
                  .toFixed(6)}, ${location.lng().toFixed(6)}`;
              }
            }
          );
        }
      }

      function confirmLocation() {
        if (mapState.selectedLocation) {
          chatbotState.answers.location = mapState.selectedLocation;
          closeMapPopup();
          chatbotState.currentQuestion++;
          askNextQuestion();
        }
      }

      // Event listeners will be set up after loading is complete

      // Setup event listeners function
      function setupEventListeners() {
        const searchBar = document.getElementById("search-bar");

        if (searchBar) {
          searchBar.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
              const query = event.target.value.trim();
              if (query.length > 0) {
                performSearch(query);
              }
            }
          });
        }

        // Add click event listener to upload button
        const uploadBtn = document.getElementById("upload-hand-btn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", showChatbot);

          // Add hover functionality for hand image
          const handImg = document.getElementById("upload-hand-btn-img");
          if (handImg) {
            uploadBtn.addEventListener("mouseenter", () => {
              handImg.src = "../../assets/ClosedHand.png";
            });

            uploadBtn.addEventListener("mouseleave", () => {
              handImg.src = "../../assets/OpenHand.png";
            });
          }
        }

        // Close chatbot with Escape key
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeChatbot();
          }
        });

        // Close chatbot when clicking on backdrop
        const backdrop = document.getElementById("chatbot-backdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) {
              closeChatbot();
            }
          });
        }
      }

      // Dock behavior will be initialized after loading is complete

      // Start the visualization when the page loads
      window.addEventListener("load", startVisualization);

      // Add Escape key listener for closing focus mode
      // Drawer Modal Functions
      function createDrawerModal(artworkData, particle) {
        // Remove existing drawer modal if any
        const existingModal = document.querySelector(".drawer-backdrop");
        if (existingModal) {
          existingModal.remove();
        }

        // Create backdrop
        const backdrop = document.createElement("div");
        backdrop.className = "drawer-backdrop";

        // Create drawer container
        const drawerContainer = document.createElement("div");
        drawerContainer.className = "drawer-container";

        // Create close button
        const closeButton = document.createElement("button");
        closeButton.className = "drawer-close";
        closeButton.innerHTML = "×";
        closeButton.onclick = closeDrawerModal;

        // Create artwork section
        const artworkSection = document.createElement("div");
        artworkSection.className = "drawer-artwork";
        const artworkImg = document.createElement("img");
        artworkImg.src = `../../images2/${artworkData.image}`;
        artworkImg.alt = artworkData.title || "Artwork";

        // Handle image loading to ensure proper sizing for elongated images
        artworkImg.onload = function () {
          const img = this;
          const aspectRatio = img.naturalWidth / img.naturalHeight;
          const isMobile = window.innerWidth <= 768;

          // Adjust max dimensions based on screen size
          const maxWidth = isMobile
            ? window.innerWidth * 0.95
            : window.innerWidth * 0.45;
          const maxHeight = isMobile
            ? window.innerHeight * 0.5
            : window.innerHeight * 0.8;

          let displayWidth, displayHeight;

          if (aspectRatio > 1) {
            // Landscape image - fit to width
            displayWidth = Math.min(maxWidth, img.naturalWidth);
            displayHeight = displayWidth / aspectRatio;
            if (displayHeight > maxHeight) {
              displayHeight = maxHeight;
              displayWidth = displayHeight * aspectRatio;
            }
          } else {
            // Portrait or square image - fit to height first
            displayHeight = Math.min(maxHeight, img.naturalHeight);
            displayWidth = displayHeight * aspectRatio;
            if (displayWidth > maxWidth) {
              displayWidth = maxWidth;
              displayHeight = displayWidth / aspectRatio;
            }
          }

          img.style.width = displayWidth + "px";
          img.style.height = displayHeight + "px";
          img.style.maxWidth = "none";
          img.style.maxHeight = "none";
        };

        artworkImg.onerror = function () {
          artworkSection.innerHTML =
            '<div style="color: #666; font-size: 16px;">Image not available</div>';
        };
        artworkSection.appendChild(artworkImg);

        // Create info section
        const infoSection = document.createElement("div");
        infoSection.className = "drawer-info";

        // Create info content
        infoSection.innerHTML = `
          <div class="drawer-field">
            <div class="drawer-label">Title</div>
            <div class="drawer-value">${
              artworkData.title || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Date stamp</div>
            <div class="drawer-value">${
              artworkData.date || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Signed by</div>
            <div class="drawer-value">${
              artworkData.signedBy || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Zone</div>
            <div class="drawer-value">${
              artworkData.zone || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Exact spot</div>
            <div class="drawer-value">${
              artworkData.exactSpot || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Rawness</div>
            <div class="drawer-value">${
              artworkData.completeness || "Not specified"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Daytime</div>
            <div class="drawer-value">${
              artworkData.daytime || "Not specified"
            }</div>
          </div>
          <div class="drawer-field full-width">
            <div class="drawer-label">Context</div>
            <div class="drawer-context">${
              artworkData.context || "No context provided"
            }</div>
          </div>
          <div class="drawer-field full-width">
            <div class="drawer-label">Vibes/Tags</div>
            <div class="drawer-tags">
              ${
                artworkData.tags && artworkData.tags.length > 0
                  ? artworkData.tags
                      .map((tag) => `<span class="drawer-tag">${tag}</span>`)
                      .join("")
                  : '<span class="drawer-tag">No tags</span>'
              }
            </div>
          </div>
        `;

        // Assemble the modal
        drawerContainer.appendChild(closeButton);
        drawerContainer.appendChild(artworkSection);
        drawerContainer.appendChild(infoSection);
        backdrop.appendChild(drawerContainer);
        document.body.appendChild(backdrop);

        // Add click outside to close
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) {
            closeDrawerModal();
          }
        });

        // Add escape key to close
        const escapeHandler = function (e) {
          if (e.key === "Escape") {
            closeDrawerModal();
            document.removeEventListener("keydown", escapeHandler);
          }
        };
        document.addEventListener("keydown", escapeHandler);

        // Animate in
        requestAnimationFrame(() => {
          backdrop.classList.add("show");
          requestAnimationFrame(() => {
            drawerContainer.classList.add("show");
          });
        });

        // Store reference to particle for potential future use
        backdrop.particle = particle;
      }

      function closeDrawerModal() {
        const backdrop = document.querySelector(".drawer-backdrop");
        if (backdrop) {
          const container = backdrop.querySelector(".drawer-container");
          container.classList.remove("show");
          backdrop.classList.remove("show");

          // Remove after animation
          setTimeout(() => {
            backdrop.remove();
          }, 400);
        }
      }
    </script>
  </body>
