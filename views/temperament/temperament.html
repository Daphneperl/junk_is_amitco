<!DOCTYPE html>
<html>
  <head>
    <title>Temperament Scores Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
      #score-overlay {
        position: absolute;
        color: white;
        font-family: "Pixel", monospace;
        padding: 5px;
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 3px;
        pointer-events: none; /* Allows mouse events to pass through */
        display: none; /* Hide by default */
        z-index: 100; /* Ensure it's above the canvas */
        transform: translate(-50%, -100%); /* Position above the cursor */
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          visibility 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        opacity: 0;
        visibility: hidden;
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          visibility 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          visibility 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Galaxy Navigation Button */
      #galaxy-nav-btn {
        position: fixed;
        top: 20px;
        left: 25px;
        width: 40px;
        height: 40px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        padding: 0;
      }

      #galaxy-nav-btn:hover {
        transform: scale(1.1);
      }

      #galaxy-nav-btn:active {
        transform: scale(0.95);
      }

      #galaxy-nav-btn img {
        width: 60px;
        height: 60px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }

      #galaxy-nav-btn:hover img {
        opacity: 1;
      }

      /* Drawer Modal Styles */
      .drawer-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .drawer-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      .drawer-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        z-index: 3001;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: flex;
        align-items: flex-start;
        gap: 20px;
        max-width: 95vw;
        max-height: 90vh;
        justify-content: center;
        position: relative;
      }

      .drawer-container.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .drawer-artwork {
        position: relative;
        width: auto;
        height: auto;
        max-width: 45vw;
        max-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        overflow: hidden;
        z-index: 2;
        flex-shrink: 0;
      }

      .drawer-artwork img {
        object-fit: contain;
        border-radius: 4px;
        display: block;
      }

      .drawer-info {
        position: relative;
        width: 350px;
        height: auto;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 20px;
        font-family: "Overpass Mono", monospace;
        color: #fff;
        font-size: 14px;
        transform: translateX(-100%);
        transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 1;
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .drawer-container.show .drawer-info {
        transform: translateX(0);
      }

      .drawer-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .drawer-field.full-width {
        grid-column: 1 / -1;
      }

      .drawer-close {
        position: absolute;
        top: -40px;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        font-family: "VT323", monospace;
        z-index: 3002;
        opacity: 0;
        transition: opacity 0.3s ease;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      .drawer-close:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .drawer-container.show .drawer-close {
        opacity: 1;
      }

      .drawer-label {
        font-weight: bold;
        font-family: "Overpass Mono", monospace;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .drawer-value {
        font-weight: normal;
        font-family: "Overpass Mono", monospace;
        font-style: italic;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        color: rgba(255, 255, 255, 0.7);
      }

      .drawer-context {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 12px;
        min-height: 80px;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 4px;
      }

      .drawer-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .drawer-tag {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        padding: 4px 10px;
        font-size: 11px;
        white-space: nowrap;
        transition: all 0.2s ease;
      }

      .drawer-tag:hover {
        background: rgba(255, 255, 255, 0.2);

    <script>
      let scene, camera, renderer, controls;

      function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set black background immediately

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 100;

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                          varying vec2 vUv;
                          void main() {
                              vUv = uv;
                              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                          }
                      `,
          fragmentShader: `
                          uniform sampler2D tDiffuse;
                          uniform float offset;
                          uniform float darkness;
                          varying vec2 vUv;

                          void main() {
                              vec2 uv = vUv;
                              vec4 color = texture2D(tDiffuse, uv);

                              // Calculate distance from center
                              vec2 center = vec2(0.5, 0.5);
                              float dist = distance(uv, center);

                              // Create vignette effect
                              float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));

                              // Apply vignette
                              color.rgb *= vignette;

                              gl_FragColor = color;
                          }
                      `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Initialize raycaster for mouse interaction
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Initialize camera position tracking for click detection
        artworkClickState.lastCameraPosition = camera.position.clone();
        artworkClickState.lastCameraRotation = camera.rotation.clone();

        // Add click event listener to the renderer
        renderer.domElement.addEventListener("click", onArtworkClick);

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);

        // Initialize rings
        initRings();
      }

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {
        const group = new THREE.Group();
        const eye = createEyeSprite(eyePath);
        eye.position.copy(eyePos);
        eye.userData.eyeId = eyeId; // Store the eye ID for navigation
        eye.userData.title = labelText; // Store the title for hover display
        group.add(eye);
        // Store for raycasting
        eyeLabelGroups.push({ eye });
        return group;
      }

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          renderOrder: 1,
        });
        const ringMaterial2 = ringMaterial1.clone();
        ringMaterial2.renderOrder = 2;
        const ringMaterial3 = ringMaterial1.clone();
        ringMaterial3.renderOrder = 3;

        // Ring 1 (horizontal, up is +Y)
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
        const group1a = createEyeWithLabel(
          "../../Eyes/Temperament_open.png",
          "Temperament",
          new THREE.Vector3(9, 0, 0),
          new THREE.Vector3(0, 1, 0),
          "eye-temperament"
        );
        const group1b = createEyeWithLabel(
          "../../Eyes/Rhizome_open.png",
          "Rhizome",
          new THREE.Vector3(-9, 0, 0),
          new THREE.Vector3(0, 1, 0),
          "eye-rhizome"
        );
        ring1.add(group1a);
        ring1.add(group1b);
        ring1.position.z = 1;

        // Ring 2 (vertical, up is +Z)
        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
        const group2a = createEyeWithLabel(
          "../../Eyes/Artist_open.png",
          "Artist",
          new THREE.Vector3(0, 9, 0),
          new THREE.Vector3(0, 0, 1),
          "eye-artist"
        );
        const group2b = createEyeWithLabel(
          "../../Eyes/Completeness_open.png",
          "Completeness",
          new THREE.Vector3(0, -9, 0),
          new THREE.Vector3(0, 0, 1),
          "eye-completeness"
        );
        ring2.rotation.x = Math.PI / 2;
        ring2.position.z = 0;
        ring2.add(group2a);
        ring2.add(group2b);

        // Ring 3 (side, up is +X)
        const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
        const group3a = createEyeWithLabel(
          "../../Eyes/SecretGallery_open.png",
          "idk",
          new THREE.Vector3(0, 6, 0),
          new THREE.Vector3(1, 0, 0),
          "eye-secret"
        );
        const group3b = createEyeWithLabel(
          "../../Eyes/Intimacy_open.png",
          "Intimacy",
          new THREE.Vector3(0, -6, 0),
          new THREE.Vector3(1, 0, 0),
          "eye-intimacy"
        );
        ring3.rotation.y = Math.PI / 2;
        ring3.position.z = -1;
        ring3.add(group3a);
        ring3.add(group3b);

        ringsGroup.add(ring1);
        ringsGroup.add(ring2);

        return ringsGroup;
      }

      function initRings() {
        // Create separate scene for rings
        ringsScene = new THREE.Scene();
        ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
        ringsCamera.position.z = 20;

        // Create separate renderer for rings
        ringsRenderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          logarithmicDepthBuffer: true,
          preserveDrawingBuffer: true,
        });
        ringsRenderer.setSize(500, 500);
        ringsRenderer.setClearColor(0x000000, 0);
        ringsRenderer.sortObjects = false; // Disable automatic sorting
        document
          .getElementById("rings-container")
          .appendChild(ringsRenderer.domElement);

        // Create and add rings
        rings = createRings();
        ringsScene.add(rings);

        // Add event listeners for rings rotation
        ringsRenderer.domElement.addEventListener(
          "mousedown",
          onRingsMouseDown
        );
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseMove
        );
        ringsRenderer.domElement.addEventListener("mouseup", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("mouseleave", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("click", onRingsClick);
        ringsRaycaster = new THREE.Raycaster();
        ringsMouse = new THREE.Vector2();
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseHover
        );
      }

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              // Already on temperament page
              break;
            case "eye-secret":
              window.location.href = "../hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              window.location.href = "../intimacy/Intimacy.html";
              break;
            case "eye-completeness":
              window.location.href = "../Completeness/Completeness.html";
              break;
            case "eye-artist":
              window.location.href = "../Artists/Artist.html";
              break;
            case "eye-rhizome":
              window.location.href = "../rhizome/rhizome.html";
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      // Organic Floating Eye Animation
      function initFloatingEye() {
        console.log("Initializing floating eye...");
        const eye = document.getElementById("floating-eye");
        const tooltip = document.getElementById("eye-tooltip");

        console.log("Eye element:", eye);
        console.log("Tooltip element:", tooltip);

        if (!eye || !tooltip) {
          console.error("Missing elements!");
          return;
        }

        // Set up hover events
        eye.addEventListener("mouseenter", () => {
          console.log("Eye hovered!");
          eyeIsHovered = true;
          tooltip.classList.add("show");
        });

        eye.addEventListener("mouseleave", () => {
          console.log("Eye unhovered!");
          eyeIsHovered = false;
          tooltip.classList.remove("show");
        });

        // Update tooltip position
        eye.addEventListener("mousemove", (e) => {
          const rect = eye.getBoundingClientRect();
          const eyeCenterX = rect.left + rect.width / 2;
          const screenCenterX = window.innerWidth / 2;

          // Determine if eye is on left or right side of screen
          if (eyeCenterX < screenCenterX) {
            // Eye is on left side - show tooltip on the right
            tooltip.style.left = rect.right + 10 + "px";
            tooltip.style.transform = "translateX(0)"; // Reset transform
          } else {
            // Eye is on right side - show tooltip on the left
            tooltip.style.left = rect.left - 10 + "px";
            tooltip.style.transform = "translateX(-100%)"; // Move tooltip to the left of the eye
          }

          tooltip.style.top = rect.top - 10 + "px";
        });

        // Set initial position
        eye.style.left = eyeX + "px";
        eye.style.top = eyeY + "px";

        // Show the floating eye after initialization
        eye.style.display = "block";

        console.log("Eye positioned at:", eyeX, eyeY);
        console.log("Eye should be visible now!");

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      function initDockBehavior() {
        if (dockInitialized) return; // Prevent multiple initializations
        dockInitialized = true;

        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px) - increased for easier access

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");

        // Dock elements are already hidden via CSS opacity: 0 and visibility: hidden

        // Pixel arrow indicator will be shown after visualization loads

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;

            // Show the dock elements with smooth transitions
            ringsContainer.style.visibility = "visible";
            ringsContainer.style.opacity = "1";
            searchBar.style.visibility = "visible";
            searchBar.style.opacity = "1";
            uploadBtn.style.visibility = "visible";
            uploadBtn.style.opacity = "1";

            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");

            // Hide the dock elements with smooth transitions
            ringsContainer.style.opacity = "0";
            searchBar.style.opacity = "0";
            uploadBtn.style.opacity = "0";

            // Hide visibility after transition completes
            setTimeout(() => {
              if (!isDockVisible) {
                ringsContainer.style.visibility = "hidden";
                searchBar.style.visibility = "hidden";
                uploadBtn.style.visibility = "hidden";
              }
            }, 400);

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior
        document.addEventListener("mousemove", (e) => {
          const mouseY = e.clientY;
          const windowHeight = window.innerHeight;
          const isInHoverZone = mouseY > windowHeight - hoverZoneHeight;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isInHoverZone) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          // Recalculate hover zone if needed
        });
      }

      function createImageSprite(
        imageUrl,
        position,
        scores,
        normalizedScore,
        filename
      ) {
        return new Promise((resolve, reject) => {
          const textureLoader = new THREE.TextureLoader();
          textureLoader.load(
            imageUrl,
            (texture) => {
              const material = new THREE.SpriteMaterial({ map: texture });
              const sprite = new THREE.Sprite(material);
              sprite.position.set(position.x, position.y, position.z);

              // Calculate aspect ratio and maintain original proportions
              const aspectRatio = texture.image.width / texture.image.height;
              const baseSize = 5; // Base size for the larger dimension
              const width = aspectRatio > 1 ? baseSize : baseSize * aspectRatio;
              const height =
                aspectRatio > 1 ? baseSize / aspectRatio : baseSize;

              sprite.scale.set(width, height, 1);
              sprite.userData = {
                originalScale: { width, height },
                aspectRatio: aspectRatio,
                scores: scores,
                filename: filename,
              };

              // Calculate sprite dimensions once
              const spriteWidth = width; // Use the original calculated width of the sprite
              const spriteHeight = height; // Use the original calculated height of the sprite

              // Create colored squares as sprites that always face the camera
              const squareSize = width * 0.05; // Make square 5% of image width

              // Calculate colors based on normalized score (blue to red)
              const blue = new THREE.Color(0x0000ff); // Blue
              const red = new THREE.Color(0xff0000); // Red
              const squareColor = blue.clone().lerp(red, normalizedScore);

              // Create canvas for the square sprite
              const createSquareSprite = (color) => {
                const canvas = document.createElement("canvas");
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext("2d");

                // Create gradient from bottom to top
                const gradient = ctx.createLinearGradient(0, 0, 0, 64);
                gradient.addColorStop(
                  0,
                  `rgba(${Math.floor(color.r * 255)}, ${Math.floor(
                    color.g * 255
                  )}, ${Math.floor(color.b * 255)}, 0.8)`
                );
                gradient.addColorStop(
                  1,
                  `rgba(${Math.floor(color.r * 255 + 50)}, ${Math.floor(
                    color.g * 255 + 50
                  )}, ${Math.floor(color.b * 255 + 50)}, 0.8)`
                );

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;

                const spriteMaterial = new THREE.SpriteMaterial({
                  map: texture,
                  transparent: true,
                  opacity: 0.7,
                  blending: THREE.AdditiveBlending,
                  depthWrite: false,
                });

                return new THREE.Sprite(spriteMaterial);
              };

              // Create the right square sprite
              const rightSquare = createSquareSprite(squareColor);
              const offsetXRight = spriteWidth / 2 + squareSize / 2;
              rightSquare.position.set(offsetXRight, 0, 0.01);
              rightSquare.scale.set(squareSize, squareSize, 1);
              sprite.add(rightSquare);

              // Create the left square sprite
              const leftSquare = createSquareSprite(squareColor);
              const offsetXLeft = -offsetXRight;
              leftSquare.position.set(offsetXLeft, 0, 0.01);
              leftSquare.scale.set(squareSize, squareSize, 1);
              sprite.add(leftSquare);

              // Create the bottom square sprite
              const bottomSquare = createSquareSprite(squareColor);
              const offsetYBottom = -(spriteHeight / 2) - squareSize / 2;
              bottomSquare.position.set(0, offsetYBottom, 0.01);
              bottomSquare.scale.set(squareSize, squareSize, 1);
              sprite.add(bottomSquare);

              // Create the top square sprite
              const topSquare = createSquareSprite(squareColor);
              const offsetYTop = spriteHeight / 2 + squareSize / 2;
              topSquare.position.set(0, offsetYTop, 0.01);
              topSquare.scale.set(squareSize, squareSize, 1);
              sprite.add(topSquare);

              scene.add(sprite);
              imageSprites.push(sprite);
              resolve();
            },
            undefined,
            reject
          );
        });
      }

      function onArtworkClick(event) {
        // Check if camera has moved significantly since last click
        const currentPosition = camera.position.clone();
        const currentRotation = camera.rotation.clone();

        const positionDelta = currentPosition.distanceTo(
          new THREE.Vector3(
            artworkClickState.lastCameraPosition.x,
            artworkClickState.lastCameraPosition.y,
            artworkClickState.lastCameraPosition.z
          )
        );

        const rotationDelta =
          Math.abs(currentRotation.x - artworkClickState.lastCameraRotation.x) +
          Math.abs(currentRotation.y - artworkClickState.lastCameraRotation.y) +
          Math.abs(currentRotation.z - artworkClickState.lastCameraRotation.z);

        // If camera moved significantly, this was likely a drag operation
        if (
          positionDelta > artworkClickState.cameraMovementThreshold ||
          rotationDelta > artworkClickState.cameraMovementThreshold
        ) {
          // Update last position/rotation and ignore this click
          artworkClickState.lastCameraPosition = currentPosition.clone();
          artworkClickState.lastCameraRotation = currentRotation.clone();
          return;
        }

        // Update last position/rotation
        artworkClickState.lastCameraPosition = currentPosition.clone();
        artworkClickState.lastCameraRotation = currentRotation.clone();

        // Calculate mouse position in normalized device coordinates
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Update the picking ray with the camera and mouse position
        raycaster.setFromCamera(mouse, camera);

        // Calculate objects intersecting the picking ray
        const intersects = raycaster.intersectObjects(imageSprites);

        if (intersects.length > 0) {
          const clickedSprite = intersects[0].object;
          const scores = clickedSprite.userData.scores;
          const filename = clickedSprite.userData.filename;

          if (scores && filename) {
            // Create or update drawer modal for the clicked artwork
            createDrawerModal(scores, clickedSprite, filename);
          }
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // Sprites automatically face the camera, no need for manual rotation

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Add slow organic jitter to images
        const time = Date.now() * 0.001;
        imageSprites.forEach((sprite) => {
          if (!sprite.userData.originalPosition) {
            sprite.userData.originalPosition = {
              x: sprite.position.x,
              y: sprite.position.y,
              z: sprite.position.z,
            };
            sprite.userData.speed = 0.5 + Math.random() * 0.5;
            sprite.userData.offset = Math.random() * Math.PI * 2;
          }

          const t = time * sprite.userData.speed + sprite.userData.offset;
          const newX = sprite.userData.originalPosition.x + Math.sin(t) * 0.2;
          const newY =
            sprite.userData.originalPosition.y + Math.sin(t * 1.2) * 0.2;
          const newZ =
            sprite.userData.originalPosition.z + Math.sin(t * 0.8) * 0.2;

          sprite.position.set(newX, newY, newZ);
        });

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        // Update floating eye
        updateFloatingEye();

        controls.update();
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
        }
      }

      // Function to preload images
      function preloadImages(data) {
        const totalImages = Object.keys(data).length;
        let loadedImages = 0;

        const promises = Object.keys(data).map((filename) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              loadedImages++;
              const progress = (loadedImages / totalImages) * 50; // First 50% for preloading
              updateLoadingUI(progress);
              resolve();
            };
            img.onerror = () => reject();
            img.src = `../../images/${filename}`;
          });
        });
        return Promise.all(promises);
      }

      // Load the JSON data and create 3D visualization
      fetch("temperament_scores.json")
        .then((response) => response.json())
        .then((data) => {
          const totalImages = Object.keys(data).length;
          let createdSprites = 0;

          // Ensure loading page is visible
          document.getElementById("loading-container").style.display = "block";
          document.getElementById("black-overlay").style.display = "block";
          document.getElementById("black-overlay").style.opacity = "1";
          document.getElementById("visualization").style.display = "none";

          const updateLoadingProgress = () => {
            createdSprites++;
            const progress = 50 + (createdSprites / totalImages) * 50; // Second 50% for sprite creation
            updateLoadingUI(progress);
          };

          return preloadImages(data)
            .then(() => {
              init();

              const dataArray = Object.entries(data).map(
                ([filename, scores]) => ({
                  filename,
                  ...scores,
                })
              );

              const maxScore = d3.max(dataArray, (d) => d.temperament_score);
              const minScore = d3.min(dataArray, (d) => d.temperament_score);

              // Create image sprites in 3D space
              const createSpritesPromises = dataArray.map((d) => {
                const normalizedScore =
                  (d.temperament_score - minScore) / (maxScore - minScore);

                // Spherical coordinates mapping based only on temperament for radius
                const radius = 80 * (1 - normalizedScore); // Map temperament to radius
                const theta = Math.random() * Math.PI; // Random inclination (0 to PI)
                const phi = Math.random() * 2 * Math.PI; // Random azimuthal angle (0 to 2*PI)

                // Convert spherical to Cartesian coordinates
                const x = radius * Math.sin(theta) * Math.cos(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(theta);

                return createImageSprite(
                  `../../images/${d.filename}`,
                  { x, y, z },
                  {
                    temperament_score: d.temperament_score,
                    intimacy_score: d.intimacy_score,
                  },
                  normalizedScore,
                  d.filename
                ).then(() => updateLoadingProgress());
              });

              return Promise.all(createSpritesPromises);
            })
            .then(() => {
              // Hide loading page and show visualization
              document.getElementById("loading-container").style.display =
                "none";
              document.getElementById("visualization").style.display = "block";
              document.getElementById("black-overlay").style.opacity = "0";
              setTimeout(() => {
                document.getElementById("black-overlay").style.display = "none";

                // Show galaxy button after loading screen is gone
                const galaxyBtn = document.getElementById("galaxy-nav-btn");
                if (galaxyBtn) {
                  galaxyBtn.style.display = "flex";
                }
              }, 500);
              animate();

              const scoreOverlay = document.getElementById("score-overlay");

              // Add mousemove listener for hover effects
              renderer.domElement.addEventListener(
                "mousemove",
                (event) => {
                  // Calculate mouse position in normalized device coordinates (-1 to +1)
                  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                  // Update the raycaster with the camera and mouse position
                  raycaster.setFromCamera(mouse, camera);

                  // Find intersections with the image sprites
                  const intersects = raycaster.intersectObjects(imageSprites);

                  if (intersects.length > 0) {
                    // An image sprite is hovered
                    const intersectedSprite = intersects[0].object;
                    const scores = intersectedSprite.userData.scores;

                    // Display the scores
                    scoreOverlay.textContent = `Temperament: ${scores.temperament_score.toFixed(
                      2
                    )}`;

                    // Convert 3D position to 2D screen position
                    const tempV = new THREE.Vector3().copy(
                      intersectedSprite.position
                    );
                    tempV.project(camera);

                    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

                    // Position the overlay
                    scoreOverlay.style.left = `${x}px`;
                    scoreOverlay.style.top = `${y}px`;
                    scoreOverlay.style.display = "block";
                  } else {
                    // No image sprite is hovered, hide the overlay
                    scoreOverlay.style.display = "none";
                  }
                },
                false
              );
            });
        })
        .catch((error) => {
          console.error("Error loading images:", error);
          document.getElementById("loading-text").textContent =
            "Error loading images. Please refresh the page.";
          document.getElementById("loading-text").style.color = "#ff0000";
        })
        .finally(() => {
          // Initialize floating eye
          console.log("About to initialize floating eye...");
          initFloatingEye();
          console.log("Floating eye initialization completed");

          // Show pixel arrow indicator after visualization is loaded
          const pixelArrowIndicator = document.getElementById(
            "pixel-arrow-indicator"
          );
          if (pixelArrowIndicator) {
            pixelArrowIndicator.classList.add("show");
          }

          // Initialize dock behavior after loading screen is completely gone
          setTimeout(() => {
            initDockBehavior();
          }, 600);
        });

      // Search bar event listeners
      document.addEventListener("DOMContentLoaded", function () {
        const searchBar = document.getElementById("search-bar");
        let searchTimeout;

        searchBar.addEventListener("input", (event) => {
          const query = event.target.value.trim();

          // Clear previous timeout
          if (searchTimeout) {
            clearTimeout(searchTimeout);
          }

          // Set new timeout for search (debounce)
          if (query.length > 0) {
            searchTimeout = setTimeout(() => {
              performSearch(query);
            }, 500); // Wait 500ms after user stops typing
          }
        });

        searchBar.addEventListener("keypress", (event) => {
          if (event.key === "Enter") {
            const query = event.target.value.trim();
            if (query.length > 0) {
              // Clear timeout and perform search immediately
              if (searchTimeout) {
                clearTimeout(searchTimeout);
              }
              performSearch(query);
            }
          }
        });

        // Add click event listener to upload button
        const uploadBtn = document.getElementById("upload-hand-btn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", showChatbot);

          // Add hover functionality for hand image
          const handImg = document.getElementById("upload-hand-btn-img");
          if (handImg) {
            uploadBtn.addEventListener("mouseenter", () => {
              handImg.src = "../../assets/ClosedHand.png";
            });

            uploadBtn.addEventListener("mouseleave", () => {
              handImg.src = "../../assets/OpenHand.png";
            });
          }
        }

        // Close chatbot with Escape key
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeChatbot();
          }
        });

        // Close chatbot when clicking on backdrop
        const backdrop = document.getElementById("chatbot-backdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) {
              closeChatbot();
            }
          });
        }
      });

      // Initialize dock behavior when DOM is loaded (but only if not already initialized)
      document.addEventListener("DOMContentLoaded", () => {
        // Don't initialize dock behavior here - it will be initialized after loading screen
      });
    </script>
  </body>
</html>
