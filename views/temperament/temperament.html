<!DOCTYPE html>
<html>
  <head>
    <title>Temperament Scores Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }
      #score-overlay {
        position: absolute;
        color: white;
        font-family: "Pixel", monospace;
        padding: 5px;
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 3px;
        pointer-events: none; /* Allows mouse events to pass through */
        display: none; /* Hide by default */
        z-index: 100; /* Ensure it's above the canvas */
        transform: translate(-50%, -100%); /* Position above the cursor */
      }
      #focus-info-overlay {
        position: absolute;
        color: white;
        font-family: "Pixel", monospace;
        padding: 15px;
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 3px;
        pointer-events: none;
        display: none;
        z-index: 100;
        /* Position at the bottom, aligned to the right */
        bottom: 20px;
        right: 20px;
        left: unset; /* Ensure it's not affected by a left property */
        transform: none; /* Remove the horizontal centering transform */
        white-space: pre-line;
        line-height: 1.5;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Galaxy Navigation Button */
      #galaxy-nav-btn {
        position: fixed;
        top: 20px;
        left: 25px;
        width: 40px;
        height: 40px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        padding: 0;
      }

      #galaxy-nav-btn:hover {
        transform: scale(1.1);
      }

      #galaxy-nav-btn:active {
        transform: scale(0.95);
      }

      #galaxy-nav-btn img {
        width: 60px;
        height: 60px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }

      #galaxy-nav-btn:hover img {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Galaxy Navigation Button -->
    <button
      id="galaxy-nav-btn"
      onclick="window.location.href='../Total_galaxy/total_galaxy_final.html'"
      title="Go to Total Galaxy"
    >
      <img src="../../assets/galaxy_icon.png" alt="Galaxy Icon" />
    </button>

    <div id="black-overlay"></div>
    <div
      id="loading-container"
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      "
    >
      <div class="loading-bar">
        <div
          id="loading-progress"
          class="loading-progress"
          style="width: 0%"
        ></div>
      </div>
      <div
        id="loading-text"
        style="color: #ffffff; font-family: monospace; margin-top: 10px"
      >
        LOADING... 0%
      </div>
    </div>
    <div id="visualization"></div>
    <div id="score-overlay"></div>
    <div id="focus-info-overlay"></div>

    <!-- Floating Eye -->
    <div id="floating-eye">
      <img
        src="../../assets/GlitchyEyeGif.gif"
        alt="Glitchy Eye"
        style="width: 100%; height: 100%; object-fit: contain"
      />
    </div>

    <!-- Tooltip -->
    <div id="eye-tooltip">
      Here is the Temperament View. Explore the emotional landscape of junk
      through temperament scores.
    </div>

    <!-- Pixel Arrow Indicator -->
    <div id="pixel-arrow-indicator">
      <img src="../../assets/pixel_arrow.png" alt="Arrow pointing up" />
    </div>

    <div id="rings-container">
      <div id="hover-title"></div>
    </div>
    <!-- Search Bar (fixed) -->
    <input id="search-bar" type="text" placeholder="I want to see..." />
    <!-- Upload Hand Button -->
    <button id="upload-hand-btn">
      <div id="upload-hand-btn-text">Upload<br />junk</div>
      <img
        id="upload-hand-btn-img"
        src="../../assets/OpenHand.png"
        alt="Upload hand"
      />
    </button>

    <!-- Chatbot Backdrop -->
    <div id="chatbot-backdrop" class="chatbot-backdrop"></div>

    <!-- Chatbot Upload Interface -->
    <div id="chatbot-container" class="chatbot-container">
      <button class="close-btn" onclick="closeChatbot()">×</button>
      <div class="chatbot-header">Junk Upload Bot</div>
      <div class="chatbot-messages" id="chatbot-messages">
        <!-- Messages will be added here dynamically -->
      </div>
      <div class="chatbot-input-area" id="chatbot-input-area">
        <div class="persistent-input">
          <button id="persistent-back-btn" disabled>Back</button>
          <input
            type="text"
            id="persistent-text-input"
            placeholder="Type your message..."
            disabled
          />
          <div class="persistent-input-actions">
            <button id="persistent-send-btn" disabled>Send</button>
            <button id="persistent-skip-btn" disabled>Skip</button>
            <button id="persistent-finish-btn" disabled>Finish</button>
          </div>
        </div>
        <div id="dynamic-input-container">
          <!-- Dynamic input elements will be added here -->
        </div>
      </div>
    </div>
    <script>
      let scene, camera, renderer, controls;
      let imageSprites = [];
      let raycaster, mouse;
      let selectedSprite = null;
      let composer;
      let particles;
      let focusedSprite = null;
      let isTransitioning = false;
      let originalCameraPosition = null;
      let originalSpritePositions = new Map();
      let originalSpriteScales = new Map();

      // Separate variables for rings
      let ringsScene, ringsCamera, ringsRenderer;
      let rings;
      let ringsRotation = {
        isDragging: false,
        previousX: 0,
        previousY: 0,
        rotationSpeedX: 0.0003,
        rotationSpeedY: 0.0006,
        manualRotationX: 0,
        manualRotationY: 0,
        dragStartTime: 0,
        dragThreshold: 5, // Minimum distance to be considered dragging
        clickThreshold: 200, // Minimum time difference to be considered a click vs drag
      };

      // Store references to eye-label groups for hover detection
      let eyeLabelGroups = [];
      let ringsRaycaster, ringsMouse;

      // Chatbot state
      let chatbotState = {
        currentQuestion: 0,
        answers: {},
        isTyping: false,
      };

      // Organic Floating Eye Animation
      let eyeX = 100;
      let eyeY = 100;
      let eyeTargetX = 100;
      let eyeTargetY = 100;
      let eyeSpeed = 0.008; // Much slower movement
      let lastEyeMoveTime = 0;
      let eyeMoveInterval = 8000; // Longer intervals between movements
      let eyeIsHovered = false;
      let eyeDriftX = 0;
      let eyeDriftY = 0;
      let eyeDriftSpeed = 0.001; // Very slow drift
      let eyeDriftAmplitude = 15; // Small drift amplitude

      function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set black background immediately

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 100;

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                          varying vec2 vUv;
                          void main() {
                              vUv = uv;
                              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                          }
                      `,
          fragmentShader: `
                          uniform sampler2D tDiffuse;
                          uniform float offset;
                          uniform float darkness;
                          varying vec2 vUv;

                          void main() {
                              vec2 uv = vUv;
                              vec4 color = texture2D(tDiffuse, uv);

                              // Calculate distance from center
                              vec2 center = vec2(0.5, 0.5);
                              float dist = distance(uv, center);

                              // Create vignette effect
                              float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));

                              // Apply vignette
                              color.rgb *= vignette;

                              gl_FragColor = color;
                          }
                      `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Initialize raycaster for mouse interaction
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Add double click handler for focus mode
        renderer.domElement.addEventListener("dblclick", (event) => {
          mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(imageSprites);

          if (intersects.length > 0) {
            const clickedSprite = intersects[0].object;
            if (focusedSprite === clickedSprite) {
              // Exit focus mode
              exitFocusMode();
            } else {
              // Enter focus mode
              enterFocusMode(clickedSprite);
            }
          }
        });

        // Add click handler to exit focus mode when clicking outside images
        renderer.domElement.addEventListener("click", (event) => {
          if (!focusedSprite) return;

          mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(imageSprites);

          if (intersects.length === 0) {
            exitFocusMode();
          }
        });

        // Add Esc key handler to exit focus mode
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && focusedSprite) {
            exitFocusMode();
          }
        });

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);

        // Initialize rings
        initRings();
      }

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {

        return group;
      }

            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry

      function initRings() {
        // Create separate scene for rings
        ringsScene = new THREE.Scene();
        ringsCamera = new THREE.PerspectiveCamera(75, 1, 0.01, 2000);
        ringsCamera.position.z = 20;

        // Create separate renderer for rings
        ringsRenderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          logarithmicDepthBuffer: true,
          preserveDrawingBuffer: true,
        });
        ringsRenderer.setSize(500, 500);
        ringsRenderer.setClearColor(0x000000, 0);
        ringsRenderer.sortObjects = false; // Disable automatic sorting
        document
          .getElementById("rings-container")
          .appendChild(ringsRenderer.domElement);

        // Create and add rings
        rings = createRings();
        ringsScene.add(rings);

        // Add event listeners for rings rotation
        ringsRenderer.domElement.addEventListener(
          "mousedown",
          onRingsMouseDown
        );
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseMove
        );
        ringsRenderer.domElement.addEventListener("mouseup", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("mouseleave", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("click", onRingsClick);
        ringsRaycaster = new THREE.Raycaster();
        ringsMouse = new THREE.Vector2();
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseHover
        );
      }

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              // Already on temperament page
              break;
            case "eye-secret":
              window.location.href = "../hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              window.location.href = "../intimacy/Intimacy.html";
              break;
            case "eye-completeness":
              window.location.href = "../Completeness/Completeness.html";
              break;
            case "eye-artist":
              window.location.href = "../Artists/Artist.html";
              break;
            case "eye-rhizome":
              window.location.href = "../rhizome/rhizome.html";
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      // macOS Dock-like functionality
      let dockInitialized = false;
      function initDockBehavior() {

      function createImageSprite(imageUrl, position, scores, normalizedScore) {
        return new Promise((resolve, reject) => {
          const textureLoader = new THREE.TextureLoader();
          textureLoader.load(
            imageUrl,
            (texture) => {
              const material = new THREE.SpriteMaterial({ map: texture });
              const sprite = new THREE.Sprite(material);
              sprite.position.set(position.x, position.y, position.z);

              // Calculate aspect ratio and maintain original proportions
              const aspectRatio = texture.image.width / texture.image.height;
              const baseSize = 5; // Base size for the larger dimension
              const width = aspectRatio > 1 ? baseSize : baseSize * aspectRatio;
              const height =
                aspectRatio > 1 ? baseSize / aspectRatio : baseSize;

              sprite.scale.set(width, height, 1);
              sprite.userData = {
                originalScale: { width, height },
                aspectRatio: aspectRatio,
                scores: scores,
              };

              // Calculate sprite dimensions once
              const spriteWidth = width; // Use the original calculated width of the sprite
              const spriteHeight = height; // Use the original calculated height of the sprite

              // Create the right square (was glowing line)
              const lineHeight = height;
              const lineWidth = width * 0.05; // Make line 5% of image width, will now be square side length
              const squareSide = lineWidth; // Use lineWidth for the square side length
              const lineGeometry = new THREE.PlaneGeometry(
                squareSide,
                squareSide
              );

              // Calculate colors based on normalized score (blue to red)
              const blue = new THREE.Color(0x0000ff); // Blue
              const red = new THREE.Color(0xff0000); // Red
              const lineColor = blue.clone().lerp(red, normalizedScore);

              // Create gradient - assign color to vertices
              const colors = new Float32Array(2 * 3 * 3); // 2 triangles, 3 vertices per triangle, 3 components per color (RGB)

              // Calculate top and bottom colors based on normalized score
              const bottomColor = blue.clone().lerp(red, normalizedScore); // Blue for low score, Red for high score
              const topColor = bottomColor
                .clone()
                .lerp(new THREE.Color(0xffffff), 0.3); // Blend slightly with white for a brighter top

              // Assign colors to vertices for vertical gradient
              // The vertices for a PlaneGeometry (width, height) are typically ordered:
              // 0: bottom-left, 1: top-left, 2: bottom-right, 3: top-right
              // The triangles are (0, 1, 2) and (2, 1, 3)

              // Triangle 1: (0, 1, 2) -> bottom-left, top-left, bottom-right
              // Vertex 0 (bottom-left)
              colors[0] = bottomColor.r;
              colors[1] = bottomColor.g;
              colors[2] = bottomColor.b;
              // Vertex 1 (top-left)
              colors[3] = topColor.r;
              colors[4] = topColor.g;
              colors[5] = topColor.b;
              // Vertex 2 (bottom-right)
              colors[6] = bottomColor.r;
              colors[7] = bottomColor.g;
              colors[8] = bottomColor.b;

              // Triangle 2: (2, 1, 3) -> bottom-right, top-left, top-right
              // Vertex 0 (bottom-right)
              colors[9] = bottomColor.r;
              colors[10] = bottomColor.g;
              colors[11] = bottomColor.b;
              // Vertex 1 (top-left)
              colors[12] = topColor.r;
              colors[13] = topColor.g;
              colors[14] = topColor.b;
              // Vertex 2 (top-right)
              colors[15] = topColor.r;
              colors[16] = topColor.g;
              colors[17] = topColor.b;

              lineGeometry.setAttribute(
                "color",
                new THREE.BufferAttribute(colors, 3)
              );

              const lineMaterial = new THREE.MeshBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.5, // Reduced opacity
                side: THREE.DoubleSide,
                depthWrite: false, // Don't write to depth buffer to avoid transparency issues
                blending: THREE.AdditiveBlending, // Additive blending for glowing effect
              });

              const lineMesh = new THREE.Mesh(lineGeometry, lineMaterial);

              // Position the square to the right of the image sprite
              // Position is relative to the parent (the sprite)
              // Calculate the correct offset based on sprite width and new square width
              const squareWidth = squareSide; // Use the new side length of the square
              const offsetXRight = spriteWidth / 2 + squareWidth / 2;
              lineMesh.position.set(offsetXRight, 0, 0.01); // Use the calculated offset and small z-offset

              // Make the right square a child of the sprite
              sprite.add(lineMesh);

              // Create the left square
              const lineMeshLeft = new THREE.Mesh(lineGeometry, lineMaterial);

              // Position the square to the left of the image sprite
              // Calculate the offset for the left side (negative of the right offset)
              const offsetXLeft = -offsetXRight; // Negative offset for the left edge
              lineMeshLeft.position.set(offsetXLeft, 0, 0.01); // Use the calculated offset and small z-offset

              // Make the left square a child of the sprite
              sprite.add(lineMeshLeft);

              // Create the bottom square
              const lineMeshBottom = new THREE.Mesh(lineGeometry, lineMaterial);

              // Position the square below the image sprite
              // Calculate the correct offset based on sprite height and new square height
              const offsetYBottom = -(spriteHeight / 2) - squareSide / 2;
              lineMeshBottom.position.set(0, offsetYBottom, 0.01); // Centered horizontally, positioned below

              // Make the bottom square a child of the sprite
              sprite.add(lineMeshBottom);

              // Create the top square
              const lineMeshTop = new THREE.Mesh(lineGeometry, lineMaterial);

              // Position the square above the image sprite
              // Calculate the correct offset based on sprite height and new square height
              const offsetYTop = spriteHeight / 2 + squareSide / 2;
              lineMeshTop.position.set(0, offsetYTop, 0.01); // Centered horizontally, positioned above

              // Make the top square a child of the sprite
              sprite.add(lineMeshTop);

              scene.add(sprite);
              imageSprites.push(sprite);
              resolve();
            },
            undefined,
            reject
          );
        });
      }

      function enterFocusMode(sprite) {
        if (isTransitioning) return;
        isTransitioning = true;
        focusedSprite = sprite;

        // Store original positions and scales
        imageSprites.forEach((s) => {
          originalSpritePositions.set(s, s.position.clone());
          originalSpriteScales.set(s, s.scale.clone());
        });

        // Store original camera position
        originalCameraPosition = camera.position.clone();

        // Calculate target position (further from center, outside the 3D environment radius)
        const targetPosition = new THREE.Vector3(0, 0, 120); // Increased z-distance to 120

        // Calculate scale based on aspect ratio to fit screen
        const aspectRatio = sprite.userData.aspectRatio;
        const maxWidth = 15; // Maximum width in world units
        const maxHeight = 15; // Maximum height in world units

        let targetScale;
        if (aspectRatio > 1) {
          // Landscape image
          targetScale = new THREE.Vector3(maxWidth, maxWidth / aspectRatio, 1);
        } else {
          // Portrait image
          targetScale = new THREE.Vector3(
            maxHeight * aspectRatio,
            maxHeight,
            1
          );
        }

        // Show focus info overlay
        const focusInfoOverlay = document.getElementById("focus-info-overlay");
        focusInfoOverlay.innerHTML = `Artist: @N0N@me
      Created on: 04-05-19
      Created in: Subway station
      Keywords: Melancholic, dramatic, sad, cool, woman, failure`;
        focusInfoOverlay.style.display = "block";

        // Animate transition
        const duration = 1000; // 1 second
        const startTime = Date.now();

        function animateTransition() {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3); // Cubic ease-out

          // Move other sprites away
          imageSprites.forEach((s) => {
            if (s !== focusedSprite) {
              const originalPos = originalSpritePositions.get(s);
              const targetPos = originalPos.clone().multiplyScalar(2); // Move other sprites further away
              s.position.lerpVectors(originalPos, targetPos, easeProgress);
              s.material.opacity = 1 - easeProgress;
            }
          });

          // Move focused sprite to center and scale up
          focusedSprite.position.lerpVectors(
            originalSpritePositions.get(focusedSprite),
            targetPosition,
            easeProgress
          );
          focusedSprite.scale.lerpVectors(
            originalSpriteScales.get(focusedSprite),
            targetScale,
            easeProgress
          );

          // Move camera to follow the focused sprite
          const cameraTargetPosition = new THREE.Vector3(0, 0, 130); // Camera slightly behind the focused sprite
          camera.position.lerpVectors(
            originalCameraPosition,
            cameraTargetPosition,
            easeProgress
          );
          camera.lookAt(0, 0, 0);

          if (progress < 1) {
            requestAnimationFrame(animateTransition);
          } else {
            isTransitioning = false;
          }
        }

        animateTransition();
      }

      function exitFocusMode() {
        if (isTransitioning) return;
        isTransitioning = true;

        // Hide focus info overlay
        document.getElementById("focus-info-overlay").style.display = "none";

        const duration = 1000; // 1 second
        const startTime = Date.now();

        function animateTransition() {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3); // Cubic ease-out

          // Restore other sprites
          imageSprites.forEach((s) => {
            if (s !== focusedSprite) {
              const originalPos = originalSpritePositions.get(s);
              const targetPos = originalPos.clone().multiplyScalar(2);
              s.position.lerpVectors(targetPos, originalPos, easeProgress);
              s.material.opacity = easeProgress;
            }
          });

          // Restore focused sprite
          focusedSprite.position.lerpVectors(
            focusedSprite.position,
            originalSpritePositions.get(focusedSprite),
            easeProgress
          );
          focusedSprite.scale.lerpVectors(
            focusedSprite.scale,
            originalSpriteScales.get(focusedSprite),
            easeProgress
          );

          // Restore camera
          camera.position.lerpVectors(
            camera.position,
            originalCameraPosition,
            easeProgress
          );
          camera.lookAt(0, 0, 0);

          if (progress < 1) {
            requestAnimationFrame(animateTransition);
          } else {
            isTransitioning = false;
            focusedSprite = null;
            originalSpritePositions.clear();
            originalSpriteScales.clear();
            originalCameraPosition = null;
          }
        }

        animateTransition();
      }

      function animate() {
        requestAnimationFrame(animate);

        // Make squares face the camera
        const cameraQuaternion = camera.quaternion;
        imageSprites.forEach((sprite) => {
          // Assuming the first child is the right square and the second is the left
          // (based on the order they were added in createImageSprite)
          if (sprite.children.length >= 2) {
            sprite.children[0].quaternion.copy(cameraQuaternion); // Right square
            sprite.children[1].quaternion.copy(cameraQuaternion); // Left square
          }
        });

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Add slow organic jitter to images only when not in focus mode
        if (!focusedSprite) {
          const time = Date.now() * 0.001;
          imageSprites.forEach((sprite) => {
            if (!sprite.userData.originalPosition) {
              sprite.userData.originalPosition = {
                x: sprite.position.x,
                y: sprite.position.y,
                z: sprite.position.z,
              };
              sprite.userData.speed = 0.5 + Math.random() * 0.5;
              sprite.userData.offset = Math.random() * Math.PI * 2;
            }

            const t = time * sprite.userData.speed + sprite.userData.offset;
            const newX = sprite.userData.originalPosition.x + Math.sin(t) * 0.2;
            const newY =
              sprite.userData.originalPosition.y + Math.sin(t * 1.2) * 0.2;
            const newZ =
              sprite.userData.originalPosition.z + Math.sin(t * 0.8) * 0.2;

            sprite.position.set(newX, newY, newZ);
          });
        }

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        // Update floating eye
        updateFloatingEye();

        controls.update();
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      // Function to preload images
      function preloadImages(data) {
        const totalImages = Object.keys(data).length;
        let loadedImages = 0;

        const promises = Object.keys(data).map((filename) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              loadedImages++;
              const progress = (loadedImages / totalImages) * 50; // First 50% for preloading
              updateLoadingUI(progress);
              resolve();
            };
            img.onerror = () => reject();
            img.src = `../../images/${filename}`;
          });
        });
        return Promise.all(promises);
      }

      // Load the JSON data and create 3D visualization
      fetch("temperament_scores.json")
        .then((response) => response.json())
        .then((data) => {
          const totalImages = Object.keys(data).length;
          let createdSprites = 0;

          // Ensure loading page is visible
          document.getElementById("loading-container").style.display = "block";
          document.getElementById("black-overlay").style.display = "block";
          document.getElementById("black-overlay").style.opacity = "1";
          document.getElementById("visualization").style.display = "none";

          const updateLoadingProgress = () => {
            createdSprites++;
            const progress = 50 + (createdSprites / totalImages) * 50; // Second 50% for sprite creation
            updateLoadingUI(progress);
          };

          return preloadImages(data)
            .then(() => {
              init();

              const dataArray = Object.entries(data).map(
                ([filename, scores]) => ({
                  filename,
                  ...scores,
                })
              );

              const maxScore = d3.max(dataArray, (d) => d.temperament_score);
              const minScore = d3.min(dataArray, (d) => d.temperament_score);

              // Create image sprites in 3D space
              const createSpritesPromises = dataArray.map((d) => {
                const normalizedScore =
                  (d.temperament_score - minScore) / (maxScore - minScore);

                // Spherical coordinates mapping based only on temperament for radius
                const radius = 80 * (1 - normalizedScore); // Map temperament to radius
                const theta = Math.random() * Math.PI; // Random inclination (0 to PI)
                const phi = Math.random() * 2 * Math.PI; // Random azimuthal angle (0 to 2*PI)

                // Convert spherical to Cartesian coordinates
                const x = radius * Math.sin(theta) * Math.cos(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(theta);

                return createImageSprite(
                  `../../images/${d.filename}`,
                  { x, y, z },
                  {
                    temperament_score: d.temperament_score,
                    intimacy_score: d.intimacy_score,
                  },
                  normalizedScore
                ).then(() => updateLoadingProgress());
              });

              return Promise.all(createSpritesPromises);
            })
            .then(() => {
              // Hide loading page and show visualization
              document.getElementById("loading-container").style.display =
                "none";
              document.getElementById("visualization").style.display = "block";
              document.getElementById("black-overlay").style.opacity = "0";
              setTimeout(() => {
                document.getElementById("black-overlay").style.display = "none";

                // Show galaxy button after loading screen is gone
                const galaxyBtn = document.getElementById("galaxy-nav-btn");
                if (galaxyBtn) {
                  galaxyBtn.style.display = "flex";
                }
              }, 500);
              animate();

              const scoreOverlay = document.getElementById("score-overlay");

              // Add mousemove listener for hover effects
              renderer.domElement.addEventListener(
                "mousemove",
                (event) => {
                  // Calculate mouse position in normalized device coordinates (-1 to +1)
                  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                  // Update the raycaster with the camera and mouse position
                  raycaster.setFromCamera(mouse, camera);

                  // Find intersections with the image sprites
                  const intersects = raycaster.intersectObjects(imageSprites);

                  if (intersects.length > 0) {
                    // An image sprite is hovered
                    const intersectedSprite = intersects[0].object;
                    const scores = intersectedSprite.userData.scores;

                    // Display the scores
                    scoreOverlay.textContent = `Temperament: ${scores.temperament_score.toFixed(
                      2
                    )}`;

                    // Convert 3D position to 2D screen position
                    const tempV = new THREE.Vector3().copy(
                      intersectedSprite.position
                    );
                    tempV.project(camera);

                    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;

                    // Position the overlay
                    scoreOverlay.style.left = `${x}px`;
                    scoreOverlay.style.top = `${y}px`;
                    scoreOverlay.style.display = "block";
                  } else {
                    // No image sprite is hovered, hide the overlay
                    scoreOverlay.style.display = "none";
                  }
                },
                false
              );
            });
        })
        .catch((error) => {
          console.error("Error loading images:", error);
          document.getElementById("loading-text").textContent =
            "Error loading images. Please refresh the page.";
          document.getElementById("loading-text").style.color = "#ff0000";
        })
        .finally(() => {
          // Initialize floating eye
          console.log("About to initialize floating eye...");
          initFloatingEye();
          console.log("Floating eye initialization completed");

          // Show pixel arrow indicator after visualization is loaded
          const pixelArrowIndicator = document.getElementById(
            "pixel-arrow-indicator"
          );
          if (pixelArrowIndicator) {
            pixelArrowIndicator.classList.add("show");
          }

          // Initialize dock behavior after loading screen is completely gone
          setTimeout(() => {
            initDockBehavior();
          }, 600);
        });

          // Set new timeout for search (debounce)
          if (query.length > 0) {
            searchTimeout = setTimeout(() => {
              performSearch(query);
            }, 500); // Wait 500ms after user stops typing
          }
        });

        searchBar.addEventListener("keypress", (event) => {
          if (event.key === "Enter") {
            const query = event.target.value.trim();
            if (query.length > 0) {
              // Clear timeout and perform search immediately
              if (searchTimeout) {
                clearTimeout(searchTimeout);
              }
              performSearch(query);
            }
          }
        });

        // Add click event listener to upload button
        const uploadBtn = document.getElementById("upload-hand-btn");
        if (uploadBtn) {
          uploadBtn.addEventListener("click", showChatbot);

          // Add hover functionality for hand image
          const handImg = document.getElementById("upload-hand-btn-img");
          if (handImg) {
            uploadBtn.addEventListener("mouseenter", () => {
              handImg.src = "../../assets/ClosedHand.png";
            });

            uploadBtn.addEventListener("mouseleave", () => {
              handImg.src = "../../assets/OpenHand.png";
            });
          }
        }

        // Close chatbot with Escape key
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeChatbot();
          }
        });

        // Close chatbot when clicking on backdrop
        const backdrop = document.getElementById("chatbot-backdrop");
        if (backdrop) {
          backdrop.addEventListener("click", function (e) {
            if (e.target === backdrop) {
              closeChatbot();
            }
          });
        }
      });

      // Initialize dock behavior when DOM is loaded (but only if not already initialized)
      document.addEventListener("DOMContentLoaded", () => {
        // Don't initialize dock behavior here - it will be initialized after loading screen
      });
    </script>
  </body>
</html>
