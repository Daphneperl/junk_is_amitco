<!DOCTYPE html>
<html>
  <head>
    <title>Image Loading Test</title>
  </head>
  <body>
    <h1>Image Loading Test</h1>
    <div id="results"></div>

    <script>
      // Test the same image loading logic
      function loadImageAspect(imageName) {
        return new Promise((resolve) => {
          const img = new window.Image();

          // Try different file extensions
          const extensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];
          let currentExtensionIndex = 0;

          function tryNextExtension() {
            if (currentExtensionIndex >= extensions.length) {
              console.warn(`Could not load image: ${imageName}`);
              resolve({ url: "", aspect: 1.5, success: false });
              return;
            }

            const extension = extensions[currentExtensionIndex];
            const url = `../../images2/${imageName}${extension}`;

            img.onload = function () {
              console.log(`Successfully loaded: ${url}`);
              resolve({
                url,
                aspect: img.naturalWidth / img.naturalHeight,
                success: true,
              });
            };

            img.onerror = function () {
              console.log(`Failed to load: ${url}`);
              currentExtensionIndex++;
              tryNextExtension();
            };

            img.src = url;
          }

          tryNextExtension();
        });
      }

      // Test with some sample images
      const testImages = ["image100", "image260", "image465", "image103"];

      Promise.all(testImages.map((img) => loadImageAspect(img))).then(
        (results) => {
          const resultsDiv = document.getElementById("results");
          results.forEach((result, index) => {
            const div = document.createElement("div");
            div.innerHTML = `
                        <p><strong>${testImages[index]}:</strong> 
                        ${result.success ? "SUCCESS" : "FAILED"} 
                        ${result.success ? `(${result.url})` : ""}</p>
                    `;
            resultsDiv.appendChild(div);
          });
        }
      );
    </script>
  </body>
</html>
