<!DOCTYPE html>
<html>
  <head>
    <title>Hashtag Gallery Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }
      @font-face {
        font-family: "Heming";
        src: url("../../assets/Heming.ttf") format("truetype");
      }
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      /* Page Title */
      .page-title {
        position: fixed;
        top: 10px;
        right: 20px;
        color: white;
        font-family: "VT323", monospace;
        font-size: 30px;
        text-align: right;
        z-index: 2000;
        pointer-events: none;
        display: none;
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 18px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        opacity: 0;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          opacity 0.5s ease;
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -500px;
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
        display: none; /* Hidden by default */
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
        display: block; /* Show when needed */
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -300px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -300px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* UI visibility control */
      .ui-ready #rings-container,
      .ui-ready #search-bar,
      .ui-ready #upload-hand-btn {
        opacity: 1;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Galaxy Navigation Button */
      #galaxy-nav-btn {
        position: fixed;
        top: 20px;
        left: 25px;
        width: 40px;
        height: 40px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 999;
        display: none;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        padding: 0;
      }

      #galaxy-nav-btn:hover {
        transform: scale(1.1);
      }

      #galaxy-nav-btn:active {
        transform: scale(0.95);
      }

      #galaxy-nav-btn img {
        width: 60px;
        height: 60px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }

      #galaxy-nav-btn:hover img {
        opacity: 1;
      }

      /* Drawer Modal Styles */
      .drawer-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .drawer-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      .drawer-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        z-index: 3001;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: flex;
        align-items: flex-start;
        gap: 20px;
        max-width: 95vw;
        max-height: 90vh;
        justify-content: center;
        position: relative;
      }

      .drawer-container.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .drawer-artwork {
        position: relative;
        width: auto;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        overflow: hidden;
        z-index: 2;
        flex-shrink: 0;
      }

      .drawer-artwork img {
        object-fit: contain;
        border-radius: 4px;
        display: block;
      }

      .drawer-info {
        position: relative;
        width: 350px;
        height: auto;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 20px;
        font-family: "Overpass Mono", monospace;
        color: #fff;
        font-size: 14px;
        transform: translateX(-100%);
        transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 1;
        flex-shrink: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .drawer-container.show .drawer-info {
        transform: translateX(0);
      }

      .drawer-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }

      .drawer-field.full-width {
        grid-column: 1 / -1;
      }

      .drawer-close {
        position: absolute;
        top: -40px;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        font-family: "VT323", monospace;
        z-index: 3002;
        opacity: 0;
        transition: opacity 0.3s ease;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      .drawer-close:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .drawer-container.show .drawer-close {
        opacity: 1;
      }

      .drawer-label {
        font-weight: bold;
        font-family: "Overpass Mono", monospace;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.9);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .drawer-value {
        font-weight: normal;
        font-family: "Overpass Mono", monospace;
        font-style: italic;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
        color: rgba(255, 255, 255, 0.7);
      }

      .drawer-context {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 12px;
        min-height: 80px;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.8);
      }

      .drawer-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .drawer-tag {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        font-family: "Overpass Mono", monospace;
      }
    </style>
  </head>
  <body>

    <script>
      let scene, camera, renderer, controls;
      let composer;
      let particles;

      let wallRadius = 55; // Shared radius for both image and text walls
      // Animation state for camera rotation
      let isRotating = false;
      let rotationStart = 0;
      let rotationDuration = 3000; // ms
      let initialAngle = 0;
      let targetAngle = -Math.PI / 2; // 90 degrees to the left
      let cameraRadius = 125; // Default, will be set after images are loaded
      let cameraY = 0; // Default, will be set after images are loaded
      let raycaster, mouse;
      let quoteConnections = {}; // Store the quote connections data
      let currentQuoteData = null; // Store current quote data

      // Floating eye movement variables
      let eyeX = 100;
      let eyeY = 100;
      let eyeTargetX = 100;
      let eyeTargetY = 100;
      let eyeSpeed = 0.02;
      let eyeDriftX = 0;
      let eyeDriftY = 0;
      let eyeDriftSpeed = 0.5;
      let eyeDriftAmplitude = 2;
      let lastEyeMoveTime = 0;
      let eyeMoveInterval = 8000; // 8 seconds between target changes
      let eyeIsHovered = false;

      // Separate variables for rings
      let ringsScene, ringsCamera, ringsRenderer;
      let rings;
      let ringsRotation = {
        isDragging: false,
        previousX: 0,
        previousY: 0,
        rotationSpeedX: 0.0003,
        rotationSpeedY: 0.0006,
        manualRotationX: 0,
        manualRotationY: 0,
        dragStartTime: 0,
        dragThreshold: 5, // Minimum distance to be considered dragging
        clickThreshold: 200, // Minimum time difference to be considered a click vs drag
      };

      // Store references to eye-label groups for hover detection
      let eyeLabelGroups = [];
      let ringsRaycaster, ringsMouse;

      // Easing function for even smoother animation (quartic)
      function easeInOutQuart(t) {
        return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
      }

      function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // Set black background immediately

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create particles
        const particleCount = 300;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSizes = new Float32Array(particleCount);
        const particleColors = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
          // Random positions within a sphere
          const radius = 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          particlePositions[i * 3 + 1] =
            radius * Math.sin(phi) * Math.sin(theta);
          particlePositions[i * 3 + 2] = radius * Math.cos(phi);

          // More vibrant colors
          const hue = Math.random(); // Random hue
          const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
          const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness

          // Convert HSL to RGB
          const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
          const x = c * (1 - Math.abs(((hue * 6) % 2) - 1));
          const m = lightness - c / 2;

          let r, g, b;
          if (hue < 1 / 6) {
            r = c;
            g = x;
            b = 0;
          } else if (hue < 2 / 6) {
            r = x;
            g = c;
            b = 0;
          } else if (hue < 3 / 6) {
            r = 0;
            g = c;
            b = x;
          } else if (hue < 4 / 6) {
            r = 0;
            g = x;
            b = c;
          } else if (hue < 5 / 6) {
            r = x;
            g = 0;
            b = c;
          } else {
            r = c;
            g = 0;
            b = x;
          }

          particleColors[i * 3] = r + m; // R
          particleColors[i * 3 + 1] = g + m; // G
          particleColors[i * 3 + 2] = b + m; // B

          // Random speeds between 0.02 and 0.08 (much slower than before)
          particleSpeeds[i] = Math.random() * 0.06;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(particlePositions, 3)
        );
        particleGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(particleSizes, 1)
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(particleColors, 3)
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.5,
          vertexColors: true,
          transparent: true,
          opacity: 0.3,
          sizeAttenuation: true,
          depthWrite: false, // Allow particles to be transparent when in front
        });

        particles = new THREE.Points(particleGeometry, particleMaterial);
        particles.userData = {
          speeds: particleSpeeds,
          opacities: new Float32Array(particleCount), // Store individual opacities
        };
        scene.add(particles);

        // Create camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 100;

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Set black background color immediately
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Initialize raycaster for image clicks
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // Add click event listener to renderer
        renderer.domElement.addEventListener("click", onImageClick);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;

                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);

                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);

                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));

                        // Apply vignette
                        color.rgb *= vignette;

                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Add orbit controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Limit controls to only zoom and horizontal rotation
        controls.enablePan = false; // Disable panning
        controls.minPolarAngle = Math.PI / 2; // Lock vertical angle to horizontal
        controls.maxPolarAngle = Math.PI / 2; // Lock vertical angle to horizontal
        controls.enableZoom = true; // Keep zoom enabled
        controls.enableRotate = true; // Keep rotation enabled

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Create wireframe grid for walls and floor
        createWireframeGrid();

        // Initialize rings
        initRings();

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        // Animate camera position in a circular arc if needed
        if (isRotating) {
          const now = performance.now();
          const elapsed = now - rotationStart;
          if (elapsed < rotationDuration) {
            const t = elapsed / rotationDuration;
            const easedT = easeInOutQuart(t);
            const angle = initialAngle + (targetAngle - initialAngle) * easedT;
            camera.position.x = cameraRadius * Math.sin(angle);
            camera.position.z = cameraRadius * Math.cos(angle);
            camera.position.y = cameraY;
            camera.lookAt(0, cameraY, 0);
          } else {
            camera.position.x = cameraRadius * Math.sin(targetAngle);
            camera.position.z = cameraRadius * Math.cos(targetAngle);
            camera.position.y = cameraY;
            camera.lookAt(0, cameraY, 0);
            isRotating = false;

            // Show pixel arrow indicator when camera rotation finishes
            const pixelArrowIndicator = document.getElementById(
              "pixel-arrow-indicator"
            );
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }

            // Enable UI when animation completes
            document.body.classList.add("ui-ready");
          }
        }

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a circular motion
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01;
            positions[i + 1] += Math.cos(time) * 0.01;
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Check if particle is in front of images (z > 0)
            const z = positions[i + 2];
            opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.material.opacity = 0.3; // Base opacity
        }

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005; // Reduced from 0.0003
          rings.rotation.y += 0.0008; // Reduced from 0.0006
        }

        controls.update();
        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);

        // Update floating eye position
        updateFloatingEye();
      }

      function updateLoadingUI(progress) {
        const progressBar = document.getElementById("loading-progress");
        const loadingText = document.getElementById("loading-text");

        if (progressBar && loadingText) {
          progressBar.style.width = `${progress}%`;
          loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
        }
      }

      function addImageWall(imageList) {
        const numImages = imageList.length;
        const arcAngle = Math.PI * 1.22; // 220 degrees
        let radius = wallRadius; // Use shared wall radius
        const yCenter = 17; // Moved images even higher
        const fixedHeight = 18; // All images have this height
        const zOffset = 0;

        console.log("Adding image wall with", numImages, "images:", imageList);

        // Remove previous images if any
        clearPreviousImages();

        // Helper to load image and return a promise with aspect ratio
        function loadImageAspect(imageName) {
          return new Promise((resolve) => {
            const img = new window.Image();

            // Try different file extensions
            const extensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];
            let currentExtensionIndex = 0;

            function tryNextExtension() {
              if (currentExtensionIndex >= extensions.length) {
                console.warn(`Could not load image: ${imageName}`);
                // Return a fallback with default aspect ratio
                resolve({ url: "", aspect: 1.5, success: false });
                return;
              }

              const extension = extensions[currentExtensionIndex];
              // Add cache-busting parameter to prevent browser caching
              const cacheBuster = Date.now() + Math.random();
              const url = `../../images2/${imageName}${extension}?cb=${cacheBuster}`;

              img.onload = function () {
                console.log(`Successfully loaded: ${url}`);
                resolve({
                  url,
                  aspect: img.naturalWidth / img.naturalHeight,
                  success: true,
                });
              };

              img.onerror = function () {
                console.log(`Failed to load: ${url}`);
                currentExtensionIndex++;
                tryNextExtension();
              };

              img.src = url;
            }

            tryNextExtension();
          });
        }

        // Load all images to get aspect ratios
        Promise.all(imageList.map((img) => loadImageAspect(`${img}`))).then(
          (imagesWithAspect) => {
            console.log(
              "Successfully loaded images:",
              imagesWithAspect.filter((img) => img.success).length,
              "out of",
              imageList.length
            );

            // Filter out images that failed to load
            const validImages = imagesWithAspect.filter((img) => img.success);

            if (validImages.length === 0) {
              console.error("No images loaded successfully!");
              // Create a fallback wall with placeholder
              createFallbackWall();
              return;
            }

            // Calculate total arc length needed (sum of widths + gaps)
            const gap = 3; // Gap between images (in world units)
            const widths = validImages.map((img) => img.aspect * fixedHeight);
            const totalWidth =
              widths.reduce((a, b) => a + b, 0) +
              gap * (validImages.length - 1);
            const arcLength = radius * arcAngle;
            // If totalWidth > arcLength, increase radius
            let usedRadius = radius;
            if (totalWidth > arcLength) {
              usedRadius = totalWidth / arcAngle;
            }

            console.log("Placing", validImages.length, "images on wall");

            // Place images along the arc, centered
            // Calculate total width of all images plus gaps
            const totalImagesWidth =
              widths.reduce((a, b) => a + b, 0) +
              gap * (validImages.length - 1);

            // Calculate the starting arc position to center the images
            const availableArcLength = usedRadius * arcAngle;
            const startArc =
              -arcAngle / 2 +
              (availableArcLength - totalImagesWidth) / (2 * usedRadius);

            let currentArc = startArc;
            for (let i = 0; i < validImages.length; i++) {
              const width = widths[i];
              const angle = currentArc + width / (2 * usedRadius); // Center of this image
              const x = usedRadius * Math.cos(angle);
              const z = usedRadius * Math.sin(angle);

              console.log(
                `Placing image ${i + 1} at position (${x.toFixed(
                  2
                )}, ${yCenter}, ${z.toFixed(2)})`
              );

              // Texture loader
              const texture = new THREE.TextureLoader().load(
                validImages[i].url,
                function (texture) {
                  console.log(`Texture loaded successfully for image ${i + 1}`);
                },
                undefined,
                function (error) {
                  console.error(
                    `Failed to load texture for image ${i + 1}:`,
                    error
                  );
                }
              );
              const material = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide,
              });
              const geometry = new THREE.PlaneGeometry(width, fixedHeight);
              const plane = new THREE.Mesh(geometry, material);
              plane.position.set(x, yCenter, zOffset + z);
              plane.lookAt(0, yCenter, 0); // Face the center

              // Store image data with the mesh for drawer modal
              plane.userData.imageData = imageList[i];
              plane.userData.imageUrl = validImages[i].url;

              scene.add(plane);
              scene.userData.imagePlanes.push(plane);

              // Move to next position (arc advances by width + gap)
              currentArc += (width + gap) / usedRadius;
            }
            // Set camera in front of the images, facing the center, and store radius/y for animation
            wallRadius = usedRadius; // Update global wall radius for text
            cameraRadius = usedRadius + 40; // More zoomed in (reduced from 70)
            cameraY = yCenter;
            camera.position.set(0, yCenter, cameraRadius);
            camera.lookAt(0, yCenter, 0);

            console.log(
              "Image wall setup complete. Camera positioned at:",
              camera.position
            );
          }
        );
      }

      // Function to properly clear previous images and textures
      function clearPreviousImages() {
        if (scene.userData.imagePlanes) {
          scene.userData.imagePlanes.forEach((plane) => {
            // Dispose of geometry
            if (plane.geometry) {
              plane.geometry.dispose();
            }
            // Dispose of material and texture
            if (plane.material) {
              if (plane.material.map) {
                plane.material.map.dispose();
              }
              plane.material.dispose();
            }
            // Remove from scene
            scene.remove(plane);
          });
        }
        scene.userData.imagePlanes = [];
        console.log("Cleared previous images");
      }

      // Create wireframe grid for walls and floor
      function createWireframeGrid() {
        // Wall wireframe removed - only floor remains

        // Define variables needed for floor grid
        const gridRadius = wallRadius + 15; // Larger radius for grid to be well behind images
        const height = 25; // Height of the wall grid

        // Create floor wireframe (full circle)
        const floorGeometry = new THREE.BufferGeometry();
        const floorVertices = [];
        const floorIndices = [];

        // Create a full circular grid for the floor
        const floorRadius = gridRadius; // Match the wall grid radius for alignment
        const floorSegments = 32; // Number of segments around the full circle
        const radialSegments = 8; // Number of radial lines
        const y = -height + 9; // Floor height - moved higher

        // Generate vertices for full circular floor grid
        for (let i = 0; i <= radialSegments; i++) {
          for (let j = 0; j <= floorSegments; j++) {
            const angle = (2 * Math.PI * j) / floorSegments; // Full 360 degrees
            const currentRadius = (floorRadius * i) / radialSegments;
            const x = currentRadius * Math.cos(angle);
            const z = currentRadius * Math.sin(angle);
            floorVertices.push(x, y, z);
          }
        }

        // Generate indices for rounded floor grid
        for (let i = 0; i < radialSegments; i++) {
          for (let j = 0; j < floorSegments; j++) {
            const a = i * (floorSegments + 1) + j;
            const b = a + 1;
            const c = (i + 1) * (floorSegments + 1) + j;
            const d = c + 1;

            // Radial lines (from center outward)
            floorIndices.push(a, c);
            floorIndices.push(b, d);

            // Arc lines (around the circle)
            floorIndices.push(a, b);
            floorIndices.push(c, d);
          }
        }

        floorGeometry.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(floorVertices, 3)
        );
        floorGeometry.setIndex(floorIndices);

        const floorMaterial = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.4, // Increased opacity for more weight
          linewidth: 2, // Increased line width for more weight
          depthWrite: false, // Don't write to depth buffer
          depthTest: false, // Don't test depth - always render behind
        });
        const floorWireframe = new THREE.LineSegments(
          floorGeometry,
          floorMaterial
        );
        floorWireframe.renderOrder = -999; // Render very first (behind everything)
        scene.add(floorWireframe);
      }

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,

        // Create separate renderer for rings

          preserveDrawingBuffer: true,
        });
        ringsRenderer.setSize(500, 500);
        ringsRenderer.setClearColor(0x000000, 0);
        ringsRenderer.sortObjects = false; // Disable automatic sorting
        document
          .getElementById("rings-container")
          .appendChild(ringsRenderer.domElement);

        // Create and add rings
        rings = createRings();
        ringsScene.add(rings);

        // Add event listeners for rings rotation
        ringsRenderer.domElement.addEventListener(
          "mousedown",
          onRingsMouseDown
        );
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseMove
        );
        ringsRenderer.domElement.addEventListener("mouseup", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("mouseleave", onRingsMouseUp);
        ringsRenderer.domElement.addEventListener("click", onRingsClick);
        ringsRaycaster = new THREE.Raycaster();
        ringsMouse = new THREE.Vector2();
        ringsRenderer.domElement.addEventListener(
          "mousemove",
          onRingsMouseHover
        );

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        // Only rotate if we're dragging
        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic

            case "eye-completeness":

      // Select a random quote from the connections
      function selectRandomQuote() {
        const quotes = Object.keys(quoteConnections);
        if (quotes.length === 0) return null;

        // Filter quotes to only include those with 5 or more images
        const validQuotes = quotes.filter((quote) => {
          const quoteData = quoteConnections[quote];
          return (
            quoteData.matching_images && quoteData.matching_images.length >= 5
          );
        });

        if (validQuotes.length === 0) {
          console.log("No quotes found with 5 or more images");
          return null;
        }

        const randomQuote =
          validQuotes[Math.floor(Math.random() * validQuotes.length)];
        currentQuoteData = quoteConnections[randomQuote];
        console.log("Selected quote:", currentQuoteData.quote);
        console.log("Matching images:", currentQuoteData.matching_images);
        console.log(
          "Number of images:",
          currentQuoteData.matching_images.length
        );
        return currentQuoteData;
      }

      // Create curved 3D text wrapped around the cylinder
      function createCurvedText(text) {
        // Remove existing curved text if any
        if (curvedText) {
          scene.remove(curvedText);
        }

        // Create canvas for text
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        canvas.width = 5000;
        canvas.height = 300;

        // Set text style (smaller font)
        context.fillStyle = "white";
        context.font = "bold 200px Heming, monospace";
        context.textAlign = "center";
        context.textBaseline = "middle";

        // Draw text on canvas
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillText(text, canvas.width / 2, canvas.height / 2);

        // Create texture from canvas (flip Y to fix mirroring)
        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        texture.center = new THREE.Vector2(0.5, 0.5);
        texture.rotation = Math.PI; // Flip vertically
        texture.flipY = false;

        // Create curved geometry
        const radius = wallRadius; // Use shared wall radius
        const arcAngle = Math.PI * 0.61; // Half of the semi-cylinder (about 110 degrees)
        const height = 8; // Increased height for larger text
        const segments = 128;

        const geometry = new THREE.PlaneGeometry(
          arcAngle * radius * 1.5,
          height,
          segments,
          1
        );
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
        });

        // Create mesh
        curvedText = new THREE.Mesh(geometry, material);

        // Position and curve the text
        curvedText.position.set(0, 45, 0); // Above the images - moved even higher
        curvedText.rotation.y = Math.PI / 2; // Face outward

        // Apply curvature by bending the geometry
        const positions = geometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          const x = positions[i];
          const y = positions[i + 1];
          const z = positions[i + 2];

          // Calculate angle based on x position
          const angle = (x / ((arcAngle * radius) / 2)) * (arcAngle / 2);

          // Apply cylindrical transformation
          positions[i] = radius * Math.sin(angle);
          positions[i + 1] = y;
          positions[i + 2] = radius * Math.cos(angle);
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.computeVertexNormals();

        // Add to scene
        scene.add(curvedText);
      }

      // macOS Dock-like functionality
      function initDockBehavior() {
        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px) - increased for easier access

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");

        // Ensure pixel arrow indicator is hidden initially
        if (pixelArrowIndicator) {
          pixelArrowIndicator.classList.remove("show");
        }

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;
            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior
        document.addEventListener("mousemove", (e) => {
          const mouseY = e.clientY;
          const windowHeight = window.innerHeight;
          const isInHoverZone = mouseY > windowHeight - hoverZoneHeight;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isInHoverZone) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          // Recalculate hover zone if needed
        });
      }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;
          const topMargin = 150; // Keep eye away from top
          const bottomMargin = 300; // Keep eye far from bottom
          const centerAvoidanceRadius =
            Math.min(window.innerWidth, window.innerHeight) * 0.3; // Avoid center area

          // Create perimeter-based movement - avoid bottom and center
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.5) {
            // Top edge only
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = topMargin + Math.random() * 100; // Stay in top area
          } else if (perimeterChoice < 0.75) {
            // Left edge (avoiding bottom)
            eyeTargetX = margin + Math.random() * 100;
            eyeTargetY =
              topMargin +
              Math.random() * (screenHeight - bottomMargin - topMargin);
          } else {
            // Right edge (avoiding bottom)
            eyeTargetX = screenWidth - margin - Math.random() * 100;
            eyeTargetY =
              topMargin +
              Math.random() * (screenHeight - bottomMargin - topMargin);
          }

          // Ensure target is not in center area
          const centerX = screenWidth / 2;
          const centerY = screenHeight / 2;
          const distanceFromCenter = Math.sqrt(
            (eyeTargetX - centerX) ** 2 + (eyeTargetY - centerY) ** 2
          );

          if (distanceFromCenter < centerAvoidanceRadius) {
            // Move target away from center
            const angle = Math.atan2(
              eyeTargetY - centerY,
              eyeTargetX - centerX
            );
            eyeTargetX = centerX + Math.cos(angle) * centerAvoidanceRadius;
            eyeTargetY = centerY + Math.sin(angle) * centerAvoidanceRadius;
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center and bottom to avoid them
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.3;
        const bottomAvoidanceY = window.innerHeight - 300; // Keep 300px from bottom

        // Add center and bottom avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;

        // Center avoidance
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.08; // Increased strength
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Bottom avoidance
        if (eyeY > bottomAvoidanceY) {
          const bottomAvoidanceStrength = 0.1; // Strong bottom avoidance
          avoidanceY -=
            (bottomAvoidanceStrength * (eyeY - bottomAvoidanceY)) / 100;
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }
