          }
        }, 50);
      }

      // Start the visualization when the page loads
      window.addEventListener("load", startVisualization);

      // Chatbot functions
      function showChatbot() {
        const chatbot = document.getElementById("chatbot-container");
        const backdrop = document.getElementById("chatbot-backdrop");

        // Show backdrop first
        backdrop.style.display = "block";
        setTimeout(() => {
          backdrop.style.opacity = "1";
        }, 10);

        chatbot.style.display = "flex";
        chatbotState.currentQuestion = 0;
        chatbotState.answers = {};

        // Start with opening message
        addBotMessage(
          "Hi, friend. Before we dive in — a tiny heads-up: nothing here is mandatory except the junk. Everything else? Totally up to you."
        );

        // Disable persistent input initially
        disablePersistentInput();

        // Start the conversation after a delay
        setTimeout(() => {
          addBotMessage("Let's begin. Upload your junk:");
          setTimeout(() => {
            askNextQuestion();
          }, 1500);
        }, 2000);
      }

      function closeChatbot() {
        const chatbot = document.getElementById("chatbot-container");
        const backdrop = document.getElementById("chatbot-backdrop");

        // Hide chatbot first
        chatbot.style.display = "none";

        // Fade out backdrop
        backdrop.style.opacity = "0";
        setTimeout(() => {
          backdrop.style.display = "none";
        }, 300);

        // Clear messages and dynamic input
        const messagesContainer = document.getElementById("chatbot-messages");
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        messagesContainer.innerHTML = "";
        dynamicContainer.innerHTML = "";
        disablePersistentInput();
      }

      function addBotMessage(message) {
        const messagesContainer = document.getElementById("chatbot-messages");
        const messageDiv = document.createElement("div");
        messageDiv.className = "message bot";
        messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function addUserMessage(message) {
        const messagesContainer = document.getElementById("chatbot-messages");
        const messageDiv = document.createElement("div");
        messageDiv.className = "message user";
        messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function enablePersistentInput() {
        const textInput = document.getElementById("persistent-text-input");
        const sendBtn = document.getElementById("persistent-send-btn");
        const backBtn = document.getElementById("persistent-back-btn");
        const skipBtn = document.getElementById("persistent-skip-btn");
        const finishBtn = document.getElementById("persistent-finish-btn");
        if (textInput && sendBtn && backBtn && skipBtn && finishBtn) {
          textInput.disabled = false;
          sendBtn.disabled = false;
          backBtn.disabled = false;
          skipBtn.disabled = false;
          finishBtn.disabled = false;
          textInput.focus();
        }
      }

      function disablePersistentInput() {
        const textInput = document.getElementById("persistent-text-input");
        const sendBtn = document.getElementById("persistent-send-btn");
        const backBtn = document.getElementById("persistent-back-btn");
        const skipBtn = document.getElementById("persistent-skip-btn");
        const finishBtn = document.getElementById("persistent-finish-btn");
        if (textInput && sendBtn && backBtn && skipBtn && finishBtn) {
          textInput.disabled = true;
          sendBtn.disabled = true;
          backBtn.disabled = true;
          skipBtn.disabled = true;
          finishBtn.disabled = true;
          textInput.value = "";
        }
      }

      function askNextQuestion() {
        // For now, just close the chatbot after showing the initial messages
        setTimeout(() => {
          closeChatbot();
        }, 3000);
      }

      // Global variable to store artistic analysis data
      let artisticAnalysisData = {};

      // Load artistic analysis data
      async function loadArtisticAnalysisData() {
        try {
          const response = await fetch(
            "../../image_analysis/images2_analysis/artistic_analysis_images2_filtered.json"
          );
          const data = await response.json();

          // Convert array to object for easier lookup
          data.forEach((item) => {
            artisticAnalysisData[item.filename] = item;
          });

          console.log("Artistic analysis data loaded successfully");
        } catch (error) {
          console.error("Error loading artistic analysis data:", error);
        }
      }

      // Drawer Modal Functions
      function createDrawerModal(imageData, mesh) {
        // Remove existing drawer modal if any
        const existingModal = document.querySelector(".drawer-backdrop");
        if (existingModal) {
          existingModal.remove();
        }

        // Get artistic analysis data for this image
        const imageAnalysis = artisticAnalysisData[imageData] || {};

        // Extract image filename without extension for lookup
        const imageName = imageData.split(".")[0];
        const analysisData = artisticAnalysisData[imageName] || {};

        // Create backdrop
        const backdrop = document.createElement("div");
        backdrop.className = "drawer-backdrop";

        // Create drawer container
        const drawerContainer = document.createElement("div");
        drawerContainer.className = "drawer-container";

        // Create close button
        const closeButton = document.createElement("button");
        closeButton.className = "drawer-close";
        closeButton.innerHTML = "×";
        closeButton.onclick = closeDrawerModal;

        // Create artwork section
        const artworkSection = document.createElement("div");
        artworkSection.className = "drawer-artwork";
        const artworkImg = document.createElement("img");

        // Try different extensions for the image
        const extensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];
        let currentExtensionIndex = 0;

        function tryLoadImage() {
          if (currentExtensionIndex >= extensions.length) {
            artworkSection.innerHTML =
              '<div style="color: #666; font-size: 16px;">Image not available</div>';
            return;
          }

          const extension = extensions[currentExtensionIndex];
          const imagePath = `../../images2/${imageData}${extension}`;

          artworkImg.onload = function () {
            console.log(`Successfully loaded image for drawer: ${imagePath}`);

            // Calculate optimal dimensions based on aspect ratio
            const aspectRatio = this.naturalWidth / this.naturalHeight;
            const isPortrait = aspectRatio < 1;

            // Get container dimensions
            const container = artworkSection;
            const containerRect = container.getBoundingClientRect();

            // Define maximum dimensions (responsive)
            const maxWidth = window.innerWidth <= 768 ? 0.95 : 0.45; // 95% on mobile, 45% on desktop
            const maxHeight = window.innerWidth <= 768 ? 0.5 : 0.8; // 50% on mobile, 80% on desktop

            const maxContainerWidth = window.innerWidth * maxWidth;
            const maxContainerHeight = window.innerHeight * maxHeight;

            let finalWidth, finalHeight;

            if (isPortrait) {
              // For elongated images: start with height, then adjust width if needed
              finalHeight = maxContainerHeight;
              finalWidth = finalHeight * aspectRatio;

              // If width exceeds container, scale down proportionally
              if (finalWidth > maxContainerWidth) {
                finalWidth = maxContainerWidth;
                finalHeight = finalWidth / aspectRatio;
              }
            } else {
              // For landscape images: start with width, then adjust height if needed
              finalWidth = maxContainerWidth;
              finalHeight = finalWidth / aspectRatio;

              // If height exceeds container, scale down proportionally
              if (finalHeight > maxContainerHeight) {
                finalHeight = maxContainerHeight;
                finalWidth = finalHeight * aspectRatio;
              }
            }

            // Apply calculated dimensions
            this.style.width = `${finalWidth}px`;
            this.style.height = `${finalHeight}px`;
          };

          artworkImg.onerror = function () {
            console.log(`Failed to load image: ${imagePath}`);
            currentExtensionIndex++;
            tryLoadImage();
          };

          artworkImg.src = imagePath;
        }

        artworkImg.alt = "Artwork";
        artworkSection.appendChild(artworkImg);
        tryLoadImage();

        // Create info section
        const infoSection = document.createElement("div");
        infoSection.className = "drawer-info";

        // Map data to semantic fields according to user's definitions
        const title = imageData || "-";
        const signedBy = "-"; // Creator name - not available in current data
        const zone = "-"; // Geographic location - not available in current data
        const exactSpot = currentQuoteData
          ? currentQuoteData.quote.replace(/_/g, " ")
          : "-";
        const dateStamp = "-"; // Time of creation - not available in current data
        const daytime = "-"; // Level of day - not available in current data
        const rawness = "-"; // Completeness level % - not available in current data
        const formatType = "-"; // Artwork format - not available in current data
        const context = analysisData.description || "-";
        const tags = analysisData.keywords
          ? analysisData.keywords.map((k) => k.keyword)
          : [];

        // Create info content with correct semantic mapping
        infoSection.innerHTML = `
              <div class="drawer-field">
                  <div class="drawer-label">Title</div>
                  <div class="drawer-value">${title}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Signed by</div>
                  <div class="drawer-value">${signedBy}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Zone</div>
                  <div class="drawer-value">${zone}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Exact spot</div>
                  <div class="drawer-value">${exactSpot}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Date stamp</div>
                  <div class="drawer-value">${dateStamp}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Daytime</div>
                  <div class="drawer-value">${daytime}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Rawness</div>
                  <div class="drawer-value">${rawness}</div>
              </div>
              <div class="drawer-field">
                  <div class="drawer-label">Format type</div>
                  <div class="drawer-value">${formatType}</div>
              </div>
              <div class="drawer-field full-width">
                  <div class="drawer-label">Scene/Context</div>
                  <div class="drawer-context">${context}</div>
              </div>
              <div class="drawer-field full-width">
                  <div class="drawer-label">Vibes/Tags</div>
                  <div class="drawer-tags">
                      ${
                        tags.length > 0
                          ? tags
                              .map(
                                (tag) =>
                                  `<span class="drawer-tag">${tag}</span>`
                              )
                              .join("")
                          : '<span class="drawer-tag">No tags available</span>'
                      }
                  </div>
              </div>
          `;

        // Assemble the modal
        drawerContainer.appendChild(closeButton);
        drawerContainer.appendChild(artworkSection);
        drawerContainer.appendChild(infoSection);
        backdrop.appendChild(drawerContainer);
        document.body.appendChild(backdrop);

        // Add click outside to close
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) {
            closeDrawerModal();
          }
        });

        // Add escape key to close
        const escapeHandler = function (e) {
          if (e.key === "Escape") {
            closeDrawerModal();
            document.removeEventListener("keydown", escapeHandler);
          }
        };
        document.addEventListener("keydown", escapeHandler);

        // Animate in
        requestAnimationFrame(() => {
          backdrop.classList.add("show");
          requestAnimationFrame(() => {
            drawerContainer.classList.add("show");
          });
        });

        // Add resize handler to recalculate image dimensions
        const resizeHandler = () => {
          if (artworkImg.complete && artworkImg.naturalWidth > 0) {
            // Recalculate dimensions when window is resized
            const aspectRatio =
              artworkImg.naturalWidth / artworkImg.naturalHeight;
            const isPortrait = aspectRatio < 1;

            const maxWidth = window.innerWidth <= 768 ? 0.95 : 0.45;
            const maxHeight = window.innerWidth <= 768 ? 0.5 : 0.8;

            const maxContainerWidth = window.innerWidth * maxWidth;
            const maxContainerHeight = window.innerHeight * maxHeight;

            let finalWidth, finalHeight;

            if (isPortrait) {
              finalHeight = maxContainerHeight;
              finalWidth = finalHeight * aspectRatio;

              if (finalWidth > maxContainerWidth) {
                finalWidth = maxContainerWidth;
                finalHeight = finalWidth / aspectRatio;
              }
            } else {
              finalWidth = maxContainerWidth;
              finalHeight = finalWidth / aspectRatio;

              if (finalHeight > maxContainerHeight) {
                finalHeight = maxContainerHeight;
                finalWidth = finalHeight * aspectRatio;
              }
            }

            artworkImg.style.width = `${finalWidth}px`;
            artworkImg.style.height = `${finalHeight}px`;
          }
        };

        window.addEventListener("resize", resizeHandler);

        // Store the resize handler for cleanup
        backdrop.resizeHandler = resizeHandler;

        // Store reference to mesh for potential future use
        backdrop.mesh = mesh;
      }

      function closeDrawerModal() {
        const backdrop = document.querySelector(".drawer-backdrop");
        if (backdrop) {
          // Clean up resize event listener
          if (backdrop.resizeHandler) {
            window.removeEventListener("resize", backdrop.resizeHandler);
          }

          const container = backdrop.querySelector(".drawer-container");
          container.classList.remove("show");
          backdrop.classList.remove("show");

          // Remove after animation
          setTimeout(() => {
            backdrop.remove();
          }, 400);
        }
      }

      function onImageClick(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        raycaster.setFromCamera(mouse, camera);

        // Get all image planes from the scene
        const imagePlanes = scene.userData.imagePlanes || [];
        const intersects = raycaster.intersectObjects(imagePlanes, false);

        if (intersects.length > 0) {
          const clickedMesh = intersects[0].object;

          // Get the image data stored with the mesh
          const imageData = clickedMesh.userData.imageData;

          if (imageData) {
            // Create drawer modal with the image data
            createDrawerModal(imageData, clickedMesh);
          }
        }
      }
    </script>

    <!-- Chatbot Backdrop -->
    <div id="chatbot-backdrop" class="chatbot-backdrop"></div>

    <!-- Chatbot Upload Interface -->
    <div id="chatbot-container" class="chatbot-container">
      <button class="close-btn" onclick="closeChatbot()">×</button>
      <div class="chatbot-header">Junk Upload Bot</div>
      <div class="chatbot-messages" id="chatbot-messages">
        <!-- Messages will be added here dynamically -->
      </div>
      <div class="chatbot-input-area" id="chatbot-input-area">
        <div class="persistent-input">
          <button id="persistent-back-btn" disabled>Back</button>
          <input
            type="text"
            id="persistent-text-input"
            placeholder="Type your message..."
            disabled
          />
          <div class="persistent-input-actions">
            <button id="persistent-send-btn" disabled>Send</button>
            <button id="persistent-skip-btn" disabled>Skip</button>
            <button id="persistent-finish-btn" disabled>Finish</button>
          </div>
        </div>
        <div id="dynamic-input-container">
          <!-- Dynamic input elements will be added here -->
        </div>
      </div>
    </div>
  </body>
