        const question = questions[chatbotState.currentQuestion];
        const questionInput = document.getElementById("question-input");
        let answer = "";

        switch (question.type) {
          case "file":
            const fileInput = document.querySelector("#file-input");
            if (fileInput && fileInput.files.length === 0) {
              alert("Please select a file");
              return;
            }
            answer = fileInput.files[0].name;
            break;

          case "text":
          case "textarea":
            // Text questions are handled by submitTextAnswer function
            // This should not be called for text questions
            return;
          case "location":
            // Location questions are handled by submitTextAnswer function
            // This should not be called for location questions
            return;

          case "slider":
            const slider = questionInput.querySelector("#slider-input");
            answer = slider ? `${slider.value}%` : "50%";
            break;

          case "time_slider":
            const timeSlider =
              questionInput.querySelector("#time-slider-input");
            const timeLabels = ["Sun", "Coffee", "Pasta", "Wine", "Moon"];
            const value = timeSlider ? parseFloat(timeSlider.value) : 0;
            // Find the closest label or create a blend
            const closestIndex = Math.round(value);
            const closestLabel = timeLabels[closestIndex];

            // If it's exactly on an icon, use that label
            if (Math.abs(value - closestIndex) < 0.1) {
              answer = closestLabel;
            } else {
              // If it's between icons, create a blend
              const lowerIndex = Math.floor(value);
              const upperIndex = Math.min(
                Math.ceil(value),
                timeLabels.length - 1
              );
              const lowerLabel = timeLabels[lowerIndex];
              const upperLabel = timeLabels[upperIndex];
              answer = `${lowerLabel}-${upperLabel}`;
            }
            break;

          case "tags":
            const selectedTags =
              questionInput.querySelectorAll(".tag.selected");
            const customTag = questionInput.querySelector("#custom-tag-input")
              ? questionInput.querySelector("#custom-tag-input").value.trim()
              : "";
            const tagTexts = Array.from(selectedTags).map((tag) =>
              tag.textContent.replace(" ×", "")
            );
            if (customTag) tagTexts.push(customTag);
            answer = tagTexts.join(", ");
            break;
        }

        // Store answer (even if empty)
        chatbotState.answers[question.id] = answer;

        // Show user's answer only if not empty
        if (answer) {
          addUserMessage(answer);
        } else {
          addUserMessage("Skipped");
        }

        // Remove input and disable persistent input
        const dynamicContainer = document.getElementById(
          "dynamic-input-container"
        );
        dynamicContainer.innerHTML = "";
        dynamicContainer.style.display = "none";
        disablePersistentInput();

        // Remove upload area from messages if it exists
        const uploadMessage = document.querySelector(
          ".message .file-upload-area"
        );
        if (uploadMessage) {
          uploadMessage.closest(".message").remove();
        }

        // Move to next question
        chatbotState.currentQuestion++;
        setTimeout(() => {
          askNextQuestion();
        }, 1000);
      }

                        <div style="font-size: 12px; margin-top: 10px; opacity: 0.6;">(Local development mode)</div>
                    </div>
                </div>
            `;
        console.log("Fallback map HTML set");

        // Add click listener for fallback map
        const fallbackMap = document.getElementById("fallback-map");
        fallbackMap.addEventListener("click", (event) => {
          const rect = fallbackMap.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;

          // Create a pin element
          const pin = document.createElement("div");
          pin.style.cssText = `
                    position: absolute;
                    left: ${x}px;
                    top: ${y}px;
                    width: 24px;
                    height: 24px;
                    background: #ff4444;
                    border: 2px solid #fff;
                    border-radius: 50%;
                    transform: translate(-50%, -50%);
                    cursor: pointer;
                    z-index: 10;
                    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
                    animation: pinDrop 0.3s ease-out;
                `;
          pin.innerHTML = "📍";
          pin.style.fontSize = "14px";
          pin.style.textAlign = "center";
          pin.style.lineHeight = "20px";

          // Add animation keyframes
          if (!document.querySelector("#pin-animation")) {
            const style = document.createElement("style");
            style.id = "pin-animation";
            style.textContent = `
                        @keyframes pinDrop {
                            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
                            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
                            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                        }
                    `;
            document.head.appendChild(style);
          }

          // Remove previous pin
          const existingPin = fallbackMap.querySelector(".fallback-pin");
          if (existingPin) {
            existingPin.remove();
          }

          pin.className = "fallback-pin";
          fallbackMap.appendChild(pin);

          // Store coordinates
          mapState.selectedLocation = {
            lat: () => ((y / rect.height) * 180 - 90).toFixed(6),
            lng: () => ((x / rect.width) * 360 - 180).toFixed(6),
          };

          updateCoordinatesDisplay(mapState.selectedLocation);
        });
      }

      function placeMarker(latLng) {
        // Remove existing marker
        if (mapState.marker) {
          mapState.marker.setMap(null);
        }

        // Create new marker
        mapState.marker = new google.maps.Marker({
          position: latLng,
          map: mapState.map,
          title: "Selected Location",
          icon: {
            url:
              "data:image/svg+xml;charset=UTF-8," +
              encodeURIComponent(`
                        <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="15" cy="15" r="12" fill="#ff4444" stroke="#fff" stroke-width="2"/>
                            <text x="15" y="20" text-anchor="middle" fill="#fff" font-size="16">📍</text>
                        </svg>
                    `),
            scaledSize: new google.maps.Size(30, 30),
            anchor: new google.maps.Point(15, 15),
          },
        });

        mapState.selectedLocation = latLng;
        updateCoordinatesDisplay(latLng);
      }

      function updateCoordinatesDisplay(latLng) {
        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent = `Pinned at: ${latLng
          .lat()
          .toFixed(6)}, ${latLng.lng().toFixed(6)}`;
      }

      function clearPin() {
        if (mapState.marker) {
          mapState.marker.setMap(null);
          mapState.marker = null;
        }

        // Also clear fallback pin
        const fallbackPin = document.querySelector(".fallback-pin");
        if (fallbackPin) {
          fallbackPin.remove();
        }

        mapState.selectedLocation = null;

        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent =
          "Click on the map to pin your location";
      }

      function closeMapPopup() {
        const mapPopup = document.getElementById("map-popup-overlay");
        const mapInput = document.getElementById("map-location-input");

        mapPopup.style.display = "none";
        mapInput.value = "";

        // Clear pin state
        clearPin();

        // Reset coordinates display
        const coordinatesDisplay = document.getElementById(
          "coordinates-display"
        );
        coordinatesDisplay.textContent =
          "Click on the map to pin your location";
      }

      function confirmMapLocation() {
        const mapInput = document.getElementById("map-location-input");
        const locationDescription = mapInput.value.trim();

        if (!mapState.selectedLocation) {
          alert("Please pin a location on the map first!");
          return;
        }

        // Create location string
        const lat = mapState.selectedLocation.lat().toFixed(6);
        const lng = mapState.selectedLocation.lng().toFixed(6);
        const locationString = locationDescription
          ? `${locationDescription} (${lat}, ${lng})`
          : `Location: ${lat}, ${lng}`;

        // Submit the location answer
        submitTextAnswer(locationString);

        closeMapPopup();
      }

      // Initialize Google Maps when the API loads
      function initGoogleMaps() {
        mapState.googleMapsLoaded = true;
        console.log("Google Maps API loaded successfully");
      }

      // Make the function globally available
      window.initGoogleMaps = initGoogleMaps;

      // Add cleanup on page unload to prevent memory leaks
      window.addEventListener("beforeunload", () => {
        if (renderer) {
          renderer.dispose();
        }
        if (composer) {
          composer.dispose();
        }
        if (scene) {
          scene.traverse((object) => {
            if (object.geometry) {
              object.geometry.dispose();
            }
            if (object.material) {
              if (Array.isArray(object.material)) {
                object.material.forEach((material) => material.dispose());
              } else {
                object.material.dispose();
              }
            }
          });
        }
      });

      // Add error handling for WebGL context loss
      window.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        console.warn("WebGL context lost. Reloading page...");
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      });

      // Drawer Modal Functions
      let drawerRaycaster, drawerMouse;

      function initDrawerModal() {
        drawerRaycaster = new THREE.Raycaster();
        drawerMouse = new THREE.Vector2();

        // Add click event listener to the renderer for cluster mode
        renderer.domElement.addEventListener("click", onArtworkClick);
      }

      function onArtworkClick(event) {
        // Calculate mouse position in normalized device coordinates (-1 to +1)
        const mouse = new THREE.Vector2();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // Setup raycaster
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        // Check for intersections with cluster sprites
        const intersects = [];
        helixGroup.children.forEach((cluster, clusterIndex) => {
          const container = cluster.children[0];
          if (container) {
            container.children.forEach((sprite) => {
              const intersection = raycaster.intersectObject(sprite);
              if (intersection.length > 0) {
                intersects.push({
                  cluster,
                  clusterIndex,
                  distance: intersection[0].distance,
                });
              }
            });
          }
        });

        // Sort intersections by distance and select the closest
        if (intersects.length > 0) {
          intersects.sort((a, b) => a.distance - b.distance);
          showClusterPopup(intersects[0].cluster, intersects[0].clusterIndex);
        }
      }

      function createDrawerModal(artworkData, sprite) {
        // Remove existing drawer modal if any
        const existingModal = document.querySelector(".drawer-backdrop");
        if (existingModal) {
          existingModal.remove();
        }

        // Create backdrop
        const backdrop = document.createElement("div");
        backdrop.className = "drawer-backdrop";

        // Create drawer container
        const drawerContainer = document.createElement("div");
        drawerContainer.className = "drawer-container";

        // Create close button
        const closeButton = document.createElement("button");
        closeButton.className = "drawer-close";
        closeButton.innerHTML = "×";
        closeButton.onclick = closeDrawerModal;

        // Create artwork section
        const artworkSection = document.createElement("div");
        artworkSection.className = "drawer-artwork";
        const artworkImg = document.createElement("img");
        artworkImg.src = `../../images/${artworkData.image}`;
        artworkImg.alt = artworkData.title || "Artwork";
        artworkImg.onerror = function () {
          artworkSection.innerHTML =
            '<div style="color: #666; font-size: 16px;">Image not available</div>';
        };
        artworkSection.appendChild(artworkImg);

        // Create info section
        const infoSection = document.createElement("div");
        infoSection.className = "drawer-info";

        // Create info content
        infoSection.innerHTML = `
          <div class="drawer-field">
            <div class="drawer-label">Title</div>
            <div class="drawer-value">${artworkData.title || "-"}</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Rawness</div>
            <div class="drawer-value">${
              artworkData.completenessScore || "-"
            }</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Signed by</div>
            <div class="drawer-value">${artworkData.signedBy || "-"}</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Zone</div>
            <div class="drawer-value">${artworkData.zone || "-"}</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Exact spot</div>
            <div class="drawer-value">${artworkData.exactSpot || "-"}</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Date stamp</div>
            <div class="drawer-value">${artworkData.date || "-"}</div>
          </div>
          <div class="drawer-field">
            <div class="drawer-label">Daytime</div>
            <div class="drawer-value">${artworkData.daytime || "-"}</div>
          </div>
          <div class="drawer-field full-width">
            <div class="drawer-label">Context</div>
            <div class="drawer-context">${artworkData.context || "-"}</div>
          </div>
          <div class="drawer-field full-width">
            <div class="drawer-label">Vibes/Tags</div>
            <div class="drawer-tags">
              ${
                artworkData.tags && artworkData.tags.length > 0
                  ? artworkData.tags
                      .map((tag) => `<span class="drawer-tag">${tag}</span>`)
                      .join("")
                  : '<span class="drawer-tag">-</span>'
              }
            </div>
          </div>
        `;

        // Assemble the modal
        drawerContainer.appendChild(closeButton);
        drawerContainer.appendChild(artworkSection);
        drawerContainer.appendChild(infoSection);
        backdrop.appendChild(drawerContainer);
        document.body.appendChild(backdrop);

        // Add click outside to close
        backdrop.addEventListener("click", function (e) {
          if (e.target === backdrop) {
            closeDrawerModal();
          }
        });

        // Add escape key to close
        const escapeHandler = function (e) {
          if (e.key === "Escape") {
            closeDrawerModal();
            document.removeEventListener("keydown", escapeHandler);
          }
        };
        document.addEventListener("keydown", escapeHandler);

        // Animate in
        requestAnimationFrame(() => {
          backdrop.classList.add("show");
          requestAnimationFrame(() => {
            drawerContainer.classList.add("show");
          });
        });

        // Store reference to sprite for potential future use
        backdrop.sprite = sprite;
      }

      function closeDrawerModal() {
        const backdrop = document.querySelector(".drawer-backdrop");
        if (backdrop) {
          const container = backdrop.querySelector(".drawer-container");
          container.classList.remove("show");
          backdrop.classList.remove("show");

          // Remove after animation
          setTimeout(() => {
            backdrop.remove();
          }, 400);
        }
      }

      // Ensure loading screen is visible immediately
      document.addEventListener("DOMContentLoaded", function () {
        const loadingContainer = document.getElementById("loading-container");
        const blackOverlay = document.getElementById("black-overlay");
        const visualization = document.getElementById("visualization");

        if (loadingContainer) loadingContainer.style.display = "block";
        if (blackOverlay) {
          blackOverlay.style.display = "block";
          blackOverlay.style.opacity = "1";
        }
        if (visualization) visualization.style.display = "none";
      });

      window.addEventListener("load", startVisualization);
    </script>
  </body>
</html>
