<!DOCTYPE html>
<html>
<head>
    <title>Artist Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('../../assets/pixel.ttf') format('truetype');
        }
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
        }
        
        /* UI Menu Drawer Styles */
        #ui-menu-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 80vh;
            z-index: 2000;
            pointer-events: none;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #ui-menu-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            pointer-events: auto;
        }
        
        #ui-menu-toggle {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 2001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        #ui-menu-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }
        
        #ui-menu-overlay.hidden {
            transform: translateY(100%);
            pointer-events: none;
        }
        
        #ui-menu-overlay.visible {
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* Drawer handle indicator */
        #ui-menu-toggle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        #ui-menu-toggle.visible::after {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        
        #visualization {
            width: 100vw;
            height: 100vh;
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 1000;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        #loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1001;
        }
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            background: #ffffff;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- UI Menu Overlay -->
    <div id="ui-menu-overlay" class="hidden">
        <iframe id="ui-menu-iframe" src="../../UI-menu-overlay.html"></iframe>
    </div>
    
    <!-- UI Menu Toggle Button -->
    <button id="ui-menu-toggle" title="Open Menu"></button>
    
    <div id="black-overlay"></div>
    <div id="loading-container" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div class="loading-bar">
            <div id="loading-progress" class="loading-progress" style="width: 0%"></div>
        </div>
        <div id="loading-text" style="color: #ffffff; font-family: monospace; margin-top: 10px;">LOADING... 0%</div>
    </div>
    <div id="visualization"></div>
    <script>
        let scene, camera, renderer, controls;
        let composer;
        let particles;
        let imageGroups = [];
        let isInitialized = false;
        let helixGroup;
        let helixOutline;
        let isDragging = false;
        let previousY = 0;
        let targetY = 0;
        let currentY = 0;
        let scrollVelocity = 0;
        let currentRotation = 0;
        let targetRotation = 0;
        const SCROLL_SPEED = 0.3;
        const SCROLL_SMOOTHING = 0.95;
        const VELOCITY_DAMPENING = 0.92;
        const MAX_SCROLL = 900; // Increased to accommodate longer helix
        const ROTATION_SPEED = 0.5;

        // Cluster mode variables
        let isClusterMode = false;
        let activeCluster = null;
        let originalClusterPosition = null;
        let originalClusterRotation = null;
        let originalCameraPosition = null;
        let originalHelixY = null;
        let originalHelixRotation = null;
        let targetClusterPosition = new THREE.Vector3();
        const CLUSTER_TRANSITION_DURATION = 1000; // ms
        let transitionStartTime = 0;

        // Function to position clusters in a helix
        function createHelixPosition(index, totalClusters) {
            const turns = 20; // Increased turns to make helix longer
            const heightStep = 1500 / totalClusters; // Increased height to accommodate more turns
            const radius = 40; // Larger radius for better visibility of the extended helix
            
            // Calculate position on helix
            const angle = (index / totalClusters) * Math.PI * 2 * turns;
            const x = radius * Math.cos(angle);
            const y = (index * heightStep) - 750; // Center vertically (half of 1500)
            const z = radius * Math.sin(angle);
            
            return new THREE.Vector3(x, y, z);
        }

        // Function to create helix outline
        function createHelixOutline() {
            const turns = 20;
            const radius = 40;
            const totalHeight = 1500;
            const segments = 1200; // Increased segments for even smoother curve
            
            // Create main helix line
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2 * turns;
                const y = (i / segments) * totalHeight - totalHeight / 2;
                const x = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.9,
                linewidth: 6
            });
            
            const line = new THREE.Line(geometry, material);
            line.renderOrder = 0; // Ensure grid renders behind images
            return line;
        }

        // Function to create 3D grid for helix
        function createHelixGrid() {
            const turns = 20;
            const radius = 40;
            const totalHeight = 1500;
            const gridGroup = new THREE.Group();
            

            
            // Create spiral guide lines (secondary helix paths) - more lines with weight hierarchy
            const spiralGuides = 6; // Increased number of spiral guides
            for (let guide = 0; guide <= spiralGuides; guide++) {
                const guideRadius = radius * (0.2 + guide * 0.15); // More guides with closer spacing
                const points = [];
                const segments = 800; // Increased segments for smoother guide lines
                
                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2 * turns;
                    const y = (i / segments) * totalHeight - totalHeight / 2;
                    const x = guideRadius * Math.cos(angle);
                    const z = guideRadius * Math.sin(angle);
                    points.push(new THREE.Vector3(x, y, z));
                }
                
                // Weight hierarchy: outermost line is heaviest
                const isOutermost = guide === spiralGuides;
                const lineWidth = isOutermost ? 5 : (3 + guide * 0.5); // 5 for outermost, decreasing inward
                const opacity = isOutermost ? 0.8 : (0.4 + guide * 0.05); // Higher opacity for outer lines
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ 
                    color: 0xffffff, 
                    transparent: true, 
                    opacity: opacity,
                    linewidth: lineWidth
                });
                
                const line = new THREE.Line(geometry, material);
                line.renderOrder = 0; // Ensure grid renders behind images
                gridGroup.add(line);
            }
            
            return gridGroup;
        }

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = 256;
            canvas.height = 64;
            
            // Set text style
            context.font = '24px monospace';
            context.textAlign = 'center';
            context.fillStyle = 'white';
            
            // Draw text
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            
            // Create texture
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            
            // Create sprite material
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 0.8
            });
            
            // Create sprite
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(10, 2.5, 1); // Adjust scale to make text readable
            
            return sprite;
        }

        async function loadAndCreateImageClusters() {
            try {
                helixGroup = new THREE.Group();
                scene.add(helixGroup);

                // Create and add helix outline
                helixOutline = createHelixOutline();
                helixGroup.add(helixOutline);

                // Create and add 3D grid
                const helixGrid = createHelixGrid();
                helixGroup.add(helixGrid);

                const response = await fetch('../../images/images.json');
                if (!response.ok) {
                    throw new Error('Failed to load images.json');
                }
                const imageList = await response.json();
                
                const textureLoader = new THREE.TextureLoader();
                let loadedImages = 0;
                const totalImages = imageList.length;
                
                const avgClusterSize = 5;
                const estimatedClusters = Math.ceil(imageList.length / avgClusterSize);
                let clusterIndex = 0;
                
                let remainingImages = [...imageList];
                while (remainingImages.length > 0) {
                    const clusterSize = Math.min(Math.floor(Math.random() * 5) + 3, remainingImages.length);
                    const clusterGroup = new THREE.Group();
                    
                    // Position cluster on helix
                    const helixPos = createHelixPosition(clusterIndex, estimatedClusters);
                    clusterGroup.position.copy(helixPos);
                    
                    // Create container for images
                    const clusterContainer = new THREE.Object3D();
                    clusterGroup.add(clusterContainer);
                    clusterContainer.userData.shouldFaceCamera = true;
                    
                    // Add images to cluster
                    for (let i = 0; i < clusterSize && remainingImages.length > 0; i++) {
                        const imageIndex = Math.floor(Math.random() * remainingImages.length);
                        const imagePath = remainingImages[imageIndex];
                        remainingImages.splice(imageIndex, 1);
                        
                        await new Promise((resolve, reject) => {
                            textureLoader.load(
                                `../../images/${imagePath}`,
                                (texture) => {
                                    const aspectRatio = texture.image.width / texture.image.height;
                                    const spriteMaterial = new THREE.SpriteMaterial({ 
                                        map: texture,
                                        transparent: true,
                                        opacity: 1.0
                                    });
                                    const sprite = new THREE.Sprite(spriteMaterial);
                                    
                                    // Ensure images render in front of grid
                                    sprite.renderOrder = 1000;
                                    sprite.material.depthTest = false;
                                    
                                    const baseSize = 8; // Increased from 5 to 8
                                    sprite.scale.set(baseSize * aspectRatio, baseSize, 1);
                                    
                                    // Calculate grid dimensions for proper spacing
                                    const gridCols = Math.ceil(Math.sqrt(clusterSize));
                                    const gridRows = Math.ceil(clusterSize / gridCols);
                                    const spacing = Math.max(10, baseSize * 1.3); // Reduced spacing to bring images closer
                                    
                                    // Calculate total height of the grid
                                    const totalGridHeight = gridRows * spacing;
                                    
                                    // Add username text under the cluster
                                    const username = "@User" + (clusterIndex + 1);
                                    const textSprite = createTextSprite(username);
                                    // Ensure text also renders in front
                                    textSprite.renderOrder = 1000;
                                    textSprite.material.depthTest = false;
                                    // Position the text sprite below the bottom row of images
                                    textSprite.position.y = -(totalGridHeight / 2 + 1 ); // 5 units padding below the last row
                                    textSprite.position.z = 0; // Keep on same plane as images
                                    clusterContainer.add(textSprite);
                                    
                                    // Position in a flat grid layout with increased spacing
                                    const col = i % gridCols;
                                    const row = Math.floor(i / gridCols);
                                    const offsetX = (col - (gridCols - 1) / 2) * spacing;
                                    const offsetY = (row - (gridRows - 1) / 2) * spacing;
                                    sprite.position.set(offsetX, offsetY, 0); // All sprites at z=0 for flat plane
                                    
                                    clusterContainer.add(sprite);
                                    loadedImages++;
                                    updateLoadingUI((loadedImages / totalImages) * 100);
                                    resolve();
                                },
                                undefined,
                                reject
                            );
                        });
                    }

                    helixGroup.add(clusterGroup);
                    imageGroups.push(clusterGroup);
                    clusterIndex++;
                }

                // Initial camera position
                camera.position.set(80, 0, 80); // Moved camera further out
                camera.lookAt(0, 0, 0);

                // Show visualization
                document.getElementById('loading-container').style.display = 'none';
                document.getElementById('visualization').style.display = 'block';
                document.getElementById('black-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('black-overlay').style.display = 'none';
                }, 500);

                isInitialized = true;
                animate();

            } catch (error) {
                console.error('Error in loadAndCreateImageClusters:', error);
                document.getElementById('loading-text').textContent = 'Error loading images. Please refresh the page.';
            }
        }

        // Add mouse event listeners
        function initScrollControls() {
            const container = renderer.domElement;
            let lastDragTime = 0;
            let lastDragY = 0;
            
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousY = e.clientY;
                lastDragY = e.clientY;
                lastDragTime = Date.now();
                scrollVelocity = 0;
            });
            
            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const now = Date.now();
                const dt = Math.min(now - lastDragTime, 50);
                if (dt > 0) {
                    scrollVelocity = (e.clientY - lastDragY) / dt * 0.5;
                }
                
                const deltaY = (e.clientY - previousY) * SCROLL_SPEED;
                targetY = Math.max(-MAX_SCROLL, Math.min(MAX_SCROLL, targetY + deltaY));
                
                previousY = e.clientY;
                lastDragY = e.clientY;
                lastDragTime = now;
            });
            
            container.addEventListener('mouseup', () => {
                isDragging = false;
                scrollVelocity *= 8;
            });
            
            container.addEventListener('mouseleave', () => {
                isDragging = false;
                scrollVelocity = 0;
            });

            // Improved touch support
            container.addEventListener('touchstart', (e) => {
                isDragging = true;
                previousY = e.touches[0].clientY;
                lastDragY = e.touches[0].clientY;
                lastDragTime = Date.now();
                scrollVelocity = 0;
                e.preventDefault();
            }, { passive: false });
            
            container.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                
                const now = Date.now();
                const dt = Math.min(now - lastDragTime, 50);
                if (dt > 0) {
                    scrollVelocity = (e.touches[0].clientY - lastDragY) / dt * 0.5;
                }
                
                const deltaY = (e.touches[0].clientY - previousY) * SCROLL_SPEED;
                targetY = Math.max(-MAX_SCROLL, Math.min(MAX_SCROLL, targetY + deltaY));
                
                previousY = e.touches[0].clientY;
                lastDragY = e.touches[0].clientY;
                lastDragTime = now;
                e.preventDefault();
            }, { passive: false });
            
            container.addEventListener('touchend', () => {
                isDragging = false;
                scrollVelocity *= 8;
            });

            // Improved wheel support
            let wheelTimeout;
            container.addEventListener('wheel', (e) => {
                const deltaY = e.deltaY * 0.15;
                targetY = Math.max(-MAX_SCROLL, Math.min(MAX_SCROLL, targetY + deltaY));
                
                scrollVelocity = 0;
                clearTimeout(wheelTimeout);
                wheelTimeout = setTimeout(() => {
                    scrollVelocity = Math.sign(deltaY) * 0.05;
                }, 50);
                
                e.preventDefault();
            }, { passive: false });
        }

        // Function to handle cluster mode transition
        function enterClusterMode(cluster) {
            if (isClusterMode && activeCluster === cluster) {
                exitClusterMode();
                return;
            }

            isClusterMode = true;
            activeCluster = cluster;
            
            // Store original positions and states
            originalCameraPosition = camera.position.clone();
            originalHelixY = helixGroup.position.y;
            originalHelixRotation = helixGroup.rotation.y;
            
            // Store original scale of the cluster container
            const container = cluster.children[0];
            if (container) {
                container.userData.originalScale = container.scale.clone();
            }
            
            // Calculate camera target position based on cluster's current position
            const clusterWorldPos = cluster.getWorldPosition(new THREE.Vector3());
            const cameraOffset = new THREE.Vector3(0, 0, 60); // Increased offset from 40 to 60
            targetClusterPosition = clusterWorldPos.clone().add(cameraOffset);
            
            // Start dimming all other clusters
            helixGroup.children.forEach(otherCluster => {
                if (otherCluster !== cluster) {
                    const container = otherCluster.children[0];
                    if (container) {
                        container.children.forEach(sprite => {
                            sprite.userData.originalOpacity = sprite.material.opacity;
                            sprite.material.opacity = 0;
                        });
                    }
                }
            });
            
            // Ensure active cluster is fully visible
            if (container) {
                container.renderOrder = 999;
                container.children.forEach(sprite => {
                    sprite.renderOrder = 999;
                    sprite.material.depthTest = false;
                    sprite.material.opacity = 1;
                });
            }
            
            // Start transition
            transitionStartTime = Date.now();
            
            // Disable scrolling during cluster mode
            isDragging = false;
            scrollVelocity = 0;
        }

        function exitClusterMode() {
            if (!isClusterMode || !activeCluster) return;
            
            // Reset render order and depth testing for active cluster
            const container = activeCluster.children[0];
            if (container) {
                container.renderOrder = 0;
                container.children.forEach(sprite => {
                    sprite.renderOrder = 0;
                    sprite.material.depthTest = true;
                });
                
                // Restore original scale
                if (container.userData.originalScale) {
                    container.scale.copy(container.userData.originalScale);
                    delete container.userData.originalScale;
                }
            }
            
            // Restore opacity for all clusters
            helixGroup.children.forEach(cluster => {
                const container = cluster.children[0];
                if (container) {
                    container.children.forEach(sprite => {
                        if (sprite.userData.originalOpacity !== undefined) {
                            sprite.material.opacity = sprite.userData.originalOpacity;
                            delete sprite.userData.originalOpacity;
                        }
                    });
                }
            });
            
            // Start transition back
            transitionStartTime = Date.now();
            targetClusterPosition.copy(originalCameraPosition);
            
            // Reset after animation
            setTimeout(() => {
                isClusterMode = false;
                activeCluster = null;
                originalClusterPosition = null;
                originalClusterRotation = null;
                originalCameraPosition = null;
            }, CLUSTER_TRANSITION_DURATION);
        }

        function updateClusterTransition() {
            if (!isClusterMode || !activeCluster) return;
            
            const elapsed = Date.now() - transitionStartTime;
            const progress = Math.min(elapsed / CLUSTER_TRANSITION_DURATION, 1);
            
            // Smooth easing function
            const eased = 1 - Math.pow(1 - progress, 3);
            
            // Move camera to cluster
            if (originalCameraPosition) {
                camera.position.lerpVectors(originalCameraPosition, targetClusterPosition, eased);
                
                // Make camera look at the cluster
                const clusterWorldPos = activeCluster.getWorldPosition(new THREE.Vector3());
                camera.lookAt(clusterWorldPos);
            }
            
            // Scale up the entire cluster container uniformly
            const container = activeCluster.children[0];
            if (container && container.userData.originalScale) {
                const targetScale = 1.5; // Reduced from 2.5x to 1.5x for smaller appearance
                const currentScale = 1 + (targetScale - 1) * eased;
                container.scale.setScalar(currentScale);
                
                // Ensure all sprites are on the same plane and facing camera
                container.children.forEach(sprite => {
                    if (sprite instanceof THREE.Sprite) {
                        sprite.position.z = 0; // Force all sprites to same z-plane
                    }
                });
            }
            
            // If exiting cluster mode, restore helix position and rotation
            if (!isClusterMode && originalHelixY !== null && originalHelixRotation !== null) {
                helixGroup.position.y = originalHelixY;
                helixGroup.rotation.y = originalHelixRotation;
            }
            
            if (progress === 1) {
                transitionStartTime = 0;
                if (!isClusterMode) {
                    originalHelixY = null;
                    originalHelixRotation = null;
                }
            }
        }

        // Add double click handler to renderer
        function initClusterInteraction() {
            const container = renderer.domElement;
            
            // Add double click handler
            container.addEventListener('dblclick', (event) => {
                event.preventDefault();
                
                // Calculate mouse position in normalized device coordinates (-1 to +1)
                const mouse = new THREE.Vector2();
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                // Setup raycaster
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                
                // Check for intersections with cluster sprites
                const intersects = [];
                helixGroup.children.forEach(cluster => {
                    const container = cluster.children[0];
                    if (container) {
                        container.children.forEach(sprite => {
                            const intersection = raycaster.intersectObject(sprite);
                            if (intersection.length > 0) {
                                intersects.push({ cluster, distance: intersection[0].distance });
                            }
                        });
                    }
                });
                
                // Sort intersections by distance and select the closest
                if (intersects.length > 0) {
                    intersects.sort((a, b) => a.distance - b.distance);
                    enterClusterMode(intersects[0].cluster);
                }
            });

            // Add escape key handler
            window.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && isClusterMode) {
                    exitClusterMode();
                }
            });
        }

        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create noise texture
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Generate noise
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const value = Math.random() * 50;
                data[i] = value;     // R
                data[i + 1] = value; // G
                data[i + 2] = value; // B
                data[i + 3] = 20;    // A
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Create texture from canvas
            const noiseTexture = new THREE.CanvasTexture(canvas);
            noiseTexture.wrapS = THREE.RepeatWrapping;
            noiseTexture.wrapT = THREE.RepeatWrapping;
            
            // Set as background
            scene.background = noiseTexture;

            // Create camera with larger far plane and wider FOV
            camera = new THREE.PerspectiveCamera(
                45, // Increased FOV from 35 to 45 for better visibility with margins
                window.innerWidth / window.innerHeight,
                0.1,
                2000 // Much larger far plane to see the entire helix
            );
            camera.position.set(80, 0, 80); // Moved camera further out
            camera.lookAt(0, 0, 0);

            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1);
            document.getElementById('visualization').appendChild(renderer.domElement);

            // Setup post-processing
            composer = new THREE.EffectComposer(renderer);
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Add vignette effect
            const vignetteShader = {
                uniforms: {
                    "tDiffuse": { value: null },
                    "offset": { value: 1.0 },
                    "darkness": { value: 1.0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;
                    
                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);
                        
                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);
                        
                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
                        
                        // Apply vignette
                        color.rgb *= vignette;
                        
                        gl_FragColor = color;
                    }
                `
            };

            const vignettePass = new THREE.ShaderPass(vignetteShader);
            vignettePass.uniforms.offset.value = 0.5;
            vignettePass.uniforms.darkness.value = 0.5;
            composer.addPass(vignettePass);

            // Initialize scroll controls instead of orbit controls
            initScrollControls();

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);

            // Load and create image clusters
            loadAndCreateImageClusters();

            // Initialize cluster interaction after renderer setup
            initClusterInteraction();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!isInitialized) return;
            requestAnimationFrame(animate);

            // Only update helix position and rotation when not in cluster mode
            if (!isClusterMode) {
            if (!isDragging) {
                targetY += scrollVelocity * 12;
                scrollVelocity *= VELOCITY_DAMPENING;
                
                if (Math.abs(scrollVelocity) < 0.001) {
                    scrollVelocity = 0;
                }
                
                targetY = Math.max(-MAX_SCROLL, Math.min(MAX_SCROLL, targetY));
            }

            const delta = targetY - currentY;
            const smoothing = Math.abs(delta) > 1 ? SCROLL_SMOOTHING : 0.8;
            currentY += delta * (1 - smoothing);
            
                targetRotation = (currentY / MAX_SCROLL) * Math.PI * 2 * ROTATION_SPEED;
                const rotationDelta = targetRotation - currentRotation;
                currentRotation += rotationDelta * (1 - SCROLL_SMOOTHING);
                
                if (helixGroup) {
                    helixGroup.position.y = -currentY;
                    helixGroup.rotation.y = currentRotation;
                }
            }

            // Update cluster transition if active
            updateClusterTransition();

            // Update camera-facing behavior for all clusters
            if (helixGroup) {
                helixGroup.children.forEach(cluster => {
                    const container = cluster.children[0];
                    if (container && container.userData.shouldFaceCamera) {
                        const clusterPosition = cluster.getWorldPosition(new THREE.Vector3());
                        const cameraPosition = camera.position.clone();
                        const direction = cameraPosition.sub(clusterPosition);
                        
                        const lookMatrix = new THREE.Matrix4();
                        lookMatrix.lookAt(
                            new THREE.Vector3(0, 0, 0),
                            direction,
                            new THREE.Vector3(0, 1, 0)
                        );
                        
                        container.quaternion.setFromRotationMatrix(lookMatrix);
                    }
                });
            }

            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const speeds = particles.userData.speeds;
                const opacities = particles.userData.opacities;
                
                for (let i = 0; i < positions.length; i += 3) {
                    // Move particles in a more vertical pattern
                    const speed = speeds[i / 3];
                    const time = Date.now() * 0.001 * speed;
                    
                    positions[i] += Math.sin(time) * 0.01; // Reduced horizontal movement
                    positions[i + 1] += Math.cos(time) * 0.02; // Increased vertical movement
                    positions[i + 2] += Math.sin(time * 0.5) * 0.01;

                    // Keep particles within bounds
                    if (positions[i + 1] > 150) positions[i + 1] = -150;
                    if (positions[i + 1] < -150) positions[i + 1] = 150;
                }
                
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            composer.render();
        }

        function updateLoadingUI(progress) {
            const progressBar = document.getElementById('loading-progress');
            const loadingText = document.getElementById('loading-text');
            
            if (progressBar && loadingText) {
                progressBar.style.width = `${progress}%`;
                loadingText.textContent = `LOADING... ${Math.floor(progress)}%`;
            }
        }

        function startVisualization() {
            // Show loading screen
            document.getElementById('loading-container').style.display = 'block';
            document.getElementById('black-overlay').style.display = 'block';
            document.getElementById('black-overlay').style.opacity = '1';
            document.getElementById('visualization').style.display = 'none';

            // Initialize the scene
            init();
            
            // Initialize UI menu after scene is ready
            setTimeout(() => {
                initUIMenu();
            }, 1000);
        }

        // UI Menu Management
        let isMenuVisible = false;
        
        function initUIMenu() {
            const menuToggle = document.getElementById('ui-menu-toggle');
            const menuOverlay = document.getElementById('ui-menu-overlay');
            const menuIframe = document.getElementById('ui-menu-iframe');
            
            // Toggle menu visibility
            menuToggle.addEventListener('click', () => {
                isMenuVisible = !isMenuVisible;
                if (isMenuVisible) {
                    menuOverlay.classList.remove('hidden');
                    menuOverlay.classList.add('visible');
                    menuToggle.classList.add('visible');
                    menuToggle.title = 'Close Menu';
                } else {
                    menuOverlay.classList.remove('visible');
                    menuOverlay.classList.add('hidden');
                    menuToggle.classList.remove('visible');
                    menuToggle.title = 'Open Menu';
                }
            });
            
            // Close menu when clicking outside
            menuOverlay.addEventListener('click', (e) => {
                if (e.target === menuOverlay) {
                    isMenuVisible = false;
                    menuOverlay.classList.remove('visible');
                    menuOverlay.classList.add('hidden');
                    menuToggle.classList.remove('visible');
                    menuToggle.title = 'Open Menu';
                }
            });
            
            // Swipe gesture support for mobile
            let startY = 0;
            let currentY = 0;
            let isDragging = false;
            
            menuOverlay.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isDragging = true;
            });
            
            menuOverlay.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
                const deltaY = currentY - startY;
                
                if (deltaY > 50) { // Swipe down to close
                    isMenuVisible = false;
                    menuOverlay.classList.remove('visible');
                    menuOverlay.classList.add('hidden');
                    menuToggle.classList.remove('visible');
                    menuToggle.title = 'Open Menu';
                    isDragging = false;
                }
            });
            
            menuOverlay.addEventListener('touchend', () => {
                isDragging = false;
            });
            
            // Handle iframe load
            menuIframe.addEventListener('load', () => {
                console.log('UI Menu iframe loaded successfully');
                
                // Set up communication between parent and iframe
                window.addEventListener('message', (event) => {
                    // Handle messages from the iframe
                    if (event.data && event.data.type === 'navigation') {
                        // Handle navigation requests from the menu
                        console.log('Navigation request:', event.data);
                        // You can add specific navigation logic here
                    }
                });
            });
            
            // Handle iframe errors
            menuIframe.addEventListener('error', (error) => {
                console.error('Failed to load UI Menu:', error);
                menuToggle.style.display = 'none';
            });
        }

        window.addEventListener('load', startVisualization);
    </script>
</body>
