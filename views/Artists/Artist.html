<!DOCTYPE html>
<html>
  <head>
    <title>Creator Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB41DRUbKWJHPxaFjMAwdrzWzbVKartNGg&libraries=places&callback=initGoogleMaps&loading=async"
      async
      defer
    ></script>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../../assets/VT323-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "Pixel";
        src: url("../../assets/pixel.ttf") format("truetype");
      }

      /* Page Title */
      .page-title {
        position: fixed;
        top: 10px;
        right: 20px;
        color: white;
        font-family: "VT323", monospace;
        font-size: 30px;
        text-align: right;
        z-index: 2000;
        pointer-events: none;
        display: none;
      }

      body {
        margin: 0;
        background-color: black;
        overflow: hidden;
      }

      #visualization {
        width: 100vw;
        height: 100vh;
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }
      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        z-index: 1000;
        transition: opacity 0.5s ease;
        opacity: 1;
        display: block;
      }
      #loading-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1001;
        display: block;
      }
      .loading-bar {
        width: 300px;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
      }
      .loading-progress {
        height: 100%;
        background: #ffffff;
        transition: width 0.3s ease;
      }

      /* Floating Eye Styles */
      #floating-eye {
        position: fixed;
        width: 200px;
        height: 200px;
        z-index: 1000;
        cursor: pointer;
        transition: transform 0.3s ease;
        pointer-events: auto;
        display: none;
        top: 100px;
        left: 100px;
        opacity: 0.7;
      }

      #floating-eye:hover {
        transform: scale(1.2);
      }

      #floating-eye img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* Tooltip Styles */
      #eye-tooltip {
        position: fixed;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        font-family: "VT323", monospace;
        font-size: 26px;
        width: 350px;
        height: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        pointer-events: none;
        text-align: center;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      #eye-tooltip.show {
        opacity: 0.8;
        visibility: visible;
      }

      #rings-container {
        position: fixed;
        bottom: -90px;
        left: -10px;
        width: 500px;
        height: 500px;
        z-index: 2;
        pointer-events: auto;
        cursor: grab;
        transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #rings-container:active {
        cursor: grabbing;
      }

      #rings-container.dock-visible {
        bottom: -90px;
      }

      #rings-container.dock-hidden {
        bottom: -400px;
      }

      /* Dock hover zone indicator (for debugging - can be removed) */
      .dock-hover-zone {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: rgba(255, 0, 0, 0.1);
        pointer-events: none;
        z-index: 1;
        display: none; /* Hidden by default, can be enabled for debugging */
      }

      /* Pixel Arrow Indicator */
      #pixel-arrow-indicator {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 1000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        animation: arrow-bounce 2s ease-in-out infinite;
      }

      #pixel-arrow-indicator.show {
        opacity: 0.7;
      }

      #pixel-arrow-indicator img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(0) invert(1);
      }

      @keyframes arrow-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(-8px);
        }
      }
      #hover-title {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-family: "VT323", monospace;
        font-size: 32px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      #search-bar {
        position: fixed;
        left: 50%;
        bottom: 3vw;
        transform: translateX(-50%);
        width: 420px;
        max-width: 80vw;
        min-width: 280px;
        height: 54px;
        background: #fff;
        border-radius: 32px;
        box-shadow: 0 2px 16px #0003;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #888;
        border: none;
        outline: none;
        padding: 0 32px;
        z-index: 1000;
        display: flex;
        align-items: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      #search-bar.dock-visible {
        opacity: 1;
        bottom: 3vw;
      }

      #search-bar.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      /* Upload Button Styles */
      #upload-hand-btn {
        position: fixed;
        right: -1vw;
        bottom: -2vw;
        width: 280px;
        height: 280px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2100;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
        flex-direction: column;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 25px;
      }

      #upload-hand-btn.dock-visible {
        opacity: 1;
        bottom: 0vw;
      }

      #upload-hand-btn.dock-hidden {
        opacity: 0;
        bottom: -200px;
      }

      #upload-hand-btn-text {
        position: relative;
        font-size: 28px;
        font-family: "VT323", monospace, sans-serif;
        color: #ffffff;
        background: none;
        border: none;
        text-align: center;
        pointer-events: none;
        width: 180px;
        line-height: 0.9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        letter-spacing: 0.5px;
        margin-bottom: -20px;
        transform: translateY(-50%);
      }

      #upload-hand-btn-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        display: block;
        pointer-events: none;
        transition: all 0.3s ease;
      }

      /* Chatbot Styles */
      .chatbot-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2999;
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .chatbot-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 95vw;
        max-width: 800px;
        height: 80vh;
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        z-index: 3000;
        display: none;
        font-family: "Overpass Mono", monospace;
        color: #fff;
      }

      .chatbot-input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #000;
        border-top: 1px solid #fff;
        padding: 20px;
        z-index: 10;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #dynamic-input-container {
        position: absolute;
        bottom: 100px;
        left: 0;
        right: 0;
        background: #000;
        padding: 10px 20px;
        z-index: 8;
        min-height: 0;
      }

      .persistent-input {
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .persistent-input input {
        flex: 1;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .persistent-input input:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .persistent-input input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .persistent-input button {
        padding: 12px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .persistent-input button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
      }

      .persistent-input button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .chatbot-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px;
        border-bottom: 1px solid #fff;
        font-family: "VT323", monospace;
        font-size: 24px;
        text-align: center;
        background: #000;
        z-index: 5;
      }

      .chatbot-messages {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 120px;
        overflow-y: auto;
        padding: 20px 20px 100px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
      }

      .message.bot {
        align-items: flex-start;
      }

      .message.user {
        align-items: flex-end;
      }

      .message-content {
        max-width: 80%;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      .message.bot .message-content {
        background: rgba(255, 255, 255, 0.05);
      }

      .message.user .message-content {
        background: rgba(255, 255, 255, 0.1);
      }

      /* Add extra space after the last message */
      .chatbot-messages::after {
        content: "";
        height: 40px;
        flex-shrink: 0;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 15px;
        border: 1px solid #fff;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        max-width: 80%;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes typing {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field {
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }

      .input-field:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .file-upload-area {
        border: 2px dashed #fff;
        border-radius: 8px;
        padding: 20px;
        min-height: 300px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .upload-icon {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        opacity: 1;
        transition: opacity 0.3s ease;
        margin-top: -5px;
      }

      .file-upload-area:hover .upload-icon {
        opacity: 1;
      }

      .file-upload-area:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .file-upload-area.dragover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #fff;
      }

      .uploaded-image {
        max-width: 80%;
        max-height: 120px;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .file-upload-text {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
      }

      .button-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: flex-end;
      }

      .btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 10px;
      }

      .slider {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
        min-width: 0;
      }

      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
      }

      .tag-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .tag {
        padding: 6px 12px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .tag:hover,
      .tag.selected {
        background: rgba(255, 255, 255, 0.1);
      }

      .summary-screen {
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .summary-label {
        font-family: "VT323", monospace;
        font-size: 16px;
      }

      .summary-value {
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      /* Map Popup Styles */
      .map-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        z-index: 4000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .map-popup-content {
        background: #000;
        border: 1px solid #fff;
        border-radius: 8px;
        padding: 20px;
        max-width: 800px;
        width: 90vw;
        max-height: 80vh;
        font-family: "VT323", monospace;
        color: #fff;
        display: flex;
        flex-direction: column;
      }

      .map-popup-header {
        font-size: 24px;
        margin-bottom: 15px;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .map-popup-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        font-family: "VT323", monospace;
      }

      .map-container {
        flex: 1;
        min-height: 400px;
        border: 1px solid #fff;
        border-radius: 4px;
        margin-bottom: 15px;
        position: relative;
        background: #1a1a1a;
        overflow: visible;
        display: flex;
        flex-direction: column;
      }

      #map {
        width: 100%;
        height: 100%;
        min-height: 400px;
        flex: 1;
        position: relative;
        background: #1a1a1a;
      }

      .map-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        padding: 10px;
        border-radius: 4px;
        z-index: 1000;
      }

      .map-instructions {
        color: #fff;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
      }

      .map-pin-button {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #ff4444;
        border: 2px solid #fff;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        cursor: pointer;
        z-index: 1001;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }

      .map-pin-button:hover {
        background: #ff6666;
      }

      .map-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }

      .map-input {
        flex: 1;
        min-width: 200px;
        background: transparent;
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 8px 12px;
        color: #fff;
        font-family: "Overpass Mono", monospace;
        font-size: 14px;
        outline: none;
      }

      .map-input:focus {
        border-color: #fff;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
      }

      .map-popup-buttons {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .map-popup-btn {
        padding: 10px 20px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .map-popup-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary {
        background: rgba(255, 255, 255, 0.1);
      }

      .map-popup-btn.primary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .coordinates-display {
        font-family: "Overpass Mono", monospace;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 10px;
        text-align: center;
      }

      /* Drawer Modal Styles */
      .drawer-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .drawer-backdrop.show {
        opacity: 1;
        visibility: visible;
      }

      .drawer-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        z-index: 3001;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        display: flex;
        align-items: flex-start;
        gap: 20px;
        max-width: 95vw;
        max-height: 90vh;
        justify-content: center;
        position: relative;
      }

      .drawer-container.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      .drawer-artwork {
        position: relative;
        width: auto;
        height: auto;
        max-width: 45vw;
        max-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        overflow: hidden;
        z-index: 2;

      let originalHelixRotation = null;

        images: [],

      // Function to position clusters in a helix
      function createHelixPosition(index, totalClusters) {
        const turns = 20; // Increased turns to make helix longer
        const heightStep = 1500 / totalClusters; // Increased height to accommodate more turns
        const radius = 40; // Larger radius for better visibility of the extended helix

        // Calculate position on helix
        const angle = (index / totalClusters) * Math.PI * 2 * turns;
        const x = radius * Math.cos(angle);
        const y = index * heightStep - 750; // Center vertically (half of 1500)
        const z = radius * Math.sin(angle);

        return new THREE.Vector3(x, y, z);
      }

      // Function to create helix outline
      function createHelixOutline() {
        const turns = 20;
        const radius = 40;
        const totalHeight = 1500;
        const segments = 1200; // Increased segments for even smoother curve

        // Create main helix line
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const angle = (i / segments) * Math.PI * 2 * turns;
          const y = (i / segments) * totalHeight - totalHeight / 2;
          const x = radius * Math.cos(angle);
          const z = radius * Math.sin(angle);
          points.push(new THREE.Vector3(x, y, z));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.9,
          linewidth: 6,
        });

        const line = new THREE.Line(geometry, material);
        line.renderOrder = 0; // Ensure grid renders behind images
        return line;
      }

      // Function to create 3D grid for helix
      function createHelixGrid() {
        const turns = 20;
        const radius = 40;
        const totalHeight = 1500;
        const gridGroup = new THREE.Group();

        // Create spiral guide lines (secondary helix paths) - more lines with weight hierarchy
        const spiralGuides = 6; // Increased number of spiral guides
        for (let guide = 0; guide <= spiralGuides; guide++) {
          const guideRadius = radius * (0.2 + guide * 0.15); // More guides with closer spacing
          const points = [];
          const segments = 800; // Increased segments for smoother guide lines

          for (let i = 0; i <= segments; i++) {
            const angle = (i / segments) * Math.PI * 2 * turns;
            const y = (i / segments) * totalHeight - totalHeight / 2;
            const x = guideRadius * Math.cos(angle);
            const z = guideRadius * Math.sin(angle);
            points.push(new THREE.Vector3(x, y, z));
          }

          // Weight hierarchy: outermost line is heaviest
          const isOutermost = guide === spiralGuides;
          const lineWidth = isOutermost ? 5 : 3 + guide * 0.5; // 5 for outermost, decreasing inward
          const opacity = isOutermost ? 0.8 : 0.4 + guide * 0.05; // Higher opacity for outer lines

          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: opacity,
            linewidth: lineWidth,
          });

          const line = new THREE.Line(geometry, material);
          line.renderOrder = 0; // Ensure grid renders behind images
          gridGroup.add(line);
        }

        return gridGroup;
      }

      function createTextSprite(text) {
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        // Set canvas size with more width for longer text
        canvas.width = 512;
        canvas.height = 64;

        // Set text style
        context.font = "32px monospace";
        context.textAlign = "center";
        context.fillStyle = "white";

        // Draw text
        context.fillText(text, canvas.width / 2, canvas.height / 2);

        // Create texture
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;

        // Create sprite material
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.8,
        });

        // Create sprite with moderate scale
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(16, 3, 1); // Moderate scale that should fit longer text without distortion

        return sprite;
      }

      async function loadAndCreateImageClusters() {
        try {
          // Ensure loading screen is visible and update initial progress
          updateLoadingUI(0);

          // Load data first
          await loadData();

          helixGroup = new THREE.Group();
          scene.add(helixGroup);

          // Create and add helix outline
          helixOutline = createHelixOutline();
          helixGroup.add(helixOutline);

          // Create and add 3D grid
          const helixGrid = createHelixGrid();
          helixGroup.add(helixGrid);

          updateLoadingUI(5); // 5% for scene setup

          // Load creator clusters instead of random images
          const response = await fetch("creator_clusters.json");
          if (!response.ok) {
            throw new Error(
              "Failed to load creator_clusters.json. Please run the create_creator_clusters.py script first."
            );
          }
          const creatorClusters = await response.json();

          updateLoadingUI(10); // 10% for JSON loaded

          const textureLoader = new THREE.TextureLoader();
          let loadedImages = 0;
          const totalImages = creatorClusters.reduce(
            (sum, cluster) => sum + cluster.images.length,
            0
          );

          updateLoadingUI(15); // 15% for data processing

          // Create clusters for each creator
          for (
            let clusterIndex = 0;
            clusterIndex < creatorClusters.length;
            clusterIndex++
          ) {
            const cluster = creatorClusters[clusterIndex];
            const clusterGroup = new THREE.Group();

            // Position cluster on helix
            const helixPos = createHelixPosition(
              clusterIndex,
              creatorClusters.length
            );
            clusterGroup.position.copy(helixPos);

            // Create container for images
            const clusterContainer = new THREE.Object3D();
            clusterGroup.add(clusterContainer);
            clusterContainer.userData.shouldFaceCamera = true;
            clusterContainer.userData.clusterData = cluster; // Store cluster data for popup

            // Add images to cluster
            const images = cluster.images;
            for (let i = 0; i < images.length; i++) {
              const imageData = images[i];
              const imagePath = `../../images2/${imageData.filename}`;

              await new Promise((resolve, reject) => {
                textureLoader.load(
                  imagePath,
                  (texture) => {
                    const aspectRatio =
                      texture.image.width / texture.image.height;
                    const spriteMaterial = new THREE.SpriteMaterial({
                      map: texture,
                      transparent: true,
                      opacity: 1.0,
                    });
                    const sprite = new THREE.Sprite(spriteMaterial);

                    // Store image data for click detection
                    sprite.userData.imageData = imageData;
                    sprite.userData.imagePath = imagePath;
                    sprite.userData.clusterIndex = clusterIndex;

                    // Ensure images render in front of grid
                    sprite.renderOrder = 1000;
                    sprite.material.depthTest = false;

                    const baseSize = 8;
                    sprite.scale.set(baseSize * aspectRatio, baseSize, 1);

                    // Calculate grid dimensions for proper spacing
                    const gridCols = Math.ceil(Math.sqrt(images.length));
                    const gridRows = Math.ceil(images.length / gridCols);
                    const spacing = Math.max(10, baseSize * 1.3);

                    // Calculate total height of the grid
                    const totalGridHeight = gridRows * spacing;

                    // Add creator name text under the cluster
                    const creatorName = cluster.creator;
                    const textSprite = createTextSprite(creatorName);
                    // Ensure text also renders in front
                    textSprite.renderOrder = 1000;
                    textSprite.material.depthTest = false;
                    // Position the text sprite below the bottom row of images
                    textSprite.position.y = -(totalGridHeight / 2 + 1);
                    textSprite.position.z = 0;
                    clusterContainer.add(textSprite);

                    // Position in a flat grid layout with increased spacing
                    const col = i % gridCols;
                    const row = Math.floor(i / gridCols);
                    const offsetX = (col - (gridCols - 1) / 2) * spacing;
                    const offsetY = (row - (gridRows - 1) / 2) * spacing;
                    sprite.position.set(offsetX, offsetY, 0);

                    clusterContainer.add(sprite);
                    loadedImages++;

                    // Update progress from 15% to 85% based on image loading
                    const imageProgress =
                      15 + (loadedImages / totalImages) * 70;
                    updateLoadingUI(imageProgress);
                    resolve();
                  },
                  undefined,
                  reject
                );
              });
            }

            helixGroup.add(clusterGroup);
            imageGroups.push(clusterGroup);
          }

          updateLoadingUI(90); // 90% for all images loaded

          // Initial camera position
          camera.position.set(80, 0, 80);
          camera.lookAt(0, 0, 0);

          updateLoadingUI(95); // 95% for camera setup

          // Small delay to ensure everything is ready
          await new Promise((resolve) => setTimeout(resolve, 500));

          updateLoadingUI(100); // 100% complete

          // Show visualization
          const loadingContainer = document.getElementById("loading-container");
          const visualization = document.getElementById("visualization");
          const blackOverlay = document.getElementById("black-overlay");

          if (loadingContainer) loadingContainer.style.display = "none";
          if (visualization) visualization.style.display = "block";

          // Show page title after loading screen is gone
          document.querySelector(".page-title").style.display = "block";

          if (blackOverlay) {
            blackOverlay.style.opacity = "0";
            setTimeout(() => {
              blackOverlay.style.display = "none";
            }, 500);
          }

          isInitialized = true;

          // Initialize search functionality after helix is loaded
          const searchBar = document.getElementById("search-bar");
          if (searchBar) {
            // Always reset to default placeholder text
            searchBar.value = "";
          }

          animate();
        } catch (error) {
          console.error("Error in loadAndCreateImageClusters:", error);
          const loadingText = document.getElementById("loading-text");
          if (loadingText) {
            loadingText.textContent =
              "Error loading images. Please refresh the page.";
          }
        }
      }

      // Add mouse event listeners
      function initScrollControls() {
        const container = renderer.domElement;
        let lastDragTime = 0;
        let lastDragY = 0;
        let isMouseDown = false;

        container.addEventListener("mousedown", (e) => {
          isDragging = true;
          isMouseDown = true;
          previousY = e.clientY;
          lastDragY = e.clientY;
          lastDragTime = Date.now();
          scrollVelocity = 0;
        });

        container.addEventListener("mousemove", (e) => {
          if (!isDragging || !isMouseDown) return;

          const now = Date.now();
          const dt = Math.min(now - lastDragTime, 100); // Increased max dt for smoother velocity
          if (dt > 0) {
            scrollVelocity = ((e.clientY - lastDragY) / dt) * 0.3; // Reduced multiplier for smoother velocity
          }

          const deltaY = (e.clientY - previousY) * SCROLL_SPEED;
          targetY = Math.max(
            -MAX_SCROLL,
            Math.min(MAX_SCROLL, targetY + deltaY)
          );

          previousY = e.clientY;
          lastDragY = e.clientY;
          lastDragTime = now;
        });

        container.addEventListener("mouseup", () => {
          isDragging = false;
          isMouseDown = false;
          scrollVelocity *= 6; // Reduced from 8 for smoother deceleration
        });

        container.addEventListener("mouseleave", () => {
          isDragging = false;
          isMouseDown = false;
          scrollVelocity = 0;
        });

        // Improved touch support
        container.addEventListener(
          "touchstart",
          (e) => {
            isDragging = true;
            previousY = e.touches[0].clientY;
            lastDragY = e.touches[0].clientY;
            lastDragTime = Date.now();
            scrollVelocity = 0;
            e.preventDefault();
          },
          { passive: false }
        );

        container.addEventListener(
          "touchmove",
          (e) => {
            if (!isDragging) return;

            const now = Date.now();
            const dt = Math.min(now - lastDragTime, 100); // Increased max dt
            if (dt > 0) {
              scrollVelocity = ((e.touches[0].clientY - lastDragY) / dt) * 0.3; // Reduced multiplier
            }

            const deltaY = (e.touches[0].clientY - previousY) * SCROLL_SPEED;
            targetY = Math.max(
              -MAX_SCROLL,
              Math.min(MAX_SCROLL, targetY + deltaY)
            );

            previousY = e.touches[0].clientY;
            lastDragY = e.touches[0].clientY;
            lastDragTime = now;
            e.preventDefault();
          },
          { passive: false }
        );

        container.addEventListener("touchend", () => {
          isDragging = false;
          scrollVelocity *= 6; // Reduced from 8
        });

        // Improved wheel support
        let wheelTimeout;
        container.addEventListener(
          "wheel",
          (e) => {
            const deltaY = e.deltaY * 0.1; // Reduced from 0.15 for smoother wheel scrolling
            targetY = Math.max(
              -MAX_SCROLL,
              Math.min(MAX_SCROLL, targetY + deltaY)
            );

            scrollVelocity = 0;
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
              scrollVelocity = Math.sign(deltaY) * 0.03; // Reduced from 0.05
            }, 100); // Increased timeout for smoother wheel behavior

            e.preventDefault();
          },
          { passive: false }
        );
      }

      // Function to handle cluster mode transition
      function enterClusterMode(cluster) {
        if (isClusterMode && activeCluster === cluster) {
          exitClusterMode();
          return;
        }

        isClusterMode = true;
        activeCluster = cluster;

        // Store original positions and states
        originalCameraPosition = camera.position.clone();
        originalHelixY = helixGroup.position.y;
        originalHelixRotation = helixGroup.rotation.y;

        // Store original scale of the cluster container
        const container = cluster.children[0];
        if (container) {
          container.userData.originalScale = container.scale.clone();
        }

        // Calculate camera target position based on cluster's current position
        const clusterWorldPos = cluster.getWorldPosition(new THREE.Vector3());
        const cameraOffset = new THREE.Vector3(0, 0, 60); // Increased offset from 40 to 60
        targetClusterPosition = clusterWorldPos.clone().add(cameraOffset);

        // Start dimming all other clusters
        helixGroup.children.forEach((otherCluster) => {
          if (otherCluster !== cluster) {
            const container = otherCluster.children[0];
            if (container) {
              container.children.forEach((sprite) => {
                sprite.userData.originalOpacity = sprite.material.opacity;
                sprite.material.opacity = 0;
              });
            }
          }
        });

        // Ensure active cluster is fully visible
        if (container) {
          container.renderOrder = 999;
          container.children.forEach((sprite) => {
            sprite.renderOrder = 999;
            sprite.material.depthTest = false;
            sprite.material.opacity = 1;
          });
        }

        // Start transition
        transitionStartTime = Date.now();

        // Disable scrolling during cluster mode
        isDragging = false;
        scrollVelocity = 0;
      }

      function exitClusterMode() {
        if (!isClusterMode || !activeCluster) return;

        // Reset render order and depth testing for active cluster
        const container = activeCluster.children[0];
        if (container) {
          container.renderOrder = 0;
          container.children.forEach((sprite) => {
            sprite.renderOrder = 0;
            sprite.material.depthTest = true;
          });

          // Restore original scale
          if (container.userData.originalScale) {
            container.scale.copy(container.userData.originalScale);
            delete container.userData.originalScale;
          }
        }

        // Restore opacity for all clusters
        helixGroup.children.forEach((cluster) => {
          const container = cluster.children[0];
          if (container) {
            container.children.forEach((sprite) => {
              if (sprite.userData.originalOpacity !== undefined) {
                sprite.material.opacity = sprite.userData.originalOpacity;
                delete sprite.userData.originalOpacity;
              }
            });
          }
        });

        // Start transition back
        transitionStartTime = Date.now();
        targetClusterPosition.copy(originalCameraPosition);

        // Reset after animation
        setTimeout(() => {
          isClusterMode = false;
          activeCluster = null;
          originalClusterPosition = null;
          originalClusterRotation = null;
          originalCameraPosition = null;
        }, CLUSTER_TRANSITION_DURATION);
      }

      function updateClusterTransition() {
        if (!isClusterMode || !activeCluster) return;

        const elapsed = Date.now() - transitionStartTime;
        const progress = Math.min(elapsed / CLUSTER_TRANSITION_DURATION, 1);

        // Smooth easing function
        const eased = 1 - Math.pow(1 - progress, 3);

        // Move camera to cluster
        if (originalCameraPosition) {
          camera.position.lerpVectors(
            originalCameraPosition,
            targetClusterPosition,
            eased
          );

          // Make camera look at the cluster
          const clusterWorldPos = activeCluster.getWorldPosition(
            new THREE.Vector3()
          );
          camera.lookAt(clusterWorldPos);
        }

        // Scale up the entire cluster container uniformly
        const container = activeCluster.children[0];
        if (container && container.userData.originalScale) {
          const targetScale = 1.5; // Reduced from 2.5x to 1.5x for smaller appearance
          const currentScale = 1 + (targetScale - 1) * eased;
          container.scale.setScalar(currentScale);

          // Ensure all sprites are on the same plane and facing camera
          container.children.forEach((sprite) => {
            if (sprite instanceof THREE.Sprite) {
              sprite.position.z = 0; // Force all sprites to same z-plane
            }
          });
        }

        // If exiting cluster mode, restore helix position and rotation
        if (
          !isClusterMode &&
          originalHelixY !== null &&
          originalHelixRotation !== null
        ) {
          helixGroup.position.y = originalHelixY;
          helixGroup.rotation.y = originalHelixRotation;
        }

        if (progress === 1) {
          transitionStartTime = 0;
          if (!isClusterMode) {
            originalHelixY = null;
            originalHelixRotation = null;
          }
        }
      }

      // Cluster popup functions
      function showClusterPopup(cluster, clusterIndex) {
        // Extract images from the cluster
        const container = cluster.children[0];
        const images = [];
        let username = "";
        let clusterData = null;

        if (container && container.userData.clusterData) {
          clusterData = container.userData.clusterData;
          username = clusterData.creator;

          // Extract image data from the cluster
          container.children.forEach((child) => {
            if (child instanceof THREE.Sprite && child.userData.imageData) {
              images.push(child.userData.imageData);
            }
          });
        }

        // Store cluster data
        clusterPopupData = {
          images: images,
          clusterIndex: clusterIndex,
          username: username,
          clusterData: clusterData,
        };

        // Update popup title
        const titleElement = document.getElementById("cluster-popup-title");
        if (titleElement) {
          titleElement.textContent = `${username} • ${images.length} images`;
        }

        // Build carousel
        buildClusterCarousel();

          popup.style.display = "flex";
          setTimeout(() => {
            popup.classList.add("show");
          }, 10);
        }

            }

        const popup = document.getElementById("cluster-popup-overlay");
        if (popup) {
          popup.classList.remove("show");
          setTimeout(() => {
            popup.style.display = "none";
          }, 300);

      function buildClusterCarousel() {
        const carousel = document.getElementById("cluster-carousel");

        if (!carousel) return;

        // Clear existing content
        carousel.innerHTML = "";

        // Calculate number of columns needed for 2 rows
        const numImages = clusterPopupData.images.length;
        const columnsNeeded = Math.ceil(numImages / 2);

        // Set grid template columns for exactly 2 rows
        carousel.style.gridTemplateColumns = `repeat(${columnsNeeded}, 1fr)`;

        // Add images to grid
        clusterPopupData.images.forEach((imageData, index) => {
          const imageItem = document.createElement("div");
          imageItem.className = "cluster-image-item";

          const img = document.createElement("img");
          img.src = `../../images2/${imageData.filename}`;
          img.alt = imageData.title || `Image ${index + 1}`;
          img.style.cursor = "pointer";
          img.style.maxWidth = "100%";
          img.style.maxHeight = "220px";
          img.style.objectFit = "contain";
          img.onerror = function () {
            imageItem.innerHTML =
              '<div style="color: #666; font-size: 16px;">Image not available</div>';
          };

          // Add click handler to show image details
          img.onclick = function (event) {
            showImageDetails(imageData, index, event);
          };

          imageItem.appendChild(img);
          carousel.appendChild(imageItem);
        });

            // Landscape image: fit to width first
            finalWidth = maxWidth;
            finalHeight = maxWidth / aspectRatio;

            // If height exceeds max height, scale down proportionally
            if (finalHeight > maxHeight) {
              finalHeight = maxHeight;
              finalWidth = maxHeight * aspectRatio;
            }

            // Portrait/elongated image: fit to height first
            finalHeight = maxHeight;

            // If width exceeds max width, scale down proportionally

              finalWidth = maxWidth;

      // Add double click handler to renderer
      function initClusterInteraction() {
        const container = renderer.domElement;

        // Add double click handler for clusters
        container.addEventListener("dblclick", (event) => {
          event.preventDefault();

          // Calculate mouse position in normalized device coordinates
          const mouse = new THREE.Vector2();
          mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

          // Raycast to find clicked cluster
          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          // Check for intersections with cluster groups
          const intersects = raycaster.intersectObjects(imageGroups, true);

          if (intersects.length > 0) {
            // Find the cluster group that was clicked
            let clickedCluster = null;
            let clusterIndex = -1;

            for (let i = 0; i < imageGroups.length; i++) {
              const cluster = imageGroups[i];
              if (cluster.children.length > 0) {
                const container = cluster.children[0];
                if (
                  container.children.some(
                    (child) =>
                      child instanceof THREE.Sprite &&
                      raycaster.intersectObject(child).length > 0
                  )
                ) {
                  clickedCluster = cluster;
                  clusterIndex = i;
                  break;
                }
              }
            }

            if (clickedCluster) {
              showClusterPopup(clickedCluster, clusterIndex);
            }
          }
        });

        // Add escape key handler
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeClusterPopup();
          }
        });
      }

      async function init() {
        // Create scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // Create noise texture
        const canvas = document.createElement("canvas");
        canvas.width = 1920;
        canvas.height = 1080;
        const ctx = canvas.getContext("2d");

        // Generate noise
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const value = Math.random() * 50;
          data[i] = value; // R
          data[i + 1] = value; // G
          data[i + 2] = value; // B
          data[i + 3] = 20; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // Create texture from canvas
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Set as background
        scene.background = noiseTexture;

        // Create camera with larger far plane and wider FOV
        camera = new THREE.PerspectiveCamera(
          45, // Increased FOV from 35 to 45 for better visibility with margins
          window.innerWidth / window.innerHeight,
          0.1,
          2000 // Much larger far plane to see the entire helix
        );
        camera.position.set(80, 0, 80); // Moved camera further out
        camera.lookAt(0, 0, 0);

        // Create renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document
          .getElementById("visualization")
          .appendChild(renderer.domElement);

        // Setup post-processing
        composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Add vignette effect
        const vignetteShader = {
          uniforms: {
            tDiffuse: { value: null },
            offset: { value: 1.0 },
            darkness: { value: 1.0 },
          },
          vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
          fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float offset;
                    uniform float darkness;
                    varying vec2 vUv;

                    void main() {
                        vec2 uv = vUv;
                        vec4 color = texture2D(tDiffuse, uv);

                        // Calculate distance from center
                        vec2 center = vec2(0.5, 0.5);
                        float dist = distance(uv, center);

                        // Create vignette effect
                        float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));

                        // Apply vignette
                        color.rgb *= vignette;

                        gl_FragColor = color;
                    }
                `,
        };

        const vignettePass = new THREE.ShaderPass(vignetteShader);
        vignettePass.uniforms.offset.value = 0.5;
        vignettePass.uniforms.darkness.value = 0.5;
        composer.addPass(vignettePass);

        // Initialize scroll controls instead of orbit controls
        initScrollControls();

        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);

        // Load and create image clusters (this will handle the loading screen)
        await loadAndCreateImageClusters();

        // Initialize cluster interaction after renderer setup
        initClusterInteraction();

        // Initialize rings
        initRings();

        // Initialize drawer modal functionality
        initDrawerModal();
      }

      function createEyeSprite(imagePath) {
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load(imagePath);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
        });

        const sprite = new THREE.Sprite(spriteMaterial);

        // Set scale based on image aspect ratio
        const img = new window.Image();
        img.src = imagePath;
        img.onload = function () {
          const baseHeight = 2; // units
          const aspect = img.width / img.height;
          sprite.scale.set(baseHeight * aspect, baseHeight, 1);
        };
        // Fallback scale until image loads
        sprite.scale.set(2, 2, 1);
        return sprite;
      }

      // Helper to create a horizontal text sprite (label above the eye)
      function createArcTextSprite(text, fontSize = 100) {
        const canvas = document.createElement("canvas");
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        // Ensure full transparency
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
        ctx.save();
        ctx.globalCompositeOperation = "copy";
        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.font = `bold ${fontSize}px VT323, monospace`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Draw the text as a single horizontal line
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        ctx.fillText(text, centerX, centerY);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
          depthWrite: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(7, 1.5, 1);
        sprite.material.renderOrder = 9999;
        return sprite;
      }

      function createEyeWithLabel(eyePath, labelText, eyePos, upVector, eyeId) {

        group.add(eye);
        // Store for raycasting
        eyeLabelGroups.push({ eye });
        return group;
      }

      function createRings() {
        // Create an elliptical curve for the oblong ring
        class CustomEllipseCurve extends THREE.Curve {
          constructor() {
            super();
          }
          getPoint(t) {
            const a = 8; // major axis
            const b = 5; // minor axis
            const tx = Math.cos(2 * Math.PI * t) * a;
            const ty = Math.sin(2 * Math.PI * t) * b;
            return new THREE.Vector3(tx, ty, 0);
          }
        }

        const ringsGroup = new THREE.Group(); // <-- ensure this is defined
        eyeLabelGroups = [];
        // Create the oblong ring geometry
        const path = new CustomEllipseCurve();
        const ringGeometry = new THREE.TubeGeometry(path, 100, 0.05, 16, false);

        // Create materials with different render orders
        const ringMaterial1 = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.2,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          renderOrder: 1,
        });
        const ringMaterial2 = ringMaterial1.clone();
        ringMaterial2.renderOrder = 2;
        const ringMaterial3 = ringMaterial1.clone();
        ringMaterial3.renderOrder = 3;

        // Ring 1 (horizontal, up is +Y)
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial1);
        const group1a = createEyeWithLabel(
          "../../Eyes/Temperament_open.png",

        ring1.add(group1a);
        ring1.add(group1b);
        ring1.position.z = 1;

        // Ring 2 (vertical, up is +Z)
        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial2);
        const group2a = createEyeWithLabel(
          "../../Eyes/Artist_open.png",
          "Creator",
          new THREE.Vector3(0, 9, 0),

        const group2b = createEyeWithLabel(
          "../../Eyes/Completeness_open.png",

        ring2.rotation.x = Math.PI / 2;
        ring2.position.z = 0;
        ring2.add(group2a);
        ring2.add(group2b);

        // Ring 3 (side, up is +X)
        const ring3 = new THREE.Mesh(ringGeometry, ringMaterial3);
        const group3a = createEyeWithLabel(

        const group3b = createEyeWithLabel(

        ring3.rotation.y = Math.PI / 2;
        ring3.position.z = -1;
        ring3.add(group3a);
        ring3.add(group3b);

        ringsGroup.add(ring1);
        ringsGroup.add(ring2);
        ringsGroup.add(ring3);
        return ringsGroup;

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;

      function animate() {
        if (!isInitialized) return;
        requestAnimationFrame(animate);

        // Only update helix position and rotation when not in cluster mode and not animating camera
        if (!isClusterMode && !isCameraAnimating) {
          if (!isDragging) {
            targetY += scrollVelocity * 8; // Reduced from 12 for smoother movement
            scrollVelocity *= VELOCITY_DAMPENING;

            if (Math.abs(scrollVelocity) < 0.0005) {
              // Reduced threshold for smoother stopping
              scrollVelocity = 0;
            }

            targetY = Math.max(-MAX_SCROLL, Math.min(MAX_SCROLL, targetY));
          }

          const delta = targetY - currentY;
          const smoothing = Math.abs(delta) > 0.5 ? SCROLL_SMOOTHING : 0.9; // Increased base smoothing
          currentY += delta * (1 - smoothing);

          targetRotation =
            (currentY / MAX_SCROLL) * Math.PI * 2 * ROTATION_SPEED;
          const rotationDelta = targetRotation - currentRotation;
          currentRotation += rotationDelta * (1 - SCROLL_SMOOTHING);

          if (helixGroup) {
            helixGroup.position.y = -currentY;
            helixGroup.rotation.y = currentRotation;
          }
        }

        // Update cluster transition if active
        updateClusterTransition();

        // Update camera-facing behavior for all clusters
        if (helixGroup) {
          helixGroup.children.forEach((cluster) => {
            const container = cluster.children[0];
            if (container && container.userData.shouldFaceCamera) {
              const clusterPosition = cluster.getWorldPosition(
                new THREE.Vector3()
              );
              const cameraPosition = camera.position.clone();
              const direction = cameraPosition.sub(clusterPosition);

              const lookMatrix = new THREE.Matrix4();
              lookMatrix.lookAt(
                new THREE.Vector3(0, 0, 0),
                direction,
                new THREE.Vector3(0, 1, 0)
              );

              container.quaternion.setFromRotationMatrix(lookMatrix);
            }
          });
        }

        // Animate particles
        if (particles) {
          const positions = particles.geometry.attributes.position.array;
          const speeds = particles.userData.speeds;
          const opacities = particles.userData.opacities;

          for (let i = 0; i < positions.length; i += 3) {
            // Move particles in a more vertical pattern
            const speed = speeds[i / 3];
            const time = Date.now() * 0.001 * speed;

            positions[i] += Math.sin(time) * 0.01; // Reduced horizontal movement
            positions[i + 1] += Math.cos(time) * 0.02; // Increased vertical movement
            positions[i + 2] += Math.sin(time * 0.5) * 0.01;

            // Keep particles within bounds
            if (positions[i + 1] > 150) positions[i + 1] = -150;
            if (positions[i + 1] < -150) positions[i + 1] = 150;
          }

          particles.geometry.attributes.position.needsUpdate = true;
        }

        // Animate rings - natural slow rotation when not dragging
        if (rings && !ringsRotation.isDragging) {
          // Very slow, natural rotation
          rings.rotation.x += 0.0005;
          rings.rotation.y += 0.0008;
        }

        composer.render();
        ringsRenderer.render(ringsScene, ringsCamera);
      }

      function onRingsMouseDown(event) {
        ringsRotation.dragStartTime = Date.now();
        ringsRotation.previousX = event.clientX;
        ringsRotation.previousY = event.clientY;
        ringsRotation.isDragging = false; // Start as false, will be set to true if movement exceeds threshold
      }

      function onRingsMouseMove(event) {
        // Only handle dragging if mouse button is pressed
        if (event.buttons !== 1) {
          return; // No mouse button pressed, don't handle dragging
        }

        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Check if we should start dragging (movement exceeds threshold)
        if (
          !ringsRotation.isDragging &&
          distance > ringsRotation.dragThreshold
        ) {
          ringsRotation.isDragging = true;
        }

        if (ringsRotation.isDragging) {
          rings.rotation.y += deltaX * 0.01;
          rings.rotation.x += deltaY * 0.01;

          ringsRotation.previousX = event.clientX;
          ringsRotation.previousY = event.clientY;
        }
      }

      function onRingsMouseUp() {
        ringsRotation.isDragging = false;
      }

      function onRingsMouseHover(event) {
        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        // Collect all eye meshes
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        const hoverTitle = document.getElementById("hover-title");

        // Hide title by default
        if (hoverTitle) {
          hoverTitle.style.opacity = "0";
        }

        // Show title for hovered eye
        if (intersects.length > 0) {
          const hoveredEye = intersects[0].object;
          if (hoveredEye.userData.title && hoverTitle) {
            hoverTitle.textContent = hoveredEye.userData.title;
            hoverTitle.style.opacity = "1";
          }
        }
      }

      function onRingsClick(event) {
        // Check if this was a drag or a click
        const timeSinceMouseDown = Date.now() - ringsRotation.dragStartTime;
        const deltaX = event.clientX - ringsRotation.previousX;
        const deltaY = event.clientY - ringsRotation.previousY;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

        // Only handle clicks if:
        // 1. Not dragging (or very minimal movement)
        // 2. Quick click (less than threshold time)
        // 3. Small movement (less than threshold distance)
        if (
          ringsRotation.isDragging ||
          timeSinceMouseDown > ringsRotation.clickThreshold ||
          distance > ringsRotation.dragThreshold
        ) {
          return;
        }

        // Calculate mouse position in normalized device coordinates
        const rect = ringsRenderer.domElement.getBoundingClientRect();
        ringsMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        ringsMouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        // Raycast
        ringsRaycaster.setFromCamera(ringsMouse, ringsCamera);
        const eyes = eyeLabelGroups.map((g) => g.eye);
        const intersects = ringsRaycaster.intersectObjects(eyes, false);

        if (intersects.length > 0) {
          const clickedEye = intersects[0].object;
          const eyeId = clickedEye.userData.eyeId;

          // Navigation logic
          switch (eyeId) {
            case "eye-temperament":
              window.location.href = "../temperament/temperament.html";
              break;
            case "eye-secret":
              window.location.href = "../hashtag_gallery/hashtag_gallery.html";
              break;
            case "eye-intimacy":
              window.location.href = "../intimacy/Intimacy.html";
              break;
            case "eye-completeness":
              window.location.href = "../Completeness/Completeness.html";
              break;
            case "eye-artist":
              // Already on artist page
              break;
            case "eye-rhizome":
              window.location.href = "../rhizome/rhizome.html";
              break;
            default:
              // Silently ignore unknown eye IDs
              break;
          }
        }
      }

      function initFloatingEye() {
        console.log("Initializing floating eye...");
        const eye = document.getElementById("floating-eye");
        const tooltip = document.getElementById("eye-tooltip");

        console.log("Eye element:", eye);
        console.log("Tooltip element:", tooltip);

          return;
        }

        // Set up hover events
        eye.addEventListener("mouseenter", () => {
          console.log("Eye hovered!");
          eyeIsHovered = true;
          tooltip.classList.add("show");
        });

        eye.addEventListener("mouseleave", () => {
          console.log("Eye unhovered!");
          eyeIsHovered = false;
          tooltip.classList.remove("show");
        });

        // Update tooltip position
        eye.addEventListener("mousemove", (e) => {
          const rect = eye.getBoundingClientRect();
          const eyeCenterX = rect.left + rect.width / 2;
          const screenCenterX = window.innerWidth / 2;

          // Determine if eye is on left or right side of screen
          if (eyeCenterX < screenCenterX) {
            // Eye is on left side - show tooltip on the right

            tooltip.style.transform = "translateX(0)"; // Reset transform
          } else {

          }

      function updateFloatingEye() {
        const eye = document.getElementById("floating-eye");
        if (!eye || eye.style.display === "none") return;

        // Don't move if hovered
        if (eyeIsHovered) return;

        const now = Date.now();
        const time = now * 0.001; // Convert to seconds

        // Change target position periodically with more organic timing
        if (now - lastEyeMoveTime > eyeMoveInterval) {
          const margin = 150;
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          // Create perimeter-based movement - prefer edges and corners
          const perimeterChoice = Math.random();

          if (perimeterChoice < 0.4) {
            // Top edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = margin + Math.random() * 50;
          } else if (perimeterChoice < 0.7) {
            // Bottom edge
            eyeTargetX = margin + Math.random() * (screenWidth - 2 * margin);
            eyeTargetY = screenHeight - margin - Math.random() * 50;
          } else if (perimeterChoice < 0.85) {
            // Left edge
            eyeTargetX = margin + Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          } else {
            // Right edge
            eyeTargetX = screenWidth - margin - Math.random() * 50;
            eyeTargetY = margin + Math.random() * (screenHeight - 2 * margin);
          }

          lastEyeMoveTime = now;
        }

        // Add subtle organic drift using sine waves
        eyeDriftX = Math.sin(time * eyeDriftSpeed) * eyeDriftAmplitude;
        eyeDriftY =
          Math.cos(time * eyeDriftSpeed * 0.7) * eyeDriftAmplitude * 0.8;

        // Smooth movement towards target with easing
        const dx = eyeTargetX - eyeX;
        const dy = eyeTargetY - eyeY;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Calculate distance from center to avoid it
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const distanceFromCenter = Math.sqrt(
          (eyeX - centerX) ** 2 + (eyeY - centerY) ** 2
        );
        const centerAvoidanceRadius =
          Math.min(window.innerWidth, window.innerHeight) * 0.4; // Increased from 0.25 to 0.4

        // Add center avoidance force
        let avoidanceX = 0;
        let avoidanceY = 0;
        if (distanceFromCenter < centerAvoidanceRadius) {
          const avoidanceStrength = 0.05; // Increased from 0.02 to 0.05
          const centerDx = eyeX - centerX;
          const centerDy = eyeY - centerY;
          const centerDistance = Math.sqrt(
            centerDx * centerDx + centerDy * centerDy
          );
          if (centerDistance > 0) {
            // Stronger avoidance when closer to center
            const avoidanceMultiplier =
              1 + (1 - distanceFromCenter / centerAvoidanceRadius);
            avoidanceX =
              (centerDx / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
            avoidanceY =
              (centerDy / centerDistance) *
              avoidanceStrength *
              avoidanceMultiplier;
          }
        }

        // Slower movement when closer to target (easing)
        const currentSpeed = eyeSpeed * (0.5 + (distance / 200) * 0.5);

        eyeX += dx * currentSpeed + avoidanceX;
        eyeY += dy * currentSpeed + avoidanceY;

        // Add drift to final position
        const finalX = eyeX + eyeDriftX;
        const finalY = eyeY + eyeDriftY;

        // Update position
        eye.style.left = finalX + "px";
        eye.style.top = finalY + "px";
      }

      function initDockBehavior() {
        const ringsContainer = document.getElementById("rings-container");
        const searchBar = document.getElementById("search-bar");
        const uploadBtn = document.getElementById("upload-hand-btn");
        const pixelArrowIndicator = document.getElementById(
          "pixel-arrow-indicator"
        );

        let dockTimeout;
        let isDockVisible = false;
        const dockDelay = 400; // Delay before hiding dock (ms)
        const hoverZoneHeight = 120; // Height of hover zone from bottom (px) - increased for easier access

        // Initialize dock state - hidden by default
        ringsContainer.classList.add("dock-hidden");
        searchBar.classList.add("dock-hidden");
        uploadBtn.classList.add("dock-hidden");

        // Show pixel arrow indicator initially since dock is hidden
        if (pixelArrowIndicator) {
          pixelArrowIndicator.classList.add("show");
        }

        function showDock() {
          if (!isDockVisible) {
            isDockVisible = true;
            ringsContainer.classList.remove("dock-hidden");
            ringsContainer.classList.add("dock-visible");
            searchBar.classList.remove("dock-hidden");
            searchBar.classList.add("dock-visible");
            uploadBtn.classList.remove("dock-hidden");
            uploadBtn.classList.add("dock-visible");

            // Hide pixel arrow indicator when dock is visible
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.remove("show");
            }
          }
        }

        function hideDock() {
          if (isDockVisible) {
            isDockVisible = false;
            ringsContainer.classList.remove("dock-visible");
            ringsContainer.classList.add("dock-hidden");
            searchBar.classList.remove("dock-visible");
            searchBar.classList.add("dock-hidden");
            uploadBtn.classList.remove("dock-visible");
            uploadBtn.classList.add("dock-hidden");

            // Show pixel arrow indicator when dock is hidden
            if (pixelArrowIndicator) {
              pixelArrowIndicator.classList.add("show");
            }
          }
        }

        // Mouse move handler for dock behavior
        document.addEventListener("mousemove", (e) => {
          const mouseY = e.clientY;
          const windowHeight = window.innerHeight;
          const isInHoverZone = mouseY > windowHeight - hoverZoneHeight;

          // Clear existing timeout
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }

          if (isInHoverZone) {
            showDock();
          } else {
            // Delay hiding the dock
            dockTimeout = setTimeout(() => {
              hideDock();
            }, dockDelay);
          }
        });

        // Also handle mouse leave from window
        document.addEventListener("mouseleave", () => {
          if (dockTimeout) {
            clearTimeout(dockTimeout);
          }
          hideDock();
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          // Recalculate hover zone if needed
        });
      }

      // Function to search creators within the current page
      function searchCreators(query) {
        if (!helixGroup || !imageGroups) {
          console.log("Helix not initialized yet");
          return;
        }

        const searchTerm = query.toLowerCase().trim();

        if (searchTerm === "") {
          // If search is empty, return to normal view
          return;
        }

        // Search through creator clusters
        let foundMatch = false;
        let targetCluster = null;

        helixGroup.children.forEach((cluster, index) => {
          const container = cluster.children[0];
          if (container && container.userData.clusterData) {
            const creatorName =
              container.userData.clusterData.creator.toLowerCase();

            if (creatorName.includes(searchTerm)) {
              // Found matching cluster
              foundMatch = true;
              targetCluster = cluster;
            }
          }
        });

        if (foundMatch && targetCluster) {
          // Find the cluster index in the helix
          const clusterIndex = imageGroups.indexOf(targetCluster);
          if (clusterIndex !== -1) {
            // Calculate the target Y position based on cluster index and current helix position
            const totalClusters = imageGroups.length;
            const clusterLocalPos = createHelixPosition(
              clusterIndex,
              totalClusters
            );
            const currentHelixY = helixGroup ? helixGroup.position.y : 0;

            // The target Y is the cluster's local Y position minus the current helix Y offset
            const targetY = clusterLocalPos.y - currentHelixY;
            const currentCameraY = camera.position.y;

            console.log("Cluster index:", clusterIndex);
            console.log("Cluster local position:", clusterLocalPos);
            console.log("Current helix Y:", currentHelixY);
            console.log("Current camera Y:", currentCameraY);
            console.log("Target Y:", targetY);
            console.log(
              "Movement direction:",
              targetY > currentCameraY ? "UP" : "DOWN"
            );

            // Animate camera to the cluster's Y position
            animateCameraToY(targetY);

            console.log(
              "Found creator:",
              targetCluster.children[0].userData.clusterData.creator
            );
          }
        } else {
          console.log("No creators found matching:", searchTerm);
        }
      }

      // Function to animate camera to a specific Y position
      function animateCameraToY(targetY) {
        // Set animation flag to prevent main loop interference
        isCameraAnimating = true;

        // Disable scroll controls during animation
        const originalIsDragging = isDragging;
        isDragging = false;
        scrollVelocity = 0;

        const startY = camera.position.y;
        const startTime = Date.now();
        const duration = 2000; // 2 seconds for faster response

        function animateCamera() {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);

          // Smooth easing function (ease-out cubic)
          const eased = 1 - Math.pow(1 - progress, 3);

          // Update the current Y position
          currentY = startY + (targetY - startY) * eased;

          // Update helix position to match camera
          if (helixGroup) {
            helixGroup.position.y = -currentY;
          }

          // Update camera position
          camera.position.y = currentY;

          // Keep camera looking at the center
          camera.lookAt(0, currentY, 0);

          if (progress < 1) {
            requestAnimationFrame(animateCamera);
          } else {
            // Animation complete - restore scroll controls and animation flag
            isDragging = originalIsDragging;
            isCameraAnimating = false;
            console.log("Camera animation complete");
          }
        }

        animateCamera();
      }
