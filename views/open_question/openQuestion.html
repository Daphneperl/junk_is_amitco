<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Layered Score Circle</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      visibility: hidden;
      white-space: nowrap;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    #search-bar {
      position: fixed;
      left: 50%;
      bottom: 3vw;
      transform: translateX(-50%);
      width: 420px;
      max-width: 80vw;
      min-width: 280px;
      height: 54px;
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 2px 16px #0003;
      font-size: 18px;
      font-family: 'VT323', monospace, sans-serif;
      color: #888;
      border: none;
      outline: none;
      padding: 0 32px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <!-- Search Bar (fixed) -->
  <input id="search-bar" type="text" placeholder="I want to see..." />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x111111);
    document.body.appendChild(renderer.domElement);

    // Create noise texture for background
    const canvas = document.createElement('canvas');
    canvas.width = 1920;
    canvas.height = 1080;
    const ctx = canvas.getContext('2d');
    
    // Generate noise
    const imageData = ctx.createImageData(canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const value = Math.random() * 50;
      data[i] = value;     // R
      data[i + 1] = value; // G
      data[i + 2] = value; // B
      data[i + 3] = 20;    // A
    }
    ctx.putImageData(imageData, 0, 0);
    
    // Create texture from canvas
    const noiseTexture = new THREE.CanvasTexture(canvas);
    noiseTexture.wrapS = THREE.RepeatWrapping;
    noiseTexture.wrapT = THREE.RepeatWrapping;
    
    // Set as background
    scene.background = noiseTexture;

    // Setup post-processing
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    // Add vignette effect
    const vignetteShader = {
      uniforms: {
        "tDiffuse": { value: null },
        "offset": { value: 1.0 },
        "darkness": { value: 1.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float offset;
        uniform float darkness;
        varying vec2 vUv;
        
        void main() {
          vec2 uv = vUv;
          vec4 color = texture2D(tDiffuse, uv);
          
          // Calculate distance from center
          vec2 center = vec2(0.5, 0.5);
          float dist = distance(uv, center);
          
          // Create vignette effect
          float vignette = smoothstep(0.8, offset * 0.5, dist * (darkness + offset));
          
          // Apply vignette
          color.rgb *= vignette;
          
          gl_FragColor = color;
        }
      `
    };

    const vignettePass = new THREE.ShaderPass(vignetteShader);
    vignettePass.uniforms.offset.value = 0.5;
    vignettePass.uniforms.darkness.value = 0.5;
    composer.addPass(vignettePass);

    // Create particles
    const particleCount = 300;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    const particleColors = new Float32Array(particleCount * 3);
    const particleSpeeds = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      // Random positions within a sphere
      const radius = 80;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      
      particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      particlePositions[i * 3 + 2] = radius * Math.cos(phi);

      // More vibrant colors
      const hue = Math.random(); // Random hue
      const saturation = 0.3 + Math.random() * 0.2; // Lower saturation range (0.3-0.5)
      const lightness = 0.5 + Math.random() * 0.3; // Medium to high lightness
      
      // Convert HSL to RGB
      const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
      const x = c * (1 - Math.abs((hue * 6) % 2 - 1));
      const m = lightness - c/2;
      
      let r, g, b;
      if (hue < 1/6) {
        r = c; g = x; b = 0;
      } else if (hue < 2/6) {
        r = x; g = c; b = 0;
      } else if (hue < 3/6) {
        r = 0; g = c; b = x;
      } else if (hue < 4/6) {
        r = 0; g = x; b = c;
      } else if (hue < 5/6) {
        r = x; g = 0; b = c;
      } else {
        r = c; g = 0; b = x;
      }
      
      particleColors[i * 3] = r + m;     // R
      particleColors[i * 3 + 1] = g + m; // G
      particleColors[i * 3 + 2] = b + m; // B

      // Random speeds between 0.02 and 0.08 (much slower than before)
      particleSpeeds[i] = Math.random() * 0.06;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.3,
      sizeAttenuation: true,
      depthWrite: false // Allow particles to be transparent when in front
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    particles.userData = { 
      speeds: particleSpeeds,
      opacities: new Float32Array(particleCount) // Store individual opacities
    };
    scene.add(particles);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableRotate = false;
    controls.enablePan = true;
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;

    // Camera position
    camera.position.set(0, 0, 10);
    controls.update();

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 10, 5);
    scene.add(directionalLight);

    // Parameters
    const numLayers = 15;
    const minRadius = 0;
    const maxRadius = 20;
    const baseImageSize = 0.8;
    const renderedDots = [];

    // Generate dots per layer
    const dotsPerLayer = [];
    let totalDots = 0;
    for (let i = 0; i < numLayers; i++) {
      const count = 6 + i * 6;
      dotsPerLayer.push(count);
      totalDots += count;
    }
    totalDots += 1; // center dot

    // Scores from 1 to totalDots
    const scores = Array.from({ length: totalDots }, (_, i) => i + 1);
    scores.sort((a, b) => b - a); // high score = center

    let scoreIndex = 0;

    const bellHeight = 6; // Maximum Z height at the center (closer to camera)
    const bellSigma = maxRadius * 0.18; // Controls width of the bell (adjust for sharpness)

    // Store dot base positions for dynamic Z updates
    const dotBasePositions = [];

    // Dynamically generated list of all image files in the images folder (no repeats)
    const allImageFiles = [
      // List all image files found in the images/ folder
      'image5.jpg','image6.jpg','image7.jpg','image8.jpg','image9.jpg','image50.jpg','image51.jpg','image52.jpg','image53.jpg','image54.jpg','image55.jpg','image56.jpg','image57.jpg','image58.jpg','image59.jpg','image60.jpg','image61.jpg','image62.jpg','image63.jpg','image64.jpg','image65.jpg','image66.jpg','image67.jpg','image68.jpg','image69.jpg','image70.jpg','image71.jpg','image72.jpg','image73.jpg','image74.jpg','image75.jpg','image76.jpg','image77.jpg','image78.jpg','image79.jpg','image80.jpg','image81.jpg','image82.jpg','image83.jpg','image84.jpg','image85.jpg','image86.jpg','image87.jpg','image88.jpg','image89.jpg','image90.jpg','image91.jpg','image92.jpg','image93.jpg','image94.jpg','image95.jpg','image96.jpg','image97.jpg','image98.jpg','image99.jpg','image100.jpg','image101.jpg','image102.jpg','image103.jpg','image104.jpg','image105.jpg','image106.jpg','image107.jpg','image108.jpg','image109.jpg','image110.jpg','image111.jpg','image112.jpg','image113.jpg','image114.jpg','image115.jpg','image116.jpg','image117.jpg','image118.jpg','image119.jpg','image120.jpg','image121.jpg','image122.jpg','image123.jpg','image124.jpg','image125.jpg','image126.jpg','image127.jpg','image128.jpg','image129.jpg','image130.jpg','image131.jpg','image132.jpg','image133.jpg','image134.jpg','image135.jpg','image136.jpg','image137.jpg','image138.jpg','image139.jpg','image140.jpg','image141.jpg','image142.jpg','image143.jpg','image144.jpg','image145.jpg','image146.jpg','image147.jpg','image148.jpg','image149.jpg','image150.jpg','image151.jpg','image152.jpg','image153.jpg','image154.jpg','image155.jpg','image156.jpg','image157.jpg','image158.jpg','image159.jpg','image160.jpg','image161.jpg','image162.jpg','image163.jpg','image164.jpg','image165.jpg','image166.jpg','image167.jpg','image168.jpg','image169.jpg','image170.jpg','image171.jpg','image172.jpg','image173.jpg','image174.jpg','image175.jpg','image176.jpg','image177.jpg','image178.jpg','image179.jpg','image180.jpg','image181.jpg','image182.jpg','image183.jpg','image184.jpg','image185.jpg','image186.jpg','image187.jpg','image188.jpg','image189.jpg','image190.jpg','image191.jpg','image192.jpg','image193.jpg','image194.jpg','image195.jpg','image196.jpg','image197.jpg','image198.jpg','image199.jpg','image200.jpg','image201.jpg','image202.jpg','image203.jpg','image204.jpg','image205.jpg','image206.jpg','image207.jpg','image208.jpg','image209.jpg','image210.jpg','image211.jpg','image212.jpg','image213.jpg','image214.jpg','image215.jpg','image216.jpg','image217.jpg','image218.jpg','image219.jpg','image220.jpg','image221.jpg','image222.jpg','image223.jpg','image224.jpg','image225.jpg','image226.jpg','image227.jpg','image228.jpg','image229.jpg','image230.jpg','image231.jpg','image232.jpg','image233.jpg','image234.jpg','image235.jpg','image236.jpg','image237.jpg','image238.jpg','image239.jpg','image240.jpg','image241.jpg','image242.jpg','image243.jpg','image244.jpg','image245.jpg','image246.jpg','image247.jpg','image248.jpg','image249.jpg','image250.jpg','image251.jpg','image252.jpg','image253.jpg','image254.jpg','image255.jpg','image256.jpg','image257.jpg','image258.jpg','image259.jpg','image260.jpeg','image261.jpeg','image262.jpeg','image263.jpeg','image264.jpeg','image265.jpeg','image266.jpeg','image267.jpeg','image268.jpeg','image269.jpeg','image270.jpeg','image271.jpeg','image272.jpeg','image273.jpeg','image274.jpeg','image275.jpeg','image276.jpeg','image277.jpeg','image278.jpeg','image279.jpeg','image280.jpeg','image281.jpeg','image282.jpeg','image283.jpeg','image284.jpeg','image285.jpeg','image286.jpeg','image287.jpeg','image288.jpeg','image289.jpeg','image290.jpeg','image292.png','image293.png','image364.png','image365.png','image366.png','image367.png','image368.png','image369.png','image370.png','image371.png','image372.png','image373.png','image374.png','image375.png','image376.png','image377.png','image378.png','image379.png','image380.png','image381.png','image382.png','image383.png','image384.png','image385.png','image386.png','image387.png','image388.png','image389.png','image390.png','image391.png','image392.png','image393.png','image394.png','image395.png','image396.png','image397.png','image398.png','image399.png','image400.png','image401.png','image402.png','image403.png','image404.png','image405.png','image406.png','image407.png','image408.png','image409.png','image410.png','image411.png','image412.png','image413.png','image414.png','image415.png','image416.png','image417.png','image418.png','image419.png','image420.png','image421.png','image422.png','image423.png','image424.png','image425.png','image426.png','image427.png','image428.png','image429.png','image430.png','image431.png','image432.png','image433.png','image434.png','image435.png','image436.png','image437.png','image438.png','image439.png','image440.png','image441.png','image442.png','image443.png','image444.png','image445.png','image446.png','image447.png','image448.png','image449.png','image450.png','image451.png','image452.png','image453.png','image454.png','image455.png','image456.png','image457.png','image458.png','image459.png','image460.png','image461.png','image462.png','image463.png','image464.png','image465.png','image466.png','image467.png','image468.png','image469.png','image470.png','image471.png','image472.png','image473.png','image474.png','image475.png','image476.png','image477.png','image478.png','image479.png','image480.png','image481.png','image482.png','image483.png','image484.png','image485.png','image486.png','image487.png','image488.png','image489.png','image490.png','image491.png','image492.png','image493.png','image494.png','image495.png','image496.png','image497.png','image498.png','image499.gif','image500.gif','image501.gif','image502.gif','image503.gif','image504.gif','image505.gif','image506.gif','image507.gif','image508.gif','image509.gif','image510.webp','image511.webp','image512.webp','image513.webp','image514.webp','image515.webp','image516.webp','image517.webp','image518.webp','image519.webp','image520.webp','image521.webp','image522.webp','image523.webp','image524.webp','image525.webp','image526.webp','image527.webp','image528.png','image529.png','image530.png'
    ];

    // Use as many unique images as possible, up to the number of dots
    const imageFiles = allImageFiles.slice(0, totalDots);

    // Function to load image texture
    function loadImageTexture(imagePath) {
      return new Promise((resolve, reject) => {
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
          imagePath,
          (texture) => {
            // Get image dimensions for aspect ratio
            const image = texture.image;
            const aspectRatio = image.width / image.height;
            resolve({ texture, aspectRatio });
          },
          undefined,
          (error) => {
            console.warn('Failed to load image:', imagePath, error);
            // Return a fallback colored texture
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(0, 0, 64, 64);
            const fallbackTexture = new THREE.CanvasTexture(canvas);
            resolve({ texture: fallbackTexture, aspectRatio: 1 });
          }
        );
      });
    }

    // Load all image textures
    const imageTextures = [];
    let loadedTextures = 0;
    const totalTextures = imageFiles.length;

    // Create dots in 3D layers
    async function createDots() {
      // Load all textures first
      for (let i = 0; i < imageFiles.length; i++) {
        // Use correct relative path from openQuestion.html to images folder
        const imagePath = `../../images/${imageFiles[i]}`;
        const { texture, aspectRatio } = await loadImageTexture(imagePath);
        imageTextures.push({ texture, aspectRatio });
        loadedTextures++;
      }

      // Now create the dots with loaded textures
      let usedImageIndex = 0;
      for (let layer = 0; layer < numLayers; layer++) {
        const t = layer / (numLayers - 1);
        const radius = minRadius + t * (maxRadius - minRadius);
        const count = dotsPerLayer[layer];

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * 2 * Math.PI;
          const x = radius * Math.cos(angle);
          const y = radius * Math.sin(angle);

          const score = scores[scoreIndex++];
          
          // Get unique texture for this dot
          if (usedImageIndex >= imageTextures.length) break;
          const { texture, aspectRatio } = imageTextures[usedImageIndex++];

          // Initial Z (will be updated dynamically)
          const z = 0;

          // Create sprite with image texture
          const material = new THREE.SpriteMaterial({ 
            map: texture,
            transparent: true,
            opacity: 0.9
          });
          const sprite = new THREE.Sprite(material);
          sprite.position.set(x, y, z);
          
          // Scale based on aspect ratio to maintain original proportions
          const scaleX = baseImageSize * aspectRatio;
          const scaleY = baseImageSize;
          sprite.scale.set(scaleX, scaleY, 1);
          
          scene.add(sprite);

          // Store for interaction and dynamic Z
          renderedDots.push({ 
            mesh: sprite, 
            score: score,
            originalScale: { x: scaleX, y: scaleY },
            texture: texture
          });
          dotBasePositions.push({ x, y });
        }
      }

      // Center dot (highest score)
      if (usedImageIndex < imageTextures.length) {
        const centerScore = scores[scoreIndex];
        const { texture: centerTexture, aspectRatio: centerAspectRatio } = imageTextures[usedImageIndex++];
        
        const centerMaterial = new THREE.SpriteMaterial({ 
          map: centerTexture,
          transparent: true,
          opacity: 0.9
        });
        const centerSprite = new THREE.Sprite(centerMaterial);
        centerSprite.position.set(0, 0, 0);
        
        // Larger scale for center dot
        const centerScaleX = baseImageSize * 1.5 * centerAspectRatio;
        const centerScaleY = baseImageSize * 1.5;
        centerSprite.scale.set(centerScaleX, centerScaleY, 1);
        
        scene.add(centerSprite);
        renderedDots.push({ 
          mesh: centerSprite, 
          score: centerScore,
          originalScale: { x: centerScaleX, y: centerScaleY },
          texture: centerTexture
        });
        dotBasePositions.push({ x: 0, y: 0 });
      }
    }

    // Raycaster for mouse interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById("tooltip");

    // Mouse move handler
    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(renderedDots.map(dot => dot.mesh), true);

      // Reset all scales
      renderedDots.forEach(dot => {
        dot.mesh.scale.set(dot.originalScale.x, dot.originalScale.y, 1);
      });

      if (intersects.length > 0) {
        const hitDot = renderedDots.find(dot => dot.mesh === intersects[0].object);
        if (hitDot) {
          // Scale up hovered dot
          hitDot.mesh.scale.set(
            hitDot.originalScale.x * 1.2, 
            hitDot.originalScale.y * 1.2, 
            1
          );
          
          // Show tooltip
          tooltip.style.left = `${event.clientX + 10}px`;
          tooltip.style.top = `${event.clientY + 10}px`;
          tooltip.textContent = `Score: ${hitDot.score}`;
          tooltip.style.visibility = 'visible';
        }
      } else {
        tooltip.style.visibility = 'hidden';
      }
    }

    // Event listeners
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('resize', onWindowResize);

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      // Animate particles
      if (particles) {
        const positions = particles.geometry.attributes.position.array;
        const speeds = particles.userData.speeds;
        const opacities = particles.userData.opacities;
        
        for (let i = 0; i < positions.length; i += 3) {
          // Move particles in a circular motion
          const speed = speeds[i / 3];
          const time = Date.now() * 0.001 * speed;
          
          positions[i] += Math.sin(time) * 0.01;
          positions[i + 1] += Math.cos(time) * 0.01;
          positions[i + 2] += Math.sin(time * 0.5) * 0.01;

          // Check if particle is in front of images (z > 0)
          const z = positions[i + 2];
          opacities[i / 3] = z > 0 ? 0 : 0.3; // Make transparent if in front
        }
        
        particles.geometry.attributes.position.needsUpdate = true;
        particles.material.opacity = 0.3; // Base opacity
      }

      // Project camera center to world coordinates (z=0 plane)
      const vector = new THREE.Vector3(0, 0, 0.5); // center of screen, z=0.5 in NDC
      vector.unproject(camera);
      // Project onto z=0 plane
      const camPos = camera.position;
      const dir = vector.clone().sub(camPos).normalize();
      const t = -camPos.z / dir.z;
      const centerWorld = camPos.clone().add(dir.multiplyScalar(t));

      // Update Z for all dots
      for (let i = 0; i < renderedDots.length; i++) {
        const base = dotBasePositions[i];
        const dx = base.x - centerWorld.x;
        const dy = base.y - centerWorld.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const z = bellHeight * Math.exp(-Math.pow(dist, 2) / (2 * Math.pow(bellSigma, 2)));
        renderedDots[i].mesh.position.z = z;
      }

      composer.render();
    }

    // Initialize the scene
    createDots().then(() => {
      animate();
    });
    
    // Show search bar with fade-in effect
    setTimeout(() => {
      const searchBar = document.getElementById('search-bar');
      if (searchBar) {
        searchBar.style.opacity = '1';
      }
    }, 500);
  </script>
